      Description:
        Biography: |
          Konstantinos Theódoros "Pappous Kostas" Athanasiou is Stella Blake's (alter ego of the cosmic hero Evenstar) maternal grandfather. He immigrated to New York City from the Peloponnese, Greece as a child. Kostas worked as a fisherman, as his father did, when school wasn't in session and after graduation. When World War II broke out, he enlisted in the Navy and served as a radioman on the USS New York (BB-34). After the war, he married Maria Teresa Aiello and continued to work as a fisherman until they amassed enough savings to open their family restaurant and grocery in 1947.
          
          A hale, robust man of great height and heroic frame, Pappous Kostas's wave of black hair has turned grey with years. Jovial and sanguine, Pappous has a twinkle of mischief from his youth that never left and is a virtuoso on the bouzouki. He's the family's heart, the rock on which everyone else depends. In addition to the restaurant, Pappous runs the Kratos Athletic Club, a gym that focuses on boxing, Greco-Roman Wrestling, gymnastics, and weightlifting, featuring a landmark traditional Turkish bath in the back. The apartments above he rents below market to young people in need. He also owns and operates the Kalliopi's Arcade at the South Street Pier, hosting most of his collection of hand-restored vintage pinball machines. His oldest children, Giannis and Andreas, have recently taken over the other family interests such as apartments, commercial and mixed-use spaces, parking lots, and the expansion locations of the specialty grocery/bodega portion of the original business.
