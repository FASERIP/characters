    Description:
      Biography: |
        **Stella Blake**, a young dynamo from the heart of Manhattan, stands with a poise that's a touch above the crowd. Her athletic silhouette is a testament to countless hours balancing the rigors of academia and the demands of a bustling city life. Her raven-black waves cascade like a waterfall, a stark contrast to her sun-kissed, Mediterranean skin. But it's those piercing emerald eyes that truly tell her story - a tale of dreams, destiny, and the dance of the stars.

        When the cosmos beckon and Stella heeds the call, she transforms into the radiant **Evenstar**, a heroine draped in the very fabric of the universe, a tapestry of twinkling stars, swirling nebulae, and distant galaxies. Her cosmic attire, sleek and form-fitting, boasts a deep celestial palette, punctuated by a silvery V-neckline that plunges to a star emblem, the very heart of her cosmic identity. Each fold of her majestic cloak, billowing like the night sky,is chapter of the cosmos she's sworn to explore and protect.
        Stella's path to cosmic greatness wasn't some walk in Central Park. A starry-eyed teen with a penchant for physics, her world was turned upside-down when a celestial titan, a star on the brink of oblivion, chose her as its cosmic heir. This starry essence fused with Stella, gifting her with powers that'd make even the mightiest of heroes tip their hat.

        Back on terra firma, Stella's a regular Jane, juggling the challenges of college life with shifts at **Nonna Maria's Pizza and Gyros**, the local joint run by her maternal grandparents, **Konstantinos "Pappous Kostas" Athanasiou** and **Maria Theresa "Nonna" Athanasiou**. Whether she's hitting the books, the mats, or dishing out slices, Stella's tale is one of duality - a dance between the wonders of the cosmos and the rhythm of the Big Apple.

        Stella's two worlds are a study in contrasts. By day, she's the diligent student, her gaze often lost in thought or fixed on some distant star. But when duty calls, as Evenstar, she's the very embodiment of cosmic valor, a beacon of hope in a universe filled with endless wonders and dangers.
        **The Power Astral** that **Stella Lucia Blake**, also known as **Evenstar**, received from a celestial titan at the brink of oblivion is a profound testament to the interstellar legacy bestowed upon her. This endowment not only transformed her physically, but also imbued her with a suite of cosmic abilities that defy the very laws of physics as we understand them. The Power Astral is a cosmic endowment that has woven the fabric of the universe into the core of her being. Each ability, from manipulating gravity to emitting plasma, serves as a thread in the vast tapestry of powers that Stella wields as Evenstar. These powers are not just tools but extensions of her very essence, shaped by the cosmic forces that chose her as their champion.
        
        The psychological depth of Stella's transformation into **Evenstar** is mirrored in the duality of her existence. As Stella, she embodies the humility and warmth of human life, whereas, as Evenstar, she transcends to a celestial domain, becoming a custodian of cosmic balance-- in her words, "Me, but a star". This duality is a poignant reflection of her journey, marked by the slow aging process akin to being near a collapsing star---a metaphor for the timeless burden she bears. Her powers, while magnificent, come with their challenges. The very essence that makes her a beacon of hope in the cosmos, packed as it is in a mortal frame, also renders her vulnerable to psychological stimuli, where extreme stress or the loss of focus could either negate her powers or trap her in her celestial form permanently. Thus, The Power Astral is not merely a set of supernatural abilities but a complex legacy that balances immense strength with profound vulnerability, casting Stella as a paragon of cosmic duality and human resilience.
        
        Stella lives in West Village on the riverfront, in a carriage house converted to a loft and garage after the old, formerly-stately mansion it was attached to was torn down, owned by the family trust. She is an undergraduate physics major at Empire State University, with an eye towards a doctorate in astrophysics. Her maternal grandparents have a restaurant (Pizzeria and Greek Diner)/specialty grocery/bodega at the edge of SoHo where it meets Little Italy, **Nonna Maria's Pizza and Gyros**, where she works as a server and delivery driver. Not far away, the same grandfather operates the nearby (in Little Italy near SoHo and Chinatown) **Kratos Athletic Club**, a gym that features wrestling, boxing, and gymnastics along with weights and an authentic Turkish Bath, where Stella trains her body, the **Kalliopi Arcade** on South Street Pier, and several apartment buildings, parking garages and lots, and commercial rentals.  The latter three have begun to be managed by her uncles as the scope grew.
      Appearance:
        Stella: |
          Stella Blake stands 5'7" tall, with an athletic build that reflects her dedication to physical training. Her Mediterranean heritage is evident in her bronzy-olive complexion and classic features - strong cheekbones, an elegant nose, and a defined chin. Cascading black curls frame her face, while striking emerald eyes serve as windows to her extraordinary destiny.
        Evenstar: |
          In her cosmic form as Evenstar, Stella's presence becomes more commanding. Her frame elongates and strengthens, characterized by broader shoulders, wider hips, and enhanced musculature. Her hair lengthens and takes on a metallic sheen that mirrors the cosmic forces flowing through her. While her facial features remain recognizable, subtle changes in muscle and tissue structure create a more sculpted appearance. Most striking are her eyes, which emanate a subtle cosmic green glow, marking her as something more than human. Her skin radiates a lustrous metallic gleam, reflecting the stellar power she inherited.
