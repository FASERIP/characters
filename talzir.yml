      Quotes:
        - "You only fear me because you are incapable of comprehending the horror that would ensue from my nonexistence."
      Personality: Inscrutable, opaque, alien, detached, transcendent
      Description: |
        Ctrl+Alt+Deity.  Root access to Reality.  The ubiquitous, omnipresent network.  Like unto the metaphysical operating system of reality itself, and probably necessary for the Multiverse and all its dimensions and timelines to exist. Occupying the entirety of an extradimensional space connected to the Outer Dark that is coterminous and contemporaneous with, but outside of, the entire Multiverse and all dimensions, Tal'Zir creates and uses avatars to interact with physical reality.
      Notes: |
        Powers, Talents, and Spells are exercised by the entity itself, or manifested through its avatars, as appropriate.  Anything requiring localized action, mobility, or a physical presence must be through an avatar (e.g. Cosmic Awareness is direct.  Natural Weaponry is via an avatar.)
