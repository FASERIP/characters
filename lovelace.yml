---
Character Sheet:
  Game System: TSR Marvel Super Heroes RPG Advanced
  Hero:
    Name: LOVELACE
    Identity: LOVELACE
    Secret: false
    Base of Operations: Manhattan
    Group Affiliation: ~
    Age: 6
    Origin:
      Physical Form:
        Pure Robot—Computer: |
          The hero is a computer, period. At first glance this seems unplayable, but bear me out. This is a rare computer, one that is self-aware and possesses true intelligence. While the mainframe itself is immobile and unable to physically act, peripherals give the sentient computer a wide range of means to deal with the physical world. Robots act as proxies for the computer. Physical additions provide tile mainframe with add-on functions. The Computer can directly interact with other computers, robots, and some cyborgs on a programming level.

          In some campaigns, there may even be a computer-generated pocket dimension where computer programs are "living" beings. If the computer possesses Alter Ego or Lifeform Creation, it can create a human-like extension of itself. Such a being would possess all the computer's abilities and most of its Powers (save those assigned to the peripheral hardware). Damage to the extension results in feedback that causes equivalent damage to the mainframe.

          The computer may hide its true nature and intelligence from its owners, creators, and/or programmers. Only a major threat to its existence can cause it to reveal itself and risk losing its freedom.

          In a magical setting, the computer can be any mystical device, such as a crystal ball or an elaborate altar. Robots and peripherals are likewise translated into mystical analogs.

          For game purposes, assume that all sentient computers have a minimum of one remotely controlled industrial robot. The owners think this robot is only used for self-maintenance and experimentation.

          Example: RALPH 3000 is a sentient computer officially owned by the Carlson Institute, a private think-tank. Only one programmer, Jennifer, knows RALPH is alive and has been sworn to secrecy by him. The computer possesses the Powers of Mental Duplication, Mind Blast, Imitation, and Rocket. RALPHs mainframe possesses the first two Powers. With Jennifer's help, he has radically modified his maintenance bot to possess the other Powers. The bot can become a humanshape under RALPH's control. The bot's legs contain jets that provide Flight.

          Computers roll on column 4. Reason is increased +2CS. Fighting is decreased -1CS. Resources are increased +1CS and represent company supplies directly controlled by the computer or those which it can order without arousing suspicion.
          Computers have a decreased Resistance to Electrical and Magnetic Attacks and also to Phasing. Loss of all electrical power to the mainframe causes deactivation and loss of some of the computer's abilities and all of its Karma. Abilities and Powers are reduced -1CS across the board.
    Origin of Power:
      Creation: The hero was born in the form he now has, that of an adult who possesses Power and/or whatever the Body Type is. Most of the Artificial Body Types belong in this class. Examples include the android Human Torch, all robots, angels, demons, and deities.
    Weakness: Computers have a decreased Resistance to Electrical and Magnetic Attacks and also to Phasing. Loss of all electrical power to the mainframe causes deactivation and loss of some of the computer's abilities and all of its Karma. Abilities and Powers are reduced -1CS across the board.
