  Headquarters:
    Akropolis:
      Description: |
        A mid-rise office building attached to a warehouse and factory with a parking garage and some dockside space and rail access, located near the port and transit station in the Hudson Yards neighborhood of Manhattan, comprise the Varangian Guard, Incorporated headquarters compound, Akropolis. There are helipads, extensive communications antenna arrays, weather and atmospheric montiors, and solar panels atop each.

        There is a perimeter wall with security stations that oversee the walkup, light vehicle, freight, and railyard entrances, as well as at the docks, whose piers are outside the perimeter. The entrances for Varangian Guard vehicles are separate from the others, and employees, visitors, and VIPs also have separate entrances for both foot and vehicle traffic.

        The sidewalk and street and water outside the perimeter wall, the pier, railyard, the roof, and the grounds inside and the interiors and exteriors of the buildings themselves are always well-lit and watched by cameras with infra-red capability, recorded and monitored at the security station. The company employes certified and licensed doctors, paramedics, and firefighters who are located onsite as well.

        There is ample exterior and covered parking inside the perimeter in the outside lots and attached parking garage for employees, visitors, and company vehicles, all of them separate and watched, in addition to the maintenance garages inside the warehouse building. There is special, reserved parking outside for emergency and government vehicles.
      Administrative Building:
        Description: Primary administrative building for the Varangian Guard leadership and support personnel.
        Reference:
          Office Building, 8 floors:
            Size:
              Deluxe: &Deluxe Deluxe is the largest size, and is for heroes with several vehicle types, trophy rooms, and living quarters. It has 20 + areas spread through 3 or more floors.
