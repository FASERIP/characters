    Security Officer:
      Description: Varangian Guard, Inc. Security Officers use improved Policeman stats and are equipped with a handgun, club, handcuffs, flashlight, and mace.
      Abilities:
        Primary Abilities:
          Fighting: Excellent
          Agility: Excellent
          Strength: Good
          Endurance: Excellent
          Reason: Good
          Intuition: Good
          Psyche: Good
        Secondary Abilities:
          Health: 70
          Karma: 30
        Talents:
          Weapon Skills:
            Blunt Weapons: &Blunt_Weapons Characters with this Talent gain a +1CS to hit when attacking with a weapon that resolves attacks on the Blunt Attacks column of the Battle Effects Table.
          Fighting Skills:
            Martial Arts C: &Martial_Arts_C This form of martial arts concentrates on holds and escapes. The practitioner of this form gains a +1CS to his Strength for Grappling attacks (including damage), a +1CS to Strength for Escaping, and a +1CS to Agility for purposes of Dodging.
          Professional Skills:
            Military: &Military The hero has had some dealings with one of the armed services. In military matters, the hero gets a +1CS to all FEAT rolls, and in addition may take a member of the armed services as a Contact.
            Law Enforcement: &Law_Enforcement The character with this Talent has a background with law-enforcement authorities. This Talent includes both Gun and Law Talents, and the character, if still a member of a law-enforcement agency, may legally carry a gun and make arrests.
          Other Talents:
            First Aid: &First_Aid The medicine Talent notes that the loss of Endurance ranks may be halted by someone checking on the dying character and administering some form of aid. The First Aid Talent grants the character this immediate halt to Endurance rank loss, the recovery of one rank immediately (one use only per situation), and in addition, the hero with this Talent can stabilize a dying character at Shift 0 Health up to 5 rounds after that character reaches that level.
      Equipment:
        Shooting Weapons:
          Handgun/Pistol: &Handgun-Pistol
            Range: 3
            Damage: 10
            Type: Shooting
            Rate: 1
            Shots:
              - 6
              - 8
              - 9
            Material Strength: Excellent
            Notes:
              - One-Handed
            Ammunition: 
              Standard: &Standard_Ammunition Damage listed for each weapon is for standard ammunition.
            Reference: The Handgun/Pistol is the next most common weapon, and like the cheap handgun, is easily concealed. A number of makes and models exist, noted by the different number of shots available. When the number is not predetermined (the text states a 9-shot pistol), assume the chambers hold 6 shots.
        Melee and Thrown Weapons:
          Club: &Club
            Price: Feeble
            Damage: 10
            Type:
              - Blunt Attack
              - Blunt Throwing
            Material Strength: Good
            Reference: Clubs are standard blunt weapons, including makeshift weapons such as chairs and tables.
          Knife: &Knife
            Price: Feeble
            Damage: 10
            Type:
              - Edged Attack
              - Edged Throwing
            Material Strength: Excellent
        Other Gear:
          Flashlight, Standard: &Flashlight Flashlights are common to all readers. The normal flashlight is the type most common, with a plastic or metal body (Typical Intensity). The Halogen flashlight has a brighter bulb and more concentrated beam, and blinds with a more powerful Intensity (Remarkable Intensity). Normal flashlight has a range of two areas, the halogen three.
          Mace: &Mace Mace is a small one-area weapon that shoots a mist of Typical Intensity tear gas at a single target adjacent to the user. It does not require an Agility FEAT to hit, though the target must make an Endurance FEAT to avoid the effects.
          Handcuffs: &Handcuffs Handcuffs are a standard restraining device used by the police forces of the world to prevent actions by criminals in custody. They are made of Excellent material.
