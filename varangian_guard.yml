            Talents:
              Professional Skills:
                Medicine: &Medicine The hero with this Talent has extensive knowledge of medicine and as such limited Talents in healing. In general, a character losing Endurance Ranks as the result of a lethal situation can have those losses stopped by any character checking on him. The individual with Medicine Talent may bring back characters that have reached the Shift 0 level up to 20 turns after they have reached that level. A character with this Talent may restore one rank of Endurance to a wounded character per week, in addition to natural healing. Finally, the character with Medicine as a Talent is +1CS on Reason FEATs that involve medical problems, medications, poisons, and surgery.
                Psychiatry: &Psychiatry The hero with this Talent has a background in studies of the mind and as such gains a +1CS on all FEATs involving the mind. This is a popular Talent with those heroes and villains with Mental Powers, and the character with these Talents gains a +1CS on FEATs involving Mental Control, Domination, Hypnosis, Emotion Control, and Mental Probe Powers.
              Scientific Skills:
                Biology: &Biology A +1CS on matters of biology, including animal and plant identification, finding cures for organic poisons, and researching diseases and their cures.
                Chemistry: &Chemistry A +1CS on matters of chemistry, including developing new formulas, finding cures for inorganic poisons, and identifying chemicals by smell, touch, or taste.
                Genetics: &Genetics A +1CS on matters involving the genes, including creating new life forms, understanding mutants, and researching diseases.
              Other Talents:
