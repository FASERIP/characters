          Fighting Skills:
            Martial Arts C: *Martial_Arts_C
            Martial Arts E: This form of martial arts encourages quick striking to catch the opponent off-guard. Heroes with this form of Martial Arts are at a +1CS to initiative rolls in unarmed combat.
          Professional Skills:
            Military: *Military
            Law Enforcement: *Law_Enforcement
          Other Talents:
            First Aid: *First_Aid
      Equipment:
        Shooting Weapons:
          Handgun: *Handgun-Pistol
          One of the Following:
            Riot Gun:
              Range: 2
              Damage: 15
              Type: Shooting
              Rate: 1
              Shots: 6
              Material Strength: Excellent
              Notes:
                - Bursts: Affect up to three adjacent targets, with one roll made for all targets.
                - Fire one-handed at -1CS
              Ammunition:
                Standard: *Standard_Ammunition
                Canister Shot:
                  - Canister shot is a special type of ammunition that may be loaded with various cartridges for different effects. Specify the type of canister desired when purchasing.
                  - Gas Canisters: Gas Canisters contain Incredible Intensity Tear Gas. Cover one area.
                  - Knock-Out Canisters: Knock-Out Can contain Remarkable Intensity Knock-Out gas. Cover one area.
                  - Smoke Canisters: Smoke Canisters contain Excellent Intensity smoke. Cover one area.
                  - Explosive Canisters: Explosive Canisters inflict double damage to all in target area, normal damage to all in adjacent areas.
                  - Incendiary Canisters: Incendiary Canisters inflict 20 damage in fire (Energy), which burns at Excellent Intensity for 1-10 rounds.
              Reference:
                - Riot Gun: The Riot Gun is a smaller version of the shotgun and fires grenade-like missiles and canister shot (treat as grenades).
                - Shotgun: The Shotgun fires bursts. It is often loaded with non-lethal cartridges (such as rock salt) that will not inflict Killing damage (ignore Kill results).
            Sniper Rifle:
              Range: 10
              Damage: 15
              Type: Shooting
              Rate: 1
              Shots: 4
              Material Strength: Good
              Ammunition:
                Standard: *Standard_Ammunition
                AP Shot: Armor-piercing bullets reduce the target's Body Armor by 2 CS (from Good to Poor, for example) for purposes of hitting and damage. This type of ammunition has no effect on force fields.
              Reference: The Sniper Rifle, like the target pistol, suffers no penalty for firing up to maximum range. It is used by criminals as well as the military.
            Assault Rifle:
              Range: 7
              Damage: 10
              Type: Shooting
              Rate: 2
              Shots: 20
              Material Strength: Good
              Notes: Military
              Ammunition:
                Standard: *Standard_Ammunition
              Reference: The Assault Rifle is the version of the rifle used by the military.
