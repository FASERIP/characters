                Cost: Incredible
                Reference: |
                  Cost: Excellent Occupies one room. Basically a separate computer with a specialized task at information processing and retrieval. Used by large groups to keep track of former villains and modi operandi. Performs its task with Remarkable ability. Room cost includes terminal, chairs, lights.
