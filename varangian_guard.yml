          Reference:
            Walker:
              Type:
                Off-Road: *Off-Road
              Control: Good
              Speed: Good
              Body: Remarkable
              Protection: Remarkable
              Reference:  
                - The Walker is a curious form of off-road vehicle in that it does not have wheels or treads but rather two or more legs that simulate human or animal movement. Such devices are generally experimental and are used by organizations such as Hulkbusters. They are normally equipped with a stun cannon, as firing weapons with recoil (such as LAW or Light Artillery) would require a Control FEAT to prevent tipping over. Any attack on a walker vehicle requires a Control FEAT by the operator to determine whether it remains upright. Seats four to eight persons.
                - Shooting Weapons:
                    Stun Cannon:
                      Range: 10
                      Rate: 1
                      Shots: 10
                      Material Strength: Remarkable
                      Notes:
                        - Two men to fire
                        - One-man firing at -1CS to hit
                        - Incredible Intensity stunning
                        - Bursts (Affects up to 3 adjacent targets with one roll)
                        - Power pack
        Prototype Tunneling Vehicle:
          Reference:
            Borer:
              Type:
                Off-Road: *Off-Road
              Control: Poor
              Speed: Typical
              Body: Remarkable
              Protection: Remarkable
              Reference: The Borer is not really a land vehicle but a subterranean vehicle. It allows speedy travel through the underground. If moving at Poor speed, its passage leaves a tunnel that others may follow; otherwise, it leaves churned earth behind it. Villains who live deep within the Earth, such as Mole Man, use the Borer as standard equipment. Because of its construction, with the forward screw, the borer can make an Edged Attack for Incredible damage.
