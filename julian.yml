              Powers:
                Defensive:
                  Body Armor: #D1
                    Rank: Base Power Rank
                    Reference: |
                      The hero possesses artificially-created armor that provides protection and possibly a way of possessing other Powers.

                      Armor comes in many forms exotic plate-mail, nuclear-powered exoskeletons, or mechanically-created force fields. The player should work with the Judge to create proper Armor for his hero. The player can also determine which Powers are possessed by the hero and which are properties of the armor. Powers built into the armor can later be modified and enhanced: think of the changes Tony Stark has made in the Iron Man armor. On the other hand, Powers that are built into the armor may suffer mechanical failure. The Armor's Power rank determines its ability to resist damage.

                      The player also has to determine where he got the Armor in the first place. This is covered in the "Character Creation" section elsewhere in this book. If the hero gained the armor through an accident, he might not be able to repair it.
                Detection:
                  Energy Detection: #DT3
                    Rank: Base Power Rank
                    Reference: Range column D. The hero can detect and identify energy and related phenomena. The power can only detect actual energy, not potential energy (it couldn't detect a bomb until it explodes, for example). Likewise, while it can detect the energies consciously emitted by superhumans, it cannot detect the superhumans themselves. Rank determines range.
                  Radarsense: #DT15
                    Rank: Base Power Rank
                    Reference: |
                      Range column B. The hero can gain a three-dimensional picture of his surroundings through the use of electromagnetic waves. The hero both emits and senses these waves. He can use the Power to locate and identify targets by their characteristic echoes. Because of the hero's sensitivity to electromagnetic waves, he has an increased vulnerability to electrical and magnetic attacks (-1CS): these temporarily negate the Radarsense.
                  Sonar: #DT16
                    Rank: Base Power Rank
                    Reference: |
                      Range column B. The hero can gain a three-dimensional picture of his environment through the use of soundwaves. The Power allows the hero to locate and identify targets by the way they reflect sound.

                      There are two ways this Power can operate. Passive Sonar utilizes existing sound. Active Sonar uses special sounds emitted by the hero (this is how bats and dolphins do it). The latter form requires a special adaptation of the hero's voice: otherwise there is no real difference between them. Because of the special sensitivity of the hero's hearing, he is vulnerable to sonic attacks (-1CS to resist).
                  Telescopic Vision: #DT17
                    Rank: Base Power Rank
                    Reference: |
                      Range column E. The hero's eyes can focus on extremely distant targets, objects too small for normal vision to perceive. The eyes function as telescopes, magnifying normal visual images. With this Power, the hero can see anything in his line of sight, even the surfaces of distant worlds. However, the Power is limited by the speed of light. Images of Alpha Centauri, for example, are five years old.

                      If the hero has other vision-based Powers, he can couple them with Telescopic vision to extend their range.

                      When using this Power, the distant objects appear very close. An adversary with a means of altering the hero's control over this Power might make the Telescopic Vision continually override the hero's normal sight. The effect would be disastrous (imagine trying to walk through Manhattan when all you're seeing are the sands of Mars).
                  Thermal Vision: #DT18
                    Rank: Base Power Rank
                    Reference: |
                      The hero can see infrared light and heat images. This allows the hero to see in the dark, perceive temperature differences (especially those left by a living person's contact with an object), and partially see through solids. In the last case, the hero can only see the heat patterns of objects touching the other side of the barrier.

                      With practice, the hero can judge the temperature of a target by its thermal color. The hero has an increased risk of being blinded by strong heat sources, even those that don't affect normal vision (-1CS). Thermal vision may be a consciously-activated mode or the hero's normal means of vision.
                  Ultraviolet Vision: #DT21
                    Rank: Base Power Rank
                    Reference: |
                      The hero can see ultraviolet light. Because UV light isn't as readily absorbed by water as normal light, this Power enables the hero to see clearly through fog and at greater distance in the water (+1CS). The hero can also see the dim light given off by radioactive materials.

                      The hero cannot actually "see in the dark" but only if UV light is present. The effect is the same when seen by normal people. The hero has an increased risk of being blinded by strong UV sources, like black lights and radiation (-2CS).
                Matter Control:
                  Micro-Environment: #MC10
                    Rank: Base Power Rank +2CS
                    Constraint: Range and area of effect within suit only (reduced to Feeble range).
                    Reference:  |
                      The hero can alter his immediate surroundings to create a miniature climate around himself. The Micro-Environment always contains fresh clean air (or water or methane or whatever the hero breathes) at any temperature and pressure the hero desires. The Micro-Environment incorporates a Force Field that protects it from any factor that might harm or even annoy the hero, such as rain, poisonous gases, extreme temperatures, or the pressure that naturally results from having three miles of ocean over your head. In such cases, the Micro-Environment automatically excludes potentially hazardous gases and liquids and reduces the Intensity of pressure, extreme temperature, and high gravity by the Power rank number. Lesser or equal Intensities are canceled out, while higher ranks only penetrate in diminished form.

                      The Power automatically Collects the desired materials into a sphere around the hero; if no such materials are available, the Power employs an innate form of Matter Creation or Conversion to produce those materials. The Force Field maintains the desired pressure, temperature, and gravity levels while enclosing the desired materials and shielding the hero from the undesired ones. If the hero requires a surface to stand on but none is available, the Power provides one by solidifying a section of the Force Field.

                      The Power is primarily intended to protect the hero when he is in places other than his home environment. It can, be used to protect him from extreme variations in that home environment though, should the hero so choose. Thus the Power can be used to protect the hero in the middle of a house fire, gas leak at a fertilizer plant, radiation spill at a laboratory, a thunderstorm, or a smog alert in Los Angeles. The Power can be used to Resist the effects of Air or Water Animation, Weather Control, Heat, or Cold Generation; the Intensity of the attack is reduced by the Power rank number.

                      The Micro-Environment has a maximum radius in feet equal to the Power rank number. Normally it is a sphere centered in the hero but she can shape it or direct it to another location if she so desires. The maximum range at which the hero can direct the Micro-Environment is determined by the Power rank; appropriate distances are shown on Column B on the Range Table. The maximum volume of the Micro-Environment is the equivalent of a sphere whose radius equals the Power rank number. Figuring out the maximum volume of other shapes requires a doing a bit of geometry.

                      Example: A rank of Good can produce a sphere of 3.14(10-cubed) or 3,140 cubic feet. This can be shaped into a rectangular "tunnel" 10 feet high, 10 feet wide, and 31 feet long. I suggest that anyone with this Power figure out as soon as possible how big a sphere/hemisphere/column/tunnel/cone/et cetera he can make with his Power rank. If you don't, the Judge is liable to say that mysterious changes in the environment prevent your hero's Power from working.

                      The Power only protects the hero from environmental effects or Powers that employ aspects of the Environment. Beside the Powers mentioned earlier, this Power will also provide limited protection against Electrical Control, Electrical Generation, Coldshaping, Gravity Manipulation, Hard Radiation and its Control, Thermal Control, Plague Carrier, Geoforce, Spray, and Pheromones, but only if the offending Power originates outside the Micro-Environment.

                      As hinted at before, the Power can be used to create any environment the hero desires, provided it is beneficial to whatever nature of being is inside its protection. Of course, what is a marvelous climate for one being could be instantly fatal to another. Consider the Micro-Environments created by beings that thrive on super-heated steam or swim in liquid helium. Player characters are limited to producing only those Micro-Environments that will help the beings inside. Villainous and Mind-Controlled NPC heroes are able to pervert the Power and create toxic Micro-Environments. In such a case, the Power is treated as an attack and the intended victim is urged to Resist it in any way he can.

                      The Nemeses are either Air or Liquid Animation, depending on the nature of the Micro-Environment.
                Travel:
                  Rocket:
                    Rank: Base Power Rank +2CS
                    Reference: | #T13
                      The hero flies by means of a rocket-like exhaust that propels him at Power rank speed. The rocket blast is created by a thermo-chemical reaction generated by the hero's body. The Power converts whatever material is around him into fuel and oxidant, then it shapes the exhaust into a stream to propel him. If the hero is in a vacuum, the Power creates fuel out of virtual nothingness.

                      The Power is treated like Strength to determine the maximum thrust the Power can achieve. If the thrust is high enough, the hero can carry or push additional loads. For example, Cannonball's Remarkable thrust can lift up to one ton.

                      The Nemesis is Gravity Manipulation.
                Other Powers: #From APB
                  Senses:
                    Computer Links:
                      Rank: Base Power Rank
                      Reference: The character with this Power may communicate with and retrieve information from computer systems with Power rank ability. The hero must be able to access the computer in some way; usually this is by means of an implant relayed to a predetermined computer. If attempting to break into a new computer, compare this Power rank with the Reason of the computer or mechanical being. This Power also allows the reprogramming of simple robots (but not Player Character robots under normal circumstances).
                    Protected Senses:
                      Rank: Base Power Rank
                      Reference: One or more of the hero's basic senses are protected from attack. The hero ignores potentially damaging attacks of less than the Power rank in intensity level. In many cases, this considers the effects of specially polarized goggles that prevent being suddenly blinded by high Intensity light. or earplugs or headgear that reduce the effects of sonic attacks.
          Pathfinder Tactical Utility Vehicle: &Pathfinder
            Description: |
              An up-armored, high-performance four wheel drive vehicle, The Pathfinder Tactical Utility Vehicle (TUV) has the speed, acceleration, and handling of a sports car, the off-road capability of a military vehicle, and the protection and durability of an armored vehicle. Features expected off-road functional accessories like winches, lights, onboard compressed air, hydraulic pump, generator, and welder-cutter, PTO, trail vise, communications suite featuring SSB CB, HAM, and commercial/business band radios, as well as police scanners, weather radio, world band radio, television, and satellite receivers, personal computer, and car phone, spotlights, cameras, flashers, PA, run flat tires with spare, and ramming-capable grille guards.  They carry pioneer tools, basic hand tools, basic air and power tools, road safety equipment, heavy-duty and high-lift jacks, basic survival gear, basic rescue gear, high angle gear, AED, field stretcher and backboard, oxygen, suction, and first aid and first responder gear. It can drop caltrops or release smoke behind it to dissuade pursuers. Optionally, a turret-mounted Guardian Integrated Multipurpose Weapon Model I Mk. γ may be installed, though this is not typical for daily operations. There are secure racks inside for Guardian IMW Model I Mks. α and β, along with ammunition and refills, and Warden Staves, two each up front, and optionally 4 in the back if there's no turret and magazine. In this base configuration, it seats 4 in inward-facing jump seats that fold securely out of the way. There are Remarkable Material Strength points to handcuff someone or strap down cargo or people to, and they generally carry various straps, chains, and cargo nets for various purposes. In general, Pathfinders are registered and plated as private ambulances, regardless of configuration, and if so, have police-band and other emergency band radios, siren, and red flashers in addition to white, amber, and green.
              
              It's an integrated combination of existing items (Sports Car, Jeep, and Armored Car, optionally Ambulance).
            Type:
              Off-Road: Off-Road vehicles are land vehicles designed to handle broken ground better than road vehicles. Some recreational vehicles and military equipment fall under this category.
            Control: Excellent
            Speed: Remarkable
            Body: Remarkable
            Protection: Remarkable
            Reference:
              Vehicles:
                Sports Car: *Sports_Car
                Jeep: The Pick-Up and Jeep are four-wheel drive off-road vehicles. Four-wheel drive does not prevent you from getting stuck; it only gets you stuck in worse places (quote by Dirtbuggy Doug Niles). The Jeep has been a workhorse for the Army for years and is only now being replaced by another vehicle with similar stats.
                Armored Car: &Armored_Car Armored Cars are favorite targets of criminals and normally sport a team of two guards in the front and an optional man inside. Armored Cars are also used for transporting powerful criminals who are under arrest.
                Ambulance: &Ambulance |
                  An Ambulance is a van equipped with a more powerful engine and gear to handle most medical emergencies. Ambulances operate both in conjunction with hospitals and as separate Paramedic services. Driving Note: Ambulances, Fire Trucks, and Police Vehicles with their top-lights flashing have right of way over other vehicles.
              Other Weapons:
                Smoke: Smoke, whether from fire or missiles, is usually considered to be of Excellent Intensity to see through. All FEATs performed while in a Smoke-filled area are at -2CS.
              Other Equipment:
                Caltrops: Caltrops are small, dart-like jacks that are scattered to avoid pursuit. They inflict Poor Edged Attack on those that step on them (but are non-lethal– no Kill results). For road and off-road vehicles that use tires, the caltrop acts as an Edged Attack of Excellent damage and immediately forces a Control FEAT.
                Personal Computer: *Personal_Computer
                Flashlight: *Flashlight
              Custom Equipment:
                Guardian Integrated Multipurpose Weapon Model I Mk. γ: *Guardian_Integrated_Multipurpose_Weapons_Model_I_Mkγ
          Wayfinder Tactical Utility Watercraft: &Wayfinder
            Description: |
              The Wayfinder Tactical Utility Watercraft (TUW) is a nimble jet-powered submersible ship that can displace on or under the surface, deploy hydrofoils, or hover in ground effect as needed, combining the versatility of surface, subsurface, and amphibious operations with the protection and durability of an armored vehicle. There is just enough room on the rear deck of the Wayinder for a VTOL vehicle to land, (un)load, and takeoff, or to park a pair of vehicles on, and the means to secure them with Incredible Material Strength tiedown points. A small galley, cabins, laundry, and head with shower can support up to 4 people for long term operations, up to about 6-8 for a few days if the jump bunks in the hold are deployed, and can transport 10-15 short term, 20 if cramped into an empty hold and as many more crowded on deck in a pinch. The small cargo hold and smaller brig feature Incredible Material Strength points to handcuff someone or strap down cargo or people to, and they generally carry various straps, chains, and cargo nets for various purposes. Features expected off-grid, marine, and functional accessories like cranes, winches, and hoists, washdowns, solar panels, lights, onboard compressed air, hydraulic pump, generator, and welder-cutter, communications suite featuring marine band radios and an experimental INMARSAT phone, SSB CB, HAM, and commercial/business band radios, as well as police scanners, weather radio, world band radio, television, and satellite receivers, personal computer, and mobile phone, spotlights, cameras, flashers, PA. Marine, weather, and air traffic radars and navigational, sounding, side-scanning, upward-looking, and synthetic-aperture sonars provide constant awareness. Navigation includes Decca, LORAN, gyroscopic and magnetic compasses, and an experimental satellite navigation system, as well as a sophisticated autopilot.  They carry scuba gear, surface-supplied air diving pumps, dredging, salvage, and cargo-handling gear, life rafts, pioneer tools, basic hand tools, basic air and power tools, water safety equipment, basic and open water survival gear, basic and water rescue gear, AED, field stretchers and backboards, oxygen, suction, and first aid and first responder gear. It can release smoke behind it to dissuade pursuers or as a signal. Optionally, up to four turret-mounted Guardian Integrated Multipurpose Weapon Model I Mk. γ may be installed, though this is not typical for daily operations. There are secure racks inside for 10 sets of Guardian IMW Model I Mks. α and β, along with ammunition and refills, and Warden Staves.  In general, Wayfinders are registered as private water ambulances, regardless of configuration, and if so, have police-band and other emergency band radios, siren, and red flashers in addition to white, amber, and green.
              
              It's an integrated combination of existing items (Patrol Boat, Hydrofoil, Mini-Sub, Hovercraft, Armored Carrier, and Ambulance).
            Type:
              Water: Water vehicles are boats of every description. from sailboats to carriers. Their main limitation is the danger of sinking.
              Sub: Submersible vehicles are those designed to travel underwater, and are represented by the submarine. Subs are similar to water vehicles in the danger of sinking.
              GEV: &GEV GEV means Ground Effect Vehicle, which is basically the hovercraft. GEVs exhibit properties of both Air and Off-Road Vehicles, and as such deserve their own entry.
            Control:
              Water:
                Displacement: Good
                Hydrofoil: Typical
              Sub: Excellent
              GEV: Poor
            Speed:
              Water:
                Displacement: Remarkable
                Hydrofoil: Incredible
              Sub: Good
              GEV:
                Smooth: Excellent
                Rough: Good
            Body: Incredible
            Protection: Remarkable
            Reference:
              Vehicles:
                Patrol Boat: The Patrol Boat includes those craft of the harbor patrol and Coast Guard, as well as small military craft. Most patrol boats are armed with one piece of light artillery, 1-3 machine guns, and carry a crew of up to 10.
                Hydrofoil: The Hydrofoil is among the fastest of watercraft. It attains its high speed by rising above the water on skis, reducing the drag from the boat in the water. The disadvantage is that any successful attack on the hydrofoil results in a Control FEAT to see if control is lost. If control is lost on a Hydrofoil at greater than Excellent speed, the craft will crash into the water.
                Mini-Sub: Mini-subs are one- or two-man craft that may be launched from specially designed ships. These subs are faster and more maneuverable than the sub itself and are armed with missiles or laser rifles.
                Hovercraft: The Hovercraft is the only notable mention of the Ground Effect Vehicle. This vehicle is neither fish nor fowl, as it rides on a cushion of air, handles as does an Air type, but goes out of control as an off-road vehicle. Hovercraft move at a maximum Speed of Good off road, over broken ground, or in stormy weather.
                Ambulance: *Ambulance
                Armored Carrier: The Armored Carrier is an armored troop-carrying vehicle (about 20 people maximum). The armored carrier operates on treads and carries two machine guns (lasers in some cases).
              Other Weapons:
                Smoke: Smoke, whether from fire or missiles, is usually considered to be of Excellent Intensity to see through. All FEATs performed while in a Smoke-filled area are at -2CS.
              Other Equipment:
                Personal Computer: *Personal_Computer
                Flashlight: *Flashlight
                Scuba: *Scuba_Gear
              Custom Equipment:
                Guardian Integrated Multipurpose Weapon Model I Mk. γ: *Guardian_Integrated_Multipurpose_Weapons_Model_I_Mkγ
          Ranger Tactical Utility Aircraft: &Ranger
            Description: |
              The Ranger Tactical Utility Aircraft (TUA) is a sleek, nimble ducted-turbofan, thrust-vectoring VTOL aircraft that can operate in ground effect like a hovercraft as well. It has a crew of two to four, and can carry up to 6-8 in jump seats, or 10-12 crowded, with both side and tailgate hatches. The cargo deck features Remarkable Material Strength points to handcuff someone or strap down cargo or people to, and they generally carry various straps, chains, and cargo nets for various purposes. It can carry a vehicle or similar weight as a slung load. Features expected off-grid, aviation, and functional accessories like cranes, winches, and hoists, lights, onboard compressed air, hydraulic pump, generator, and welder-cutter, communications suite featuring aviation band and marine band radios, SSB CB, HAM, and commercial/business band radios, as well as police scanners, weather radio, world band radio, television, and satellite receivers, personal computer, and mobile phone, spotlights, cameras, flashers, PA. Navigational, weather, lookdown, and synthetic-aperture radars provide constant awareness. Navigation includes VORE, LORAN, gyroscopic and magnetic compasses, and an experimental satellite navigation system, as well as a sophisticated autopilot.  They carry cargo-handling gear, high-angle gear, life rafts, pioneer tools, basic hand tools, basic air and power tools, water safety equipment, basic and open water survival gear, basic and water rescue gear, AED, field stretchers and backboards, oxygen, suction, and first aid and first responder gear. Optionally, up to three turret-mounted Guardian Integrated Multipurpose Weapon Model I Mk. γ may be installed (nose and nacelles), though this is not typical for daily operations. There are secure racks inside for 10 sets of Guardian IMW Model I Mks. α and β, along with ammunition and refills, and Warden Staves.  In general, Wayfinders are registered as private airlift ambulances, regardless of configuration, and if so, have police-band and other emergency band radios, siren, and red flashers in addition to white, amber, and green.
              
              It's an integrated combination of existing items (Traffic Copter, Battle Copter, Corporate Jet, Hovercraft, Armored Car, and Ambulance).
            Type:
              Air: Air vehicles travel mainly through the friendly skies, and include all forms of aircraft from gliders to the Concorde.
              GEV: *GEV
            Control:
              Air: Excellent
              GEV: Poor
            Speed:
              Air: Amazing
              GEV:
                Smooth: Excellent
                Rough: Good
            Body: Incredible
            Protection: Remarkable
            Reference:
              Vehicles:
                Traffic Copter: Traffic Copters are fairly common in the airspace over American cities, and this type also includes private vehicles and medivac copters as well. Helicopters have VTOL ability (Vertical Take-off and Landing), and as such may drop to 0 speed without losing control.
                Battle Copter: Battle Copters are heavy-duty versions of the Traffic Copter, can carry a squad of 15 men plus crew, and are armed with Machine Guns (alternately lasers). All Copters have VTOL abilities and may hover in place.
                Corporate Jet: Corporate Jets represent the more modern turbo-prop jets that more powerful corporations use for their top executives. Corporate Jets have a crew of two and may carry up to 20 people in comfort.
                Hovercraft: The Hovercraft is the only notable mention of the Ground Effect Vehicle. This vehicle is neither fish nor fowl, as it rides on a cushion of air, handles as does an Air type, but goes out of control as an off-road vehicle. Hovercraft move at a maximum Speed of Good off road, over broken ground, or in stormy weather.
                Ambulance: *Ambulance
                Armored Car: *Armored_Car
              Other Equipment:
                Personal Computer: *Personal_Computer
                Flashlight: *Flashlight
                Scuba: *Scuba_Gear
              Custom Equipment:
                Guardian Integrated Multipurpose Weapon Model I Mk. γ: *Guardian_Integrated_Multipurpose_Weapons_Model_I_Mkγ
      Supporting Cast:
        Leonidas:
          Description: A particularly large housecat most resembling a strikingly ancient- and wild-looking Oriental breed, somewhat like an oversized Egyptian Mau, with a black spotted silver tabby coat and brilliant green eyes. While still very much a cat in personality, it's tempered by intelligence and insight that's far above the human norm and over a millennium of existence in close contact with Julian Constantine, giving him a dry, witty, sarcastic detachment and studious, serious, somewhat pessimistic outlook.  Leonidas doesn't speak or use telepathy to communicate per se, but is exceptionally adept at making himself understood by others, as well as understanding them, regardless of language, the same as if he were conversing like any human. Leonidas has been with Julian since the latter began his sorcerous journey.
          Origin:
            Physical Form:
              Animal: |
                This is a catch-all category that includes fish, mammals, birds, reptiles, and the rest of Earth's fauna, in addition to aliens that do not fit into any other category. About the only example of this in the Marvel Universe is Lockheed, the dragon. Your campaign, on the other hand, might be filled with heroic Animals or really peculiar aliens (I'll fudge a little and include Lockjaw, the Inhumans' "dog" as an example of this).

                Animal PCs have three main types of backgrounds. One is that the animal is a mutant. Another is that the animal was altered in ways that gave his intelligence and Power. The last is the animal is a relatively normal member of a race of animals like him (Lockheed, for example). The player can determine this in the Origins of Power section and embellish it to the best of his ability.

                Animals have to have a human Contact. People tend to see the human Contact as the animal's owner or trainer. People refuse initially to believe the animal is intelligent. Animals have very few legal rights, but they also have few responsibilities.

                - Animals roll on column 1.
                - Aliens in this category roll on column 5. Animals gain one less Power.
                - Animals automatically have two Detection Powers at Good rank.
                - Animals risk death or capture from people who are ignorant of the animal's true nature.
                - Resources are zero unless the animal has attached himself to a human. In this case, the Resource rank is assigned to that human.
            Origin of Power:
              Endowment: The hero was given his Power by another being. This includes such diverse situations as being transformed (Tigra), being charged with Power (the Power Pack kids), and acquiring an item whose possession gives the hero Power (Black Knight, Vindicator).
            Weakness: *Normal_Human_Weakness
          Abilities:
            Primary Abilities:
              Fighting: Excellent
              Agility: Amazing
              Strength: Poor
              Endurance: Remarkable
              Reason: Excellent
              Intuition: Remarkable
              Psyche: Incredible
            Secondary Abilities:
              Health: 104
              Karma: 90
              Popularity: Excellent
              Resources: Shift 0
            Special Abilities:
              Powers:
                Detection:
                  Hypersensitive Hearing:
                    Rank: Remarkable
                    Number: 30
                    Reference: The hero can detect extremely faint sounds and unusual frequencies. He can identify objects by the sounds they emit. Because of the sensitivity of the hero's hearing, he is more vulnerable to sonic attacks (which receive a +1CS against him).
                  Hypersensitive Olfactory:
                    Rank: Remarkable
                    Number: 30
                    Reference: |
                      The hero can detect the presence of minute traces of substances and accurately identify them.

                      This Power is continually functioning: the hero has learned to ignore unpleasant smells. If he loses his ability to mask out nasty odors, he'll be so distracted (and possibly sickened) by the intruding odors that he loses -1CS on Reason and Endurance.
                  Tracking Ability:
                    Rank: Remarkable
                    Number: 30
                    Reference: The hero can detect and follow the tracks left by a specific target. The hero can detect environmental and spatial disturbances with the result that at high ranks the hero can actually track across deep space.
                Other Powers: #From APB
                  Body Alterations-Defensive:
                    Immortality:
                      Reference: *Immortality
              Talents:
                Fighting Skills:
                  Acrobatics: *Acrobatics
                  Tumbling: *Tumbling
                Mystic and Mental Skills:
                  Resist Domination: *Resist_Domination
                  Occult Lore: *Occult_Lore
                  Mystic Background: *Mystic_Background
              Magic:
              Character Type:
                Magic Wielder: *Magic_Wielder
              Magic School:
                Eclectic Magic: &Eclectic_Magic This is an unorganized school of magic, that is, it follows no one school of philosophy but is a hodge-podge of “get-as-get-can” magic. It is considered neutral magic. Many of those who “dabble” in magic, and are not up to the level of a Marvel super hero, usually wind up with this type of magic. A spell learned here, an enchantment discovered there, makes up the whole of their philosophy. The bonus with this is that there is very little to bind the character (enemies, rituals, obligations, etc.), the penalty with this type of magic is that there is no one to learn from in a complete and comprehensive manner; thus advancement can be very slow.
              Energy Use:
                Personal and Universal Energies Only: &Personal-Universal Personal and Universal Energies Only means that the character can use spells listed as both Personal Energies and Universal Energies. The character’s spells will only be able to be utilized by tapping into either his personal energy or the energy of the universe around him.
              Rank:
                Adept: |
                  The character possesses at least 8 spells. He has a spell rank of at least Excellent in all of them and Incredible or better in at least two of them. He spends more time adventuring than he spends with his master, though he is still at his master’s beck and call. His studying of the writings of the ancient arts gleans him more information than if he were a novice or disciple.

                  This is the lowest rank at which a sorcerer could normally gain special attention from dimensional beings (see the Entreaty FEAT Roll Table and the Casting Shifts Table in Book 1.
              Master: ~
              Spells:
                Personal Energies:
                  Admittance:
                    Rank: Incredible
                    Number: 40
                    Reference: *Admittance
                  Apparition:
                    Rank: Incredible
                    Number: 40
                    Reference: *Apparition
                  Invisibility:
                    Rank: Incredible
                    Number: 40
                    Reference: *Invisibility
                  Luck:
                    Rank: Incredible
                    Number: 40
                    Reference:  The caster can disrupt probability fields so that very unlikely events can occur, somewhat like creating his own luck. For example, he could cause a table to collapse or a machine to tip over. He can not cause something to happen if that event is impossible; tables can not be created from nothing, and machines just can’t cease to exist. When the caster uses his spell, the player describes exactly what effect is wanted, and the Judge decides whether or not that effect is within the spell’s power and assigns an appropriate FEAT color. To use the spell the caster must make a successful spell rank FEAT roll. If the caster is trying to alter probabilities around magic materials or energies, such as magical artifacts or temples, apply a -2CS to the spell rank when making the FEAT roll.
                  Sensing-Evil:
                    Rank: Incredible
                    Number: 40
                    Reference: *Sensing-Evil
                  Sensing-Mystical Detection:
                    Rank: Incredible
                    Number: 40
                    Reference: *Sensing-Mystical_Detection
                Universal Energies:
                  Fear:
                    Rank: Incredible
                    Number: 40
                    Reference: |
                      This spell affects all targets in the area of effect. The spell releases an unreasoning fear from the target’s mind. All targets are allowed a Psyche FEAT roll to resist the effect (see the Magic Effects Table). If the target misses the roll, the frightened character wants nothing more than to run away and hide (all his actions while afraid are at -2CS). The victim will try to avoid, or if necessary attack, anyone attempting to stop or restrain him. The character can only perform actions (including spellcasting) that will help him to escape. The victim always flees away from the attacker, even if he cannot see the caster. After the first three rounds of being afraid, and every other round after that, if need be, the frightened character is allowed a Psyche FEAT roll to regain his composure. Once made, it will still take him a full round to get complete control of himself.

                      Though the caster must maintain a high degree of concentration on this spell to keep the target afraid (no attacks or other spellcasting allowed), he does not know when the character breaks the spell. Only when the target attacks the caster or otherwise acts contrary to a state of fear does the caster realize he no longer influences the target.
                  Forgetfulness:
                    Rank: Incredible
                    Number: 40
                    Reference: |
                      The caster can magically effect other characters’ minds and cause them to forget events. This is usually used by heroic magic wielders to protect innocent bystanders from the awesome psychic shock caused by some of the sights to be seen during magical combat, etc. It is also used by most magic wielding characters to protect their secret identities. Evil magicians may also use this spell to cover up their trail or their crimes. The duration of the spell is permanent (unless another sorcerer uses a Revival spell of at least equal spell rank to break the spell of Forgetfulness). The number of people that can be ensorcelled by the spell depends on the spell rank: Good = 1 person; Excellent = up to 5 people; Remarkable = everyone in 1 area; Incredible = everyone in a square mile; Amazing = everyone in 100 square miles; Monstrous = everyone on the planet; Unearthly everyone in one dimension; Class 1000 everyone in all dimensions.

                      Any character with a Psyche equal to or greater than the caster’s may make a Psyche FEAT roll to reduce the effects of the spell. Magic wielding characters have a +2CS for this FEAT roll. A green result means that vague recollections of the event sometimes surface in the character’s memory. A yellow result means that the character knows most of the highlights of the event, but cannot remember who cast the spell of forgetfulness. A red result means that the character can remember everything.
                  Static Field:
                    Rank: Incredible
                    Number: 40
                    Reference: |
