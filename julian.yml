            Defensive:
              Resistance to Magic Attacks: #D13
                Rank: Amazing
                Number: 50
                Reference: |
                  The hero has increased resistance to magic based attacks, whether physical or mental in orientation. Unlike D11 and D14, this Power rank can be lower than the Psyche rank, making the hero more vulnerable to some types of magic.

                  The hero can ignore any magic whose rank is less than this Power's rank and can reduce higher level attacks by the Power rank number.
            Detection:
              Environmental Awareness: #DT5
                Rank: Incredible
                Number: 40
                Reference: |
                  Range column B. The hero has increased sensitivity to conditions in, disturbances in, and influences on the environment. The hero automatically maintains full knowledge of current conditions in his surroundings. This awareness extends to such factors as weather, chemicals, movement, and life.

                  The rank determines the range to which the awareness extends: exceeding it requires a FEAT (+1CS, green; +2CS, yellow; +3CS, red). The hero can gain +1CS by linking his Health to the environment. In this symbiosis, harm to the environment is reflected in the hero's physical welfare.
              Extradimensional Detection: #DT5
                Rank: Incredible
                Number: 40
                Reference: |
                  The hero can sense across the dimensional barrier and see things existing in other dimensions.

                  A list of some of the dimensions in the Marvel Universe is found in Realms of Magic. These include Asgard, the Astral Plane, Avalon, the Dark Dimension, the Demon Dimension, etc. The power rank number equals the number of different dimensions into which the hero can see.
              Life Detection: #DT9
                Rank: Incredible
                Number: 40
                Reference: |
                  Range column B. The hero can detect the presence of life and identify the nature of that life. The hero can probe a specific target for more detailed physiological data on a red FEAT.

                  Rank determines the maximum range. A red FEAT allows the hero to locate a specific lifeform in the midst of a number of similar beings.

                  This is one of the Powers that can function as "Mutant Detection."
              Magic Detection: #DT10
                Rank: Incredible
                Number: 40
                Reference: |
                  The hero can detect and identify magic and its effects. The Power can detect both magic in actual use and in potential. As such, this is another way to detect mutants, although it cannot differentiate them from normal magic-users.

                  The hero can identify the past use of magic (a green FEAT), a yellow FEAT identifies the magic-user, and a red FEAT identifies the actual spell.
            Fighting:
              Martial Supremacy: #F2
                Rank: Amazing
                Number: 50
                Reference: |
                  In the MARVEL SUPER HEROES game system Fighting is considered an Ability, not a Power. However, this Power increases a hero's already-mastered Martial Arts (a Talent in the game system) to dramatically higher levels and allows him to perform actions that would otherwise be impossible, like splitting a battleship in two with a single karate chop.

                  Martial Arts as explained in the Advanced Set falls into five categories labeled A through E for simplicity's sake:

                  - A: This form uses the opponent's Strength against him and permits the hero to Stun or Slam an opponent regardless of their relative Strengths and Endurances.
                  - B: This form is keyed to offense by inflicting damage by short, quick bursts. The hero gains +1CS Fighting when engaged in unarmed combat.
                  - C: This form concentrates on holds and escapes. The hero gains +1CS to his Strength when Grappling or Grabbing and +1CS to his Agility when dodging.
                  - D: This form seeks out the opponent's weak points and strikes at them. The hero can ignore the effects of physical Armor when determining Stun and Slam results. Unfortunately, the hero must study his opponent for two turns before he can bring this effect into play.
                  - E: This form encourages quick striking to catch an opponent off-guard. The hero gains +1 to initiative rolls when engaged in unarmed combat.

                  The player chooses one of the above Martial Arts and determines its rank when he creates the hero. When this Power shows up, add its Power rank number to the already determined Talent rank number.

                  For example, the Kung Fu Kommando possesses Martial Arts E at Typical rank and Martial Arts Supremacy at Good rank. These combine to give Kung Fu Kommando an Excellent rank for his Martial Arts.

                  Martial Arts Supremacy can be used to do rank-level damage against non-living matter.

                  For example, Kung Fu Kommando can shatter iron, concrete, or bullet-proof glass with a red Power rank FEAT. If desired, this Power can be modified to fit any Fighting skill the prayer can imagine. This can include Supremacy in any one weapon, such as swordsmanship or archery.

                  Optional Powers include Iron Will and Weapons Creation.

                  The Nemesis Power is Martial Arts Supremacy of one rank higher than that possessed by the hero.
              Weapons Tinkering: #F5
                Rank: Unearthly
                Number: 100
                Reference: |
                  The hero can devise and assemble any weapon that can be made with the available materials. By means of a red FEAT, the hero can even improvise a means of creating unavailable materials (adamantium, for example). Provided he has the resources, the hero can assemble a functional copy of any weapon. As to what weapons he can make, use the Resource costs listed in the Hardware section of the Player's Book (pages 42-46). Compare the Power's rank with the cost of the desired weapon. Equal or lower cost weapons can be created on a green FEAT. A cost of one to three levels higher requires a yellow FEAT. A cost of four to six levels higher requires a red FEAT. If the cost of the desired weapon is more than six levels higher than the hero's Power rank, it is an impossible FEAT.

                  Example: Dr. Fixit has Excellent Weapons Tinkering and access to his brother-in-law's junkyard. He wants to build a battle-copter with adamantium armor. The copter has an Amazing cost. True adamantium has a Shift X cost: secondary adamantium has an Unearthly cost. Dr. Fixit makes the yellow FEAT: his copter will work. He doesn't have any adamantium, though, and tries to improvise. He fails to make a red FEAT: neither batch of "home-brewed" adamantium worked. Oh well, he can always convert that old boiler he found into armor plate.

                  When creating the hero, the player can choose to make the character a jack-of-all-trades or specialist in a particular field. If he chooses to specialize, he can raise the rank +2CS. Categories of weapons include:

                  - Edged and Blunt weapons
                  - Projectile weapons
                  - Energy weapons
                  - Heavy weapons
                  - Battle weapons
                  - Alien weapons
                  - Battlesuits
                  - War robots

                  Needless to say, the player will have to develop stats for anything he comes up with. If he successfully copies existing technology, like the Iron Man battlesuit or a SHIELD Plasma Beam Handgun, he can simply use the established stats for that device. Weapons Locker (MHAC8) by Epperson and Grubb is a valuable aid to the player of a hero with this Power. A clever character can also use this Power to make money off of other characters by building weapons on commission. After all, somebody's got to be building all those super-weapons tha`t fill the pages of comic books…
            Lifeform Control:
              Exorcism: #L5
                Rank: Amazing
                Number: 50
                Reference: |
                  The hero can release a being from any external domination imposed by a third party. Such controls include Possession, Mental Domination, Serial Immortality, and Magic. If there's a control, this Power can break it. This Power rank is compared to that of the Power controlling the subject. A Typical Intensity FEAT can sever a lower ranking control Power. A Remarkable Intensity FEAT severs a controlling Power of equal rank, and an Amazing Intensity FEAT severs one of one or more ranks higher. Upon severing the being's control over the subject, that being is immediately teleported to its home dimension.

                  This Power commonly appears as a spell used by sorcerers and holy men.

                  The hero must be within 10' of the subject in order to perform the Exorcism.

                  The hero can use this Power to resist the initial attempt by another to control him, but if this attempt fails (as per the FEATs listed above), he cannot Exorcise himself later.
              Summoning: #L20
                Rank: Amazing
                Number: 50
                Reference: |
                  The hero can summon and control extra-dimensional, corporeal beings. Such beings are commonly called "demons" but may be of any nature or disposition.

                  The Power enables the hero to summon any known extra-dimensional being, Provided his Power rank is higher than the being's Psyche rank, on a green FEAT. Equal ranks require a yellow FEAT. Trust me, you don't want to summon beings more powerful than you (they might answer), but if you do it anyway, you need a red FEAT. The summoned being is instantly teleported from its home dimension to a spot chosen by the hero. Once summoned, the being must perform a single task ordered by the hero. being must immediately set about fulfilling the order. If successful, he can immediately depart for his home dimension.

                  Players should refer to MHAC9, Realms of Magic, by Kim Eastland for a detailed list of beings this Power can summon. Normally, heroes will only summon magical creatures like demons and elementals. If a hero feels particularly confident, though, he might be able to call magical characters like Clea and D'Spayre. Heroes can never summon entities, although one might pretend to answer a summoning on a lark.

                  This Power summons one being at a time. Each additional being decreases the Power's rank by -1CS.

                  Remember that most magical beings are intelligent and that many are hostile to humans. The being a hero summons today might hold a grudge against him for eons to come.
            Magic:
              Enchantment: #MG1
                Rank: Amazing
                Number: 50
                Reference: |
                  The Mage is able to invest a target with Magical Power. The target must be a non-sentient being or even nonliving matter. The Mage is able to turn the Enchanted item into a battery that can harmlessly store Magic. Any spell stored within the item can be retained indefinitely in a state of readiness until the spell is somehow released. The Mage can store any spell he already possesses with the sole exception of this Power; a Mage cannot Enchant something that will then Enchant something else later on. If the Mage is working in conjunction with another being who possesses other Magic or Powers, these can be stored away as well by incorporating them into the spell.

                  Enchantment can store any number of spells, within the limit imposed by Enchantment's rank number. The total rank numbers of any.spells that are Enchanted into a target cannot exceed Enchantment's own rank number.

                  For example, Feeble Enchantment can only store a single Feeble spell; Monstrous Enchantment can store one Amazing and one Excellent spell, seven Good spells, 37 Feeble spells, or any combination.

                  The Mage is not required to cram everything he has into every Enchantment he makes.

                  The Mage must make contact With the item in order to fully Enchant it. If he does not make physical contact, the rank of any spells he is storing decreases -1CS for each ten feet that separates the Mage and the item. For example, a Monstrous Enchantment could only place Typical spells in a target 60 feet away.

                  Enchantment is disrupted by the presence of a Psyche in the target. This is why only non-sentient or nonliving items can be used. While sentient Robots and Computers cannot be Enchanted, mindless servomechanisms can be. The mechanical components of a Cyborg may fall into this category; the Judge is free to decide on an individual basis. If he decides so, the Enchantment does not directly affect the living sections of the Cyborg.

                  Enchantment can be prevented by a variety of factors. Interrupting the Mechanism that creates this Effect will prevent Enchantment from occurring at all. Removing the target causes the Mage to Enchant the now-empty air; if the inter. loper substitutes another item before the Mechanism is complete, then that item will get Enchanted instead. A would-be target can be protected from unwanted Enchantment by Force Field vs. Magic, Resistance to Magic, Magic Control, Magic Domination, or a previously created Ward.

                  When the Mage Enchants the item, he must specify the stimulus that will release the Magic. This can be a specific time, event, condition, intended target, or have a controlled release at the will of whoever is in possession of the Enchanted item. This last example includes such things as magical amulets, swords, wands, and the rest of the exotic paraphernalia that clutters the Sword-and-Sorcery genre.

                  Such an item reverts to normal when all the spells have been released. Some spells are permanent modifications. These are spells that only directly affect the item itself and not a second, external target later on. The innate Powers of a permanently Enchanted item can be resisted or even negated by such Powers as Force Field vs. Magic, Resistance to Magic, Iron Will, Magic Control, or Magic Domination.

                  Optional Powers include Elemental Conversion, Molecular Conversion, and Molding.

                  Nemeses include Force Field vs. Magic, Resistance to Magic, Magic Control, or Magic Domination.
              Warding: #MG13
                Rank: Amazing
                Number: 50
                Reference: |
                  The Mage can create areas of latent Power in any desired location. The Ward is designated by a special substance or mark. The mage decides what specific Powers the Ward possesses and what the triggering stimulus will be. When that stimulus occurs, the Ward releases all its power is a single turn, generally in the direction of whatever created the stimulus.

                  The Power's rank determines how great a variety of Wards the Mage can create. The rank number is also the number of Powers he can incorporate into his Wards, even if the Mage cannot directly use those Powers. hirrn-self. Each Wards's intensity rank is the same as the Mage's own rank. For example, a Mage with Excellent Warding can create 20 different Wards, each possessing Excellent Intensity rank.

                  A Remarkable Intensity FEAT enables the Mage to create a single-use Ward. An Amazing Intensity FEAT enables him to create a self-renewing Ward. The Power rank number is also the maximum number of Wards a Mage can have in existence at any one time. If the Mage tries to surpass this number, his oldest still-existing Ward harmlessly vanishes. The minimum distance between Wards is one foot for each point of the Wards' combined Intensity rank numbers. For example, a Feeble and a Monstrous Ward must be separated by at least 77 feet. If the Mage attempts to place a new ward within range of an existing one, the new one will not function. If the new Ward's area of effect would overlap with another Ward, the new Ward cannot have the full Intensity rank. The new Ward will have a maximum rank that will only touch the edge of the earlier Ward's range. For example, a Good Ward coyers an area of ten-foot radius.If the Mage tries to create a Remarkable Ward within twenty feet of the Good Ward, lie discovers he can only create a Good ward at best. If he backs off another twenty feet, though, he can create the Intensity he desires.

                  The triggering mechanism can be any condition stated by the Mage at the time of creation. Normally Wards are. triggered by the close passage of a living being. Thus they are often found near doorways or in passages.

                  Once created, Wards last until they are depleted or destroyed. Given the durability of modern building materials, a Ward can last for about a century or so. (Quick, name five 100-year-old buildings in your area!) Wards can be destroyed by demolishing the surface on which they are placed or by the use of Magic Control/Negation. Wards can be detected by a number of ways. The simplest is the brute force method of triggering them (also called the really stupid method). The presence of a Ward can be revealed by either Energy, Magic, Power, or Psionic Detection.

                  Shortly after the Mage has been created, the Player should make up a list of at half of the possible Wards he can create. The Player should return to the Power Generation tables on pages 14-16 and randomly generate all the Powers the Mage can incorporate into Wards. Wards that employ a special variation on normal Power use, such as a Power Stunt, should be treated as individual Wards.

                  Example: Consider two different Wards that each employ Force Field Generation. One creates a trap that envelops anyone within the target area. The other one creates an invisible column of force that shoves anyone back with rank level Strength. Each of these is considered a separate Ward and requires a unique designation.

                  Nemesis Powers include Energy, Magic, Psionic, and Power Detections and Resistance to Magic.
            Mental Enhancement:
              Hyper-Intelligence: #M13
                Reason: 
                  Rank: Unearthly
                  Number: 100
                  Type: Intermittent
                Intuition:
                  Rank: Unearthly
                  Number: 100
                  Type: Intermittent
                Reference: |
                  Normally a character's Intelligence is determined in the Character Generation Process. However, the research for the Ultimate Powers Book showed that extreme levels of Intelligence can be a Power in its own right. Examples include The Leader and the late Soviet scientist known only as Gargoyle. The hyper-intelligent character is a genius of awesome potential. He can quickly master new subjects, retain that knowledge indefinitely, and easily succeed in any mental endeavor.

                  There are two ways the Power can be incorporated into a character. The player should choose one when he first creates the character (a coin toss will do).

                  The first method is a permanent modification of the hero's Intelligence. The Power rank number is added to the hero's previously generated Reason or Intuition rank number. The total is the hero's actual Hyper-intelligence. For example, a character like the Leader started off with Good Reason. The gamma rays added Incredible Hyper-Intelligence for a final total of Amazing Reason rank.

                  The second method uses Hyper-Intelligence the same way most other Powers are used-intermittently. Just as Siryn doesn't scream all the time, so too would a Hyper-intelligent character have normal intelligence most of the time. When he uses his Power, he transforms himself into a mental giant. The way it operates is the character's normal rank for either Reason or Intuition is raised the number of levels equal to the Power rank (Feeble is +1CS, Poor +2CS, and so on). The total is the actual Hyper-Intelligence rank the character can achieve using this Power. The hero can retain this higher rank for a limited amount of time: the duration is the number of minutes equal to the original Ability's rank number. This is for the first time each day the hero uses the Power. Each successive time the hero uses his Power within the same day decreases the duration -1CS.

                  Example: Steve is creating an awesomely wise alien named Shepherd. Shepherd has a normal Incredible Intuition rank. His Power rank is Excellent. This raises the Intuition rank by +5CS to a potential Shift-Y rank. Shepherd can retain this enhanced state for an Excellent duration of 40 minutes before he reverts to normal. Summoning his Power a second time, he returns to Shift-Y Intuition for a Remarkable duration of only 30 minutes. He can summon his Power five more times after that, then he has to rest.

                  When creating the character, the player can increase the Power rank +1CS by specializing in a specific fields. After all, comics are filled with characters who are titans in the lab but failures in other fields. Possible fields include Professional and other Talents, such as Medicine, Engineering, and Animal Training.

                  Optional Powers include Hyper-Invention and Total Memory.

                  The Nemesis is Mind Drain.
              Hyper-Invention: #M14
                Rank: Unearthly
                Number: 100
                Reference: |
                  This is a special form of Hyper-intelligence that is common enough to merit its own classification. It is a permanent enhancement of the hero's overall intelligence that is channeled into the field of mechanical design and engineering. The hero is an Edison-like genius who take existing materials and technologies and use them to create new devices or applied technologies. He can repair previously operational devices, even if the device was of an unknown type.

                  The hero can learn new technologies at a rate determined by his rank, the complexity of the technology, and the amount of instruction available. Modern technology requires an Excellent Intensity FEAT. Advanced technology requires a Remarkable Intensity FEAT. Alien or futuristic technology vary from Incredible Intensity (Shi'ar) to Unearthly (the Watcher). The color of the FEAT is determined by the amount of instruction the hero receives. A green FEAT requires instructional materials that explain the technology (a teacher, books, holocubes). A yellow FEAT is required if the hero has access to materials not specially designed to instruct someone in that technology (readouts, performance specs, operating manuals, a copy of a working device). A red FEAT is required if all the hero is has an inoperational device if that technology.

                  Like Hyper-intelligence, the Hyper-Inventor can raise his rank +1CS by specializing in a particular field. Examples include vehicles, weapons, biomedical technology, and architectural engineering.

                  The hero has the ability to manufacture or modify items using any technology he knows. He still requires adequate physical resources to create the items, though the cost of anything he builds himself is decreased -2CS compared to the list price for off-the-shelf versions. A Power FEAT based on the desired item's tech level determines the durability of the item. A green or yellow FEAT means the item has the same durability as a normally manufactured item. A red FEAT means the item will function but has performance problems: the Judge can decide how long or well the item functions before it fails.

                  Note: This is one of those Powers that can be used for personal profit. The hero can design and build exotic paraphernalia for other characters and NPCs on commission. This can raise the hero's Resource level by whatever fees he can get away with.

                  Optional Powers include Weapons Tinkering, Machine Animation, Molding, Artifact Creation, and Machine Creation.

                  Nemeses are Mental Duplication and Mind Drain.
              Iron Will: #M16
                Rank: Unearthly
                Number: 100
                Reference: |
                  The hero has complete conscious control over his mind and body. By using his Iron Will, the hero can temporarily halt the damage done by mental or physical attacks: he can even postpone his own death.

                  Iron Will can be used in place of any lower-ranked Ability to determine Resistance to an attack. Any time the hero suffers damage from an attack, the Power can temporarily absorb it before it can affect any of the hero's Ability ranks. The maximum amount of damage Iron Will can absorb at one time is equal to its rank number. Absorbed damage does not affect the hero at that time. Damage exceeding that amount affects the hero in its normal manner. The hero can maintain his Iron Will indefinitely but will eventually have to relax his self-control in order to heal and renew his Power. Letting down his control causes him to immediately suffer a loss of Health points equal to one half the amount of damage Iron Will had absorbed. Regardless of the original nature of the attack, it is always translated into lost Health points: this reflects the strain the Power places on the body. Once the translation occurs and the Iron Will has been purged of its burden, it is able to absorb new damage. The cycle of absorption/purging/ absorption can continue until the hero's Health drops to zero or below. Note: The Power. can still absorb damage, even if the conversion of that damage into Health points will result in the immediate death of the hero. In such a case, the hero had best make sure he is already in an excellent Trauma Center when he relaxes his Power.

                  Example: Sunstone is battling the Marauders and not doing too well. He possesses Incredible Iron Will and has 100 Health points. Harpoon hits him with a Slayspear: this does 40 points of damage. Iron Will absorbs it all but immediately reconverts it to a loss of 20 Health points. Sabertooth slashes and gnaws Sunstone for 60 points. Iron Will only absorbs the first 40, then immediately converts it. Health now stands at 40 points. Malice attempts to Possess Sunstone: Iron Will fends off the mental attack but at a cost of another 38 points. Sunstone decides discretion is better than valor and flees. Scalphunter fires at the retreating figure and inflicts thirty more points of damage. Sunstone heads for the best-equipped hospital in the area. He manages to maintain his self-control until he is actually in the operating room, then he passes out as wounds suddenly appear across his body.
              Linguistics: #M17
                Rank: Unearthly
                Number: 100
                Reference: |
                  This is a specialized form of Hyper-intelligence. The hero has the ability to rapidly learn any language if sufficient material is available for him to work with. Once the language is mastered, the hero is fluent in that language, provided he is physically capable of communicating in it.

                  The number of languages a hero is currently fluent in is limited to the Power rank number. For example, Doug Ramsey's Incredible rank enables him to retain fluency in up to forty languages at a time. When a hero exceeds that limit, he begins to forget a previously mastered language. This will usually be some obscure tongue the hero has had little use for, like Basic Otter or Mephitish.

                  The speed with which a hero can learn a new language is determined by its strangeness and what source materials are available. Current human languages require a Poor FEAT. Archaic human languages are a Good FEAT. Alien but Humanoid languages are Remarkable FEAT. Animal languages are an Incredible FEAT (note: not all animals have an actual language). Alien, nonhumanoid languages are an Amazing FEAT. The color of the FEAT is determined by the source of the language. A green FEAT is needed if the hero has access to actual instructional materials or a cooperative native speaker of that language who also speaks a language the hero knows. A yellow FEAT is needed if the hero has a native speaker who cannot speak any tongue the hero knows or if the hero only has non-instructional samples of that language. A red FEAT is needed if the hero has only fragments of the new language. For example, learning Shi'ar from watching a broadcast of a speech by Majestrix Lilandra is a yellow Remarkable Intensity FEAT. Learning spoken Primate by actually using sign language to talk with a chimpanzee requires a green incredible intensity FEAT.

                  The hero can try a FEAT roll every hour. Failure means he simply has not yet gotten the hang of the new language. The only real drawback to the Power is that the hero may accidentally forget his native language, especially if he rarely uses it. Still, he can always re-learn it. There is a danger that an adversary might warp the hero's Linguistic Power and actually negate his language comprehension: in such a case, the hero becomes dyslexic and unable to understand simple English.

                  A curious side-effect of the Power is that it provides Power rank Resistance to Hypnotic Voice and other sonic-based forms of Hypnotic or Mind Control. The hero's mind shifts into its translation mode: it studies the medium through which the hypnosis is communicated rather than the actual message. ("Lorelei, did you ever realize that your sleep command is a high C-sharp while your paralysis command is a high C-flat?")

                  The Optional Power is Hyper-Intelligence.

                  The Nemesis is Mind Drain.
              Total Memory: #M33
                Rank: Unearthly
                Number: 100
                Reference: |
                  The hero has the ability to remember anything that he has ever experienced. This could be a book he's read, the faces of everyone he saw on Tuesday, what birth was like, and so on. The accuracy of his recall is his Power rank number treated as a percentage. Feeble is 2%, Excellent is 20%, and so on to automatic accuracy at Unearthly rank or above.

                  The color FEAT reflects the nature of the memory being sought. Green FEATs involve personal memories. Yellow FEATs involve learning experiences. Red FEATs involve unconsciously gained information, such as the faces of everyone the hero saw on Tuesday.

                  The Power is the perfect complement for Hyper-Intelligence by providing a built-in library. It can be used to simulate that Power, Hyper-Invention, or Weapons Tinkering, provided the hero once read texts that explained how to do things that come naturally to those with the other Powers. ("Well, I read Reed Richard's notes on constructing dimensional gateways, so if I just follow his plans we should be in the Negative Zone by next Monday night.")

                  When playing a character with Total Memory, assume he is a voracious consumer of all media. It is to his advantage, after all. Such characters are also fond of quoting obscure texts or unconsciously reciting encyclopedia entries. The Power doesn't really alter either Intuition or Reason, thus these can be used as a guide for what the hero has probably read in the past. When the hero claims to have read a special text, the player is required to make a Reason FEAT to prove he has read something along the desired liner.

                  Flashback is a real danger. If the hero was ever a victim of a mental attack, there is a chance the memory will accidentally resurface at a later time and the effect returns anew. Such flashbacks occur when the hero is somehow reminded of the original incident. The hero must make a green Psyche FEAT to avoid reliving the full effects of that other Power.

                  Example: Phtomemry was under Ringmaster's Hypnotic Control for two days back in 1978. Today he saw a news report on Ringmaster's parole hearing. Suddenly the compulsion to rob jewelry stores returned.

                  Optional Powers include Hyper-Invention, Hyper-intelligence, and Weapons Tinkering.

                  The Nemesis is Mind Drain.
            Power Control:
              Focus: #PC7
                Rank: Amazing
                Number: 50
                Total:
                  Rank: Class 1000
                  Number: 1629
                  Spread: 27
                  Turns to Full Recovery: 33
                Reference: The hero can channel all his raw energy into a single burst of a chosen Ability or Power. All his Power and Ability rank numbers are totaled together. This rank number replaces the rank number for a chosen Power. Upon the completion of releasing the Power, all the hero's Abilities and Powers temporarily drop to Feeble. This Power's rank number is the total amount of lost points the hero can regain each turn. Points are divided evenly between all the depleted Abilities and Powers. (Okay, this isn't really a Power either. Roll again for an additional Power.)
            Other Powers: #From APB
              Body Alterations/Defensive:
                Immortality:
                  Reference: &Immortality |
                    The character with this Power does not age or die in a normal fashion. Now, before you all run out and grab this Power for your young hero, note the fine print. The hero can still suffer loss of Endurance ranks as the result of wounds, poisons, and damages, but if the results call for perishing. then the character is left at Shift 0 Endurance but does not die. The character cannot move or act until Endurance reaches Feeble, however. so throwing an Immortal character into an active volcano will keep him out of the way for a while. (He cannot heal while taking damage.)

                    If Endurance reaches Shift 0, or the character otherwise dies, the immortal character loses all Karma, including that set aside for advancement. The character may be out of luck, but at least he has his Health. If an immortal character is part of a Karma pool, then an amount of Karma is subtracted as if the character had left the group. This is done each time the immortal character becomes "dead."

                    This Power does not have a Power rank. It counts as two Powers for any hero who takes it, unless the character is alien in origin, in which case the cost is normal (this reflects that a large number of extradimensional aliens are effectively immortal).

                    An immortal character's body will slowly regenerate lost parts and heal. so that short of atomizing the remains and spreading that collection of atoms through a large portion of space, the immortal character will return at some point in the future.

                    Immortality is applicable to the Earth Dimension only (including all planets of this dimension). An immortal character in another dimension—such as Asgard or Olympus, but excluding variant or divergent earths-does not age, but may be killed normally while in that dimension.
              Mental Powers:
                Mechanical intuition:
                  Reference: This is a specific form of Ultimate Skill that affects repairs. inventing, and building things. The character with this Power has a strong intuitive knowledge of machinery. Regardless of Reason, any rolls for determining whether an invention works or not are at Unearthly Rank. No modifiers may be added to this roll. The character with this Power must still provide Resources for these inventions in the standard fashion.
              Magic:
                Eldritch Bolts:
                  Rank: Amazing
                  Number: 50
                  Reference: &Eldritch_Bolts |
                    Eldritch Bolt is a bolt of magical power, and includes all manner of spells such as Doctor Strange's Bolt of Bedevilment. The range is as determined in the spell range table, and damage is equal to the Power rank, with the following difference: the bolt may reduce Health or Karma values (in the latter case, the target's effectively out of luck). If the bolt attacks Health, treat it as a Force attack.
                Eldritch Shield:
                  Rank: Amazing
                  Number: 50
                  Reference: &Eldritch_Shield |
                    The Eldritch Shield is a shield of mystical energy that provides the caster with mystical Body Armor equal to the caster's rank number. This is also proof against magical attacks or those attacks which arise from magic.

                    If an attacker directs his attacks against the shield Itself, treat the attack as an attempt to break the material, with the attacker's bolt supplying the strength and the defender's shield the object that may be broken. The mage whose shield is broken that round takes no damage, but has no shield until he raises it the next round. An Eldritch Shield will protect its caster from all forms of magic of up to the Psyche of the caster.
          Talents:
            Weapons Skills:
              Guns: &Guns Individuals without this Talent fire guns (all handguns, rifles, and submachine guns, including laser, stun, and concussion varieties) at their Agility rank. Those with this Talent fire such weapons at +1CS.
              Thrown Weapons: Characters with this Talent toss weapons designed to be thrown (including spears, daggers, Shuriken, disks, and snowballs) at +1CS to their Agility.
              Bows: Bows are tricky items to operate, such that those who have not been trained fire them at -1CS to their Agility. Those with this Talent gain a +1CS to hit with all bows, including crossbows, and may fire and reload in a single round. They may fire multiple arrows on a successful Agility FEAT.
              Blunt Weapons: &Blunt_Weapons Characters with this Talent gain a +1CS to hit when attacking with a weapon that resolves attacks on the Blunt Attacks column of the Battle Effects Table.
              Sharp Weapons: &Sharp_Weapons Characters with this Talent gain a +1CS to hit when attacking with a weapon that resolves attacks on the Edged Attack column of the Battle Effects Table. This includes swords, daggers (unless thrown), and spears, but excludes claws and other natural extensions that inflict this type of damage.
              Marksmanship: &Marksmanship The character with this Talent gains a +1CS to hit with any distance weapon that requires line of sight to hit (the character could benefit when firing heavy artillery, but not when controlling a tele-guided missile). Such a weapon in the hands of a marksman does not suffer penalties to hit from range.
              Weapons Master: The character with this Talent gains a +1CS to hit with any weapon that requires a Fighting FEAT to hit.
              Weapons Specialist:
                - The character with this Talent gains a +2CS with a single weapon of choice. This may be any type of weapon, missile, or melee. The character who is a weapon specialist will also increase his initiative when using this weapon by 1.
                - Weapons:
                  - Club
                  - Sword
                  - Knife
                  - Spear
                  - Handgun
            Fighting Skills:
              Martial Arts A: &Martial_Arts_A This form of martial arts concentrates on using an opponent's strength against him and is typical of oriental-American forms such as judo and karate. The practitioner of this type of martial arts can Stun or Slam an opponent regardless of their comparative Strengths and Endurances.
              Martial Arts B: &Martial_Arts_B This form of martial arts is keyed on offense and inflicting damage in short, quick bursts, and includes such disciplines as boxing. The practitioner of this form of martial arts gains a +1CS to Fighting ability when engaged in unarmed combat.
              Martial Arts C: &Martial_Arts_C This form of martial arts concentrates on holds and escapes. The practitioner of this form gains a +1CS to his Strength for Grappling attacks (including damage), a +1CS to Strength for Escaping, and a +1CS to Agility for purposes of Dodging.
              Martial Arts D: This meditative form of martial arts searches out the weak spots of the opponent's defenses and strikes against them. The practitioner of this form of attack may ignore the effects of Body Armor (though not force fields) for determining Stun and Slam results. The attack by the character with this Talent does not have to inflict damage to force a check for possible Stun and Slam. The disadvantage is that the target of this attack must be studied for two rounds before the effects may be brought into play. The character with this Talent does not have to attack the character, only watch him in battle for two rounds previous to attacking.
              Martial Arts E: &Martial_Arts_E This form of martial arts encourages quick striking to catch the opponent off-guard. Heroes with this form of Martial Arts are at a +1CS to initiative rolls in unarmed combat.
              Wrestling: The hero with this Talent is proficient in applying holds. It includes familiar types of wrestling as well as the sumo forms of the art. The hero with this Talent gains a +2CS when making Grappling attacks, but gains no benefit in damage. (A hero with Martial Arts B and this Talent gains a +3CS to hit in a Grappling attack, and a +1CS for damage.)
              Thrown Objects: The hero with this Talent gains a +1CS with all Throwing attacks (both Edged and Blunt) and +1CS on Catching. This applies to both thrown weapons and normal items. If the hero has the Thrown Weapons Talent as well, the modification is +2CS when using thrown weapons.
              Acrobatics: &Acrobatics The hero with this Talent is very limber and as such gains advantages when under attack. The hero has a +1CS when dodging, evading, and escaping.
              Tumbling: &Tumbling The hero with this Talent knows how to fall and land without undue injury. Individuals with this Talent may make an Agility FEAT to land feet-first after any fall that does not inflict damage.
            Professional Skills:
              Medicine: The hero with this Talent has extensive knowledge of medicine and as such limited Talents in healing. In general, a character losing Endurance Ranks as the result of a lethal situation can have those losses stopped by any character checking on him. The individual with Medicine Talent may bring back characters that have reached the Shift 0 level up to 20 turns after they have reached that level. A character with this Talent may restore one rank of Endurance to a wounded character per week, in addition to natural healing. Finally, the character with Medicine as a Talent is +1CS on Reason FEATs that involve medical problems, medications, poisons, and surgery.
              Law: The character with this Talent has an extensive background in law (the assumption being US Law, but this may vary according to the Judge's campaign). The hero may be a lawyer or capable of applying to pass the bar (Reason FEAT of Good Intensity). A character with Law as a Talent gains a +1CS to all FEAT rolls involving the law, including correct legal procedure. A character without Law gains no benefit to Reason FEATs, and in addition, will have to make Reason FEATs more often than a character with Law Talent.
              Pilot: &Pilot The character with this Talent has a working knowledge of most aircraft and receives a +1CS for all FEAT rolls involving an aircraft that character is controlling (including Control FEATs, Agility FEATs, and Reason FEATs involving aircraft handling and design). A character with a background that would permit it (a hero who is an alien) may extend this Talent to spacecraft as well.
              Military: &Military The hero has had some dealings with one of the armed services. In military matters, the hero gets a +1CS to all FEAT rolls, and in addition may take a member of the armed services as a Contact.
              Business/Finance: The hero is familiar with the world of business, corporate finance, and how money works. Initial resources are a minimum of Good, and the hero gains a +1CS for FEAT rolls dealing with money. The hero gains a Contact in the Professional category.
              Engineering: |
                Engineering includes all the varied types of that profession dedicated to the design of functional items: civil, chemical, mechanical, etc. A character with Engineering Talent gains a +1CS to all FEATs involving building things, including the Resource FEAT to determine if an object can be built.
              Criminology: &Criminology The hero with this Talent has an understanding of the criminal mind and behavior, either from studies or first-hand observation. The character with this Talent gains a +1CS on all Reason and Intuition FEATs involving criminal practices ("If I were a crook, where would I hide?"). The hero also gains a Contact in either the police or crime areas.
              Psychiatry: The hero with this Talent has a background in studies of the mind and as such gains a +1CS on all FEATs involving the mind. This is a popular Talent with those heroes and villains with Mental Powers, and the character with these Talents gains a +1CS on FEATs involving Mental Control, Domination, Hypnosis, Emotion Control, and Mental Probe Powers.
              Detective/Espionage: &Detective-Espionage The hero with this Talent has been trained to notice small clues in solving crimes. The character with this Talent gains a +1CS to discover clues to a crime, and in addition gains a Contact in either crime, law enforcement, law, or espionage.
            Scientific Skills:
              Chemistry: A +1CS on matters of chemistry, including developing new formulas, finding cures for inorganic poisons, and identifying chemicals by smell, touch, or taste.
              Biology: A +1CS on matters of biology, including animal and plant identification, finding cures for organic poisons, and researching diseases and their cures.
              Geology: A +1CS on matters involving the Earth, including volcanic activity, the geology of the surrounding land, types of rocks and their powers, and mineral identification.
              Genetics: A +1CS on matters involving the genes, including creating new life forms, understanding mutants, and researching diseases.
              Archaeology: &Archaeology A +1CS on matters involving the past, including paleontology, historical records, and ancient myths and legends.
              Physics: A +1CS on matters involving physics and astrophysics, including motion, flight, and the planets and stars.
              Computers: &Computers A +1CS on matters involving computers, computer-controlled equipment, and artificial intelligences.
              Electronics: &Electronics A +1CS on matters involving electronic devices, including their creation and repair.
            Mystic and Mental Skills:
              Trance: &Trance The character may place himself into a trance. While in a trance, the character slows his body functions to such a level that he may be assumed to be deceased (Intuition FEAT for the character checking). A character in a trance reduces needs for food and water to a minimal level, and may regain Endurance ranks at one rank per day.
              Mesmerism and Hypnosis: &Mesmerism_and_Hypnosis This Talent is a primitive form of Mind Control at the Power rank number equal to the Reason of the character with this Talent. Information can be gained as per a Mental Probe, and posthypnotic suggestions may be implanted within the victim's mind. Any attempt to force an individual to do something that he would not normally do, or divulge information that he would not normally reveal, will cause the hypnotism to break. A hypnotic command fades in 1-10 hours after it is given.
              Sleight of Hand: This is a Talent developed by stage magicians which causes items to appear and disappear by a combination of misdirection and swift, fluid gestures. The character with this Talent may palm small items, making them appear or disappear with Agility +1CS ability.
              Resist Domination: &Resist_Domination This is a Psi-Screen that may be developed by individuals without that Power. This permits the character to resist mental attacks as if the character had a mental power of Psyche +1CS. The Talent is passive in nature and does not grant any other particular benefit. A character with Mental Probe may be able to discern where the character gained this Talent, but nothing else.
              Occult Lore: &Occult_Lore The character with this Talent has a knowledge of magical societies, antiquities, runes, and a general understanding of forgotten lore. The character gains a +1CS to Reason FEATs involving items of a magical nature.
              Mystic Background: &Mystic_Background In the Marvel Universe, all humankind has the potential for developing magical Powers. This "Talent" shows that the character has some background with magical forces. Heroes may have derived their powers from these forces if they choose this Talent. A character with this Talent may have Magical Powers, with the approval of the Judge. If the Judge allows magical player characters, then any of the initial Powers created may be spells, and should be noted as deriving from Personal, Universal, or Dimensional energies.
            Other Talents:
              Artist: The character with an artist background creates works of art, either for himself or for sale to others. This includes painting, sculpting, and writing. A single work takes 1-10 weeks, and upon completion grants the artist Karma points equal to 10 times the number of weeks. The character must allocate some time daily at his work.
              Languages: &Languages The character with this Talent has a natural understanding of languages. The character gains 1 additional language at start, and may add other languages at half the cost of a Talent (500 points regardless of who teaches it). Characters without the Languages Talent must gain this Talent first to learn other languages. The gaining of additional languages assumes someone is available to teach these languages. A Player character with this Talent does not have to assign a language at start, but may fill one in later as need be.
              First Aid: &First_Aid The medicine Talent notes that the loss of Endurance ranks may be halted by someone checking on the dying character and administering some form of aid. The First Aid Talent grants the character this immediate halt to Endurance rank loss, the recovery of one rank immediately (one use only per situation), and in addition, the hero with this Talent can stabilize a dying character at Shift 0 Health up to 5 rounds after that character reaches that level.
              Repair/Tinkering: &Repair-Tinkering The character with this Talent gains a +1CS to any Reason FEATs involving the repair and modification of existing items, but not the building of new items. This +1CS may be added to any other bonuses gained from other Talents, so that an Engineer with Tinkering Talent would gain a +2CS on repair.
              Performer: The character is someone who acts, sings, dances, mimes, or otherwise uses his Talents to entertain (this is related to the Artist, the key difference being that the Artist may leave the scene of creation; the Performer is identified with that creation directly). A Performer receives 10 karma points for a week's worth of performance, whether in a play, doing a nightclub routine, or working for a movie.
              Leadership: The hero with this Talent has the brains and understanding of a cohesive group, such that he is a benefit to the team. Any Karma Pool to which the character belongs receives a 50-point bonus, provided the character with this Talent is recognized as the "team leader." A Karma Pool may only have one recognized leader, though more than one character with Leadership may belong to one group. When the "Leader" of a group leaves, the 50 points are deducted from the Karma Pool, but the leader does not receive them for personal use (the bonus points only exist as a part of the pool)
            Magic Wielder Talents:
              Bibliophile: &Bibliophile The character has an extensive knowledge of magical books, scrolls, or other primarily informational items, and the lore concerning them. He has a +2CS when using or researching these.
              Chronicler of Magic: The character studies magical societies and their activities. He has a +2CS for researching and/or knowing who the adepts and masters are, what their relationship is with each other and with any beings that they entreat, and for any specific facts about most magical cults.
              Demonologist: &Demonologist The character has studied accounts of demons in the Marvel Universe and he knows how dangerous and hostile they are. The character receives a +1CS in any situation involving demons, including research, communication, identification, and combat.
              Occultist: &Occultist |
                The character has made extensive studies into the area of occult happenings, including: unexplained events and mysteries of the world, hauntings, and other manifestations of the spirit world. He has a +2CS when researching or dealing with occult events.
              Runesmith: &Runesmith The character is a transcriber and translator of runes, especially ancient, magical runes. (A rune is a letter in an ancient alphabet. Most ancient magical items have runes on them to warn potential users of the possible harm that the item can cause. These runes can be any one of a vast array of almost-forgotten codes.) The character has a +2CS whenever studying, deciphering, or inscribing runes.
              Scholar of Antiquities: &Scholar_of_Antiquities The character has an extensive knowledge of antiques, especially ancient magical artifacts and lore concerning them (but not including books, scrolls, or other artifacts that are primarily informational). He has a +2CS when dealing with them or researching them.
              Stamina: The character has trained himself to go many days without eating or sleeping in the pursuit of his magical studies. If researching anything magical or just using a spell (no physical combat or extensive movement allowed), the character can go without food or sleep for up to 6 days.
              Theoginist: &Theoginist The character is a scholar on the origins of the powerful extra-dimensional beings and gods of the Marvel Universe (this category includes all of the major entities listed in the Miscellany of Mysticism and those beings that provide dimensional energy when called upon, such as Dormammu). The character has a +2CS when researching information on this subject.
              Zoologist of Magic: &Zoologist_of_Magic The character studies magical creatures and has collected books on the subject. This talent includes not only mythological or fantastic beasts of Earth’s legends but also the creatures of other dimensions in the Marvel Universe. He has a +1CS when attempting to identify magical creatures and their powers. (Please see the Magical Creature section in Book 3 for many known magical creatures.
