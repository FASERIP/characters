      Description:
      Biography: Born in Nicomedia in the year 380 in what was then the Eastern Roman Empire, Julian Hieronymus Constantine, then known as Ioulianós ó Nikomediátes, unlocked the secrets of the Philosopher's Stone in the early-mid Fifth Century, gaining immortality and eternal youth and health.  He has spent the centuries since honing his mind, body, and spirit to unprecedented levels, dedicating himself to the mastery of anything that has caught his attention along the way.  By the late 20th century, he is exorbitantly wealthy and well-connected along with his hyper-competence, due to incessant personal development and cultivation. Of human peak physicality, his mind is centuries since transcending all human limits..
      Personality: Julian is, in a general sense, heroic, noble, valorous, and beneficient, although as a man well into his second millennium of life, having witnessed the rise and fall of many cultures, societies, and philosophies, and their values, his view is long and his perspective distant and somewhat detached.  What heroic and noble means to him reflects that perspective. He is gregarious, humorous, and charming, socially, although he prefers such socialization to be on his terms. He is disciplined, focused, and meticulous, as well as obsessive about his personal development—he devotes a considerable amount of his waking hours to that pursuit.
      Appearance: Tall, long-limbed, broad-shouldered, and athletic, his olive skin, dark hair, strong, regal facial features, and piercing green eyes reflect his ancient Near-Eastern heritage, an ethnicity that no longer exists in that form among the entirety of humanity save himself.  When out of his armor, he tends to wear impeccable, tailored suits in neutral colors appropriate to the season, and quite a bit of jewelery with mystic or occult connotations, some of it as ancient as he is, or more.
  Supporting Cast:
    Leonidas:
      Description: A particularly large housecat most resembling a strikingly ancient- and wild-looking Oriental breed, somewhat like an oversized Egyptian Mau, with a black spotted silver tabby coat and brilliant green eyes. While still very much a cat in personality, it's tempered by intelligence and insight that's far above the human norm and over a millennium of existence in close contact with Julian Constantine, giving him a dry, witty, sarcastic detachment and studious, serious, somewhat pessimistic outlook.  Leonidas doesn't speak or use telepathy to communicate per se, but is exceptionally adept at making himself understood by others, as well as understanding them, regardless of language, the same as if he were conversing like any human.
