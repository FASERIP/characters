                      - Explosive Heat-Seeker Ammunition
                  Target Pistol: The Target Pistol is the most finely balanced and accurate of the pistols. The user of a target pistol suffers no penalty for range when firing with two hands
                  Variable Pistol: The Variable Pistol has an advantage in that it may be set in the field to a specific type of ammunition and changed according to need. Most handguns fire standard ammunition and must be modified to fire other types as well.
                  GyroJet Pistol: A GyroJet Pistol fires a miniature rocket, which may affect one or more targets according to ammunition type. Gyro-jets will only fire one type of ammunition, and gyrojet ammunition will not fit any other type of gun.
                  Laser Pistol, Concussion Pistol, Plasma Beam Handgun: The Laser Pistol, Concussion Pistol, and Plasma Beam Handgun are weapons used by high-tech spies and subversive organizations, including S.H.I.E.L.D. and A.I.M. All three types operate from power packs.
                  Stun Pistol: The standard Stun Pistol fires a stunning beam of Typical Intensity, and the target must make an Endurance FEAT or pass out for 1-10 turns. It operates from a power pack.
                  Shotgun: The Shotgun fires bursts. It is often loaded with non-lethal cartridges (such as rock salt) that will not inflict Killing damage (ignore Kill results).
                  Riot Gun: The Riot Gun is a smaller version of the shotgun and fires grenade-like missiles and canister shot (treat as grenades).
                Other Equipment:
                  Fire Extinguisher: Fire Extinguishers inflict no damage normally, but against fire are of Good Intensity (eliminate fire of Typical Intensity or less in the same area on a green FEAT, of Good Intensity on a yellow, and up to Excellent on a red). Against characters with flaming powers, such as the Human Torch, the extinguisher causes a FEAT roll against that Intensity to retain flame.
                  Silencer: The Silencer is a device that may be added to a pistol or rifle which inflicts damage on the Shooting table, excluding the gyro-jet and all lasers, stunning and concussion weapons. The silencer operates by dispersing the gases from the shot that creates the crack of the pistol. The target (and those around him or her) must make an Intuition FEAT to hear the shot and know its location.
                  Sniper Sights: Sniper Sights are built into the sniper rifle and the target pistol, and added to any other weapon eliminate the penalty for range for weapons. Using the sniper sight automatically has an initiative roll of 10 (last in the round). 
                  Infra-Red Sights: Infra-Red Sights are a modification similar to the sniper sight, may be used for any missile weapon. These sights permit the user to see up to 5 areas in the dark.
                  Flashlight: Flashlights are common to all readers. The normal flashlight is the type most common, with a plastic or metal body (Typical Intensity). The Halogen flashlight has a brighter bulb and more concentrated beam, and blinds with a more powerful Intensity (Remarkable Intensity). Normal flashlight has a range of two areas, the halogen three.
                  Mace: Mace is a small one-area weapon that shoots a mist of Typical Intensity tear gas at a single target adjacent to the user. It does not require an Agility FEAT to hit, though the target must make an Endurance FEAT to avoid the effects.
                  Flare Pistol: Flare Pistols fire a burning charge that lights the sky, either to provide illumination (lighting all areas within three) or as a signal device (fired 10 floors straight up). Used as a weapon, the device has a range of two areas and inflicts Good damage. The charge is incendiary and will ignite flammable material.
              Mk. 1:
                Description: A sleek, futuristic device with extendable stock and forestock to transition between handgun to long gun form factors. It may be attached to the Sentinel Battlesuit Mk. 1's arm, becoming an integral part of the suit, or operate off a power pack as an energy source to be used as a standalone device.
                Material Strength: Monstrous
                Powers: 
                  Energy Control:
                    Fire Control: #EC10
                      Rank: Monstrous
                      Number: 75
                      Reference: The hero can control existing flames, whether natural or Power-based. He can alter any factor involved in combustion without direct physical contact. The hero can increase or decrease the flame's Intensity up to his Power rank and reduce fire damage by his rank number. This Power includes Power rank Resistance to Fire and Heat. The most important aspect of this Power is enabling the hero to reshape flame into any form he desires. This can be used in a variety of Power stunts, as the hero develops numerous fiery constructs to perform miscellaneous deeds. Such fiery constructs do not act like normal flames. They emit less heat and consume less oxygen. Their fire doesn't spread past the outline of the constructs. In addition, they self-extinguish rapidly upon cessation of this Power. Optional Powers include Fire Generation, Thermal Control, Energy Sheath, and Energy Body.
                  Energy Emission:
                    Electrical Generation: #EE2
                      Rank: Monstrous
                      Number: 75
                      Reference: |
                        The hero can create electrical streams that can do Power rank damage. The hero can project the electricity through any conductive medium, such as air, water, or metal, at Power rank range. If the player chooses, the hero can gain +2CS to his damage by choosing to limit his range to contact only. In this case, the range can be extended by conducting the Power through solid conductors like metal. Electricity comes in various forms:

                        - Static electricity causes magnetic attraction between objects and can disrupt electronic communications.
                        - Lightning is sheer, raw, destructive power and by far the most popular form of this Power.
                        - Alternating current is what our technology is driven by. This Power can either energize or overload normal electrical devices.
                        - Direct current is what a battery produces. It can energize or overload devices that use DC power. It can also short out devices that use AC power.

                        The hero can use any form at will or can raise his rank +1CS by specializing in a particular form. This Power automatically includes Power rank Resistance to Electricity: no FEAT is required to resist your own Power. This Power is linked to Electrical Control and Energy Sheath. When creating the hero, the player can exchange any randomly determined Powers for these if he so desires. Extreme heat reduces this Power's rank by the Intensity rank of the heat. Conversely, extreme cold increases the rank by the cold's Intensity rank. At Shift X level, the hero gains the ability to create a stream of conductive gas, thus allowing the Power to function even in a vacuum.
                    Fire Generation: #EE4
                      Rank: Monstrous
                      Number: 75
                      Reference: |
                        The hero can project fire with Power rank damage and range. These flames have no apparent fuel source and spring from the hero as if he were a living fuel tank. Although the flames' fuel comes out of the proverbial nowhere, free oxygen must be present for the Power to function. If not, the hero can cause a single flame that lasts' only one turn, then fizzles out. At Shift X rank, the hero gains the ability to generate oxygen as well, permitting this Power to function under any conditions. When creating the hero, the player can choose the Powers of Flame Control, Energy Sheath, and Energy Body to fill any slots still open. For example, under the Ultimate system, the Human Torch possesses three powers: Fire Generation, Fire Control, and Energy Sheath.

                        This has to be the most dangerous Power around. Heroes have to watch out for accidental firestorms. They also tend to consume all the oxygen in their location, making everyone pass out. Then there is the question of smoke and gases created by the hero's Flame Power. It makes me wonder what kind of ventilation system the Baxter Building has…

                        Fire Generation is the opposing Power to Cold Emission, Coldshaping, and Powers that use water. This Power gains +1CS when fighting these Powers. It also loses -1CS when being attacked by those Powers.
                    Light Emission: #EE8
                      Rank: Monstrous
                      Number: 75
                      Reference: |
                        The hero can emit powerful bursts of light do Power rank damage at rank range. The light may be of any nature:

                        - Normal light in any color or intensity: the hero can light the area, dispel Shadow Powers, and temporarily blind targets.
                        - Coherent Light (lasers) do rank level heat damage as they burn into targets. Lasers can also be used to carry information or to create holograms.
                        - Optic blasts do rank level damage but rather than burn a target, they act as Kinetic Bolts.

                        The player can raise the hero's rank upon creation by +2CS if he chooses specialization in a specific form of this Power.
                    Plasma Generation: #EE10
                      Rank: Monstrous
                      Number: 75
                      Power Stunts:
                        - Light
                        - Heat
                        - Flame
                        - Hard Radiation
                        - Magnetism
                        - Electricity
                      Reference: |
                        Plasma refers to here to a field of highly-charged particles. Common examples include the aurora borealis, the glow in a fluorescent tube, the Van Allen Belt, and the heart of a nuclear blast. Plasmas may be of any nature: fiery, magnetic, electrical, radioactive, or be of a previously unknown form of energy. This last group includes many super-powers, living energy fields, and beings who can transform themselves into pure energy.

                        The hero can project Plasma fields at Power rank range. Due to the unique nature of this Power, it does damage on two levels. The primary level is brute force: the field does Power rank damage There are also side-effects based on the nature of each Plasma bolt. Plasma fields have two of the following side effects:

                        - Light at -2CS level of illumination
                        - Heat at -2CS damage
                        - Flame at -2CS damage
                        - Hard Radiation at -2CS damage
                        - Magnetism at -2CS damage but full Power rank range
                        - Electricity at -2CS damage.

                        The hero initially possesses a single type of Plasma with two set side-effects that occur each time he uses his Power. Later he can develop other Plasmas with different side-effects as Power Stunts.

                        Plasma is a Nemesis to the Powers of Energy Sheath and Energy Body. The hero gains +1CS when attacking either Power. Plasma's own Nemeses are Plasma Control and Power Control.
                  Lifeform Control:
                    Neural Manipulation: #L12
                      Rank: Monstrous
                      Number: 75
                      Reference: |
                        The hero can alter a target's neural activity. By changing nerve messages within the target's body, the hero can cause a variety of effects.

                        - Disruption: The target's body loses all sensations: it falls to the ground, a limp, aumb mass of flesh.
                        - Paralysis: The target body becomes completely rigid. No chemical can counteract the paralysis while the Power is in effect.
                        - Seizure: The target's muscles spasm uncontrollably for as long as the Power is in effect.
                        - Exaggeration: Nerve signals are actually amplified, causing the target to overact when attempting any movement.

                        Normally, a hero can select any of these effects. When creating the hero, the player can choose to specialize in one effect for a benefit of +2CS. Note: This Power only affects the voluntary muscles; it does not affect the autonomic nervous system which controls the heart, lungs, and other automatic bodily functions. The range and duration of this Power are determined by its rank. Suitable distances are shown on column A of the Range Table. The Power normally affects only a single person; affecting more causes a decrease in duration of -1CS per additional person. The target's mind and senses are unaffected by the Power: the victim knows full well what is happening (even if he doesn't know why it's happening to him). The Power can reach across the dimensional barriers if it is combined with some way of breaching the dimensions. It can function normally if both hero and target are within another dimension.
                  Matter Conversion:
                    Rank: Rank
                    Disintegration: #MCo3
                      Reference: |
                        This is the ever popular but never explained "Disintegrator Ray." The hero has the ability to convert any matter into pure energy, usually Light although the player can specify another resultant energy when he first creates the character. The energy dissipates harmlessly and does not affect anyone in the vicinity.

                        This Power can affect any target within range and line-of-sight. The range is determined by Power rank; resulting distances are shown on Column A of the Range Table. The maximum amount of matter that can be disintegrated in a single turn is the number of cubic feet equal to the Power rank number. For example, a Typical Disintegrator can destroy six cubic feet of matter at a range of two areas or 264 feet. When creating the character, the player can alter the Power range or effect if he so chooses. Either the range or the amount affected can be increased any number of Column Shifts by decreasing the other factor an equal amount.

                        Example: Ken and Sue are both creating Disintegrators. Ken rolls 97 for his Power rank, an awesome Amazing rank for both range and effect. Sue isn't so lucky and rolls 77, a Good rank for her Cyborg Character. Sue wants deadlier force and chooses to after her range and effect. She decreases her range to Feeble or Contact-only, a loss of -3CS that she can apply to her effect. This increases +3CS to an Incredible effect.

                        Unwilling targets of this Power are allowed to resist it in any way they can. Furthermore, the Disintegrator must make an Agility FEAT to aim this Power on a target.

                        I mentioned the maximum area the Disintegrator can effect, but what of the minimum area? The Power comes in handy for doing all sorts of fine-detailed work like sculpting, surgery, or removing unwanted locks. The hero can Disintegrate as small an area as he can clearly see. With normal, unaided vision, the minimum limit is about 1/128th of an inch. Smaller than that and the hero needs some kind of magnifying device or Power. Note: this limit is proportional to a normally-sized human of about six feet in height. Enlarged or miniaturized characters have a proportional limit. For example, a 36-foot-tall giant would have a minimum limit of 1/21 of an inch, while a one-foot-tall person would have a minimum limit of 1/768th of an inch or about the size of a cell.

                        As stated earlier, the target must be within line of sight since the Power affects the first thing it encounters, excluding air molecules. Actually, some air is accidentally Disintegrated whenever this Power is used-that's why the Power appears as a glowing beam emitted by the hero-but not enough to divert the Power from its intended target. If an unseen or unanticipated barrier is present between the Disintegrator and the target, that barrier takes the full brunt of the Power that turn.

                        Ken's hero, Starburst, sights a Dreadnought and immediately tries to Disintegrate it. Unfortunately, Starburst failed to notice the plate glass window the Dreadnought was behind. The window vanishes in a flash of pretty lights as the Dreadnought ducks around the corner.

                        This Power is frequently given, to weapons systems such as the ever popular Disintegrator Pistols that fill pulp SciFi. In terms of normal contemporary Earth technology, a Disintegrator raygun requires Incredible Reason and Physics Talent to design and an Amazing cost in Resource points to build. The Judge is free to decide the range and effect of such a weapon.

                        Nemeses for Disintegration are Phasing (to protect the hero) and Ionization (to protect others) as the Power cannot affect intangible matter.
                  Matter Creation:
                    Missile Creation: #MCr5
                      Rank: Monstrous
                      Number: 75
                      Reference: |
                        The hero can spontaneously create and launch projectiles. These are propelled to Power rank range. Missiles that simply slam into a target act as Stunning Missiles and inflict Stunning attacks of Power rank Intensity. If the hero has other Powers, these are combined with this Power to produce missiles with specific effects.

                        - Nullifier: The Missile Power is combined with Power Control/Negation to produce missiles that inflict no direct damage but may nullify inborn or technological Powers with Power rank Intensity. Sleep Darts-the Power is combined with Induced Sleep to create anesthetic darts.
                        - Magnetic: The Power combines with Magnetism to produce missiles with Power rank Intensity Magnetism. These can do Power rank damage to magnetic recordings or delicate electronics, and can attract any iron in the target site (guns, for example).
                        - Ghostcasters: The Power is combined with Illusion-casting to create missiles that emit a static hologram upon hitting the target site.
                        - Vanishers: The Power is combined with Induced Teleportation to create missiles that teleport the target to a predetermined destination.
                        - Energizer: Missiles are combined with Power Transference to give the target part of the hero's other Powers.

                        Any Power in this book can be combined with this Power to create unique missiles for your character. When creating the character, the player should follow this guideline: If there is a way to combine external Powers with this Power, do it. Powers that are completely internal in their effects are exempted from this. This includes most of the Mental and Physical Enhancements and all of the Self Alterations and Detection Powers.

                        If the character is High Tech, has rolled such Powers as Hyper-Invention or Weapons Tinkering, or possesses a magical device, then the Missile Powers should be combined into a device possessed by the hero. This may be an exotic gun, a wand, or any other bit of superheroic paraphernalia the player can imagine.

                        The hero has a finite ammo supply, even if he creates the missiles as he goes. The maximum number of Missiles the hero can create per hour is equal to the Power rank number. This prevents the cliché found in bad Westerns, whereby a lone cowboy holds off the entire Apache nation with a single sixshooter. This limit also applies to Technological versions of this Power, in that the gun/wand/whatever simply overheats from repeated use.

                        There are two Nemeses for this Power. If the Power is innate to the hero, Reflection stops it. If the Power is externalized in a weapon, Induced Teleportation works by removing the weapon from the hero's possession and giving it to the opponent.            
                    Spray: #MCr7
                      Rank: Monstrous
                      Number: 75
                      Reference: |
                        The hero can spontaneously create a directed cloud of gas, mist, or dust. The Spray has a range of up to one area. It has the basic properties of doing Feeble damage by choking off the target's fresh air and reducing visibility by -2CS for anyone within the cloud. The main purpose of Spray is combining it with other Powers, thereby producing unique Spray Powers for the hero. In all these cases, the range remains the same. Other factors, such as the nature and Intensity of effects, are determined by the Power that has been combined with Spray. Some possibilities include:

                        - Hallucinogenic: The Spray is combined with Image Generation to produce vivid visual images in the target's mind; these, of course, have nothing to do with reality. The target's
                        - Corrosion-proofing: The Spray combines with Catalytic Control to lessen corrosive attacks' Intensity by this Power rank number.
                        - Insulation: The Spray combines with any Energy Control to produce a coating that protects any target from that form of Energy Emission. The insulation reduces the energy attack's Intensity rank by the Energy Control's rank number.
                        - Healing Spray: This uses any of the more pleasant forms of Bio-Physical Control to produce a cloud that heals anyone in the target area who has taken damage up to -1CS.
                        - Napalm: The Spray is combined with Fire Generation and does Power rank damage.
                        - Freeze Cloud: The Spray combines with Cold Emission to do Power rank damage.
                        - Shrink Dust: The Spray combines with Diminution to reduce the size of anything in the target area.
                        - Booster Dust: The Spray combines with Power Control/Magnification to raise the Power ranks of everyone in the target area +1CS.

                        Any Power in the Ultimate Powers Book can be combined with this Power to create unique Sprays for each character. When creating such characters, the player should follow this simple guideline: If you can figure out a way to combine externalized Powers with this one, do it. Powers that are completely internalized are exempt from this rule. This includes most of the Mental and Physical Enhancements and all of the Self Alterations and Detections.

                        If a character is High Tech, has rolled such Powers as Hyper-Invention or Weapons Tinkering, or possesses a magical device, then the Spray Power should be incorporated into a device. This may be a gas gun, ring, horn, or any other piece of superheroic paraphernalia the player can imagine.

                        Example: The player rolls up the following Fire Generation, Elemental Conversion, Spontaneous Combustion, Spray, and Enchantment. She is a Humanoid, an Elf to be precise. She determines she is a magical character. The first three Powers readily combine with Spray. The player decides that the heroine possesses a magical flute which she built herself. Besides playing normal tunes, she knows three special melodies that create clouds which possess each of the first three Powers.

                        The hero has a finite amount of Spray. The maximum number of Sprays the hero can create in a 24-hour period is equal to his Power rank number. This limit also applies to Technological or Magical versions of this Power; the gasgun/flute/whatever simply clogs up from repeated use.

                        There are two Nemeses for this Power. If the Power is innate to the hero, then Reflection stops it. If the Power is externalized in a device, Induced Teleportation works be removing the device from the hero's possession and turning it over to the Nemesis.
                    Webcasting: #MCr8
                      Rank: Monstrous
                      Number: 75
                      Reference: |
                        The hero can generate and shot out a solid web. The web can hit any target within 100 feet and instantly adhere to it. The Web has some basic properties. It can ensnare anyone within the target site. It possesses Power rank Strength upon hardening one round after being fired. It can be used to form swing-lines that enable the hero to travel 3 areas per turn, and it makes shields of Monstrous material strength.

                        Webcasting can be combined with other Powers to create unique Webs for other characters. In all these cases, the range remains the same. Other characteristics, such as the nature and Intensity of the effects, are determined by the Power that has been combined with Webcasting. Some possibilities include:

                        - Mind net: Telepathy combines with the Web to form a telepathic link between the hero and anyone within his Web.
                        - Dream net: Dreamtravel combines with the Web to permit everyone within to share a common dreamworld.
                        - Preserver: The Web places anyone wrapped within in Suspended Animation.
                        - Spirit Net: The Web is combined with Spirit Storage to trap any disembodied spirits within.
                        - Protector: The Web combines with any Defensive Field to protect any thing within the Web from a specific form of attack.
                        - Metamorphic: The Web combines with Induced Shapechange to transform anyone within the Web into any shape the hero desires.
                        - Cocoon: The Web possesses Micro-Environment and provides a safe habitat for anyone within, despite external conditions.
                        - Mummy Shroud: The Web combines with Zombie Animation to make any corpse wrapped up in it an Undead (great party gag, folks!).
                        - Glide Net: The hero can travel on the winds by combining his Web and Gliding Power.
                        - Network: The hero uses Sensory Link to perceive the surroundings of any web he knows the location of. In effect, he turns any web into a two-way picture phone.

                        Any Power in the UPB can be combined with Webcasting to produce unique Web Powers for each character. When creating characters, the player should follow this simple guideline: If you can figure out a way to combine externalized Powers with this one, do it. Powers that are completely internalized are exempt from this rule. This includes most of the Mental and Physical Enhancement Powers and all of the Self-Alterations and Detections. If a character is Hi-Tech, has rolled such Powers as Hyper- Invention or Weapons Tinkering, or possesses a magical device, then the Web Powers should be incorporated into a device. This can be a webshooter, reel, or any superheroic doohickey the player can invent. The hero has a finite amount of Webbing he can produce. The maximum number of times the hero can use Webcasting in a 24-hour period is equal to his Power rank number. This also applies to Technological or magical versions of this Power; the devices clog up from overuse.

                        Webs created by this Power evaporate one hour after being cast.

                        The Nemesis for this Power is Phasing.
                  Power Control: #PC 5
                    Energy Source:
                      Source: Defender Battlesuit Mk. 1
                      Reference: |
                        The hero draws his Powers from a special source that provides him with all the energy he can handle. As long as the hero can maintain his link with this source, he can continue to use his Powers. The nature of the source and its link varies with each hero. If the source is small enough, the hero may be required to carry it with him. If not, perhaps the hero needs to periodically return to the source or forge an ethereal Power cord that links him to his Source despite any intervening distance. The Judge and player need to work together to produce a playable source and link.

                        If the link is severed or the source destroyed, the Mage is left with a finite supply of energy left. The amount of raw Power left is the number of points equal to his Psyche rank. Each time he uses Power, he decreases the reservoir by that Power's rank number. Obviously, it is within the hero's best interests to renew his link or rebuild his source in as little time as possible.

                        As you are beginning to suspect, this isn't really a Power and is more of a restraint. You're right. If you roll this Power, go ahead and roll an additional Power.
            Warden Staff:
