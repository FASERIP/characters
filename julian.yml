                Angel:
                  One of:
                    - Special Realm or Pantheon: &Special_Realm_or_Pantheon This is a school usually reserved for non-player characters, but can be the basis for a player character if carefully defined by a Judge. The magical teachings and spells come from the history of a Special Realm or Pantheon of the Marvel Universe (such as Asgard or Olympus). Bonuses for this type of magic would come with the use of items or spells developed by this pantheon or realm, and when at certain locations (Greece for the Olympian pantheon, etc.) Penalties would exist as items or locations that exist to destroy the specific pantheon or realm (an Asgardian character casting a spell while in the hostile realm of Muspelheim would have a -1CS penalty.
                    - Magic for Order: &Magic_for_Order This is the school to which Earth’s former Sorcerer Supreme, the Ancient One, and Earth’s current Sorcerer Supreme, Doctor Strange, belong. It is the most powerful “white” school of magic, striving for order and good by practicing an ascetic, disciplined approach that has its foundations deeply rooted in Eastern philosophy and magic. It is currently the strongest form of magic on Earth. The bonuses attached to this type of school are the various magical characters that Doctor Strange has managed to ally with over the years and the vast knowledge that Doctor Strange, and others of the same bent, can teach a good pupil. The penalties include Doctor Strange’s enemies, who are numerous and powerful.
                Demon:
                  One of:
                    - Magic for Chaos: &Magic_for_Chaos This is a forbidden or dangerous type of magical school whose goal is to promote chaos, which will lead to an evil tyranny. One of the primary subschools of “chaotic” magic is one that follows the little-known archaic rituals and beliefs based on the existence of the Elder Gods. This type of magic is much more powerful in certain settings (such as ancient temples to the unknown gods) and with the use of “chaotic” magic artifacts. The vulnerability of “chaotic” magic is that it tends to attract “white” magic wielders or creatures who wish to negate it.
