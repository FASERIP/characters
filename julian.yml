          Magic:
            Character Type:
              Magic Wielder: &Magic_Wielder A character able to use spells. Such characters may also be called magicians, sorcerers, wizards, enchanters, etc.
            Magic School:
              Scientific Magic: &Scientific_Magic |
                This is a school that has no particular philosophy or ethical background. Magic is regarded not as a way of life, but rather as a tactic used to attain one’s goal. Followers of this school are seldom spellcasters themselves, but rather combine elements of magic with obscure or highly advanced forms of science to create effects that seem magical. In this school, the distinction between science and magic is never clear; either or both could be used to produce a single effect. Alchemy is the best example of a semi-magical science. The character, such as Diablo, would be an alchemist, that is, he brings about his effects through the use of potions, powders, and pills he himself creates (sometimes through materials or energy tapped from dimensional or universal sources). A scientific sorcerer is somewhat vulnerable (his items and creations can be destroyed or stolen, robbing him of power; or he could run out of items whereas spells are usually always available). However, a scientific spellcaster is somewhat less restricted in what he can accomplish (add three more spells, 2 of Personal energy and 1 of Universal energy to his capabilities, in artificial forms, of course).

                The time required to gather materials and create new items, powders, potions, or tablets are left to the Judge and depend on the spell, how strong it is and what its effects are. It is suggested that items with effects of Remarkable rank or less can be created at the rate of 2 per day, while items up to Amazing rank can be produced at the rate of 1 per day. The creation of items with greater effect, or the creation of any permanent item requires the equivalent of a ceremony and must be handled by the Judge.

                A scientific magic wielder begins his career with access to his master’s laboratory, which is stocked with equipment whose cost in resource points equals at least 20 times the master’s Psyche rank number. The magic wielder can use his master’s lab as long as the master agrees. If the student wishes to set up his own lab, he only needs to spend 10 times his Psyche rank number in resource points for equipment (the master makes up the difference). The Judge should use the guidelines on ceremonies and ceremonial areas to handle the creation of items in laboratories.

                A scientific magic wielder automatically receives one scientific talent of his choice (such as engineering, biology, genetics, physics, etc.) in addition to any other talents he may normally receive. The automatic talent received by alchemists is pharmacy (the mixture and preparation of medicines).

                Scientific magic is a “neutral” school, and no special bonuses or vulnerabilities apply to it.
              Note: Julian makes use of actual sorcery as well as alchemy, artifice, technomancy and such, liberally substituting and alternating.
            Energy Use:
              All Energies: All Energies indicates that the character is able to use all of the spells.
            Rank:
              Master: The character possesses at least 12 spells. He has a spell rank of at least Excellent in all of them and Incredible or better in at least four of them. He spends very little time with his master, but much of it in contemplation, study, and adventuring. If he qualifies, he may find a student of his own to teach. His studying of the writings of the ancient arts gleans him more information than any other source.
            Master: Many, but none living.
            Spells:
              Personal Energies:
                Admittance:
                  Rank: Amazing
                  Number: 50
                  Reference: &Admittance The caster can direct enchanted energy at any locked door or container and it will easily open for him, no matter how many locks it has or how big or intricate they are, if his spell rank FEAT roll is successful.
                Apparition:
                  Rank: Amazing
                  Number: 50
                  Reference: &Apparition |
                    The caster can mystically make his body non-corporeal and become an apparition. (This should not be confused with Astral Projection, as that power takes the caster to another dimension and he is invisible to most characters in this dimension.) Once the spell is cast, the caster need not concentrate upon his state to remain an apparition. As an apparition, the caster can still move, speak, cast spells, and perform most other normal actions. His movement rate is the same as if he were corporeal, but he can walk on air, sink through floors, climb up elevations as if he were climbing stairs, etc.

                    When a caster becomes an apparition his body loses its density, allowing him to pass through solid object and letting solid objects pass through him. The caster can be seen, but is obviously not completely solid. This power grants the caster body armor equal to the spell rank against any physical, energy, or mental attacks. If the apparition/caster physically attacks another character, that character must also be treated as though he has body armor equal to this spell rank. Magical, mental, or energy attacks against the target are treated as normal.

                    To pass through a solid object, or have a solid object pass through him, the object’s material rank must be equal to or less than the spell rank. In addition, the caster can lower the density of an object he touches by making a spell rank FEAT roll and, if succeeding, keeping it in his possession.

                    Judge’s Note: If the player wishes to make a concentrated effort at creating a character who appears like a ghost, striking fear and terror into criminal hearts, then the Judge should keep this effect in mind when the caster walks through a wall, drops through a ceiling, etc. and faces anyone. A character encountering this apparition, especially for the first time, must make a Psyche FEAT roll (see Magic Effects Table) or react as described in the Fear power. There is a price the caster has to pay for this extra “power”, however. This frightening effect on people only works if the caster is not famous, thus cutting off his Popularity and some sources of Karma gain. He must remain relatively reclusive and unknown so the criminal element does not recognize him.
                Astral Projection:
                  Rank: Amazing
                  Number: 50
                  Reference: |
                    The caster can separate his astral self-the sheath of his life essence-from his physical self and travel through space unbound by physical laws while retaining human consciousness. The astral form (also sometimes called the ethereal form or the ectoplasmic form) is invisible, intangible, and incapable of being harmed except by the most powerful magic or by opponents who are themselves in astral form. If the caster wishes to project his astral self while under duress, during a combat or while he is being mentally attacked, he must make his spell rank FEAT roll.

                    The duration of effect determines how long the caster can remain in this form without physical deterioration occurring to his physical form. If the astral form does not return to its physical body before the duration of effect has elapsed, the caster’s body dies; and the astral form can only enter it as it would any other corpse or dummy, creating a blind, zombie-like creature. If the caster’s body is destroyed while the astral form is projecting, the caster is stranded in his astral form.

                    If a character is stranded in his astral form due to the death of his physical body, the astral form itself will dissolve after an amount of time equal to the normal spell duration associated with the character’s Psyche rank. (For example, the astral form of a character with Incredible Psyche would endure for one day; the astral form of someone with an Unearthly Psyche would last indefinitely.)

                    The caster can transport other willing subjects to the astral plane along with himself. When attempting to do so, he must make a Psyche FEAT roll: a white or green result means that the caster traveled and the other(s) did not, a yellow or red result means that the multiple astral travel worked perfectly. Astral projection cannot affect someone against his will.

                    Characters who are in their astral forms can see and communicate with each other, if both parties desire. If one or both parties do not desire to be seen, they may have to hide behind solid items, just as if they were in their physical form. If the astral character who is seeking has a lower power rank than the astral character who is attempting to avoid being seen, he must make a Psyche FEAT roll, even if that character is in plain, astral view. If seen, they can have magical combat in that form.

                    Magical items, though left behind on the physical plane, also have a counterpart that can be taken into the astral plane. It acts in the same manner as its physical counterpart, but its powers are lessened by one rank on the astral plane. Any magic item that the character possesses on the physical plane can be controlled by the owner’s astral self. (For example, Doctor Strange has escaped innumerable traps by controlling his Cloak of Levitation and the Eye of Agamotto within his amulet, while he was in his astral form.).

                    Time alteration spells cast from the astral plane work within the physical plane, but do not affect the astral plane.
                Enchanted Eye:
                  Rank: Amazing
                  Number: 50
                  Reference: |
                    The caster creates an enchanted eye when he wishes. The caster can automatically summon the enchanted eye for one round only. A successful spell rank FEAT roll brings the eye forth for the full duration of the spell. It can only see as far as sight normally would, but can penetrate darkness (real or magical), show the caster mystical existences (such as astral projections, invisible magical objects, mystical shields, and so on), and see through illusions. The caster is mentally linked with the eye and sees everything it sees.

                    The enchanted eye is a separate magical creation capable of flight. Its movement rate is the same as that of the caster. The maximum distance it can be be separate from the caster is based on the spell rank (for example, 12 areas for Amazing rank.) The eye can be attacked physically or magically; the eye has Health points equal to the caster’s Psyche and any FEAT roll the eye is required to make use the caster’s appropriate ability rank. The caster is not affected by any damage suffered by the enchanted eye.
                Healing:
                  Rank: Amazing
                  Number: 50
                  Reference: |
                    This spell gives the caster such complete control over his bodily functions that he can heal himself by use of personal or dimensional energy. Use the spell rank number instead of his Endurance rank number to determine the maximum amount of damage healed. The caster can only perform this once per day, in addition to his normal healing rate.
                Invisibility:
                  Rank: Amazing
                  Number: 50
                  Reference: &Invisibility |
                    This spell makes the caster invisible to others. Any item on the caster’s person and anyone holding hands with him (and willing to be affected) also becomes invisible as long as they remain in contact with him. This spell cannot turn an unwilling creature invisible.

                    Being invisible causes no special problems for the caster, but anyone else affected who is not used to being invisible will have a real problem moving about (movement halved), performing the simplest of actions (-2CS), and fighting in any fashion (-3CS for any combat). It requires at least 10 rounds of being invisible before becoming used to it.

                    Note: an invisible person can be located by persons with superhuman hearing or sense of smell, or by detection powers and devices that do not depend on sight.
                Learning:
                  Rank: Amazing
                  Number: 50
                  Reference: |
                    This spell is used to give the caster an advantage in combat. It enables him to quickly learn from his mistakes. After this spell is cast the caster must fight his opponent for three consecutive rounds (normal combat, magical combat, astral combat, etc.). When the three rounds have passed the caster suddenly has insight into his opponent’s methods of combat and receives a +1CS when fighting that opponent during this encounter only. The duration and area of effect listed on the Magical Limits Table do not apply for this spell.

                    If combat is interrupted but later resumed and the Judge is not sure whether to consider it one continual encounter or two separate encounters, the spell still applies if the caster makes a successful spell rank FEAT roll.
                Levitation:
                  Rank: Amazing
                  Number: 50
                  Reference: |
                    This spell enables the caster to mystically rise into the air. A successful spell rank FEAT roll is required. No further FEAT rolls are needed unless the caster descends to the ground, and then want to levitate again during the duration of the spell. The maximum altitude a levitating character can reach is 1 area at Good rank, with an additional 2 areas for every spell rank above Good (thus, a caster with a Remarkable Levitation spell can reach an altitude of 5 areas). The movement speed (rising or descending) per round is 1 area for a character with Good Psyche with an additional area for each Psyche rank above Good. The character cannot use this spell to lift any weight greater than his normal clothing and equipment. This spell affects the caster only.

                    The character can perform other actions while airborne, including combat, but is limited to one spell per round regardless of the type of energy (personal, universal, or dimensional). If knocked unconscious while levitated, a character will immediately fall to the ground.

                    This spell should not be mistaken for the ability to fly (see the Flight spell). Levitation only allows vertical movement. Sideways movement is only achievable by the levitating character pulling himself along an object. A levitating character cannot create forward momentum to affect the direction of his ascent. It is always straight up. While wind has no affect on a floating caster’s ascent direction, it can slow him down if the Judge feels it is strong enough.
                Mental Barrier:
                  Rank: Amazing
                  Number: 50
                  Reference: |
                    This spell creates a magical invisible headgear which does not hinder the caster’s normal senses. It allows the caster to know when someone is trying to intrude on his thoughts, magically attack his mind through mesmerism, illusion, etc. It does not indicate who is doing the attacking or intruding, nor does it reveal what spell is being used.

                    In the round following the one in which the hostile spell is detected, the caster can, secure the barrier, preventing illusions, telepathy, empathy, etc., from affecting the caster. It also protects him from magical attacks on the mind (Emotion Control, Confusion, Fear, Mental Control, etc.) by giving him a +3CS for any Psyche FEAT roll to resist the attack. While the barrier is up the caster can perform no spells that require/a great deal of concentration.

                    Treat the spell rank as body armor for the sake of defense against attempted mental penetration by non-magical powers.

                    The Judge should make sure this spell is not abused. A character who constantly has the barrier up will become easily exhausted and can even suffer Psyche loss due to the mind damaging effects of trying to always be mentally protected. The maximum safe duration rank is Excellent.
                Servant:
                  Rank: Amazing
                  Number: 50
                  Reference: |
                    The caster can summon forth his own, personal servant to do his bidding. This servant will require quite a bit of Judge’s discretion as to its nature, abilities, spell, etc.

                    The servant’s abilities are generated as for any other character. The Judge then gives it two spells, and gives it an origin appropriate to the character it serves. Various types of magical servants exist, including jinn, demons, familiars, ghosts, and the like. The servant is obedient, helpful, and useful. The caster can automatically talk to or otherwise communicate with the servant.

                    This spell cannot use human beings as servants.
                Sensing-Danger:
                  Rank: Amazing
                  Number: 50
                  Reference: The caster can scan the area of spell using mystic waves that will warn him of danger. If this spell rank is higher than the caster’s Intuition rank, use this spell rank when the caster makes Intuition FEAT rolls. If the spell rank is lower than the caster’s Intuition, increase his Intuition by one level when making Intuition FEAT checks.
                Sensing-Evil:
                  Rank: Amazing
                  Number: 50
                  Reference: &Sensing-Evil |
                    The caster can mystically sense the presence of great evil in his area of spell. This includes the presence of evil creatures (demons, evil magic wielders, super villains bent on destruction, etc.), artifacts of evil design or exceptionally evil deeds. This spell is automatic (FEAT rolls are not needed). As the caster gets closer to the source of the evil emanations, his sensing gets stronger. Thus, he can usually root out the evil if he goes looking for it.

                    If the spell duration is permanent, the spell functions constantly, even when the caster is asleep.
                Sensing-Fields:
                  Rank: Amazing
                  Number: 50
                  Reference: |
                    The caster can magically detect the presence of force fields, magical or otherwise in the area of effect. The caster must make a successful yellow FEAT to detect fields smaller than man-sized at ranges greater than five areas. At ranges of a mile or more, the caster must make a successful red FEAT to detect fields smaller than building-sized.

                    Unlike some of the other sensing spells, this spell does not require a great deal of concentration.
                Sensing-Identity:
                  Rank: Amazing
                  Number: 50
                  Reference: The caster can mystically scan the mind of anybody he can see within his area of spell and determine that person’s true identity. If the target is another magic wielder or a character with mental powers of any kind, he is allowed a Psyche FEAT roll to resist the probe. If the resistance FEAT roll is successful, he is unaffected.
                Sensing-Mystical Detection:
                  Rank: Amazing
                  Number: 50
                  Reference: &Sensing-Mystical_Detection |
                    The caster is sensitive to the use of magic. He can detect magic use and its specific source within the area of effect. Among the specific things he can detect are: magicians casting spells, magical items that are being used or that have a protective spell cast on them, magical portals, and magical creatures.

                    Unlike some sensing spells, this spell does not require a great deal of concentration.
                Tongues:
                  Rank: Amazing
                  Number: 50
                  Reference: The caster mystically alters his senses so he can read, write, speak, and hear unknown language spoken or written in his presence. The area of effect has no significance with this spell. If the language is native to his world, no FEAT roll is needed. If the language is an alien one, he must make a successful spell rank FEAT roll to be able to comprehend it.
                Trance:
                  Rank: Amazing
                  Number: 50
                  Reference: |
                    The caster has two options with this spell, he can mystically slow down or speed up his metabolism.

                    The slowed metabolism reduces the potency of any poison in his body (-3CS). The character can almost hibernate, thus lasting longer on fewer supplies in harsh climates, The character can feign death and has a chance to fool even the best doctors into believing he has died; feigning death requires a successful spell rank FEAT roll. While the caster’s body metabolism is slowed down, healing is also slower (one-half his Endurance rank number per day).

                    The accelerated metabolism speeds up medicinal drugs injected into the caster’s system, thus doubling the effects of healing. He can feign a fever, heart attack, and other maladies.

                    Once the character has started his mystical trance he cannot move or do any action except concentrate. He can come out of the trance whenever he desires, but it takes 2 rounds for his body to return to full consciousness.
              Universal Energies:
                Conjure:
                  Rank: Amazing
                  Number: 50
                  Reference: |
                    This spell is used to teleport an item, plant, creature or character from its current location to the caster’s location. This spell can even restore a broken or decayed item to its original form while in the act of teleporting.

                    If conjuring a trivial item, plant, or harmless animal, the caster need make no FEAT roll, it simply appears.

                    If conjuring a complex or dangerous item, plant, or dangerous creature, or attempting to conjure a broken or decayed item, the caster must make a successful spell rank FEAT roll before it appears.

                    If conjuring forth a willing character (teammate, friend, etc.) the caster must make both a successful spell rank FEAT roll and a successful Psyche FEAT roll before the character appears.

                    If conjuring forth an unwilling character, the caster must make a successful spell rank FEAT roll. The subject is allowed a Psyche FEAT roll to resist being brought forth; if the resistance FEAT is successful, the conjuration fails.

                    The conjuration of the body of a dead character is far beyond the abilities of any caster who does not have an Unearthly spell rank in this spell. The conjure spell only summons or recreates the physical body; however, if the dead character’s astral form survives (see the Astral Projection spell), it can reanimate the body, restoring it to true life.
                Healing-Others:
                  Rank: Amazing
                  Number: 50
                  Reference: |
                    The caster can magically heal other characters by using universal or dimensional energy. The caster must touch the character for two consecutive rounds after casting the spell. A successful spell rank FEAT roll is required. The, maximum amount of damage that can be healed per person is the spell rank number. Any individual character can only be healed once per day by a specific caster. The number of different characters the caster can heal per day is equal to the spell rank number divided by 10 (round fractions up). If the player so desires, this spell could be used to heal a creature instead of a character.

                    The healing is complete, including the mending of broken bones and torn cartilage. The spell is also effective against disease.
                Illusion:
                  Rank: Amazing
                  Number: 50
                  Reference: |
                    This spell creates an illusion in the mind of creatures within the area of effect. The player whose character is using this spell must describe it to the Judge. The illusion looks, sounds, and smells the way it would if it were real, but cannot cause damage. Since the illusion exists only in the mind of the targets, no one outside the area of effect can see it. All characters in the area of effect see the same illusion. The caster must concentrate on the illusion for the entire duration of its existence to be believable.

                    Each character seeing the illusion may make a Psyche FEAT roll to disbelieve it at the beginning of the illusion and every other round after that. If the FEAT roll is successful, the illusion fades from his mind. Other characters with illusion creating powers, whether magical, mutant, or whatever, receive a +2 Column Shift to their attempts to disbelieve. An unaffected character cannot persuade an affected character of the illusion’s true nature.

                    Characters who are affected will act as they normally would if the illusion were real. If characters attack an illusion, attacks will not affect it (although the caster could make it seem otherwise); the Judge will have to keep track of the attacks because of the possibility of injury to bystanders or property. Items passing through an illusion may look like they are absorbed by it, like he side-stepped it, or whatever else the caster desires.

                    If the illusion is of something silly, confusing, or extremely contradictory, then the Judge should secretly roll an Intuition check for those affected to disbelieve it.
                Revival:
                  Rank: Amazing
                  Number: 50
                  Reference: |
                    The spell counters the effects of other spells that preventing a character from acting or thinking with complete control. Spells that can be countered by a Revival spell include Mesmerism, Emotion Control, Confusion, Fear, Illusion, Charm, Mental Control, Paralyze, Forgetfulness, and the like.

                    If the spell rank of the Revival spell is stronger than the spell rank of the controlling spell, then the controlling spell is automatically broken. If the spell ranks are equal, a successful spell rank FEAT roll is needed to break the spell. If the holding spell is a higher spell rank than the Revival spell, then the caster must make a successful spell rank FEAT roll to break the spell subtracting as many ranks from his spell’s normal spell rank as the holding spell exceeds it.

                    A Revival spell can only be used against a specific spell enthralling a specific character once a day.
                Teleportation:
                  Rank: Amazing
                  Number: 50
                  Reference: &Teleportation |
                    The caster can channel his Universal or Dimensional energy into a special type of movement that allows him to travel instantaneously from one spot to another without physically crossing any of the space between. The caster can teleport as far as his area of effect allows. If the caster is familiar with the location he is teleporting to, or is able to see it, then he need make no FEAT roll. If he is attempting to teleport into an unknown location he must make a spell rank FEAT roll. A failed roll means he could not complete the movement and was “bumped” back to his original point of departure.

                    If a caster tries teleporting into a solid object (because he is unaware of its presence) he must make an Endurance FEAT roll; if this roll fails, he materializes outside the object but suffers damage equal to the material rank of the object. The character is automatically slammed (1 area) and may be stunned (make a FEAT roll for exact result).

                    The visual effects that accompany teleporting (vapors rising, flash of light, slow fade out, etc.) are up to the player.
              Dimensional Energies:
                Environmental Independence:
                  Rank: Amazing
                  Number: 50
                  Reference: |
                    The caster can surround himself with an aura of magic that maintains a livable environment for him. He does not need to sleep, eat, drink, or breathe, but can if he wants to. He feels no non-magical cold or heat and can survive in outer space, under water, within the earth, in hostile atmospheres, etc. This spell does not provide protection from or immunity to attack, but it does allow the caster to survive in conditions where survival would normally be impossible. The area of spell is usually just around the caster himself, though the aura can contain an additional character for every rank of the caster’s Psyche above Remarkable.

                    This is a particularly long-lived spell, often used by magic wielders stranded in hostile circumstances or alien dimensions. The duration of this spell is left to the Judge, as different conditions and circumstances (time passage in other dimensions for example) can affect the duration. It is suggested that the caster receive a +3CS on the duration of the spell. (For example, the spell would have a Unearthly duration for a caster with an Incredible spell rank.) An Unearthly duration means that the spell lasts indefinitely, usually until the caster escapes from the hostile conditions that caused him to cast the spell.
                Dimensional Aperture:
                  Rank: Amazing
                  Number: 50
                  Reference: |
                    This spell causes a temporary opening in the dimension’s fabric, allowing the caster to cross from one dimension to another. Look for the section on Dimensions in the Miscellany of Mysticism for more detail. The caster can automatically open a portal to a dimension with which he is familiar, but opening a portal to an unfamiliar dimension requires a successful spell rank FEAT roll. If a FEAT roll is required, failure indicates that the caster cannot enter the desired dimension that day A beginning caster who does not really know one dimension from another can stumble into any one of them at random.

                    A spellcaster who is in a familiar foreign dimension can automatically return to his home dimension. However, if the caster is in an unfamiliar dimension or if his mind has been affected by traveling in a sanity-bending or sanity-threatening dimension, the caster must make a successful spell rank FEAT roll to locate the dimensional position of his home dimension. This roll to return is only allowed once per week. However, the caster can enter another random dimension and try to go home from there.

                    If the caster tries to take anyone else with him into a dimension, whether they are willing or unwilling, then a Psyche FEAT roll is required of each character passing through into the dimension, every time they enter a new dimension. Anyone who fails the FEAT roll cannot pass through that particular dimensional aperture at this time. Characters who are left behind can try again a day later, if the aperture is still in effect.

                    This spell also grants the caster knowledge of a tiny “personal dimension” where he can go with perfect accuracy and safety. This pocket dimension is only accessible from the caster’s home dimension and contains no dangerous creatures. There the caster can go for peace, solitude, and can even make it a home away from home. The caster can enter or leave his own little dimension once per day.
      Equipment:
        Vehicles:
          Convertible Sports Car:
            Description: A high-end convertible supercar, its alloy frame and body is more durable while not compromising speed, acceleration, and handling.  It's an integrated combination of existing items (Sports Car and Convertible). Features a car phone and state of the art sound system.
            Type:
              Road: &Road Road vehicles are those designed primarily to be driven on relatively flat surfaces (like roads), and include most vehicles found in modern cities. Road vehicles suffer penalties for Control and Speed when off- road (like cutting through the park in your luxury lime)
            Control: Excellent
            Speed: Remarkable
            Body: Good
            Protection:
              Top Down: Feeble
              Top Up: Poor
            Reference:
              - Sports Car: &Sports_Car Sports Cars include most of the jazzy little numbers the detectives on TV zip around in. They have a higher safe speed and better control than the family car, but are made of lighter materials and more easily damaged. Sports cars carry two normally. three or four with crowding (the Trans Am back seat is not designed for the human form).
              - Convertible: A Convertible is a sedan with a top that folds down. With the top up, it has similar protection to a sedan. Include cars with T-top roofs as well in this category.
        Salaries Sundries and Other Equipment:
          Personal Computer:
            Price: Excellent
            Reference: The Personal Computer listed here is the type commonly available to most Americans and is a tool, not an artificial intelligence, unlike some more powerful computers. The personal computer may be considered to have Poor Reason for problem-solving, analysis, etc. as it is only as smart as the information placed inside it. At Excellent Cost, the user can get a modem that links his machine into a net with other machines.
          Mystic Texts: &Mystic_Texts
            Price: Incredible
            Reference: Mystic Texts is a blanket term for those less-powerful magical books that mages acquire to aid them in their work.
        Magical Items:
          Grimoire: &Grimoire
            Reference: The book in which a mage records spells or incantations. Some spells, like many Entreaty spells, cannot be memorized, only read aloud from a text. A character can only have two grimoires at any one time, the primary and a back-up copy. Creating takes 10+1d10 full days of work
          Staff of Polar Power:
            Reference: |
              This is actually a class of staves. They can come in any shape or material and range in size from 4 to 8 feet long. A Staff of Polar Power polarizes the holder with the power of the master who created it. Therefore different powers and different levels of mastery are engrained into each staff and no two are alike. All Staves of Power allow the character to become pure energy for the purpose of floating through dimensions. In such form a character can move through dimensions at a rate of 5 dimensions per round and ignore all physical attacks. Another quality of most Staves of Power is their ability to absorb attack spells cast at them (see Magic Effects Table, Agility & Targeting). An Agility FEAT roll of a bull’s-eye indicates the character has intercepted the spell with his staff).

              This item offers the Judge a great opportunity to be creative and is a good item to improve a freshly generated character who is weak.
          Leonidas:
            Reference:
              Familiar: &Familiar Familiar indicates a being that is very powerful magically and actively assists the hero. Two powers should be rolled randomly or selected by the Judge from the personal and universal energy lists for this familiar. In addition, the familiar is intelligent (Reason and Psyche at least Typical) and can communicate with its owner (the kind of communication is left to the Judge’s discretion). The form of the familiar can either be that of a normal animal (usually a cat) or an unusual type, such as a small dragon or other mythical creature. The familiar’s form is at the player’s discretion.
        Custom Equipment:
          Guardian Blaster:
            Mk. 0: &Guardian_Blaster_Mk0
              Description: The Guardian Blaster Mk. I is a combination weapon with utility functions.  It fires handgun bullets, gyrojet rockets, canister rounds (including standard shotgun shells, or non-lethal shotgun loads), and plasma, laser, concussion, and stun beams. It features integral optics that are night-vision capable.  Additionally, it has utility features comprising a standard intensity and high intensity flashlight system for illumination or blinding, a foam projector to extinguish fires, tear gas spray, and a flare launcher. It's an integrated combination of existing items.
              Count: 2
              Material Strength: Excellent
              Shooting Weapons:
                Range:
                  Bullet: 5
                  Gyrojet: 5
                  Laser: 10
                  Concussion: 4
                  Plasma: 7
                  Stun: 2
                  Shot, Canister: 3
                Damage:
                  Bullet: 6
                  Gyrojet: 10
                  Laser: 10
                  Concussion: 10
                  Plasma: 20
                  Stun: Fires a stunning beam of Typical Intensity, and the target must make an Endurance FEAT or pass out for 1-10 turns.
                  Shot: 15
                  Canister: As canister
                Type:
                  Bullet: Shooting
                  Gyrojet: Shooting
                  Laser: Energy
                  Concussion: Force
                  Plasma: Force
                  Stun: Typical Intensity stunning
                  Shot: Shooting
                  Canister: As canister
                  Rate: 1
                Shots:
                  Bullets: 9
                  Gyrojet: 3
                  Laser: 10
                  Concussion: 5
                  Plasma: 10
                  Stun: 10
                  Shot, Canister: 6
                Notes:
                  - One-Handed
                  - Shot bursts, which affects up to three adjacent targets, with one roll made for all targets.
                Ammunition:
                  Power Pack: &Power_Pack Stun, concussion, and laser weapons operate from power packs and may not use other types of ammunition.
                  Bullets:
                    Standard: &Standard_Ammunition Damage listed for each weapon is for standard ammunition.
                    Mercy Shot: There are several types of specialized ammunition, the first of which is Mercy Shot. Mercy bullets inflict no damage, but spread a Remarkable Intensity knock-out drug over the skin of the target. If the bullet inflicts damage to the target, the drug takes effect, knocking those affected out for 1-10 rounds.
                    AP Shot: &AP_Shot Armor-piercing bullets reduce the target's Body Armor by 2 CS (from Good to Poor, for example) for purposes of hitting and damage. This type of ammunition has no effect on force fields.
                    Rubber Shot: Less lethal rubber bullets that inflict slugfest damage instead of shooting damage. Ignore Slam results when using rubber bullets.
                    Explosive Shot: &Explosive_Shot Explosive Shot inflicts twice the normal (listed) damage for the weapon. If the weapon fires bursts or scatters, all targets in the area are affected.
                  Shot:
                    Standard: *Standard_Ammunition
                    Non-Lethal: Non-lethal cartridges (such as rock salt) that will not inflict Killing damage (ignore Kill results).
                  Canister Shot: &Canister_Shot
                    - Canister shot is a special type of ammunition that may be loaded with various cartridges for different effects. Specify the type of canister desired when purchasing.
                    - Gas Canisters: Gas Canisters contain Incredible Intensity Tear Gas. Cover one area.
                    - Knock-Out Canisters: Knock-Out Can contain Remarkable Intensity Knock-Out gas. Cover one area.
                    - Smoke Canisters: Smoke Canisters contain Excellent Intensity smoke. Cover one area.
                    - Explosive Canisters: Explosive Canisters inflict double damage to all in target area, normal damage to all in adjacent areas.
                    - Incendiary Canisters: Incendiary Canisters inflict 20 damage in fire (Energy), which burns at Excellent Intensity for 1-10 rounds.
                  Gyrojet:
                    - Standard: Damage listed for each weapon is for standard ammunition.
                    - Explosive Shot: *Explosive_Shot
                    - Heat-Seeker Ammunition: &Heat-Seeker_Ammunition Heat-Seeker Ammunition seeks out the hottest source in line to the target. Will track the hottest source up to maximum of the weapon's range, and suffers no penalty for range. If several targets are of the same heat, then it will determine a target randomly. This ammunition type is only available for Gyro-Jet Pistols.
                    - Explosive Heat-Seeker Ammunition:
                      - Explosive Shot: *Explosive_Shot
                      - Heat-Seeker Ammunition: *Heat-Seeker_Ammunition
                Target Pistol: The Target Pistol is the most finely balanced and accurate of the pistols. The user of a target pistol suffers no penalty for range when firing with two hands
                Variable Pistol: The Variable Pistol has an advantage in that it may be set in the field to a specific type of ammunition and changed according to need. Most handguns fire standard ammunition and must be modified to fire other types as well.
                GyroJet Pistol: A GyroJet Pistol fires a miniature rocket, which may affect one or more targets according to ammunition type. Gyro-jets will only fire one type of ammunition, and gyrojet ammunition will not fit any other type of gun.
                Laser Pistol, Concussion Pistol, Plasma Beam Handgun: The Laser Pistol, Concussion Pistol, and Plasma Beam Handgun are weapons used by high-tech spies and subversive organizations, including S.H.I.E.L.D. and A.I.M. All three types operate from power packs.
                Stun Pistol: The standard Stun Pistol fires a stunning beam of Typical Intensity, and the target must make an Endurance FEAT or pass out for 1-10 turns. It operates from a power pack.
                Shotgun: &Shotgun The Shotgun fires bursts. It is often loaded with non-lethal cartridges (such as rock salt) that will not inflict Killing damage (ignore Kill results).
                Riot Gun: &Riot_Gun_Reference The Riot Gun is a smaller version of the shotgun and fires grenade-like missiles and canister shot (treat as grenades).
              Other Equipment:
                Fire Extinguisher: Fire Extinguishers inflict no damage normally, but against fire are of Good Intensity (eliminate fire of Typical Intensity or less in the same area on a green FEAT, of Good Intensity on a yellow, and up to Excellent on a red). Against characters with flaming powers, such as the Human Torch, the extinguisher causes a FEAT roll against that Intensity to retain flame.
                Silencer: The Silencer is a device that may be added to a pistol or rifle which inflicts damage on the Shooting table, excluding the gyro-jet and all lasers, stunning and concussion weapons. The silencer operates by dispersing the gases from the shot that creates the crack of the pistol. The target (and those around him or her) must make an Intuition FEAT to hear the shot and know its location.
                Sniper Sights: Sniper Sights are built into the sniper rifle and the target pistol, and added to any other weapon eliminate the penalty for range for weapons. Using the sniper sight automatically has an initiative roll of 10 (last in the round). 
                Infra-Red Sights: Infra-Red Sights are a modification similar to the sniper sight, may be used for any missile weapon. These sights permit the user to see up to 5 areas in the dark.
                Flashlight: &Flashlight Flashlights are common to all readers. The normal flashlight is the type most common, with a plastic or metal body (Typical Intensity). The Halogen flashlight has a brighter bulb and more concentrated beam, and blinds with a more powerful Intensity (Remarkable Intensity). Normal flashlight has a range of two areas, the halogen three.
                Mace: &Mace Mace is a small one-area weapon that shoots a mist of Typical Intensity tear gas at a single target adjacent to the user. It does not require an Agility FEAT to hit, though the target must make an Endurance FEAT to avoid the effects.
                Flare Pistol: Flare Pistols fire a burning charge that lights the sky, either to provide illumination (lighting all areas within three) or as a signal device (fired 10 floors straight up). Used as a weapon, the device has a range of two areas and inflicts Good damage. The charge is incendiary and will ignite flammable material.
            Mk. 1:
              Description: A sleek, futuristic device with extendable stock and forestock to transition between handgun to long gun form factors. It may be attached to the Sentinel Battlesuit Mk. 1's arm, becoming an integral part of the suit, or operate off grid power or a power pack as an energy source to be used as a standalone device for 10 uses of any power per Power Pack.
              Material Strength: Amazing
              Powers:
                Defensive:
                  Force Field: #D2
                    Rank: Amazing
                    Number: 50
                    Reference: |
                      This is the type of field used by the Invisible Woman. It provides protection against a variety of forces, including brute force, energy attacks, and extreme temperature conditions. It can be projected and used for a variety of Power stunts.

                      The following seven force fields protect against specific forms of attack. Each protects the hero and the surrounding area. The maximum size of the force field is the number of areas equal to 10% of the Power rank number. For example, a Monstrous Force Field can protect 7.5 areas.

                      The force field completely absorbs any attack which has an Intensity equal to or less than the Power's rank number. If the Intensity is higher, it is reduced by the Power's rank number. The remaining Intensity breaches the force field and affects anyone within by this diminished effect.

                      These forms cannot be used for many of the Power stunts suggested for force fields as given in the Player's Book.

                      These cannot be used to physically attack or to handle solid materials. However, the hero can develop Power stunts which reflect each form's special nature.

                      The hero can form shields to protect distant targets at +2CS range.

                      By expanding his field outward, the hero can sweep his surroundings clean of anything affected by his force field.

                      The Power can be used as a filter to sort out anything affected by his force field.

                      The force field can be formed around something it would affect, thus trapping it. The hero can move the "trap" at will up to +2CS by means of a red FEAT.
                Energy Control:
                  Fire Control: #EC10
                    Rank: Amazing
                    Number: 50
                    Note: &Spray-Only In conjunction with Spray only
                    Reference: The hero can control existing flames, whether natural or Power-based. He can alter any factor involved in combustion without direct physical contact. The hero can increase or decrease the flame's Intensity up to his Power rank and reduce fire damage by his rank number. This Power includes Power rank Resistance to Fire and Heat. The most important aspect of this Power is enabling the hero to reshape flame into any form he desires. This can be used in a variety of Power stunts, as the hero develops numerous fiery constructs to perform miscellaneous deeds. Such fiery constructs do not act like normal flames. They emit less heat and consume less oxygen. Their fire doesn't spread past the outline of the constructs. In addition, they self-extinguish rapidly upon cessation of this Power. Optional Powers include Fire Generation, Thermal Control, Energy Sheath, and Energy Body.
                Energy Emission:
                  Fire Generation: #EE4
                    Rank: Amazing
                    Number: 50
                    Reference: &Fire_Generation |
                      The hero can project fire with Power rank damage and range. These flames have no apparent fuel source and spring from the hero as if he were a living fuel tank. Although the flames' fuel comes out of the proverbial nowhere, free oxygen must be present for the Power to function. If not, the hero can cause a single flame that lasts' only one turn, then fizzles out. At Shift X rank, the hero gains the ability to generate oxygen as well, permitting this Power to function under any conditions. When creating the hero, the player can choose the Powers of Flame Control, Energy Sheath, and Energy Body to fill any slots still open. For example, under the Ultimate system, the Human Torch possesses three powers: Fire Generation, Fire Control, and Energy Sheath.

                      This has to be the most dangerous Power around. Heroes have to watch out for accidental firestorms. They also tend to consume all the oxygen in their location, making everyone pass out. Then there is the question of smoke and gases created by the hero's Flame Power. It makes me wonder what kind of ventilation system the Baxter Building has…

                      Fire Generation is the opposing Power to Cold Emission, Coldshaping, and Powers that use water. This Power gains +1CS when fighting these Powers. It also loses -1CS when being attacked by those Powers.
                  Kinetic Bolt: #EE7
                    Rank: Amazing
                    Number: 50
                    Reference: |
                      This is a crude form of M30/Telekinesis. The hero can strike a target with a surge of force at Power rank range and damage. The Kinetic Bolt can be shaped as desired by the hero. It can be a wide cylinder, or an incredibly fine needle. Its effect is the same as if the target had been struck by a solid object of equal material strength. This Power can affect only tangible materials. It includes Resistance to Kinetic Bolts, Kinetic Control, or Telekinesis. Optional Powers are Kinetic Control and Telekinesis, which are also the Nemeses.
                  Light Emission: #EE8
                    Rank: Amazing
                    Number: 50
                    Reference: &Light_Emission |
                      The hero can emit powerful bursts of light do Power rank damage at rank range. The light may be of any nature:

                      - Normal light in any color or intensity: the hero can light the area, dispel Shadow Powers, and temporarily blind targets.
                      - Coherent Light (lasers) do rank level heat damage as they burn into targets. Lasers can also be used to carry information or to create holograms.
                      - Optic blasts do rank level damage but rather than burn a target, they act as Kinetic Bolts.

                      The player can raise the hero's rank upon creation by +2CS if he chooses specialization in a specific form of this Power.
                  Plasma Generation: #EE10
                    Rank: Amazing
                    Number: 50
                    Power Stunts:
                      - Light: *Light_Emission
                      - Heat: |
                          The hero can generate pure heat that is not necessarily accompanied by light or flame by accelerating molecular motion. This permits the hero to do rank level effects over target materials. Some Power Stunts using pure heat include:

                          - Causing the breakdown of molecular or even atomic bonds (Amazing and Unearthly FEATs, respectively).
                          - Negating a target's magnetism
                          - Negating a target's electrical conductivity.
                          - Strengthening materials by heat-treating.
                          - Changing local weather by heating the air: this can cause small cyclones and electrical storms.

                          Because this Power uses pure heat, it can function in conditions that negate Flame Emission, like the absence of free Oxygen or the hero's being underwater. Beings who possess Thermal Vision or Abnormal Sensitivity can detect an infrared glow around, the hero and his target whenever he uses his Power. Heat Emission is the Nemesis of Cold Emission, Coldshaping, and Powers that use water. This Power gains +1CS when attacking those Powers and loses -1CS when being attacked by them.
                      - Flame: *Fire_Generation
                      - Hard Radiation: |
                          This covers the dangerous section of the energy spectrum: ultraviolet light, x-rays, and alpha and beta particles, gamma rays, and the ever-popular "cosmic rays." The hero can project any of these types at Power rank range and damage. When creating the hero, the player can raise his rank +1CS by specializing in a particular type of hard radiation. For game purposes, we'll assume that the hero has total control over his own inherent radioactivity and possesses automatic safe-guards that prevent him from fatally contaminating the area each time he uses his Power. This Power is linked to Radiation Control: the player can exchange one of his other Powers for Radiation Control when creating the hero, if he so desires.
                      - Magnetism: |
                          The hero can generate intense magnetic force. The magnetic field may be centered on the hero's body or be projected at rank range. The field can affect anything susceptible to magnetism, attracting it with Power rank Strength. If the target itself is magnetic, the hero can attract it at +1CS or repel it at Power rank. The hero can induce magnetism into any materials that can sustain a magnetic field: these include ferrous materials, iron-bearing clays and plastics, and ferrous ores. The hero can do rank level damage to electronic devices by scrambling internal signals: this is especially effective against magnetic recordings and micro-chip dependent devices. This Power can affect other Powers. It can redirect Electrical Generation by a Typical Intensity FEAT if the other Power's rank is lower, a Remarkable Intensity FEAT if equal, and an Unearthly Intensity FEAT if the other Power is higher. It can disrupt Electric or Magnetic Control and Energy Sheath or Energy Body, if either are magnetic in nature.

                          The Power has its drawbacks. It attracts some types of attacks if the hero is careless. Such attacks as Electrical Generation or anything using ferrous materials (knives, missiles) gain +2CS.

                          This Power is its own primary Nemesis.
                      - Electricity: |
                          The hero can create electrical streams that can do Power rank damage. The hero can project the electricity through any conductive medium, such as air, water, or metal, at Power rank range. If the player chooses, the hero can gain +2CS to his damage by choosing to limit his range to contact only. In this case, the range can be extended by conducting the Power through solid conductors like metal. Electricity comes in various forms:

                          - Static electricity causes magnetic attraction between objects and can disrupt electronic communications.
                          - Lightning is sheer, raw, destructive power and by far the most popular form of this Power.
                          - Alternating current is what our technology is driven by. This Power can either energize or overload normal electrical devices.
                          - Direct current is what a battery produces. It can energize or overload devices that use DC power. It can also short out devices that use AC power.

                          The hero can use any form at will or can raise his rank +1CS by specializing in a particular form. This Power automatically includes Power rank Resistance to Electricity: no FEAT is required to resist your own Power. This Power is linked to Electrical Control and Energy Sheath. When creating the hero, the player can exchange any randomly determined Powers for these if he so desires. Extreme heat reduces this Power's rank by the Intensity rank of the heat. Conversely, extreme cold increases the rank by the cold's Intensity rank. At Shift X level, the hero gains the ability to create a stream of conductive gas, thus allowing the Power to function even in a vacuum.
                    Reference: |
                      Plasma refers to here to a field of highly-charged particles. Common examples include the aurora borealis, the glow in a fluorescent tube, the Van Allen Belt, and the heart of a nuclear blast. Plasmas may be of any nature: fiery, magnetic, electrical, radioactive, or be of a previously unknown form of energy. This last group includes many super-powers, living energy fields, and beings who can transform themselves into pure energy.

                      The hero can project Plasma fields at Power rank range. Due to the unique nature of this Power, it does damage on two levels. The primary level is brute force: the field does Power rank damage There are also side-effects based on the nature of each Plasma bolt. Plasma fields have two of the following side effects:

                      - Light at -2CS level of illumination
                      - Heat at -2CS damage
                      - Flame at -2CS damage
                      - Hard Radiation at -2CS damage
                      - Magnetism at -2CS damage but full Power rank range
                      - Electricity at -2CS damage.

                      The hero initially possesses a single type of Plasma with two set side-effects that occur each time he uses his Power. Later he can develop other Plasmas with different side-effects as Power Stunts.

                      Plasma is a Nemesis to the Powers of Energy Sheath and Energy Body. The hero gains +1CS when attacking either Power. Plasma's own Nemeses are Plasma Control and Power Control.
                Lifeform Control:
                  Neural Manipulation: #L12
                    Rank: Amazing
                    Number: 50
                    Note: *Spray-Only
                    Reference: |
                      The hero can alter a target's neural activity. By changing nerve messages within the target's body, the hero can cause a variety of effects.

                      - Disruption: The target's body loses all sensations: it falls to the ground, a limp, aumb mass of flesh.
                      - Paralysis: The target body becomes completely rigid. No chemical can counteract the paralysis while the Power is in effect.
                      - Seizure: The target's muscles spasm uncontrollably for as long as the Power is in effect.
                      - Exaggeration: Nerve signals are actually amplified, causing the target to overact when attempting any movement.

                      Normally, a hero can select any of these effects. When creating the hero, the player can choose to specialize in one effect for a benefit of +2CS. Note: This Power only affects the voluntary muscles; it does not affect the autonomic nervous system which controls the heart, lungs, and other automatic bodily functions. The range and duration of this Power are determined by its rank. Suitable distances are shown on column A of the Range Table. The Power normally affects only a single person; affecting more causes a decrease in duration of -1CS per additional person. The target's mind and senses are unaffected by the Power: the victim knows full well what is happening (even if he doesn't know why it's happening to him). The Power can reach across the dimensional barriers if it is combined with some way of breaching the dimensions. It can function normally if both hero and target are within another dimension.
                Matter Conversion:
                  Disintegration: #MCo3
                    Rank: Amazing
                    Number: 50
                    Reference: |
                      This is the ever popular but never explained "Disintegrator Ray." The hero has the ability to convert any matter into pure energy, usually Light although the player can specify another resultant energy when he first creates the character. The energy dissipates harmlessly and does not affect anyone in the vicinity.

                      This Power can affect any target within range and line-of-sight. The range is determined by Power rank; resulting distances are shown on Column A of the Range Table. The maximum amount of matter that can be disintegrated in a single turn is the number of cubic feet equal to the Power rank number. For example, a Typical Disintegrator can destroy six cubic feet of matter at a range of two areas or 264 feet. When creating the character, the player can alter the Power range or effect if he so chooses. Either the range or the amount affected can be increased any number of Column Shifts by decreasing the other factor an equal amount.

                      Example: Ken and Sue are both creating Disintegrators. Ken rolls 97 for his Power rank, an awesome Amazing rank for both range and effect. Sue isn't so lucky and rolls 77, a Good rank for her Cyborg Character. Sue wants deadlier force and chooses to after her range and effect. She decreases her range to Feeble or Contact-only, a loss of -3CS that she can apply to her effect. This increases +3CS to an Incredible effect.

                      Unwilling targets of this Power are allowed to resist it in any way they can. Furthermore, the Disintegrator must make an Agility FEAT to aim this Power on a target.

                      I mentioned the maximum area the Disintegrator can effect, but what of the minimum area? The Power comes in handy for doing all sorts of fine-detailed work like sculpting, surgery, or removing unwanted locks. The hero can Disintegrate as small an area as he can clearly see. With normal, unaided vision, the minimum limit is about 1/128th of an inch. Smaller than that and the hero needs some kind of magnifying device or Power. Note: this limit is proportional to a normally-sized human of about six feet in height. Enlarged or miniaturized characters have a proportional limit. For example, a 36-foot-tall giant would have a minimum limit of 1/21 of an inch, while a one-foot-tall person would have a minimum limit of 1/768th of an inch or about the size of a cell.

                      As stated earlier, the target must be within line of sight since the Power affects the first thing it encounters, excluding air molecules. Actually, some air is accidentally Disintegrated whenever this Power is used-that's why the Power appears as a glowing beam emitted by the hero-but not enough to divert the Power from its intended target. If an unseen or unanticipated barrier is present between the Disintegrator and the target, that barrier takes the full brunt of the Power that turn.

                      Ken's hero, Starburst, sights a Dreadnought and immediately tries to Disintegrate it. Unfortunately, Starburst failed to notice the plate glass window the Dreadnought was behind. The window vanishes in a flash of pretty lights as the Dreadnought ducks around the corner.

                      This Power is frequently given, to weapons systems such as the ever popular Disintegrator Pistols that fill pulp SciFi. In terms of normal contemporary Earth technology, a Disintegrator raygun requires Incredible Reason and Physics Talent to design and an Amazing cost in Resource points to build. The Judge is free to decide the range and effect of such a weapon.

                      Nemeses for Disintegration are Phasing (to protect the hero) and Ionization (to protect others) as the Power cannot affect intangible matter.
                Matter Creation:
                  Missile Creation: #MCr5
                    Rank: Amazing
                    Number: 50
                    Missiles:
                      Stunning Missile:
                        Power: ~
                        Effect: Power Rank Intensity Stunning
                      Incendiary:
                        Power: Fire Generation
                        Effect: Power Rank Energy Damage
                      Plasma:
                        Power: Plasma Generation
                        Effect: Power Rank Force Damage
                      Flare:
                        Power: Light Emission
                        Effect: Emits light of any color at up to Power Rank Intensity.
                    Reference: |
                      The hero can spontaneously create and launch projectiles. These are propelled to Power rank range. Missiles that simply slam into a target act as Stunning Missiles and inflict Stunning attacks of Power rank Intensity. If the hero has other Powers, these are combined with this Power to produce missiles with specific effects.

                      - Nullifier: The Missile Power is combined with Power Control/Negation to produce missiles that inflict no direct damage but may nullify inborn or technological Powers with Power rank Intensity.
                      - Sleep Darts-the Power is combined with Induced Sleep to create anesthetic darts.
                      - Magnetic: The Power combines with Magnetism to produce missiles with Power rank Intensity Magnetism. These can do Power rank damage to magnetic recordings or delicate electronics, and can attract any iron in the target site (guns, for example).
                      - Ghostcasters: The Power is combined with Illusion-casting to create missiles that emit a static hologram upon hitting the target site.
                      - Vanishers: The Power is combined with Induced Teleportation to create missiles that teleport the target to a predetermined destination.
                      - Energizer: Missiles are combined with Power Transference to give the target part of the hero's other Powers.

                      Any Power in this book can be combined with this Power to create unique missiles for your character. When creating the character, the player should follow this guideline: If there is a way to combine external Powers with this Power, do it. Powers that are completely internal in their effects are exempted from this. This includes most of the Mental and Physical Enhancements and all of the Self Alterations and Detection Powers.

                      If the character is High Tech, has rolled such Powers as Hyper-Invention or Weapons Tinkering, or possesses a magical device, then the Missile Powers should be combined into a device possessed by the hero. This may be an exotic gun, a wand, or any other bit of superheroic paraphernalia the player can imagine.

                      The hero has a finite ammo supply, even if he creates the missiles as he goes. The maximum number of Missiles the hero can create per hour is equal to the Power rank number. This prevents the cliché found in bad Westerns, whereby a lone cowboy holds off the entire Apache nation with a single sixshooter. This limit also applies to Technological versions of this Power, in that the gun/wand/whatever simply overheats from repeated use.

                      There are two Nemeses for this Power. If the Power is innate to the hero, Reflection stops it. If the Power is externalized in a weapon, Induced Teleportation works by removing the weapon from the hero's possession and giving it to the opponent.            
                  Spray: #MCr7
                    Rank: Amazing
                    Number: 50
                    Sprays:
                      Spray:
                        Power: ~
                        Effect: Feeble damage by choking off the target's fresh air and reducing visibility by -2CS for anyone within the cloud.
                      Accelerant:
                        Power: Fire Control
                        Effect: Increases effect of Fire up to Power Rank.
                      Fire Suppression Foam:
                        Power: Fire Control
                        Effect:  Suppresses Fire up to Power Rank.
                      Insulation:
                        Power: Fire Control
                        Effect: Power Rank Protection vs. Fire and Heat
                      Napalm:
                        Power: Fire Generation
                        Effect: Power Rank Energy Damage
                      Neurotoxin:
                        Power: Neural Manipulation
                        Effect: Chosen form of Neural Manipulation power
                    Reference: |
                      The hero can spontaneously create a directed cloud of gas, mist, or dust. The Spray has a range of up to one area. It has the basic properties of doing Feeble damage by choking off the target's fresh air and reducing visibility by -2CS for anyone within the cloud. The main purpose of Spray is combining it with other Powers, thereby producing unique Spray Powers for the hero. In all these cases, the range remains the same. Other factors, such as the nature and Intensity of effects, are determined by the Power that has been combined with Spray. Some possibilities include:

                      - Hallucinogenic: The Spray is combined with Image Generation to produce vivid visual images in the target's mind; these, of course, have nothing to do with reality. The target's Fighting and Intuition drop -3CS.
                      - Corrosion-proofing: The Spray combines with Catalytic Control to lessen corrosive attacks' Intensity by this Power rank number.
                      - Insulation: The Spray combines with any Energy Control to produce a coating that protects any target from that form of Energy Emission. The insulation reduces the energy attack's Intensity rank by the Energy Control's rank number.
                      - Healing Spray: This uses any of the more pleasant forms of Bio-Physical Control to produce a cloud that heals anyone in the target area who has taken damage up to -1CS.
                      - Napalm: The Spray is combined with Fire Generation and does Power rank damage.
                      - Freeze Cloud: The Spray combines with Cold Emission to do Power rank damage.
                      - Shrink Dust: The Spray combines with Diminution to reduce the size of anything in the target area.
                      - Booster Dust: The Spray combines with Power Control/Magnification to raise the Power ranks of everyone in the target area +1CS.

                      Any Power in the Ultimate Powers Book can be combined with this Power to create unique Sprays for each character. When creating such characters, the player should follow this simple guideline: If you can figure out a way to combine externalized Powers with this one, do it. Powers that are completely internalized are exempt from this rule. This includes most of the Mental and Physical Enhancements and all of the Self Alterations and Detections.

                      If a character is High Tech, has rolled such Powers as Hyper-Invention or Weapons Tinkering, or possesses a magical device, then the Spray Power should be incorporated into a device. This may be a gas gun, ring, horn, or any other piece of superheroic paraphernalia the player can imagine.

                      Example: The player rolls up the following Fire Generation, Elemental Conversion, Spontaneous Combustion, Spray, and Enchantment. She is a Humanoid, an Elf to be precise. She determines she is a magical character. The first three Powers readily combine with Spray. The player decides that the heroine possesses a magical flute which she built herself. Besides playing normal tunes, she knows three special melodies that create clouds which possess each of the first three Powers.

                      The hero has a finite amount of Spray. The maximum number of Sprays the hero can create in a 24-hour period is equal to his Power rank number. This limit also applies to Technological or Magical versions of this Power; the gasgun/flute/whatever simply clogs up from repeated use.

                      There are two Nemeses for this Power. If the Power is innate to the hero, then Reflection stops it. If the Power is externalized in a device, Induced Teleportation works be removing the device from the hero's possession and turning it over to the Nemesis.
                Mental Enhancement:
                  Telekinesis: #M30
                    Rank: Amazing
                    Number: 50
                    Reference: |
                      The hero can handle material objects without having to make direct or indirect physical contact (pushing or blowing, for example). The hero can perform any action that could be accomplished using normal Strength. The Power rank serves as an equivalent for the Strength rank. Most Telekinetics ("TKs") visualize their Power in terms of an amorphous arm extending from the body. This leads to a curious psychological handicap in that most TKs cannot lift their own bodies. Only rare examples like Marvel Girl have overcome this bit of irrationality.

                      The range is determined by the Power rank. Column A on the Range Table shows the ranges for a single act of TK activity. Each additional simultaneous action reduces the range -1CS. Multiple activities share the common pool of TK strength. The more actions that are attempted, the weaker each telekinetic arm becomes. If the hero attempts to perform a greater number of simultaneous complex activities than the Judge thinks plausible, the Judge may require an Agility FEAT.

                      If the hero also possesses Remote Sensing, she can develop a sense of touch through her TK grasp. This permits the hero to handle materials that are not within her sight. Clairvoyance can be incorporated into TK to permit visual guidance.

                      Optional Powers include Matter Animation, Molding, Clairvoyance, Remote Sensing/Touch, Levitation, and True Flight.

                      Nemesis is either Force Field vs. Psionics or Gravity Manipulation.
                Power Control:
                  Energy Source: #PC5
                    Source:
                      - Sentinel Battlesuit Mk. 1
                      - Power Pack: *Power_Pack
                      - Room Package: Power Room
                      - Power grid
                    Reference: |
                      The hero draws his Powers from a special source that provides him with all the energy he can handle. As long as the hero can maintain his link with this source, he can continue to use his Powers. The nature of the source and its link varies with each hero. If the source is small enough, the hero may be required to carry it with him. If not, perhaps the hero needs to periodically return to the source or forge an ethereal Power cord that links him to his Source despite any intervening distance. The Judge and player need to work together to produce a playable source and link.

                      If the link is severed or the source destroyed, the Mage is left with a finite supply of energy left. The amount of raw Power left is the number of points equal to his Psyche rank. Each time he uses Power, he decreases the reservoir by that Power's rank number. Obviously, it is within the hero's best interests to renew his link or rebuild his source in as little time as possible.

                      As you are beginning to suspect, this isn't really a Power and is more of a restraint. You're right. If you roll this Power, go ahead and roll an additional Power.
                Travel:
                  Floating Disc: #T5
                    Rank: Amazing
                    Number: 50
                    Reference: |
                      The hero can create a glowing platform of solid light. The disc materializes to support any part of the hero's body: generally this is under the feet or posterior. The disc is a part of the hero's Power and has no independent existence beyond him. The disc can automatically support the hero and additional mass. The weight is supported by a Power FEAT with the Power substituting for Strength. For example, creating a Floating Disc to lift five tons is an Incredible Intensity FEAT. The disc's surface area expands to support wide loads.

                      Travel occurs at Power rank speed. The Power provides no innate protection against high windspeed and friction burns, thus the practical speed limit for atmospheric Flight is Remarkable (225 mph). The Power can be used in the water with proportionally decreased speed.

                      If the hero is a technological type or possesses such Powers as Hyper-Intelligence, Hyper-inventiveness, Weapons Tinkering, or Mechanical Creation, then the Floating Discs can be mechanical in nature. Such disks collapse for easy storage somewhere on the hero's costume, such as a false bottom in the boots. An example of this is the Wizard's anti-grav disks.

                      The Optional Power is Kinetic Bolt: the energy resembles the Floating Disc.

                      Nemesis is Energy Vampirism.
          Warden Staff:
            Mk. 0: &Warden_Staff_Mk0
              Description: A telescoping/collapsible alloy pole with a retractable blade at the end. May be used as blunt (Club, Boomerang) or edged (Knife, Sword, Spear) weapons in either extended or collapsed positions, and thrown in any configuration. Two may connect end-to-end with the blades retracted to form a longer pole. A user with the Thrown Weapons or Throwing talents knows how to throw them so they arc or ricochet to return to their hands when thrown, whether they hit or miss, by making an Agility FEAT. A coiled spring and compressed air system allows the blade to be launched as if it were a crossbow or speargun. It's an integrated combination of existing items.
              Count: 2
              Material Strength: Remarkable
              Shooting Weapons:
                Range: 3
                Damage: 10
                Type: Shooting
                Rate: 1 per 2
                Shots: 1
                Crossbow: Crossbows have a -1CS to hit, unless the wielder has Bow Talent.
                Spear Gun: The Spear Gun is similar to the crossbow in statistics but may fire its bolts underwater for their full distance without penalty.
              Melee and Thrown Weapons:
                Type:
                  - Blunt Attack
                  - Blunt Throwing
                  - Edged Attack
                  - Edged Throwing
                Damage: 10
                Knife: &Knife A Knife is defined as any blade weapon with a blade up to 12 inches. It may be thrown as a thrown object.
                Spear: A Spear is considered as any thrusting blade with a handle over one foot long. It is normally thrown or wielded with two hands.
                Club: &Club Clubs are standard blunt weapons, including makeshift weapons such as chairs and tables.
                Boomerang: The Boomerang is a flat, curved throwing stick. Only a character with Throwing talent may cause a Boomerang to return to their hands.
          Sentinel Battlesuit:
            Mk. 0: &Sentinel_Battlesuit_Mk0
              Description: A sleek, dark, armored suit consisting of para-aramids, meta-aramids, beta cloth, titanium mesh, silicone rubber, and high-impact ballistic plastic, it sports built-in functionality such as an integral air supply and respirator in its mask, and night-vision and polarized eye-protection in the goggles, as well as retractable inline wheels in the boots and compact rocket boosters on the back.  It's an integrated combination of existing items.
              Material Strength: Excellent
              Other Equipment:
                Infra-red Goggles: &Infra-Red_Goggles Infra-Red Goggles are similar to infra-red sights; these permit normal vision up to 5 areas away in dimly lit areas.
                Polarized Lenses: &Polarized_Lenses Polarized Lenses are goggles that provide Good resistance to light attacks. If exposed to a bright light, they darken for 1 round, then lighten to allow normal sight.
                Gas Mask: &Gas_Mask Allows the wearer to breathe and act normally in conditions of smoke, tear gas, or knock-out gas. It does not allow clear vision in these areas, however, only normal movement.
                Flak Jacket: &Flak_Jacket Flak Jackets are worn by police in special situations and by SWAT teams. These jackets provide Good protection from physical damage.
                Beta Cloth: Beta-Cloth is a lightweight material worn by agents of S.H.I.E.L.D. It provides Typical protection from physical attacks, Excellent protection from heat and radiation.
                Scuba Gear: Scuba Gear allows the wearer to breathe tanked air for 2 hours and, as such, dive to moderate depths in the ocean.
                Roller Skates: Roller Skates are used by a variety of heroes from Dazzler to Iron Man. Standard skates allow the hero to move at the listed speed as if Endurance were three ranks higher.
                Rocket Pack: Rocket Pack, worn either as a belt-pack or a backpack, allows the wearer to fly at Excellent speeds. All limitations on flight apply to the wearer, and Agility FEATs required are at one CS lower.
            Mk. 1:
              Description: A full suit of powered armor, still sleek and futuristic, but reminiscient of Byzantine motifs with a dark theme.
              Abilities: 
                Fighting:
                  Column Shift: +4
                  Max: Shift-Y
                Agility:
                  Column Shift: +4
                  Max: Shift-X
                Strength:
                  Column Shift: +4
                  Max: Monstrous
                Endurance:
                  Column Shift: +4
                  Max: Unearthly
              Material Strength: Monstrous
              Powers:
                Defensive:
                  Body Armor: #D1
                    Rank: Amazing
                    Number: 50
                    Reference: |
                      The hero possesses artificially-created armor that provides protection and possibly a way of possessing other Powers.

                      Armor comes in many forms exotic plate-mail, nuclear-powered exoskeletons, or mechanically-created force fields. The player should work with the Judge to create proper Armor for his hero. The player can also determine which Powers are possessed by the hero and which are properties of the armor. Powers built into the armor can later be modified and enhanced: think of the changes Tony Stark has made in the Iron Man armor. On the other hand, Powers that are built into the armor may suffer mechanical failure. The Armor's Power rank determines its ability to resist damage.

                      The player also has to determine where he got the Armor in the first place. This is covered in the "Character Creation" section elsewhere in this book. If the hero gained the armor through an accident, he might not be able to repair it.
                Detection:
                  Energy Detection: #DT3
                    Rank: Amazing
                    Number: 50
                    Reference: Range column D. The hero can detect and identify energy and related phenomena. The power can only detect actual energy, not potential energy (it couldn't detect a bomb until it explodes, for example). Likewise, while it can detect the energies consciously emitted by superhumans, it cannot detect the superhumans themselves. Rank determines range.
                  Radarsense: #DT15
                    Rank: Amazing
                    Number: 50
                    Reference: |
                      Range column B. The hero can gain a three-dimensional picture of his surroundings through the use of electromagnetic waves. The hero both emits and senses these waves. He can use the Power to locate and identify targets by their characteristic echoes. Because of the hero's sensitivity to electromagnetic waves, he has an increased vulnerability to electrical and magnetic attacks (-1CS): these temporarily negate the Radarsense.
                  Sonar: #DT16
                    Rank: Amazing
                    Number: 50
                    Reference: |
                      Range column B. The hero can gain a three-dimensional picture of his environment through the use of soundwaves. The Power allows the hero to locate and identify targets by the way they reflect sound.

                      There are two ways this Power can operate. Passive Sonar utilizes existing sound. Active Sonar uses special sounds emitted by the hero (this is how bats and dolphins do it). The latter form requires a special adaptation of the hero's voice: otherwise there is no real difference between them. Because of the special sensitivity of the hero's hearing, he is vulnerable to sonic attacks (-1CS to resist).
                  Telescopic Vision: #DT17
                    Rank: Amazing
                    Number: 50
                    Reference: |
                      Range column E. The hero's eyes can focus on extremely distant targets, objects too small for normal vision to perceive. The eyes function as telescopes, magnifying normal visual images. With this Power, the hero can see anything in his line of sight, even the surfaces of distant worlds. However, the Power is limited by the speed of light. Images of Alpha Centauri, for example, are five years old.

                      If the hero has other vision-based Powers, he can couple them with Telescopic vision to extend their range.

                      When using this Power, the distant objects appear very close. An adversary with a means of altering the hero's control over this Power might make the Telescopic Vision continually override the hero's normal sight. The effect would be disastrous (imagine trying to walk through Manhattan when all you're seeing are the sands of Mars).
                  Thermal Vision: #DT18
                    Rank: Amazing
                    Number: 50
                    Reference: |
                      The hero can see infrared light and heat images. This allows the hero to see in the dark, perceive temperature differences (especially those left by a living person's contact with an object), and partially see through solids. In the last case, the hero can only see the heat patterns of objects touching the other side of the barrier.

                      With practice, the hero can judge the temperature of a target by its thermal color. The hero has an increased risk of being blinded by strong heat sources, even those that don't affect normal vision (-1CS). Thermal vision may be a consciously-activated mode or the hero's normal means of vision.
                  Ultraviolet Vision: #DT21
                    Rank: Amazing
                    Number: 50
                    Reference: |
                      The hero can see ultraviolet light. Because UV light isn't as readily absorbed by water as normal light, this Power enables the hero to see clearly through fog and at greater distance in the water (+1CS). The hero can also see the dim light given off by radioactive materials.

                      The hero cannot actually "see in the dark" but only if UV light is present. The effect is the same when seen by normal people. The hero has an increased risk of being blinded by strong UV sources, like black lights and radiation (-2CS).
                Matter Control:
                  Micro-Environment: #MC10
                    Rank: Unearthly
                    Number: 100
                    Constraint: Range and area of effect within suit only (reduced to Feeble range).
                    Reference:  |
                      The hero can alter his immediate surroundings to create a miniature climate around himself. The Micro-Environment always contains fresh clean air (or water or methane or whatever the hero breathes) at any temperature and pressure the hero desires. The Micro-Environment incorporates a Force Field that protects it from any factor that might harm or even annoy the hero, such as rain, poisonous gases, extreme temperatures, or the pressure that naturally results from having three miles of ocean over your head. In such cases, the Micro-Environment automatically excludes potentially hazardous gases and liquids and reduces the Intensity of pressure, extreme temperature, and high gravity by the Power rank number. Lesser or equal Intensities are canceled out, while higher ranks only penetrate in diminished form.

                      The Power automatically Collects the desired materials into a sphere around the hero; if no such materials are available, the Power employs an innate form of Matter Creation or Conversion to produce those materials. The Force Field maintains the desired pressure, temperature, and gravity levels while enclosing the desired materials and shielding the hero from the undesired ones. If the hero requires a surface to stand on but none is available, the Power provides one by solidifying a section of the Force Field.

                      The Power is primarily intended to protect the hero when he is in places other than his home environment. It can, be used to protect him from extreme variations in that home environment though, should the hero so choose. Thus the Power can be used to protect the hero in the middle of a house fire, gas leak at a fertilizer plant, radiation spill at a laboratory, a thunderstorm, or a smog alert in Los Angeles. The Power can be used to Resist the effects of Air or Water Animation, Weather Control, Heat, or Cold Generation; the Intensity of the attack is reduced by the Power rank number.

                      The Micro-Environment has a maximum radius in feet equal to the Power rank number. Normally it is a sphere centered in the hero but she can shape it or direct it to another location if she so desires. The maximum range at which the hero can direct the Micro-Environment is determined by the Power rank; appropriate distances are shown on Column B on the Range Table. The maximum volume of the Micro-Environment is the equivalent of a sphere whose radius equals the Power rank number. Figuring out the maximum volume of other shapes requires a doing a bit of geometry.

                      Example: A rank of Good can produce a sphere of 3.14(10-cubed) or 3,140 cubic feet. This can be shaped into a rectangular "tunnel" 10 feet high, 10 feet wide, and 31 feet long. I suggest that anyone with this Power figure out as soon as possible how big a sphere/hemisphere/column/tunnel/cone/et cetera he can make with his Power rank. If you don't, the Judge is liable to say that mysterious changes in the environment prevent your hero's Power from working.

                      The Power only protects the hero from environmental effects or Powers that employ aspects of the Environment. Beside the Powers mentioned earlier, this Power will also provide limited protection against Electrical Control, Electrical Generation, Coldshaping, Gravity Manipulation, Hard Radiation and its Control, Thermal Control, Plague Carrier, Geoforce, Spray, and Pheromones, but only if the offending Power originates outside the Micro-Environment.

                      As hinted at before, the Power can be used to create any environment the hero desires, provided it is beneficial to whatever nature of being is inside its protection. Of course, what is a marvelous climate for one being could be instantly fatal to another. Consider the Micro-Environments created by beings that thrive on super-heated steam or swim in liquid helium. Player characters are limited to producing only those Micro-Environments that will help the beings inside. Villainous and Mind-Controlled NPC heroes are able to pervert the Power and create toxic Micro-Environments. In such a case, the Power is treated as an attack and the intended victim is urged to Resist it in any way he can.

                      The Nemeses are either Air or Liquid Animation, depending on the nature of the Micro-Environment.
                Travel:
                  Rocket:
                    Rank: Unearthly
                    Number: 100
                    Reference: | #T13
                      The hero flies by means of a rocket-like exhaust that propels him at Power rank speed. The rocket blast is created by a thermo-chemical reaction generated by the hero's body. The Power converts whatever material is around him into fuel and oxidant, then it shapes the exhaust into a stream to propel him. If the hero is in a vacuum, the Power creates fuel out of virtual nothingness.

                      The Power is treated like Strength to determine the maximum thrust the Power can achieve. If the thrust is high enough, the hero can carry or push additional loads. For example, Cannonball's Remarkable thrust can lift up to one ton.

                      The Nemesis is Gravity Manipulation.
