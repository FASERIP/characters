    Julian Constantine:
      Name: Julian Constantine
      Identity: Julian Constantine
      Secret: false
      Base of Operations: Manhattan
      Group Affiliation: ~
      Age: 1606
      Origin: &Normal_Human_Self-Achievement
        Physical Form:
          Normal Human: |
            The body is completely normal and possesses no detectable abnormalities. Any Powers the hero possesses have left no visible mark on the body.

            - Random ranks are rolled on Column 2 of the Random Ranks Table.
            - Resources are increased +1CS.
        Origin of Power:
          Self-Achievement: The hero actively sought out a means of giving himself Power. He developed the methods, procedures, equipment, or whatever permits him to possess Power. This could be through scientific endeavors (Henry Pym/ Ant Man), arcane study (Dr. Strange), or physical training (iron Fist). Anyone can gain Powers similar to the hero's by following this special training.
        Weakness: &Normal_Human_Weakness
          Normal Human:
            Reference: Everybody has an Achilles' Heel, a weakness that can really mess up his day. The nature and severity of the weakness varies with the individual, race, or class. Normal Humans have so many we don't even think about them, aside from heeding such warnings as "Poison" or skull-and-crossbones symbols. For Normal Humans, the standard stimuli are Elemental Allergy, Molecular Allergy, and Energy Allergy with Fatal Effects. 
            Stimulus:
              Elemental Allergy:
                Element: Toxic elements
                Reference: |
                  The hero suffers adverse effects if he is exposed to a specific one of the hundred-odd elements. This Allergy only occurs if the element is present in a pure state and in an accumulation of at least one ounce. If the element is combined in a molecular state or is in insufficient quantities, no Effect occurs. The element must be within 20 feet of the hero for it to have any Effect.

                  This allergy can be overcome by physically insulating the hero from the element or by increasing the distance between them.
              Molecular Allergy:
                Compound: Toxic compounds
                Reference: This is similar to Elemental Allergy. A specific compound causes the Effect. Common examples include water, wood, and Adamantium.
              Energy Allergy:
                Energy: Dangerous types of energy at sufficient Intensity
                Reference: The hero suffers when he is exposed to a specific form of energy. This can be any wavelength or Intensity of energy found in the Energy Emission and Energy Control sections of this book. Sunlight is a common example of Energy Allergy, particularly when dealing with supernatural beings.
            Effect:
              Fatal: As in the above, the hero gets ill after the initial exposure to the Stimulus. However, the Health loss does not stop at zero. Death will eventually occur if Health and (subsequently) Endurance drop to zero during the Weakness Duration. The hero can be revived if proper medical attention is given, but only after his Health and Endurance have both reached zero.
            Duration:
              Permanent: The Stimulus does its full damage to the hero, even when exposure to the Stimulus has been interrupted. In this case, the Stimulus sets off a bodily self-destruction sequence that must continue to its full extent. In the case of Power Negation, the hero's Powers are permanently lost. Incapacitation results in the hero reaching zero Health points and lapsing into a coma lasting 1 -10 days. After that time, he may regain his Health at the normal rate. Fatal results in the death of the hero as both Health and Endurance drop to zero. The hero can be revived, however, and will eventually recover if revival occurs.
      Description:
        Biography: Born in Nicomedia in the year 380 in what was then the Eastern Roman Empire, Julian Constantine, then known as Ioulianós ó Nikomediátes, unlocked the secrets of the Philosopher's Stone in the early-mid Fifth Century, gaining immortality and eternal youth and health.  He has spent the centuries since honing his mind, body, and spirit to unprecedented levels, dedicating himself to the mastery of anything that has caught his attention along the way.  By the late 20th century, he is exorbitantly wealthy and well-connected along with his hyper-competence, due to incessant personal development and cultivation. Of human peak physicality, his mind is centuries since transcending all human limits.
        Personality: Julian is, in a general sense, heroic, noble, valorous, and beneficient, although as a man well into his second millennium of life, having witnessed the rise and fall of many cultures, societies, and philosophies, and their values, his view is long and his perspective distant and somewhat detached.  What heroic and noble means to him reflects that perspective. He is gregarious, humorous, and charming, socially, although he prefers such socialization to be on his terms. He is disciplined, focused, and meticulous, as well as obsessive about his personal development—he devotes a considerable amount of his waking hours to that pursuit.
        Appearance: Tall, long-limbed, broad-shouldered, and athletic, his olive skin, dark hair, strong, regal facial features, and piercing green eyes reflect his ancient Near-Eastern heritage, an ethnicity that no longer exists in that form among the entirety of humanity save himself.  When out of his armor, he tends to wear impeccable, tailored suits in neutral colors appropriate to the season, and quite a bit of jewelery with mystic or occult connotations, some of it as ancient as he is, or more.
