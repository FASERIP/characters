                  The Guardian Integrated Multipurpose Weapon Model I Mk. β is a longarm combination weapon with utility functions, essentially a larger version of the Mk. α.  It fires medium power and magnum power rifle bullets with the precision of a sniper rifle with an integrated silencer, shot shells, rockets, canister rounds, flammable liquid, and laser, concussion, and stun beams. It features integral optics that are night-vision capable.  Additionally, it has utility features comprising a standard intensity and high intensity flashlight system for illumination or blinding, a foam projector to extinguish fires, tear gas spray, and a flare launcher.  Beam types are selectable on the fly from a power pack. Other weapons' ammunition are treated as types of ammunition that must be switched out and it can only load and fire one at a time, as does the Variable Pistol; the loading and firing mechanisms are in large part integral to the magazines. The flamethrower has a separate fuel source. Other features such as the flare gun, fire extinguisher, and mace are all present together with everything else, but must be reloaded after a single use.
                
