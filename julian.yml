              Powers:
                Energy Emission:
                  Light Emission: #EE8
                    Rank: Base Power Rank
                    Reference:
                      - &Light_Emission |
                        The hero can emit powerful bursts of light do Power rank damage at rank range. The light may be of any nature:

                        - Normal light in any color or intensity: the hero can light the area, dispel Shadow Powers, and temporarily blind targets.
                        - Coherent Light (lasers) do rank level heat damage as they burn into targets. Lasers can also be used to carry information or to create holograms.
                        - Optic blasts do rank level damage but rather than burn a target, they act as Kinetic Bolts.

                        The player can raise the hero's rank upon creation by +2CS if he chooses specialization in a specific form of this Power.
                      - Kinetic Bolts:
                          Reference: This is a crude form of M30/Telekinesis. The hero can strike a target with a surge of force at Power rank range and damage. The Kinetic Bolt can be shaped as desired by the hero. It can be a wide cylinder, or an incredibly fine needle. Its effect is the same as if the target had been struck by a solid object of equal material strength. This Power can affect only tangible materials. It includes Resistance to Kinetic Bolts, Kinetic Control, or Telekinesis. Optional Powers are Kinetic Control and Telekinesis, which are also the Nemeses.
                Matter Creation:
                  Base Powers:
                    Missile Creation: #MCr5
                      Rank: Base Power Rank
                      Missiles:
                        Stunning Missile:
                          Power: ~
                          Effect: Power Rank Intensity Stunning
                        Incendiary Flare:
                          Power: Fire Generation
                          Effect: Power Rank Energy Damage.  Illuminates Power Rank Area, may be fired upwards Power Rank Range for signaling. Ignites flammable material with Power Rank Intensity.
                        Neurotoxin Dart:
                          Power: Neural Manipulation
                          Effect: Chosen form of Neural Manipulation power to one target
                        Sleep Dart:
                          Power: Sleep-Induced
                          Effect: Effect of Sleep-Induced Power to one target
                        Smoke Canister: &Smoke_Canister
                          Power: Spray
                          Effect: Feeble damage and obscures vision in area
                      Reference: |
                        The hero can spontaneously create and launch projectiles. These are propelled to Power rank range. Missiles that simply slam into a target act as Stunning Missiles and inflict Stunning attacks of Power rank Intensity. If the hero has other Powers, these are combined with this Power to produce missiles with specific effects.

                        - Nullifier: The Missile Power is combined with Power Control/Negation to produce missiles that inflict no direct damage but may nullify inborn or technological Powers with Power rank Intensity.
                        - Sleep Darts-the Power is combined with Induced Sleep to create anesthetic darts.
                        - Magnetic: The Power combines with Magnetism to produce missiles with Power rank Intensity Magnetism. These can do Power rank damage to magnetic recordings or delicate electronics, and can attract any iron in the target site (guns, for example).
                        - Ghostcasters: The Power is combined with Illusion-casting to create missiles that emit a static hologram upon hitting the target site.
                        - Vanishers: The Power is combined with Induced Teleportation to create missiles that teleport the target to a predetermined destination.
                        - Energizer: Missiles are combined with Power Transference to give the target part of the hero's other Powers.

                        Any Power in this book can be combined with this Power to create unique missiles for your character. When creating the character, the player should follow this guideline: If there is a way to combine external Powers with this Power, do it. Powers that are completely internal in their effects are exempted from this. This includes most of the Mental and Physical Enhancements and all of the Self Alterations and Detection Powers.

                        If the character is High Tech, has rolled such Powers as Hyper-Invention or Weapons Tinkering, or possesses a magical device, then the Missile Powers should be combined into a device possessed by the hero. This may be an exotic gun, a wand, or any other bit of superheroic paraphernalia the player can imagine.

                        The hero has a finite ammo supply, even if he creates the missiles as he goes. The maximum number of Missiles the hero can create per hour is equal to the Power rank number. This prevents the cliché found in bad Westerns, whereby a lone cowboy holds off the entire Apache nation with a single sixshooter. This limit also applies to Technological versions of this Power, in that the gun/wand/whatever simply overheats from repeated use.

                        There are two Nemeses for this Power. If the Power is innate to the hero, Reflection stops it. If the Power is externalized in a weapon, Induced Teleportation works by removing the weapon from the hero's possession and giving it to the opponent.            
                    Spray: #MCr7
                      Rank: Base Power Rank
                      Sprays:
                        Spray:
                          Power: ~
                          Effect: Feeble damage by choking off the target's fresh air and reducing visibility by -2CS for anyone within the cloud.
                        Accelerant:
                          Power: Fire Control
                          Effect: Increases effect of Fire up to Power Rank.
                        Fire Suppression Foam:
                          Power: Fire Control
                          Effect:  Suppresses Fire up to Power Rank.
                        Insulation:
                          Power: Fire Control
                          Effect: Power Rank Protection vs. Fire and Heat
                        Napalm:
                          Power: Fire Generation
                          Effect: Power Rank Energy Damage
                        Neurotoxin:
                          Power: Neural Manipulation
                          Effect: Chosen form of Neural Manipulation power
                        Knockout Gas:
                          Power: Sleep-Induced
                          Effect: Effect of Power
                        Smoke Canister: *Smoke_Canister
                      Reference: |
                        The hero can spontaneously create a directed cloud of gas, mist, or dust. The Spray has a range of up to one area. It has the basic properties of doing Feeble damage by choking off the target's fresh air and reducing visibility by -2CS for anyone within the cloud. The main purpose of Spray is combining it with other Powers, thereby producing unique Spray Powers for the hero. In all these cases, the range remains the same. Other factors, such as the nature and Intensity of effects, are determined by the Power that has been combined with Spray. Some possibilities include:

                        - Hallucinogenic: The Spray is combined with Image Generation to produce vivid visual images in the target's mind; these, of course, have nothing to do with reality. The target's Fighting and Intuition drop -3CS.
                        - Corrosion-proofing: The Spray combines with Catalytic Control to lessen corrosive attacks' Intensity by this Power rank number.
                        - Insulation: The Spray combines with any Energy Control to produce a coating that protects any target from that form of Energy Emission. The insulation reduces the energy attack's Intensity rank by the Energy Control's rank number.
                        - Healing Spray: This uses any of the more pleasant forms of Bio-Physical Control to produce a cloud that heals anyone in the target area who has taken damage up to -1CS.
                        - Napalm: The Spray is combined with Fire Generation and does Power rank damage.
                        - Freeze Cloud: The Spray combines with Cold Emission to do Power rank damage.
                        - Shrink Dust: The Spray combines with Diminution to reduce the size of anything in the target area.
                        - Booster Dust: The Spray combines with Power Control/Magnification to raise the Power ranks of everyone in the target area +1CS.

                        Any Power in the Ultimate Powers Book can be combined with this Power to create unique Sprays for each character. When creating such characters, the player should follow this simple guideline: If you can figure out a way to combine externalized Powers with this one, do it. Powers that are completely internalized are exempt from this rule. This includes most of the Mental and Physical Enhancements and all of the Self Alterations and Detections.

                        If a character is High Tech, has rolled such Powers as Hyper-Invention or Weapons Tinkering, or possesses a magical device, then the Spray Power should be incorporated into a device. This may be a gas gun, ring, horn, or any other piece of superheroic paraphernalia the player can imagine.

                        Example: The player rolls up the following Fire Generation, Elemental Conversion, Spontaneous Combustion, Spray, and Enchantment. She is a Humanoid, an Elf to be precise. She determines she is a magical character. The first three Powers readily combine with Spray. The player decides that the heroine possesses a magical flute which she built herself. Besides playing normal tunes, she knows three special melodies that create clouds which possess each of the first three Powers.

                        The hero has a finite amount of Spray. The maximum number of Sprays the hero can create in a 24-hour period is equal to his Power rank number. This limit also applies to Technological or Magical versions of this Power; the gasgun/flute/whatever simply clogs up from repeated use.

                        There are two Nemeses for this Power. If the Power is innate to the hero, then Reflection stops it. If the Power is externalized in a device, Induced Teleportation works be removing the device from the hero's possession and turning it over to the Nemesis.
                  Linked Powers:
                    Energy Control:
                      Fire Control: #EC10
                        Rank: Base Power Rank
                        Note: In conjunction with Spray only
                        Reference: &Fire_Control The hero can control existing flames, whether natural or Power-based. He can alter any factor involved in combustion without direct physical contact. The hero can increase or decrease the flame's Intensity up to his Power rank and reduce fire damage by his rank number. This Power includes Power rank Resistance to Fire and Heat. The most important aspect of this Power is enabling the hero to reshape flame into any form he desires. This can be used in a variety of Power stunts, as the hero develops numerous fiery constructs to perform miscellaneous deeds. Such fiery constructs do not act like normal flames. They emit less heat and consume less oxygen. Their fire doesn't spread past the outline of the constructs. In addition, they self-extinguish rapidly upon cessation of this Power. Optional Powers include Fire Generation, Thermal Control, Energy Sheath, and Energy Body.
                    Energy Emission:
                      Fire Generation: #EE4
                        Rank: Base Power Rank
                        Note: &Missiles_or_Spray-Only In conjunction with Missiles or Spray only
                        Reference: &Fire_Generation |
                          The hero can project fire with Power rank damage and range. These flames have no apparent fuel source and spring from the hero as if he were a living fuel tank. Although the flames' fuel comes out of the proverbial nowhere, free oxygen must be present for the Power to function. If not, the hero can cause a single flame that lasts' only one turn, then fizzles out. At Shift X rank, the hero gains the ability to generate oxygen as well, permitting this Power to function under any conditions. When creating the hero, the player can choose the Powers of Flame Control, Energy Sheath, and Energy Body to fill any slots still open. For example, under the Ultimate system, the Human Torch possesses three powers: Fire Generation, Fire Control, and Energy Sheath.

                          This has to be the most dangerous Power around. Heroes have to watch out for accidental firestorms. They also tend to consume all the oxygen in their location, making everyone pass out. Then there is the question of smoke and gases created by the hero's Flame Power. It makes me wonder what kind of ventilation system the Baxter Building has…

                          Fire Generation is the opposing Power to Cold Emission, Coldshaping, and Powers that use water. This Power gains +1CS when fighting these Powers. It also loses -1CS when being attacked by those Powers.
                    Lifeform Control:
                      Neural Manipulation: #L12
                        Rank: Base Power Rank
                        Note: *Missiles_or_Spray-Only
                        Reference: |
                          The hero can alter a target's neural activity. By changing nerve messages within the target's body, the hero can cause a variety of effects.

                          - Disruption: The target's body loses all sensations: it falls to the ground, a limp, numb mass of flesh.
                          - Paralysis: The target body becomes completely rigid. No chemical can counteract the paralysis while the Power is in effect.
                          - Seizure: The target's muscles spasm uncontrollably for as long as the Power is in effect.
                          - Exaggeration: Nerve signals are actually amplified, causing the target to overact when attempting any movement.

                          Normally, a hero can select any of these effects. When creating the hero, the player can choose to specialize in one effect for a benefit of +2CS. Note: This Power only affects the voluntary muscles; it does not affect the autonomic nervous system which controls the heart, lungs, and other automatic bodily functions. The range and duration of this Power are determined by its rank. Suitable distances are shown on column A of the Range Table. The Power normally affects only a single person; affecting more causes a decrease in duration of -1CS per additional person. The target's mind and senses are unaffected by the Power: the victim knows full well what is happening (even if he doesn't know why it's happening to him). The Power can reach across the dimensional barriers if it is combined with some way of breaching the dimensions. It can function normally if both hero and target are within another dimension.
                      Sleep-Induced: #L18
                        Rank: Base Power Rank
                        Note: *Missiles_or_Spray-Only
                        Reference:
                          This is a nice, simple, straight-forward Power that is hardly ever used in any comic because it's not terribly dramatic. Nor is it exactly cricket. The hero has the ability to put any target into a deep sleep, from which he cannot awake while the Power is in effect. During this induced sleep, the target is completely helpless (see what I mean about not being cricket?). On the other hand, when you're facing 325 battle-crazed Skrulls, this Power can be really handy.

                          The Power rank determines the range and duration of the Power. Relevant distances are shown on column A of the Range Table. It affects everyone within range. Sleep persists for 1-10 hours after the Power's duration. During that time, the victim can be awakened by anyone, but he'll wake up naturally in any case.
                Power Control:
                  Energy Source: #PC5
                    Note: The Model II is able to operate continuously from a power source such as a Sentinel Battlesuit Model II, or a high voltage main or generator, or use a power pack.  
                    Source:
                      - Sentinel Battlesuit Model II: Unlimited operation, but limited to Power Rank of variant, e.g. a Guardian Integrated Multipurpose Weapon Mk. 3 will only produce Mk. 2 Power Rank output connected to a Mk. 2 suit.
                      - Grid Power: High voltage main unlimited operation as Mk. 2 Battlesuit
                      - Power Pack:
                          Uses:
                            Mk. 0: 20
                            Mk. 1: 10
                            Mk. 2: 9
                            Mk. 3: 8
                            Mk. 4: 6
                      - Power Rooms:
                          Remarkable: Unlimited operation as Mk. 1 Battlesuit for 12 hours before refuel, Mk. 2 at +1CS Package Quality Cost Modifier, Mk. 3 at +1CS Package Quality Cost Modifier 
                          Incredible: Unlimited operation as Mk. 1 Battlesuit for 24 hours before refuel, Mk. 2 at +1CS Package Quality Cost Modifier, Mk. 3 at +1CS Package Quality Cost Modifier
                          Amazing: Unlimited operation as Mk. 1 Battlesuit, Mk. 2 at +1CS Package Quality Cost Modifier, Mk. 3 at +1CS Package Quality Cost Modifier
                    Reference: |
                      The hero draws his Powers from a special source that provides him with all the energy he can handle. As long as the hero can maintain his link with this source, he can continue to use his Powers. The nature of the source and its link varies with each hero. If the source is small enough, the hero may be required to carry it with him. If not, perhaps the hero needs to periodically return to the source or forge an ethereal Power cord that links him to his Source despite any intervening distance. The Judge and player need to work together to produce a playable source and link.

                      If the link is severed or the source destroyed, the Mage is left with a finite supply of energy left. The amount of raw Power left is the number of points equal to his Psyche rank. Each time he uses Power, he decreases the reservoir by that Power's rank number. Obviously, it is within the hero's best interests to renew his link or rebuild his source in as little time as possible.

                      As you are beginning to suspect, this isn't really a Power and is more of a restraint. You're right. If you roll this Power, go ahead and roll an additional Power.
          Warden Tactical Staff: &Warden_Tactical_Staff
            Description: A telescoping/collapsible alloy pole with a retractable blade at the end. May be used as blunt (Club, Boomerang) or edged (Knife, Sword, Spear) weapons in either extended or collapsed positions, and thrown in any configuration. Two may connect end-to-end with the blades retracted to form a longer pole. A user with the Thrown Weapons or Throwing talents knows how to throw them so they arc or ricochet to return to their hands when thrown, whether they hit or miss, by making an Agility FEAT. A coiled spring and compressed air system allows the blade to be launched as if it were a crossbow or speargun. It's an integrated combination of existing items (Crossbow, Spear Gun, Knife, Spear, Club, Boomerang).
