          Magic:
            Character Type:
              Magic Wielder: &Magic_Wielder A character able to use spells. Such characters may also be called magicians, sorcerers, wizards, enchanters, etc.
            Magic School:
              Scientific Magic: &Scientific_Magic |
                This is a school that has no particular philosophy or ethical background. Magic is regarded not as a way of life, but rather as a tactic used to attain one’s goal. Followers of this school are seldom spellcasters themselves, but rather combine elements of magic with obscure or highly advanced forms of science to create effects that seem magical. In this school, the distinction between science and magic is never clear; either or both could be used to produce a single effect. Alchemy is the best example of a semi-magical science. The character, such as Diablo, would be an alchemist, that is, he brings about his effects through the use of potions, powders, and pills he himself creates (sometimes through materials or energy tapped from dimensional or universal sources). A scientific sorcerer is somewhat vulnerable (his items and creations can be destroyed or stolen, robbing him of power; or he could run out of items whereas spells are usually always available). However, a scientific spellcaster is somewhat less restricted in what he can accomplish (add three more spells, 2 of Personal energy and 1 of Universal energy to his capabilities, in artificial forms, of course).

                The time required to gather materials and create new items, powders, potions, or tablets are left to the Judge and depend on the spell, how strong it is and what its effects are. It is suggested that items with effects of Remarkable rank or less can be created at the rate of 2 per day, while items up to Amazing rank can be produced at the rate of 1 per day. The creation of items with greater effect, or the creation of any permanent item requires the equivalent of a ceremony and must be handled by the Judge.

                A scientific magic wielder begins his career with access to his master’s laboratory, which is stocked with equipment whose cost in resource points equals at least 20 times the master’s Psyche rank number. The magic wielder can use his master’s lab as long as the master agrees. If the student wishes to set up his own lab, he only needs to spend 10 times his Psyche rank number in resource points for equipment (the master makes up the difference). The Judge should use the guidelines on ceremonies and ceremonial areas to handle the creation of items in laboratories.

                A scientific magic wielder automatically receives one scientific talent of his choice (such as engineering, biology, genetics, physics, etc.) in addition to any other talents he may normally receive. The automatic talent received by alchemists is pharmacy (the mixture and preparation of medicines).

                Scientific magic is a “neutral” school, and no special bonuses or vulnerabilities apply to it.
              Note: Julian makes use of actual sorcery as well as alchemy, artifice, technomancy and such, liberally substituting and alternating.
            Energy Use:
              All Energies: All Energies indicates that the character is able to use all of the spells.
            Rank:
              Master: The character possesses at least 12 spells. He has a spell rank of at least Excellent in all of them and Incredible or better in at least four of them. He spends very little time with his master, but much of it in contemplation, study, and adventuring. If he qualifies, he may find a student of his own to teach. His studying of the writings of the ancient arts gleans him more information than any other source.
            Master: Many, but none living.
            Spells:
              Personal Energies:
                Admittance:
                  Rank: Amazing
                  Number: 50
                  Reference: &Admittance The caster can direct enchanted energy at any locked door or container and it will easily open for him, no matter how many locks it has or how big or intricate they are, if his spell rank FEAT roll is successful.
                Apparition:
                  Rank: Amazing
                  Number: 50
                  Reference: &Apparition |
                    The caster can mystically make his body non-corporeal and become an apparition. (This should not be confused with Astral Projection, as that power takes the caster to another dimension and he is invisible to most characters in this dimension.) Once the spell is cast, the caster need not concentrate upon his state to remain an apparition. As an apparition, the caster can still move, speak, cast spells, and perform most other normal actions. His movement rate is the same as if he were corporeal, but he can walk on air, sink through floors, climb up elevations as if he were climbing stairs, etc.

                    When a caster becomes an apparition his body loses its density, allowing him to pass through solid object and letting solid objects pass through him. The caster can be seen, but is obviously not completely solid. This power grants the caster body armor equal to the spell rank against any physical, energy, or mental attacks. If the apparition/caster physically attacks another character, that character must also be treated as though he has body armor equal to this spell rank. Magical, mental, or energy attacks against the target are treated as normal.

                    To pass through a solid object, or have a solid object pass through him, the object’s material rank must be equal to or less than the spell rank. In addition, the caster can lower the density of an object he touches by making a spell rank FEAT roll and, if succeeding, keeping it in his possession.

                    Judge’s Note: If the player wishes to make a concentrated effort at creating a character who appears like a ghost, striking fear and terror into criminal hearts, then the Judge should keep this effect in mind when the caster walks through a wall, drops through a ceiling, etc. and faces anyone. A character encountering this apparition, especially for the first time, must make a Psyche FEAT roll (see Magic Effects Table) or react as described in the Fear power. There is a price the caster has to pay for this extra “power”, however. This frightening effect on people only works if the caster is not famous, thus cutting off his Popularity and some sources of Karma gain. He must remain relatively reclusive and unknown so the criminal element does not recognize him.
                Astral Projection:
                  Rank: Amazing
                  Number: 50
                  Reference: |
                    The caster can separate his astral self-the sheath of his life essence-from his physical self and travel through space unbound by physical laws while retaining human consciousness. The astral form (also sometimes called the ethereal form or the ectoplasmic form) is invisible, intangible, and incapable of being harmed except by the most powerful magic or by opponents who are themselves in astral form. If the caster wishes to project his astral self while under duress, during a combat or while he is being mentally attacked, he must make his spell rank FEAT roll.

                    The duration of effect determines how long the caster can remain in this form without physical deterioration occurring to his physical form. If the astral form does not return to its physical body before the duration of effect has elapsed, the caster’s body dies; and the astral form can only enter it as it would any other corpse or dummy, creating a blind, zombie-like creature. If the caster’s body is destroyed while the astral form is projecting, the caster is stranded in his astral form.

                    If a character is stranded in his astral form due to the death of his physical body, the astral form itself will dissolve after an amount of time equal to the normal spell duration associated with the character’s Psyche rank. (For example, the astral form of a character with Incredible Psyche would endure for one day; the astral form of someone with an Unearthly Psyche would last indefinitely.)

                    The caster can transport other willing subjects to the astral plane along with himself. When attempting to do so, he must make a Psyche FEAT roll: a white or green result means that the caster traveled and the other(s) did not, a yellow or red result means that the multiple astral travel worked perfectly. Astral projection cannot affect someone against his will.

                    Characters who are in their astral forms can see and communicate with each other, if both parties desire. If one or both parties do not desire to be seen, they may have to hide behind solid items, just as if they were in their physical form. If the astral character who is seeking has a lower power rank than the astral character who is attempting to avoid being seen, he must make a Psyche FEAT roll, even if that character is in plain, astral view. If seen, they can have magical combat in that form.

                    Magical items, though left behind on the physical plane, also have a counterpart that can be taken into the astral plane. It acts in the same manner as its physical counterpart, but its powers are lessened by one rank on the astral plane. Any magic item that the character possesses on the physical plane can be controlled by the owner’s astral self. (For example, Doctor Strange has escaped innumerable traps by controlling his Cloak of Levitation and the Eye of Agamotto within his amulet, while he was in his astral form.).

                    Time alteration spells cast from the astral plane work within the physical plane, but do not affect the astral plane.
                Enchanted Eye:
                  Rank: Amazing
                  Number: 50
                  Reference: |
                    The caster creates an enchanted eye when he wishes. The caster can automatically summon the enchanted eye for one round only. A successful spell rank FEAT roll brings the eye forth for the full duration of the spell. It can only see as far as sight normally would, but can penetrate darkness (real or magical), show the caster mystical existences (such as astral projections, invisible magical objects, mystical shields, and so on), and see through illusions. The caster is mentally linked with the eye and sees everything it sees.

                    The enchanted eye is a separate magical creation capable of flight. Its movement rate is the same as that of the caster. The maximum distance it can be be separate from the caster is based on the spell rank (for example, 12 areas for Amazing rank.) The eye can be attacked physically or magically; the eye has Health points equal to the caster’s Psyche and any FEAT roll the eye is required to make use the caster’s appropriate ability rank. The caster is not affected by any damage suffered by the enchanted eye.
                Healing:
                  Rank: Amazing
                  Number: 50
                  Reference: |
                    This spell gives the caster such complete control over his bodily functions that he can heal himself by use of personal or dimensional energy. Use the spell rank number instead of his Endurance rank number to determine the maximum amount of damage healed. The caster can only perform this once per day, in addition to his normal healing rate.
                Invisibility:
                  Rank: Amazing
                  Number: 50
                  Reference: &Invisibility |
                    This spell makes the caster invisible to others. Any item on the caster’s person and anyone holding hands with him (and willing to be affected) also becomes invisible as long as they remain in contact with him. This spell cannot turn an unwilling creature invisible.

                    Being invisible causes no special problems for the caster, but anyone else affected who is not used to being invisible will have a real problem moving about (movement halved), performing the simplest of actions (-2CS), and fighting in any fashion (-3CS for any combat). It requires at least 10 rounds of being invisible before becoming used to it.

                    Note: an invisible person can be located by persons with superhuman hearing or sense of smell, or by detection powers and devices that do not depend on sight.
                Learning:
                  Rank: Amazing
                  Number: 50
                  Reference: |
                    This spell is used to give the caster an advantage in combat. It enables him to quickly learn from his mistakes. After this spell is cast the caster must fight his opponent for three consecutive rounds (normal combat, magical combat, astral combat, etc.). When the three rounds have passed the caster suddenly has insight into his opponent’s methods of combat and receives a +1CS when fighting that opponent during this encounter only. The duration and area of effect listed on the Magical Limits Table do not apply for this spell.

                    If combat is interrupted but later resumed and the Judge is not sure whether to consider it one continual encounter or two separate encounters, the spell still applies if the caster makes a successful spell rank FEAT roll.
                Levitation:
                  Rank: Amazing
                  Number: 50
                  Reference: |
                    This spell enables the caster to mystically rise into the air. A successful spell rank FEAT roll is required. No further FEAT rolls are needed unless the caster descends to the ground, and then want to levitate again during the duration of the spell. The maximum altitude a levitating character can reach is 1 area at Good rank, with an additional 2 areas for every spell rank above Good (thus, a caster with a Remarkable Levitation spell can reach an altitude of 5 areas). The movement speed (rising or descending) per round is 1 area for a character with Good Psyche with an additional area for each Psyche rank above Good. The character cannot use this spell to lift any weight greater than his normal clothing and equipment. This spell affects the caster only.

                    The character can perform other actions while airborne, including combat, but is limited to one spell per round regardless of the type of energy (personal, universal, or dimensional). If knocked unconscious while levitated, a character will immediately fall to the ground.

                    This spell should not be mistaken for the ability to fly (see the Flight spell). Levitation only allows vertical movement. Sideways movement is only achievable by the levitating character pulling himself along an object. A levitating character cannot create forward momentum to affect the direction of his ascent. It is always straight up. While wind has no affect on a floating caster’s ascent direction, it can slow him down if the Judge feels it is strong enough.
                Mental Barrier:
                  Rank: Amazing
                  Number: 50
                  Reference: |
                    This spell creates a magical invisible headgear which does not hinder the caster’s normal senses. It allows the caster to know when someone is trying to intrude on his thoughts, magically attack his mind through mesmerism, illusion, etc. It does not indicate who is doing the attacking or intruding, nor does it reveal what spell is being used.

                    In the round following the one in which the hostile spell is detected, the caster can, secure the barrier, preventing illusions, telepathy, empathy, etc., from affecting the caster. It also protects him from magical attacks on the mind (Emotion Control, Confusion, Fear, Mental Control, etc.) by giving him a +3CS for any Psyche FEAT roll to resist the attack. While the barrier is up the caster can perform no spells that require/a great deal of concentration.

                    Treat the spell rank as body armor for the sake of defense against attempted mental penetration by non-magical powers.

                    The Judge should make sure this spell is not abused. A character who constantly has the barrier up will become easily exhausted and can even suffer Psyche loss due to the mind damaging effects of trying to always be mentally protected. The maximum safe duration rank is Excellent.
                Servant:
                  Rank: Amazing
                  Number: 50
                  Reference: &Servant |
                    The caster can summon forth his own, personal servant to do his bidding. This servant will require quite a bit of Judge’s discretion as to its nature, abilities, spell, etc.

                    The servant’s abilities are generated as for any other character. The Judge then gives it two spells, and gives it an origin appropriate to the character it serves. Various types of magical servants exist, including jinn, demons, familiars, ghosts, and the like. The servant is obedient, helpful, and useful. The caster can automatically talk to or otherwise communicate with the servant.

                    This spell cannot use human beings as servants.
                Sensing-Danger:
                  Rank: Amazing
                  Number: 50
                  Reference: The caster can scan the area of spell using mystic waves that will warn him of danger. If this spell rank is higher than the caster’s Intuition rank, use this spell rank when the caster makes Intuition FEAT rolls. If the spell rank is lower than the caster’s Intuition, increase his Intuition by one level when making Intuition FEAT checks.
                Sensing-Evil:
                  Rank: Amazing
                  Number: 50
                  Reference: &Sensing-Evil |
                    The caster can mystically sense the presence of great evil in his area of spell. This includes the presence of evil creatures (demons, evil magic wielders, super villains bent on destruction, etc.), artifacts of evil design or exceptionally evil deeds. This spell is automatic (FEAT rolls are not needed). As the caster gets closer to the source of the evil emanations, his sensing gets stronger. Thus, he can usually root out the evil if he goes looking for it.

                    If the spell duration is permanent, the spell functions constantly, even when the caster is asleep.
                Sensing-Fields:
                  Rank: Amazing
                  Number: 50
                  Reference: |
                    The caster can magically detect the presence of force fields, magical or otherwise in the area of effect. The caster must make a successful yellow FEAT to detect fields smaller than man-sized at ranges greater than five areas. At ranges of a mile or more, the caster must make a successful red FEAT to detect fields smaller than building-sized.

                    Unlike some of the other sensing spells, this spell does not require a great deal of concentration.
                Sensing-Identity:
                  Rank: Amazing
                  Number: 50
                  Reference: The caster can mystically scan the mind of anybody he can see within his area of spell and determine that person’s true identity. If the target is another magic wielder or a character with mental powers of any kind, he is allowed a Psyche FEAT roll to resist the probe. If the resistance FEAT roll is successful, he is unaffected.
                Sensing-Mystical Detection:
                  Rank: Amazing
                  Number: 50
                  Reference: &Sensing-Mystical_Detection |
                    The caster is sensitive to the use of magic. He can detect magic use and its specific source within the area of effect. Among the specific things he can detect are: magicians casting spells, magical items that are being used or that have a protective spell cast on them, magical portals, and magical creatures.

                    Unlike some sensing spells, this spell does not require a great deal of concentration.
                Tongues:
                  Rank: Amazing
                  Number: 50
                  Reference: The caster mystically alters his senses so he can read, write, speak, and hear unknown language spoken or written in his presence. The area of effect has no significance with this spell. If the language is native to his world, no FEAT roll is needed. If the language is an alien one, he must make a successful spell rank FEAT roll to be able to comprehend it.
                Trance:
                  Rank: Amazing
                  Number: 50
                  Reference: |
                    The caster has two options with this spell, he can mystically slow down or speed up his metabolism.

                    The slowed metabolism reduces the potency of any poison in his body (-3CS). The character can almost hibernate, thus lasting longer on fewer supplies in harsh climates, The character can feign death and has a chance to fool even the best doctors into believing he has died; feigning death requires a successful spell rank FEAT roll. While the caster’s body metabolism is slowed down, healing is also slower (one-half his Endurance rank number per day).

                    The accelerated metabolism speeds up medicinal drugs injected into the caster’s system, thus doubling the effects of healing. He can feign a fever, heart attack, and other maladies.

                    Once the character has started his mystical trance he cannot move or do any action except concentrate. He can come out of the trance whenever he desires, but it takes 2 rounds for his body to return to full consciousness.
              Universal Energies:
                Conjure:
                  Rank: Amazing
                  Number: 50
                  Reference: |
                    This spell is used to teleport an item, plant, creature or character from its current location to the caster’s location. This spell can even restore a broken or decayed item to its original form while in the act of teleporting.

                    If conjuring a trivial item, plant, or harmless animal, the caster need make no FEAT roll, it simply appears.

                    If conjuring a complex or dangerous item, plant, or dangerous creature, or attempting to conjure a broken or decayed item, the caster must make a successful spell rank FEAT roll before it appears.

                    If conjuring forth a willing character (teammate, friend, etc.) the caster must make both a successful spell rank FEAT roll and a successful Psyche FEAT roll before the character appears.

                    If conjuring forth an unwilling character, the caster must make a successful spell rank FEAT roll. The subject is allowed a Psyche FEAT roll to resist being brought forth; if the resistance FEAT is successful, the conjuration fails.

                    The conjuration of the body of a dead character is far beyond the abilities of any caster who does not have an Unearthly spell rank in this spell. The conjure spell only summons or recreates the physical body; however, if the dead character’s astral form survives (see the Astral Projection spell), it can reanimate the body, restoring it to true life.
                Healing-Others:
                  Rank: Amazing
                  Number: 50
                  Reference: |
                    The caster can magically heal other characters by using universal or dimensional energy. The caster must touch the character for two consecutive rounds after casting the spell. A successful spell rank FEAT roll is required. The, maximum amount of damage that can be healed per person is the spell rank number. Any individual character can only be healed once per day by a specific caster. The number of different characters the caster can heal per day is equal to the spell rank number divided by 10 (round fractions up). If the player so desires, this spell could be used to heal a creature instead of a character.

                    The healing is complete, including the mending of broken bones and torn cartilage. The spell is also effective against disease.
                Illusion:
                  Rank: Amazing
                  Number: 50
                  Reference: |
                    This spell creates an illusion in the mind of creatures within the area of effect. The player whose character is using this spell must describe it to the Judge. The illusion looks, sounds, and smells the way it would if it were real, but cannot cause damage. Since the illusion exists only in the mind of the targets, no one outside the area of effect can see it. All characters in the area of effect see the same illusion. The caster must concentrate on the illusion for the entire duration of its existence to be believable.

                    Each character seeing the illusion may make a Psyche FEAT roll to disbelieve it at the beginning of the illusion and every other round after that. If the FEAT roll is successful, the illusion fades from his mind. Other characters with illusion creating powers, whether magical, mutant, or whatever, receive a +2 Column Shift to their attempts to disbelieve. An unaffected character cannot persuade an affected character of the illusion’s true nature.

                    Characters who are affected will act as they normally would if the illusion were real. If characters attack an illusion, attacks will not affect it (although the caster could make it seem otherwise); the Judge will have to keep track of the attacks because of the possibility of injury to bystanders or property. Items passing through an illusion may look like they are absorbed by it, like he side-stepped it, or whatever else the caster desires.

                    If the illusion is of something silly, confusing, or extremely contradictory, then the Judge should secretly roll an Intuition check for those affected to disbelieve it.
                Revival:
                  Rank: Amazing
                  Number: 50
                  Reference: |
                    The spell counters the effects of other spells that preventing a character from acting or thinking with complete control. Spells that can be countered by a Revival spell include Mesmerism, Emotion Control, Confusion, Fear, Illusion, Charm, Mental Control, Paralyze, Forgetfulness, and the like.

                    If the spell rank of the Revival spell is stronger than the spell rank of the controlling spell, then the controlling spell is automatically broken. If the spell ranks are equal, a successful spell rank FEAT roll is needed to break the spell. If the holding spell is a higher spell rank than the Revival spell, then the caster must make a successful spell rank FEAT roll to break the spell subtracting as many ranks from his spell’s normal spell rank as the holding spell exceeds it.

                    A Revival spell can only be used against a specific spell enthralling a specific character once a day.
                Teleportation:
                  Rank: Amazing
                  Number: 50
                  Reference: &Teleportation |
                    The caster can channel his Universal or Dimensional energy into a special type of movement that allows him to travel instantaneously from one spot to another without physically crossing any of the space between. The caster can teleport as far as his area of effect allows. If the caster is familiar with the location he is teleporting to, or is able to see it, then he need make no FEAT roll. If he is attempting to teleport into an unknown location he must make a spell rank FEAT roll. A failed roll means he could not complete the movement and was “bumped” back to his original point of departure.

                    If a caster tries teleporting into a solid object (because he is unaware of its presence) he must make an Endurance FEAT roll; if this roll fails, he materializes outside the object but suffers damage equal to the material rank of the object. The character is automatically slammed (1 area) and may be stunned (make a FEAT roll for exact result).

                    The visual effects that accompany teleporting (vapors rising, flash of light, slow fade out, etc.) are up to the player.
              Dimensional Energies:
                Environmental Independence:
                  Rank: Amazing
                  Number: 50
                  Reference: |
                    The caster can surround himself with an aura of magic that maintains a livable environment for him. He does not need to sleep, eat, drink, or breathe, but can if he wants to. He feels no non-magical cold or heat and can survive in outer space, under water, within the earth, in hostile atmospheres, etc. This spell does not provide protection from or immunity to attack, but it does allow the caster to survive in conditions where survival would normally be impossible. The area of spell is usually just around the caster himself, though the aura can contain an additional character for every rank of the caster’s Psyche above Remarkable.

                    This is a particularly long-lived spell, often used by magic wielders stranded in hostile circumstances or alien dimensions. The duration of this spell is left to the Judge, as different conditions and circumstances (time passage in other dimensions for example) can affect the duration. It is suggested that the caster receive a +3CS on the duration of the spell. (For example, the spell would have a Unearthly duration for a caster with an Incredible spell rank.) An Unearthly duration means that the spell lasts indefinitely, usually until the caster escapes from the hostile conditions that caused him to cast the spell.
                Dimensional Aperture:
                  Rank: Amazing
                  Number: 50
                  Reference: |
                    This spell causes a temporary opening in the dimension’s fabric, allowing the caster to cross from one dimension to another. Look for the section on Dimensions in the Miscellany of Mysticism for more detail. The caster can automatically open a portal to a dimension with which he is familiar, but opening a portal to an unfamiliar dimension requires a successful spell rank FEAT roll. If a FEAT roll is required, failure indicates that the caster cannot enter the desired dimension that day A beginning caster who does not really know one dimension from another can stumble into any one of them at random.

                    A spellcaster who is in a familiar foreign dimension can automatically return to his home dimension. However, if the caster is in an unfamiliar dimension or if his mind has been affected by traveling in a sanity-bending or sanity-threatening dimension, the caster must make a successful spell rank FEAT roll to locate the dimensional position of his home dimension. This roll to return is only allowed once per week. However, the caster can enter another random dimension and try to go home from there.

                    If the caster tries to take anyone else with him into a dimension, whether they are willing or unwilling, then a Psyche FEAT roll is required of each character passing through into the dimension, every time they enter a new dimension. Anyone who fails the FEAT roll cannot pass through that particular dimensional aperture at this time. Characters who are left behind can try again a day later, if the aperture is still in effect.

                    This spell also grants the caster knowledge of a tiny “personal dimension” where he can go with perfect accuracy and safety. This pocket dimension is only accessible from the caster’s home dimension and contains no dangerous creatures. There the caster can go for peace, solitude, and can even make it a home away from home. The caster can enter or leave his own little dimension once per day.
      Equipment:
        Vehicles:
          Convertible Sports Car:
            Type:
              Road: &Road Road vehicles are those designed primarily to be driven on relatively flat surfaces (like roads), and include most vehicles found in modern cities. Road vehicles suffer penalties for Control and Speed when off-road (like cutting through the park in your luxury limo)
            Control: Excellent
            Speed: Remarkable
            Body: Poor
            Protection:
              Top Down: Feeble
              Top Up: Poor
            Reference:
              - Sports Car: &Sports_Car Sports Cars include most of the jazzy little numbers the detectives on TV zip around in. They have a higher safe speed and better control than the family car, but are made of lighter materials and more easily damaged. Sports cars carry two normally. three or four with crowding (the Trans Am back seat is not designed for the human form).
              - Convertible: A Convertible is a sedan with a top that folds down. With the top up, it has similar protection to a sedan. Include cars with T-top roofs as well in this category.
        Sundries and Other Equipment:
          Personal Computer:
            Price: Excellent
            Reference: &Personal_Computer The Personal Computer listed here is the type commonly available to most Americans and is a tool, not an artificial intelligence, unlike some more powerful computers. The personal computer may be considered to have Poor Reason for problem-solving, analysis, etc. as it is only as smart as the information placed inside it. At Excellent Cost, the user can get a modem that links his machine into a net with other machines.
          Purchased Suit or Tux: Multiple
          Mystic Texts: &Mystic_Texts  Mystic Texts is a blanket term for those less-powerful magical books that mages acquire to aid them in their work.
        Magical Items:
          Hermetica:
            Description: A sturdy tome of gilt-edged, finest vellum, bound in solar-motif tooled and embossed leather over cedar board with heavy leather strap, closed with a gilded brass buckle, large, gilded brass corner protectors, silk cord headband and tailband, and many sewn in bookmarks of brocaded silk.
            Reference:
              Grimoire: &Grimoire
                Reference: The book in which a mage records spells or incantations. Some spells, like many Entreaty spells, cannot be memorized, only read aloud from a text. A character can only have two grimoires at any one time, the primary and a back-up copy. Creating takes 10+1d10 full days of work
          Hēlios Mégistos:
            Description: |
              A richly-stained boxwood staff, bound and shod in gilt bronze: rings inlaid with blue paste glass along the shaft, a solar-motif finial cap bearing peridots, sunstones, and garnets, and a spike at the butt. The finial supports a gold icon of Sol Invictus in an adlocutio pose, palm foward, topping the staff.
            Material Strength: Excellent
            Type: Blunt Attack
            Reference:
              Staff of Polar Power: |
                  This is actually a class of staves. They can come in any shape or material and range in size from 4 to 8 feet long. A Staff of Polar Power polarizes the holder with the power of the master who created it. Therefore different powers and different levels of mastery are engrained into each staff and no two are alike. All Staves of Power allow the character to become pure energy for the purpose of floating through dimensions. In such form a character can move through dimensions at a rate of 5 dimensions per round and ignore all physical attacks. Another quality of most Staves of Power is their ability to absorb attack spells cast at them (see Magic Effects Table, Agility & Targeting). An Agility FEAT roll of a bull’s-eye indicates the character has intercepted the spell with his staff).

                  This item offers the Judge a great opportunity to be creative and is a good item to improve a freshly generated character who is weak.
            Magic:
              Spells:
                Personal Energies:
                  Resistance Aura:
                    Rank: Amazing
                    Number: 50
                    Type:
                      Solar: Resistance to sun stroke, sunburn, light attacks, and solar radiation.
                      Heat and Flame: Resistance to fire, flames, and natural or artificial heat sources.
                    Reference: |
                      The caster surrounds himself with an invisible magical aura that protects him against a specific type of hostile environment or condition. The spell rank is treated as body armor against the hostile effect.

                      The following are the most common kind of resistances.

                        - Atmospheric: Resistance to the effects of all types of gases, spores, and airborne microbes.
                        - Cold: Resistance to the effects of cold.
                        - Corrosives: Resistance to acids and corrosives of all types.
                        - Electricity: Resistance to damaging electrical currents and lightning.
                        - Heat and Flame: Resistance to fire, flames, and natural or artificial heat sources.
                        - Poison: Resistance to all types of natural and synthetic poisons.
                        - Radiation: Resistance to a specific type of radiation, such as gamma rays or cosmic rays. The player and Judge should agree on a useful resistance.
                        - Solar: Resistance to sun stroke, sunburn, light attacks, and solar radiation.
                        - Sonics: Resistance to all types of damaging sonic waves and sounds.
                Universal Energies:
                  Eldritch Beams/Bolts:
                    Rank: Amazing
                    Number: 50
                    Type:
                      Light Bolt: This bolt causes damage through intense light. The bolt is golden.
                      Fire Bolt: This bolt causes fire and heat damage and is a reddish line of flame.
                    Reference: |
                      This spell unleashes a magical beam or bolt causing damage equal to the spell rank (a beam is a continuous line of energy, a bolt is an interrupted line of energy). A beam or bolt (hereafter referred to as bolt) affects only one target in the target area. When this spell is obtained, the player should roll a die to see where the bolts originate. The bolts will issue forth from the character’s: 1-4 = Hands; 5-8 = Eyes; 9 = Chest; 10 = Forehead. The type of bolt the character uses will be one of the following, which the player chooses with the approval of the Judge.

                        - Cold Bolt: This bolt causes freezing damage and is blue.
                        - Darkforce Bolt: This bolt uses the Darkforce, a form of energy from another dimension. The target loses Health points equal to the caster’s spell rank. The bolt is black. (This bolt requires dimensional energy; it is not available to characters unable to use dimensional energy.)
                        - Disintegrating Bolt: This bolt disintegrates non-living, inanimate objects up to 2 areas away from the caster. The limit of what it can disintegrate is determined by the spell rank. Compare the spell rank to the material rank of the object to be disintegrated.
                          If the material rank is higher than the spell rank, the target’s material strength is reduced one rank.
                          If the material rank is equal to or less than the spell rank, the target is disintegrated. Small objects (fist-sized, for example) can be destroyed automatically. Destroying man-sized objects requires a successful yellow spell rank FEAT roll. Destroying larger objects (like a vehicle) requires a successful red FEAT roll. If the target is an object of no importance, the Judge can waive the FEAT roll and rule that the item is automatically destroyed.
                        - Energy Bolt: (Also commonly called Bolt of Bedevilment.) This bolt uses pure universal or dimensional energy This is the most common form of eldritch bolt.
                        - Fire Bolt: This bolt causes fire and heat damage and is a reddish line of flame.
                        - Impact Bolt: This bolt causes impact damage through reverse gravity, magnetism, etc. The bolt is invisible.
                        - Light Bolt: This bolt causes damage through intense light. The bolt is golden.
                        - Sonic Bolt: This bolt causes damage through sonic disruption, nerve damage, etc.
                  Energy Control:
                    Rank: Amazing
                    Number: 50
                    Type:
                      Solar: A hero with this spell can redirect, magnify, or diminish the natural light in the area of the spell. A blinding flash can cause damage in that area equal to the spell rank number and temporarily blind a victim. A light barrier does not defend against damage, but no one can see through it and it scares off unintelligent animals and creatures.
                    Reference: |
                      The caster can use his personal, universal, or dimensional energy to control another type of nonmagical energy (not personal, universal, or dimensional). This energy manipulation requires a successful spell rank FEAT roll. Only one type of energy can be chosen by a beginning caster, but with advancement he may learn to control other forms of energy.

                      The caster can affect all of the individual type of energy within his area of effect with ease: turning it on or off, making it overload, siphoning it where he chooses, etc. He can channel controlled energy around himself so as not to be harmed by it.

                      The caster must make a successful red spell rank FEAT roll to use this spell offensively. The attack must be made by touch, no matter what the spell rank. The damage caused equals the spell rank number.

                      The caster must make a successful yellow or red spell rank FEAT roll to use this spell defensively.

                      The following energies the ones most often affected by this spell. (The Judge can add others as desired.)

                        - Darkforce: The Darkforce is a semisentient force from another dimension. It can be used to black out an area so completely that even infravision does not work. It cannot be used as a weapon outside of the area the character is occupying, but within that area anyone enveloped by the Darkforce (except the caster) loses Health points equal to the caster’s spell rank number each round. Controlling the Darkforce requires that the caster use dimensional energy; this form of control is not available to casters who cannot use dimensional energy.
                        - Electrical: The caster can absorb and redirect electrical energy. One of the best uses of this spell is as an electrical override. The caster can direct electrical spells to override the controls of electrical equipment, including computers, alarm systems, and unshielded robots. He can either take control or damage this equipment. The ability of control is equal to the spell rank.
                        - Gravity: The caster can reverse or intensify gravity at will. The spell can be used to move objects (use the spell rank as the caster’s Strength). A character with this spell can do two gravity related actions at once. When used as an attack. the caster uses the gravitational forces to seize the target in a grappling-like attack. The grappling force starts with Typical Strength, but the caster can automatically increase the strength by one rank each round, up to the spell rank. This requires concentration on the part of the caster (no attacks or other spells cast while the gravity attack is in effect). The target must make a successful Strength FEAT roll to escape the effect.

                          Reverse gravity can only be lowered to Shift 0, whereby the target can float a few feet above the ground.
                        - Magnetism: A caster with magnetic control can manipulate any items that contain iron or steel within the area of the spell. He can also manipulate the Earth’s magnetic field and use it to control iron or steelbearing items, anchoring them to the ground or twirling them like a top, or create a magnetic force shield with an armor rank equal to the magnetic control spell rank.
                        - Solar: A hero with this spell can redirect, magnify, or diminish the natural light in the area of the spell. A blinding flash can cause damage in that area equal to the spell rank number and temporarily blind a victim. A light barrier does not defend against damage, but no one can see through it and it scares off unintelligent animals and creatures.
                        - Sonics: This spell can amplify sound in an area to the point where everyone except the caster is temporarily deafened. This is particularly distracting for magic wielders using dimensional spells and incantations (successful yellow Psyche FEAT roll required to cast a dimensional spell; see Distractions in the MAGIC USE AND COMBAT Section). The caster can also reverse the effect to completely “dampen” an area so that no sound can be heard whatsoever, including sonic weapons.
                  Healing-Others:
                    Rank: Amazing
                    Number: 50
                    Type:
                      Solar: A hero with this spell can redirect, magnify, or diminish the natural light in the area of the spell. A blinding flash can cause damage in that area equal to the spell rank number and temporarily blind a victim. A light barrier does not defend against damage, but no one can see through it and it scares off unintelligent animals and creatures.
                    Reference: |
                      The caster can magically heal other characters by using universal or dimensional energy. The caster must touch the character for two consecutive rounds after casting the spell. A successful spell rank FEAT roll is required. The, maximum amount of damage that can be healed per person is the spell rank number. Any individual character can only be healed once per day by a specific caster. The number of different characters the caster can heal per day is equal to the spell rank number divided by 10 (round fractions up). If the player so desires, this spell could be used to heal a creature instead of a character.

                      The healing is complete, including the mending of broken bones and torn cartilage. The spell is also effective against disease.
                  Shield-Aura:
                    Rank: Amazing
                    Number: 50
                    Reference: The caster surrounds himself or another character with a shining aura that acts as body armor against all forms of attack. It does not hinder the caster in any way. An aura shield has an armor rank equal to the spell rank -1CS. If it is hit by an attack with a higher power rank it is shattered and disappears, though no damage reaches the caster during that round. Only one aura shield can surround a character at any given time.
                  Vapors-Resist Death:
                    Rank: Amazing
                    Number: 50
                    Type:
                      Solar: A hero with this spell can redirect, magnify, or diminish the natural light in the area of the spell. A blinding flash can cause damage in that area equal to the spell rank number and temporarily blind a victim. A light barrier does not defend against damage, but no one can see through it and it scares off unintelligent animals and creatures.
                    Reference: |
                      The caster can conjure forth magical vapors, which pour out from around his feet, hands, or just suddenly begin to swirl in the air (caster’s discretion). These vapors will only cover one individual the caster chooses within the area of spell. This character must be dying or dead for no more than 2 rounds when the spell is cast. These extremely powerful vapors will bring the character up to 0 Health points and keep him there (if he has died) or will freeze him at the level of his current Health and Endurance. This “freezing” of the character will last for the duration of effect and allows for time to treat his wounds or the condition which is killing him (taking him to a hospital, applying spells that heal, etc.)

                      Once applied, these vapors wrap the target in a black, swirling shroud. The target remains unconscious while in the vapors.

                      The caster can dissipate the vapors at will. Once gone, by the caster’s will or at the end of the duration of spell, the character starts dying and must follow the procedure on page 11 of the MARVEL SUPER HEROES Game Battle Book.

                      If the character the caster is trying to save has been dead for over 2 rounds, but less than 3 hours, the caster can try to create a special, potent vapor which will have the same effect as described above. To create this special vapor requires the caster to make a spell rank FEAT roll and deduct one rank from his Psyche (for a week) whether he succeeds in the spell or not. The caster can keep attempting this spell, but must deduct the Psyche rank each time he tries. If his Psyche rank drops to Feeble or below, due to the exercising of this spell, he permanently loses a Psyche rank.
          Leonidas:
            Reference:
              Familiar: &Familiar Familiar indicates a being that is very powerful magically and actively assists the hero. Two powers should be rolled randomly or selected by the Judge from the personal and universal energy lists for this familiar. In addition, the familiar is intelligent (Reason and Psyche at least Typical) and can communicate with its owner (the kind of communication is left to the Judge’s discretion). The form of the familiar can either be that of a normal animal (usually a cat) or an unusual type, such as a small dragon or other mythical creature. The familiar’s form is at the player’s discretion.
          Interdimensional Scanner: While this is not a mystical item, it is used to monitor dimensional nexus and scan dimensions that are near Earth. This room-sized piece of high-tech equipment was designed by Roger Bochs, who first created Box of Alpha Flight fame. He was assisted in its creation by Shaman. Imaging of these dimensions is often hazy, showing only the outlines of larger creatures, structures, and so forth. It is with this device that the Alpha Flight team unwittingly brought the Incredible Hulk back to the Earth dimension from another dimension where Doctor Strange had banished him for the good of mankind, and the Hulk’s own sake. Any use of this device to scan and observe another dimension requires a successful Reason FEAT roll.
        Custom Equipment:
          Guardian Integrated Multipurpose Weapon:
            Model I:
              Mk. α: &Guardian_Integrated_Multipurpose_Weapons_Model_I_Mkα
                Description: |
                  The Guardian Integrated Multipurpose Weapon Model I Mk. α, also known as the Guardian Blaster, is a handheld combination weapon with utility functions.  It fires handgun bullets with the precision of a match-grade target pistol with an integrated silencer, gyrojet rockets, shot shells, canister rounds, and laser, concussion, and stun beams. It features integral optics that are night-vision capable.  Additionally, it has utility features comprising a standard intensity and high intensity flashlight system for illumination or blinding, a foam projector to extinguish fires, tear gas spray, and a flare launcher. Beam types are selectable on the fly from a power pack. Other weapons' ammunition are treated as types of ammunition that must be switched out and it can only load and fire one at a time, as does the Variable Pistol; the loading and firing mechanisms are in large part integral to the magazines. Other features such as the flare gun, fire extinguisher, and mace are all present together with everything else, but must be reloaded after a single use.
                  
                  It's an integrated combination of existing weapons (Variable Pistol, Target Pistol, Gyrojet Pistol, Laser Pistol, Concussion Pistol, Stun Pistol, Shotgun, Riot Gun) and items (Fire Extinguisher, Silencer, Sniper Sights, Infra-Red Sights, Flashlights—Normal and Halogen, Mace, Flare Gun).
