                      - Coldshaping: #EC3
                          Reference: |
                            The hero can control any force that actively decreases the temperature of something else. This can be used to increase or decrease the Cold's Intensity by this Power's rank number. This function overlaps both Heat and Cold Generation but differs in that this Power cannot alter the natural temperature of a target or alter local temperatures to suit the hero's whims. There are two primary functions to this Power. The first is to counteract or supplement cold-based Powers. The hero can alter such Powers as soon as they are emitted from the target's body. Such powers can be increased or decreased by this Power's rank number. The hero can also redirect such Powers. This leads to the second primary function.

                            The hero can shape fields of intense cold and produce useful results. Ice Generation is a form of this Power. The hero can create shapes of rapidly-formed ice that he can use in a variety of Power stunts. The hero can also develop variations on Ice Generation that use other materials present in his local atmosphere. Such substances include carbon dioxide (even more slippery than ice, and the fog can knock people out), nitrogen, oxygen (potentially dangerous since a concentration of it can make normal flames explode with +2CS damage), and the inert gases (an Amazing Intensity FEAT, since there are so few of these present in Earth's atmosphere-but on other planets, not so tough). Cold Generation is a Bonus Power.

                            Optional Powers include Thermal Control, Condensation, Molding, and Body Coating.
                      - Electrical Control: #EC5
                          Reference: |
                            The hero can control all forms of electricity, whether natural, artificial, or Power-based. He can control the Intensity and direction of electron streams and alter the conductivity of materials. He can shape electron streams into any desired form. This permits him to develop Power stunts based on lightning–constructs designed to perform certain tasks (shields, cages, barriers, etc.)

                            The hero can increase or decrease the electricity's Intensity and reduce damage by his Power rank number. If the electricity is Power-related, then the target's Power rank determines the Intensity of the FEAT the hero must make to gain control.

                            The hero has Power rank Resistance to Electrical Generation.

                            Optional Powers include Electrical Generation, Energy Doppelganger, Energy Sheath, Energy Body, Carrier Wave, and Energy Path.

                            Because electricity forms the basis for most of our technology, the hero can use his Power to remotely control any electrical device on a Good Intensity FEAT. More complex devices like computers require a more complex form of control and a Remarkable Intensity FEAT.
                      - Fire Control:
                          Reference: *Fire_Control
                      - Light Control: #EC14
                          Reference: |
                            The hero can manipulate existing light. This can be visible, infrared, or ultraviolet light. The hero can alter the intensity, frequency (color, in other words), and coherence of light on a Good Intensity FEAT. The hero can actually change the direction of light and form crude holograms on a Remarkable Intensity FEAT. Such holograms are little more than clouds or single-color walls. The Power allows +1CS Resistance to Light-based Powers, since the hero can redirect or dispel them.

                            Optional Powers include Light Generation, Energy Sheath, Carrier Wave, and Illusion Casting. The Nemesis is itself.
                      - Shadowshaping: #EC18
                          Reference: |
                            This is not Darkforce Manipulation: that's handled elsewhere. This Power enables the hero to affect normal shadows and, indirectly, light as well. The hero can shift the location and size of normal shadows. He can form them into two-dimensional images that can do Power rank damage to real targets. The hero can also Remote Sense through these shadow-constructs. The hero can increase or decrease the Intensity of any shadow, whether natural or Power-based, by his Power rank number. This overlaps with Light Generation and Shadowcasting but differs in that either effect is possible and only existing shadows or shadow-related Powers are affected.

                            The hero has the ability to see through any shadow as if it were a normally-lit area, provided its Intensity is less than or equal to his Power rank. This does not apply to Darkforce, however.

                            This Power includes Power rank Resistance to shadow-based Powers.

                            This has the Bonus Power of Shadowcasting.

                            Optional Powers include Light Control, Energy Sheath, and Energy Body. In the last two cases, the hero resembles a living shadow.
                  Energy Emission: 
                    One of the following at Psyche Rank:
                      - Cold Generation: #EE1
                          Reference: |
                            This Power is the pure form of Ice Generation and one it is often confused with. The hero can emit a field that decreases thermal energy and infrared radiation.

                            The Power decreases the temperature of the target: the amount is determined both by a FEAT and the Power rank number. A Typical FEAT drops the temperature by 10x the rank number: a Remarkable FEAT drops it by 20x the rank number: and an Unearthly FEAT drops it by 40x the rank number. For example, a hero with Remarkable Cold Generation can lower a target's temperature by 300 (10x30) to 1200 (40x3O) degrees. The only limitation is that the temperature cannot drop lower than absolute zero (-273 degrees Celsius or -459.4 degrees Fahrenheit).

                            The power has the side-effect of cooling the air between the hero and the target. Gases within that area may condense. Such by-products evaporate quickly after the Power ceases to operate.

                            Cold Generation can be used to negate other sources of cold, whether Power-based, artificial, or environmental: its Power rank decreases the intensity of the affected cold. However, it cannot be used to raise the temperature of a frigid environment. The hero with this Power has Power rank level resistance to Cold in any form.

                            Optional Powers include Coldshaping, Condensation, Solidification, and Molding. Nemeses include Heat Emission, Fire Generation, and Thermal Control.
                      - Electrical Generation: #EE2
                          Reference: |
                            The hero can create electrical streams that can do Power rank damage. The hero can project the electricity through any conductive medium, such as air, water, or metal, at Power rank range. If the player chooses, the hero can gain +2CS to his damage by choosing to limit his range to contact only. In this case, the range can be extended by conducting the Power through solid conductors like metal. Electricity comes in various forms:

                            Static electricity causes magnetic attraction between objects and can disrupt electronic communications.

                            Lightning is sheer, raw, destructive power and by far the most popular form of this Power.

                            Alternating current is what our technology is driven by. This Power can either energize or overload normal electrical devices.

                            Direct current is what a battery produces. It can energize or overload devices that use DC power. It can also short out devices that use AC power.

                            The hero can use any form at will or can raise his rank +1CS by specializing in a particular form. This Power automatically includes Power rank Resistance to Electricity: no FEAT is required to resist your own Power. This Power is linked to Electrical Control and Energy Sheath. When creating the hero, the player can exchange any randomly determined Powers for these if he so desires. Extreme heat reduces this Power's rank by the Intensity rank of the heat. Conversely, extreme cold increases the rank by the cold's Intensity rank. At Shift X level, the hero gains the ability to create a stream of conductive gas, thus allowing the Power to function even in a vacuum.
                      - Fire Generation: *Fire_Generation
                      - Light Emission: *Light_Emission
                      - Shadowcasting: #EE12
                          Reference: |
                            The hero can emit a field that decreases light and radiation. The obscured energy's Intensity is lowered by the Power's rank taken as Intensity. The energy forms that can be affected by this Power are Light, Heat, Hard Radiation, Radiowaves, Energy Doppelgangers, and Energy Bodies.

                            The hero possesses the ability to affect only Light when his Power is at Good rank. At each rank above Good, he gains the ability to affect another energy form in the following order: EX-Heat, RM-Hard Radiation, IN-Radiowaves, AM-Energy Doppelgangers, MN-Energy Bodies.

                            This Power includes the ability to see clearly through his own natural or Power-created shadows of Intensity less that the hero's Power rank.

                            The Power can disrupt Darkforce Manipulation on a Typical Intensity FEAT if its rank is higher than that of the Darkforce manipulator, Remarkable Intensity FEAT if they are equal, and Unearthly Intensity FEAT if the Power's rank is lower.

                            Optional Powers include Shadowshaping and Darkforce Manipulation.

                            The Nemesis is Light Emission.
                  Self Alteration:
                    Alter Ego: *Alter_Ego
                Ethereal:
                  Lifeform Control:
                    Mind Control: #L10
                      Form:
                        Possession: the target mind loses both control and consciousness.
                      Reference: |
                        The hero has the ability to directly control a target's mind through psionic Powers. The hero completely overrides the will and perhaps even the conscious mind of the target. There are four forms of Mind Control:

                        - Puppetry: the target mind retains awareness but cannot control the body.
                        - Possession: the target mind loses both control and consciousness.
                        - Negation: the target mind is completely turned off: Mental Probes show that no mind exists in the target's body.
                        - Magnification: The target mind is actually enhanced. The rank of the target's Reason, Intuition, and/or Psyche can be temporarily increased, up to the hero's Power rank.

                        The Power rank determines the Intensity of the hero's control, the range at which he can establish and maintain that control, and the duration of the control.
