              Reference:
                Ammunition:
                  Power Pack: Stun, concussion, and laser weapons operate from power packs and may not use other types of ammunition.
                  Handgun:
                    Standard: &Standard Damage listed for each weapon is for standard ammunition.
                    Mercy Shot: &Mercy_Shot There are several types of specialized ammunition, the first of which is Mercy Shot. Mercy bullets inflict no damage, but spread a Remarkable Intensity knock-out drug over the skin of the target. If the bullet inflicts damage to the target, the drug takes effect, knocking those affected out for 1-10 rounds.
                    AP Shot: &AP_Shot Armor-piercing bullets reduce the target's Body Armor by -2CS (from Good to Poor, for example) for purposes of hitting and damage. This type of ammunition has no effect on force fields.
                    Rubber Shot: Less lethal rubber bullets that inflict slugfest damage instead of shooting damage. Ignore Slam results when using rubber bullets.
                    Explosive Shot: &Explosive_Shot Explosive Shot inflicts twice the normal (listed) damage for the weapon. If the weapon fires bursts or scatters, all targets in the area are affected.
