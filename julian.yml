    Varangioi: &Varangios
      Description: Elite operatives drawn from the highest echelons of special operations and intelligence work, screened for magical potential, Varangioi are the highly-paid, trusted bodyguards, proxies, agents, and fixers of their employer. When on duty but not in armor they generally wear the subdued, tailored suits worn by federal agents, plainclothes detectives, and bodyguards with their Guardian Blasters and collapsed Warden Staves discreetly concealed, or military fatigues with their Blaster and collapsed Staff on their pistol belts alongside flashlights, knives, handcuffs, and mace, depending on the assignment, as well as their Sentry Glasses in either event. Varangioi also have a formal dress uniform, prominently featuring Byzantine and Norse motifs and styling over a modern military dress base, including a (functional) ceremonial sword and dagger and a formal cape. They generally operate in pairs or multiples thereof, two to a Pathfinder. Varangios captains have the title "Akolouthos," while the rank and file are titled "Scholarios."
      Note: Akolouthoi have the Leadership Talent.
