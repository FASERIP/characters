                    Standard: *Standard
                    AP Shot: *AP_Shot
                  Assault Rifle:
                    Standard: *Standard
                    Mercy Shot: *Mercy_Shot
                  Shotgun:
                    Standard: *Standard
                  Riot Gun:
                    Standard: *Standard
                    Canister Shot: &Canister_Shot
                      Reference: Canister shot is a special type of ammunition that may be loaded with various cartridges for different effects. Specify the type of canister desired when purchasing.
                      Canisters:
                        - Gas Canisters: Gas Canisters contain Incredible Intensity Tear Gas. Cover one area.
                        - Knock-Out Canisters: Knock-Out Can contain Remarkable Intensity Knock-Out gas. Cover one area.
                        - Smoke Canisters: Smoke Canisters contain Excellent Intensity smoke. Cover one area.
                        - Explosive Canisters: Explosive Canisters inflict double damage to all in target area, normal damage to all in adjacent areas.
                        - Incendiary Canisters: Incendiary Canisters inflict 20 damage in fire (Energy), which burns at Excellent Intensity for 1-10 rounds.
                  Gyrojet:
                    Standard: *Standard
                    Explosive Shot: *Explosive_Shot
                    Heat-Seeker Ammunition: &Heat-Seeker_Ammunition Heat-Seeker Ammunition seeks out the hottest source in line to the target. Will track the hottest source up to maximum of the weapon's range, and suffers no penalty for range. If several targets are of the same heat, then it will determine a target randomly. This ammunition type is only available for Gyro-Jet Pistols.
                    Explosive Heat-Seeker Ammunition:
                      - Explosive Shot: *Explosive_Shot
                      - Heat-Seeker Ammunition: *Heat-Seeker_Ammunition
                  LAW:
                    Standard: *Standard
                    AP Shot: *AP_Shot
                    Canister Shot: *Canister_Shot
                  Missile Launcher:
                    Reference: |
                      Missiles are expensive propositions. In addition to a missile launcher, the user must purchase the missile itself, the specific payload to be used, and the control system This restricts missiles to those who can afford or invent them.

                      A missile without a control device will fly in a straight line to its target's location at the time of the firing, and hit those in that area on the Shift 0 column (individuals who are not choosy about their targets often do this while loading up on the explosives). Aircraft Bombs (like the type in old 8-52 movies) an missiles without control devices (the "launcher" is in the plane itself -they are "launched" straight down).
                    Missiles:
                      Standard Missiles: |
                        Standard Missiles have Body: Excellent, Control: Remarkable, and Speed: Excellent.
                      High-Tech Missiles: |
                        High-Tech Missiles have Body: Excellent, Control: Incredible, and Speed: Excellent.
                      High-Speed Missiles: |
                        High-Speed Missiles have Body: Excellent, Control: Incredible, and Speed: Amazing.
                    Control Systems:
                      Wire-guided Control System: The missile is controlled by a wire leading from the tail of the missile. The Wire-guided missile has the Agility of the controller to hit. Severing the wires causes the missile to behave as if it has no control. Range of 10 areas, maximum, but no penalties for range.
                      Tele-Guided Control System: The missile is guided by a camera in the nose of the missile, and the operator may be up to 5 miles away. Use the Control of the missile or the Agility of the controller (whichever is lower) to determine Control FEATs for this type of missile.
                      Computer-Guided Control System: The missile is programmed internally for a specific target. Its ability to determine the target is considered Poor if multiple similar targets are available.
                      Radio-Linked Control System: Also called a homing missile. The missile tracks on a specific wavelength, either directed from its point of firing or issuing from the target. Destruction of a tracer or cessation of the signal causes the missile to go out of control.
                      Heat-Seeking Control System: This form of guidance will "lock on" to the highest flame source in its path (usually a jet-engine or flaming hero). The missile will only be sidetracked by a higher source of heat.
                    Payloads:
                      Standard Missile Payload: Standard Missile Payload inflicts 40 points EA damage to all in the target area.
                      Concentrated Explosive Missile Payload: Concentrated Explosive Missile Payload inflicts 40 points EA damage to the target only.
                      High Explosive Missile Payload: High Explosive Missile Payload inflicts 70 points EA damage to all in the target area, and 20 points to those in adjacent areas.
                      Incendiary Missile Payload: Incendiary Missile Payload inflicts 40 points Energy damage to all in the area and burns for Good Intensity for each round afterward until put out.
                      Gas Missile Payload:
                        Reference: Gas Missile Payload contains Amazing Intensity tear or knock-out gas, which will affect all in the area.
                        Tear Gas: &Tear_Gas Most tear gas is considered to be Typical intensity. Those failing the Endurance FEAT roll against this gas may take no actions other than movement until they leave the area, nor for one round after leaving that area.
                        Knock-Out Gas: Knock-Out gas is listed in various Intensities, as it is a favorite device to knock out bad guys and good guys. Those in the same area as knock-out gas must make an Endurance FEAT or be knocked out for 1-10 rounds.
                Shooting Weapons:
                  Target Pistol: The Target Pistol is the most finely balanced and accurate of the pistols. The user of a target pistol suffers no penalty for range when firing with two hands
                  Variable Pistol: The Variable Pistol has an advantage in that it may be set in the field to a specific type of ammunition and changed according to need. Most handguns fire standard ammunition and must be modified to fire other types as well.
                  GyroJet Pistol: A GyroJet Pistol fires a miniature rocket, which may affect one or more targets according to ammunition type. Gyro-jets will only fire one type of ammunition, and gyrojet ammunition will not fit any other type of gun.
                  Laser Pistol: &Laser_Concussion_Pistol The Laser Pistol, Concussion Pistol, and Plasma Beam Handgun are weapons used by high-tech spies and subversive organizations, including S.H.I.E.L.D. and A.I.M. All three types operate from power packs.
                  Concussion Pistol: *Laser_Concussion_Pistol
                  Stun Pistol: The standard Stun Pistol fires a stunning beam of Typical Intensity, and the target must make an Endurance FEAT or pass out for 1-10 turns. It operates from a power pack.
                  Sniper Rifle: The Sniper Rifle, like the target pistol, suffers no penalty for firing up to maximum range.
                  Assault Rifle: The Assault Rifle is the version of the rifle used by the military.
                  Laser Rifle: &Laser_Stun_Concussion_Rifle The Laser, Stun, and Concussion Rifles are larger versions of their handgun equivalents. The stun rifle fires a beam of Remarkable Intensity. All use power packs.
                  Stun Rifle: *Laser_Stun_Concussion_Rifle
                  Concussion Rifle: *Laser_Stun_Concussion_Rifle
                  Shotgun: The Shotgun is a one- or two-barreled weapon that fires bursts. It is often loaded with non-lethal cartridges (such as rock salt) that will not inflict Killing damage (ignore Kill results). One or both barrels may be fired.
                  Riot Gun: The Riot Gun is a smaller version of the shotgun and fires grenade-like missiles and canister shot (treat as grenades).
                  LAW: LAW stands for Light Anti-tank Weapon, and is the replacement for the Bazooka on the battlefield. It requires one man to fire.
                  Stun Cannon: &Stun_Concussion_Laser_Cannon Stun, Concussion, and Laser Cannons are the largest version of the pistols and rifles of the same name. They must be stationary to fire, and all rely on power packs. Stun cannon fires bursts of Incredible Intensity.
                  Concussion Cannon: *Stun_Concussion_Laser_Cannon
                  Laser Cannon: *Stun_Concussion_Laser_Cannon
                  Flamethrower: The Flamethrower is a military weapon that shoots a jet of flaming jelly, affecting all targets in the area. The fire burns for Incredible (40) points damage the first round and continues to burn for 10 points damage each round until put out (for 1-10 rounds).
                  Missile Launcher: The Missile Launcher is a military weapon that fires missiles (see Missiles) and may range from small launchers similar to the LAW to missile equivalents of the Heavy Artillery.
                Other Equipment:
                  Fire Extinguisher: Fire Extinguishers inflict no damage normally, but against fire are of Good Intensity (eliminate fire of Typical Intensity or less in the same area on a green FEAT, of Good Intensity on a yellow, and up to Excellent on a red). Against characters with flaming powers, such as the Human Torch, the extinguisher causes a FEAT roll against that Intensity to retain flame.
                  Fire Hose: Fire Hoses have been used as riot control devices, and inflict 10 points Blunt Attack at a range of one area, and can be considered as firing bursts. Against fire and flaming characters, the water from a fire hose is considered Remarkable Intensity.
                  Silencer: The Silencer is a device that may be added to a pistol or rifle which inflicts damage on the Shooting table, excluding the gyro-jet and all lasers, stunning and concussion weapons. The silencer operates by dispersing the gases from the shot that creates the crack of the pistol. The target (and those around him or her) must make an Intuition FEAT to hear the shot and know its location.
                  Sniper Sights: Sniper Sights are built into the sniper rifle and the target pistol, and added to any other weapon eliminate the penalty for range for weapons. Using the sniper sight automatically has an initiative roll of 10 (last in the round). 
                  Infra-Red Sights: Infra-Red Sights are a modification similar to the sniper sight, may be used for any missile weapon. These sights permit the user to see up to 5 areas in the dark.
                  Flashlight: &Flashlight Flashlights are common to all readers. The normal flashlight is the type most common, with a plastic or metal body (Typical Intensity). The Halogen flashlight has a brighter bulb and more concentrated beam, and blinds with a more powerful Intensity (Remarkable Intensity). Normal flashlight has a range of two areas, the halogen three.
                  Mace: &Mace Mace is a small one-area weapon that shoots a mist of Typical Intensity tear gas at a single target adjacent to the user. It does not require an Agility FEAT to hit, though the target must make an Endurance FEAT to avoid the effects.
                  Flare Pistol: Flare Pistols fire a burning charge that lights the sky, either to provide illumination (lighting all areas within three) or as a signal device (fired 10 floors straight up). Used as a weapon, the device has a range of two areas and inflicts Good damage. The charge is incendiary and will ignite flammable material.
            Model II:
              Description: A sleek, futuristic device with extendable stock and forestock to transition between handgun to long gun form factors. It may be attached to the Sentinel Battlesuit Mk. 1's arm, becoming an integral part of the suit, or operate off grid power or a power pack as an energy source to be used as a standalone device for 10 uses of any power per Power Pack.
              Variants:
