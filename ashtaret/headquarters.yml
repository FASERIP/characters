          - Portal Room:
              Note: To secure Black Mirror instance is a combination of Trophy Room and Imprisonment Package features, designed to keep interlopers somehow emerging from the Black Mirror confined away from access to the rest of her domain.
              Black Mirror:
                Note:
                  - An instance of the Black Mirror exists in Ashtaret's demiplanar pocket, as it does in other dimensions.
                  - The incantation to access Ashtaret's domain through a Black Mirror instance is 𒉡𒈬𒌑𒈾𒃶𒊺𒄖𒆠𒀀𒉆𒋼𒍪𒉡𒈨𒀀𒄷𒃲𒆠𒀀𒁺𒍣𒂵𒅎𒈠𒀭𒌦𒍣𒂵 𒅗 𒋛𒉡𒅆𒃲𒃲𒆷𒋼𒁉𒍣𒂵𒂵𒁺 - "nù mu-un-na-ĝen!  šeg₉!  ki-a nam-tag₂-zu nu-me-a!  hul-gal ki-a gub, za-e im-ma-an-tuku!  za-e ka in-nu, igi-gál-gál-la šu-bé, za-e ĝen-a." (Sumerian, roughly translated as, "Do not enter! Go away! You are not welcome here! Great evil awaits you here, you have been warned! Abandon all hope, you who enter here!")
                  - Ashtaret has never shared the Black Mirror incantation to her dimension with anyone but it is possible the knowledge is discoverable.
                  - Ashtaret knows the incantations for many other dimensions, or knows how to find them.
                  - There is a custom, dedicated room built around the instance of the Black Mirror in Ashtaret's domain to house it that has the combined features of the Trophy Room Package and Imprisonment Package.
                Description: |
                  This full length ebony oval of glass is surrounded by an ornate frame. While it has been called a mirror, it does not reflect. Instead, it is a legendary gateway to countless dimensions, to an infinite number of alternate Earths. A specific incantation is needed for each dimension. After speaking the incantation, the character speaking can simply pass through the mirror into the desired world. The mirror also exists on each dimension it opens into, so passage back and forth is easy, but only for those who know the right incantation.
          - Scrying Room:
              Note: For the Satan-Sphere and Interdimensional Scanner is a combination of Trophy Room and Conference Room features.
              Satan-Sphere:
                Note:
                  - Ashtaret acquired this relatively recently among the aftermath and fallout of Doctor Strange's conflict with the Sons of Satannish.
                  - It is kept in a dedicated scrying room in Ashtaret's domain that has the combined features of the Trophy Room Package and Office Package. 
                Description: |
                  This large (8 feet in diameter) fiery white sphere was last known to be owned by the cult Sons of Satannish. It acts in a manner similar to the Orb of Agamotto, locating that which the user desires to see and hear on Earth. The Satan-Sphere also allows a user who makes a successful Psyche FEAT roll to send spells through it at observed targets (the check must be made for each spell used, a failed roll means that the spell has been wasted). Even if the attack successfully goes through the Satan-Sphere the target can return the attack spell to the user if: a) the target is of a mastery level equal to or greater than the user; and b) the target succeeds in making a Yellow or Red Psyche FEAT roll.

                  The current whereabouts of the Satan-Sphere are unknown.
              Interdimensional Scanner:
                Note:
                  - This is a room-sized magical scrying device that functions the same as Bochs's technologucal Interdimensional Scanner described in Realms of Magic. 
                  - It is occupies much of the scrying room in Ashtaret's domain.
                Description: |
                  While this is not a mystical item, it is used to monitor dimensional nexus and scan dimensions that are near Earth. This room-sized piece of high-tech equipment was designed by Roger Bochs, who first created Box of Alpha Flight fame. He was assisted in its creation by Shaman. Imaging of these dimensions is often hazy, showing only the outlines of larger creatures, structures, and so forth. It is with this device that the Alpha Flight team unwittingly brought the Incredible Hulk back to the Earth dimension from another dimension where Doctor Strange had banished him for the good of mankind, and the Hulk’s own sake. Any use of this device to scan and observe another dimension requires a successful Reason FEAT roll.
          - Throne Room for holding court is a combination of Conference Room and Office Package features. It features an enormous, ornate throne of basalt, obsidian, and iron.
          - Bedrooms, of which there are many, feature subtle implementations of the Imprisonment Package as described. An Amazing Intensity feat is required to notice them when they are inactive. Bedchambers are opulent but austere, matching the rest of the domain.
          - Servants:
              Note:
                - These are created or summoned by the Servant spell, and are elemental or demonic spirits, or magical automatons, rather than technological robots, but have the same general roles, Abilities, and other features.
              href: servants.yml
        Description: |
          A small, obscure, demiplanar pocket with nebulous dimensions and borders that straddles Hell Dimension and the Dimension of Dreams, with a readily accessible border with the Astral Plane, Ashtaret's domain is not strictly a structure or building, though there are areas that appear to be "inside," as well as "outside," and "underground." The substructure of "walls," "ceilings," "floors," and "the ground" are an ultrahard, impenetrable, basalt-like material.  There is "weather" of sorts in the "sky" of the "outdoor" portions, and flying into it, away from the surface eventually leads to the Astral Plane. However, this is ultimately a one-way trip once the flyer has passed fully into the Astral, requiring a different mechanism to return. Strange and alien flora populate the courtyard gardens, infernal analogues of their counterparts on Earth, if any, but there is no fauna, the sky has neither birds nor otherwise, and there aren't even creatures to buzz and flit through the gardens like insects.

          As Ashtaret satisfies her needs with Powers and Spells, the lair has few amenities although everything there is of opulent quality, as it primarily comprises places for Ashtaret to keep her Grimoires and other Mystic Texts, along with any treasures, prisoners, or other possessions, as well as a place for her to sit and hold court. The architecture and design are reminiscent of ancient Mesopotamian aesthetics, and the statuary and friezes and other elements, as well as the lighting and temperature, all respond subtly to her emotional state, changing their countenance or content to reflect her moods. The temperature, atmosphere, and other conditions are survivable, even livable, if not pleasant or comfortable, for humans, animals, and humanlike beings. There is no modern technology present, with amenities such as cooking, hot water, and lighting provided by hellfire and witchlight, running water from "natural" springs, and plumbing, drainage, and waste disposal by the void itself. Though indeed opulent in construction and ornamentation, it is also somewhat spare and spartan, empty and uninhabited save her herself and her Servants, robotic except for Allatou; she finds it stifling and boring to spend too much time there.
