                  The Laser Pistol, Concussion Pistol, and Plasma Beam Handgun are weapons used by high-tech spies and subversive organizations, including S.H.I.E.L.D. and A.I.M. Their possession is illegal by unauthorized persons (Other Crime). All three types operate from power packs.
