    References:
      Spells:
        Servant: &Servant
          Description: |
            The caster can summon forth his own, personal servant to do his bidding. This servant will require quite a bit of Judge’s discretion as to its nature, abilities, spell, etc.
            The servant’s abilities are generated as for any other character. The Judge then gives it two spells, and gives it an origin appropriate to the character it serves. Various types of magical servants exist, including jinn, demons, familiars, ghosts, and the like. The servant is obedient, helpful, and useful. The caster can automatically talk to or otherwise communicate with the servant.
            This spell cannot use human beings as servants.
      Origin: &Demon
        Physical Form:
          Demon:
            Description:
              - |
                  These are magical beings from other planes of existence. They are both supernatural and corporeal in nature. The main difference between these types is their inherent personality. "Angels" are benevolent; "demons" are malevolent. Other than that, there isn't much difference.
                  These beings resemble characters from various mythologies. This affects their Popularity. Angels gain +2CS while demons lose -2CS on their initial Popularity. These beings do not necessarily follow the popular traditional behavior patterns. A heroic demon might be fighting a personal war against other, even more evil beings. A crazed angel might be a villain, seeking to purify the Earth at any cost.
              - Demons roll on Column 5.
              - Demons have no initial Contacts but will soon be sought out by groups who see them as symbols or tools.
              - All Physical Abilities are raised +1CS.
              - Such beings possess a Psychological Weakness that Negates their Power.
              - Demons lose -2CS Popularity.
              - Demons automatically possess Good Fire Generation and Specific Invulnerability to Heat and Fire.
        Origin of Power: 
          Creation: The hero was born in the form he now has, that of an adult who possesses Power and/or whatever the Body Type is. Most of the Artificial Body Types belong in this class. Examples include the android Human Torch, all robots, angels, demons, and deities.
      Weakness: &Weakness
        Stimulus: Psychological
        Effect: Power Negation
        Duration: Continuous with Contact
        Conditions: Hallowed Ground
        Note:
          - Powers cease functioning within 20 feet of stimulus, -1CS Abilities per 10 turns of exposure, cannot directly use Powers against Stimulus from outside radius.
          - Instantly reverses when moved away from Stimulus.
          - Psychological Weaknesses can be temporarily overcome by an Unearthly Intensity Psyche FEAT. They can be permanently overcome by a Shift-Z Intensity Psyche FEAT.
          - Sites consecrated to the Annunaki (including Ashtaret and Allatou) do not trigger this Weakness.
          - Magic use is not considered a Power, but lowered Abilities may impact it if Ability FEATs are required for a particular Spell.
      Abilities:
        Special Abilities:
          Powers:
            Demon: &Powers-Common
              Defensive:
                Invulnerability to Energy Attacks:
                  Fire and Heat: *Unranked
              Energy Emission:
                Fire Generation:
                  Value: *Good
                  Description: |
                    The hero can project fire with Power rank damage and range. These flames have no apparent fuel source and spring from the hero as if he were a living fuel tank. Although the flames' fuel comes out of the proverbial nowhere, free oxygen must be present for the Power to function. If not, the hero can cause a single flame that lasts' only one turn, then fizzles out. At Shift X rank, the hero gains the ability to generate oxygen as well, permitting this Power to function under any conditions. When creating the hero, the player can choose the Powers of Flame Control, Energy Sheath, and Energy Body to fill any slots still open. For example, under the Ultimate system, the Human Torch possesses three powers: Fire Generation, Fire Control, and Energy Sheath.
                    This has to be the most dangerous Power around. Heroes have to watch out for accidental firestorms. They also tend to consume all the oxygen in their location, making everyone pass out. Then there is the question of smoke and gases created by the hero's Flame Power. It makes me wonder what kind of ventilation system the Baxter Building has…
                    Fire Generation is the opposing Power to Cold Emission, Coldshaping, and Powers that use water. This Power gains +1CS when fighting these Powers. It also loses -1CS when being attacked by those Powers
            Armor:
              Defensive: &Powers-Armor
                Body Armor:
                  Value: *Excellent
                  Note: Excellent Body Armor from Chest Plate (covers the wearer’s torso and back only), Helmet (Covers the wearer’s head only), and Shield (Protects against frontal attack only. If a shield is used in combination with a chest plate or any type of full armor, the shield raises the protection of the other armor by one rank. If used alone or with a helmet only, use the shield’s armor rank). Remarkable with Shield vs frontal attacks. Items have Remarkable Material Strength.
                  Description: |
                    The hero possesses artificially-created armor that provides protection and possibly a way of possessing other Powers.
                    Armor comes in many forms exotic plate-mail, nuclear-powered exoskeletons, or mechanically-created force fields. The player should work with the Judge to create proper Armor for his hero. The player can also determine which Powers are possessed by the hero and which are properties of the armor. Powers built into the armor can later be modified and enhanced: think of the changes Tony Stark has made in the Iron Man armor. On the other hand, Powers that are built into the armor may suffer mechanical failure. The Armor's Power rank determines its ability to resist damage.
                    The player also has to determine where he got the Armor in the first place. This is covered in the "Character Creation" section elsewhere in this book. If the hero gained the armor through an accident, he might not be able to repair it.
          Talents:
            Weapon Skills:
              Sharp Weapons: &Sharp_Weapons Characters with this Talent gain a +1CS to hit when attacking with a weapon that resolves attacks on the Edged Attack column of the Battle Effects Table. This includes swords, daggers (unless thrown), and spears, but excludes claws and other natural extensions that inflict this type of damage.
              Weapons Master: &Weapons_Master The character with this Talent gains a +1CS to hit with any weapon that requires a Fighting FEAT to hit.
              Weapons Specialist: &Weapons_Specialist The character with this Talent gains a +2CS with a single weapon of choice. This may be any type of weapon, missile, or melee. The character who is a weapon specialist will also increase his initiative when using this weapon by 1.
            Professional Skills:
              Military: &Military The hero has had some dealings with one of the armed services. In military matters, the hero gets a +1CS to all FEAT rolls, and in addition may take a member of the armed services as a Contact.
              Business/Finance: &Business-Finance The hero is familiar with the world of business, corporate finance, and how money works. Initial resources are a minimum of Good, and the hero gains a +1CS for FEAT rolls dealing with money. The hero gains a Contact in the Professional category.
              Engineering: &Engineering Engineering includes all the varied types of that profession dedicated to the design of functional items- civil, chemical, mechanical, etc. A character with Engineering Talent gains a +1CS to all FEATs involving building things, including the Resource FEAT to determine if an object can be built.
              Criminology: &Criminology The hero with this Talent has an understanding of the criminal mind and behavior, either from studies or first-hand observation. The character with this Talent gains a +1CS on all Reason and Intuition FEATs involving criminal practices ("If I were a crook, where would I hide?"). The hero also gains a Contact in either the police or crime areas.
              Detective/Espionage: &Detective-Espionage The hero with this Talent has been trained to notice small clues in solving crimes. The character with this Talent gains a +1CS to discover clues to a crime, and in addition gains a Contact in either crime, law enforcement, law, or espionage.
            Scientific Skills:
              Chemistry: &Chemistry A +1CS on matters of chemistry, including developing new formulas, finding cures for inorganic poisons, and identifying chemicals by smell, touch, or taste.
              Biology: &Biology A +1CS on matters of biology, including animal and plant identification, finding cures for organic poisons, and researching diseases and their cures.
              Geology: &Geology A +1CS on matters involving the Earth, including volcanic activity, the geology of the surrounding land, types of rocks and their powers, and mineral identification.
              Archaeology: &Archaeology A +1CS on matters involving the past, including paleontology, historical records, and ancient myths and legends.
            Mystic and Mental Skills:
              Resist Domination: &Resist_Domination This is a Psi-Screen that may be developed by individuals without that Power. This permits the character to resist mental attacks as if the character had a mental power of Psyche +1CS. The Talent is passive in nature and does not grant any other particular benefit. A character with Mental Probe may be able to discern where the character gained this Talent, but nothing else.
              Occult Lore: &Occult_Lore The character with this Talent has a knowledge of magical societies, antiquities, runes, and a general understanding of forgotten lore. The character gains a +1CS to Reason FEATs involving items of a magical nature.
              Mystic Background: &Mystic_Background the Marvel Universe, all humankind has the potential for developing magical Powers. This "Talent" shows that the character has some background with magical forces. Heroes may have derived their powers from these forces if they choose this Talent. A character with this Talent may have Magical Powers, with the approval of the Judge. If the Judge allows magical player characters, then any of the initial Powers created may be spells, and should be noted as deriving from Personal, Universal, or Dimensional energies.
            Other Talents:
              Artist: &Artist The character with an artist background creates works of art, either for himself or for sale to others. This includes painting, sculpting, and writing. A single work takes 1-10 weeks, and upon completion grants the artist Karma points equal to 10 times the number of weeks. The character must allocate some time daily at his work.
              Languages: &Languages The character with this Talent has a natural understanding of languages. The character gains 1 additional language at start, and may add other languages at half the cost of a Talent (500 points regardless of who teaches it). Characters without the Languages Talent must gain this Talent first to learn other languages. The gaining of additional languages assumes someone is available to teach these languages. A Player character with this Talent does not have to assign a language at start, but may fill one in later as need be.
              Repair/Tinkering: &Repair-Tinkering The character with this Talent gains a +1CS to any Reason FEATs involving the repair and modification of existing items, but not the building of new items. This +1CS may be added to any other bonuses gained from other Talents, so that an Engineer with Tinkering Talent would gain a +2CS on repair.
              Performer: &Performer The character is someone who acts, sings, dances, mimes, or otherwise uses his Talents to entertain (this is related to the Artist, the key difference being that the Artist may leave the scene of creation; the Performer is identified with that creation directly). A Performer receives 10 karma points for a week's worth of performance, whether in a play, doing a nightclub routine, or working for a movie.
              Leadership: &Leadership The hero with this Talent has the brains and understanding of a cohesive group, such that he is a benefit to the team. Any Karma Pool to which the character belongs receives a 50-point bonus, provided the character with this Talent is recognized as the "team leader." A Karma Pool may only have one recognized leader, though more than one character with Leadership may belong to one group. When the "Leader" of a group leaves, the 50 points are deducted from the Karma Pool, but the leader does not receive them for personal use (the bonus points only exist as a part of the pool).
            Magic Wielder Talents:
              Bibliophile: &Bibliophile The character has an extensive knowledge of magical books, scrolls, or other primarily informational items, and the lore concerning them. He has a +2 CS when using or researching these.
              Chronicler of Magic: &Chronicler_of_Magic The character studies magical societies and their activities. He has a +2 CS for researching and/or knowing who the adepts and masters are, what their relationship is with each other and with any beings that they entreat, and for any specific facts about most magical cults.
              Demonologist: &Demonologist The character has studied accounts of demons in the Marvel Universe and he knows how dangerous and hostile they are. The character receives a + 1 CS in any situation involving demons, including research, communication, identification, and combat.
              Occultist: &Occultist The character has made extensive studies into the area of occult happenings, including unexplained events and mysteries of the world, hauntings, and other manifestations of the spirit world. He has a +2 CS when researching or dealing with occult events.
              Runesmith: &Runesmith The character is a transcriber and translator of runes, especially ancient, magical runes. (A rune is a letter in an ancient alphabet. Most ancient magical items have runes on them to warn potential users of the possible harm that the item can cause. These runes can be any one of a vast array of almost-forgotten codes.) The character has a +2 CS whenever studying, deciphering, or inscribing runes.
              Scholar of Antiquities: &Scholar_of_Antiquities The character has an extensive knowledge of antiques, especially ancient magical artifacts and lore concerning them (but not including books, scrolls, or other artifacts that are primarily informational). He has a +2 CS when dealing with them or researching them.
              Theoginist: &Theoginist The character is a scholar on the origins of the powerful extra-dimensional beings and gods of the Marvel Universe (this category includes all of the major entities listed in the Miscellany of Mysticism and those beings that provide dimensional energy when called upon, such as Dormammu). The character has a +2 CS when researching information on this subject.
              Zoologist of Magic: &Zoologist_of_Magic  The character studies magical creatures and has collected books on the subject. This talent includes not only mythological or fantastic beasts of Earth’s legends but also the creatures of other dimensions in the Marvel Universe. He has a +1CS when attempting to identify magical creatures and their powers. (Please see the Magical Creature section in Book 3 for many known magical creatures.
