  Hero:
    Ashtaret:
      Name: Ashtaret
      Identity: Ashtaret
      Secret:
        Identity:
          Demon: n
          Deity: n
          Ethereal: n
          Normal Human: y
        Note: Normal Human Aspects may have appropriate cover identities.
      Base of Operations:
        Extraplanar: Ashtaret's Demiplanar Pocket Domain
        Manhattan: Various, rotating apartments depending on cover identity.
      Group Affiliation: ~
      Age: Timeless
      Origin:
        Physical Form:
          Type: Changeling
          Description: |
            Able to transform between multiple distinct Body Types, each with unique advantages, disadvantages, and at least one exclusive power. Takes 10 turns to change Aspect. No Powers can function and all Abilities -2CS during change.
          Note:
            - Not all Powers are available in every aspect. An aspect will have a Rank in a Power if it is available. A Rank given with no Aspects is available to all Aspects.
            - Continuously in Deity Aspect while in Ashtaret's Domain.  May choose to appear in another Aspect when leaving that dimension, without triggering either the Changeling penalty timer or requiring an Energy Depletion recharge.
            - Everything nonliving Ashtaret is wearing or carrying becomes Ethereal along with her when she changes into that Aspect.
          Aspects:
            Demon: |
              Supernatural, corporeal being from another dimension, inherently malevolent by nature. Demons possess increased physical abilities, fire generation, invulnerability to heat and fire, and reduced popularity.
            Deity: |
              A former powerful entity worshiped as a god, now diminished and bound to a mortal form on Earth. Deities have significantly enhanced abilities, additional powers, automatic access to at least one travel power, and increased popularity with the general public, though limited influence among modern religious groups. Eventually attract any remaining living worshippers they still have as Contacts.
            Ethereal: |
              An intangible, disembodied spirit in the Earth Dimension, solid in other Dimensions. Can drift about in any direction, can pass through solid matter. May be invisible, transparent, translucent, or opaque. Immune to most physical attacks with Intensities less than Unearthly (-9CS).
            Normal Human: |
              The body is completely normal and possesses no detectable abnormalities. Any Powers the hero possesses have left no visible mark on the body.
        Origin of Power:
          Type: Creation
          Description: |
            Born in current form, that of an adult who possesses Power and/or whatever the Body Type is. Inherent to all robots, angels, demons, and deities.
      Weakness:
        Demon:
          Stimulus: Psychological
          Effect: Power Negation
          Duration: Continuous with Contact
          Conditions: Hallowed Ground
          Note:
            - Powers cease functioning within 20 feet of stimulus, -1CS Abilities per 10 turns of exposure, cannot directly use Powers against Stimulus from outside radius.
            - Instantly reverses when moved away from Stimulus.
            - Psychological Weaknesses can be temporarily overcome by an Unearthly Intensity Psyche FEAT. They can be permanently overcome by a Shift-Z Intensity Psyche FEAT.
            - Sites consecrated to the Annunaki (including Ashtaret and Allatou) do not trigger this Weakness.
        Ethereal:
          Stimulus: Psychological
          Effect: Special
          Duration: Continuous with Contact
          Conditions: Hallowed Ground
          Note:
            - Forced change back to Demon Aspect on exposure to stimulus. May not assume Ethereal Aspect again until outside of Stimulus radius.
            - Psychological Weaknesses can be temporarily overcome by an Unearthly Intensity Psyche FEAT. They can be permanently overcome by a Shift-Z Intensity Psyche FEAT.
        Deity:
          Stimulus: Energy Depletion
          Effect: Special
          Duration: Permanent
          Conditions: Assuming Deity Aspect
          Note:
            - Forced change back to Demon Aspect after 1d100 turns in Deity Aspect, doubled if a Psyche FEAT has Red result rolled after determining duration, unless in continuous contact with Energy Source while in that Aspect (contact pauses countdown).
            - Cannot resume Deity form until 1d100 turns exposure to Energy Source to recharge, Red Psyche FEAT to halve time (recharge does not begin until duration of change concludes).
        Normal Human:
          Stimulus:
            Elemental Allergy: Suffers adverse effects if exposed to dangerous chemical elements.
            Molecular Allergy: Dangerous chemical compounds cause the Effect.
            Energy Allergy: Exposure to dangerous or powerful forms of energy.
          Effect: Fatal
          Duration: Continuous with Contact
          Conditions: Exposure to dangerous energies or toxic substances causes loss of Health and Endurance.  May heal as normal after exposure ceases.
          Note:
            - Inherent to all Normal Human Physical Form Characters.
            - This Weakness simply reflects how dangerous substances and energy like poison, fire, radiation, electricity, etc. affect Normal Humans.
        All Aspects:
          Deity Rule:
            Stimulus: Special
            Effect: Special
            Duration: Continuous with Contact
            Conditions: Engaging personally in actively promoting a religion based on herself (may still passively attract followers).
            Note:
              - Loss of -1CS to all Powers and abilities. Inherent to all Deity Physical Form characters. This condition and effect applies in any Aspect.
              - Independent activity by others where she is not actively involved does not trigger this Weakness, neither does assisting or otherwise taking actions that benefit those who already follow or worship her.
              - Eventual attraction of living followers as described in Deity entry is passive and does not trigger this Weakness, but actively recruiting or encouraging her existing followers to do so does trigger it.
          Aspect Shifting:
            Stimulus: Special
            Effect: Special
            Duration: Special
            Conditions: Attempting to change Aspects.
            Note:
              - Assuming Deity Aspect requires a Red result on a Psyche FEAT from Normal Human Aspect at start of turn, Yellow from Demon and Ethereal Aspects. Requires a Red result on Psyche FEAT from Demon Aspect if subject to Hallowed Ground Weakness.
              - Assuming Demon or Ethereal Aspect is impossible if Aspect would be subject to Hallowed Ground Weakness.
              - Assuming Normal Human Aspect requires a Yellow result on a Psyche FEAT from Demon Aspect if subject to Hallowed Ground Weakness.
              - Failed FEAT to assume an Aspect requires 1d10 turns until retrying is possible.
              - Any remaining duration is lost if Deity Aspect transformation ends prematurely. Recharge required to assume Deity Aspect afterwards, irrespective of remaining duration, unless in contact with an Energy Source.
