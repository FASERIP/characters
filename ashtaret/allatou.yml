  Supporting Cast:
    Allatou:
      Name: Allatou
      Identity: Allatou
      Secret:
        Identity:
          Demon: false
          Ethereal: false
          Normal Human: true
          Animal: false
      Base of Operations: Manhattan
      Group Affiliation: ~
      Age: Timeless
      Origin:
        Physical Form:
          Type: Changeling
          Description: |
            Able to transform between multiple distinct Body Types, each with unique advantages, disadvantages, and at least one exclusive power. Takes 10 turns to change Aspect. No Powers can function and all Abilities -2CS during change.
          Note:
            - Not all Powers are available in every aspect. An aspect will have a Rank in a Power if it is available. A Rank given with no Aspects is available to all Aspects.
            - Everything nonliving Allatou is wearing or carrying becomes Ethereal along with her when she changes into that Aspect.
          Aspects:
            Demon: |
              Supernatural, corporeal being from another dimension, inherently malevolent by nature. Demons possess increased physical abilities, fire generation, invulnerability to heat and fire, and reduced popularity.
            Ethereal:
              Note: All Physical attacks vs Ethereal Aspect have -9CS penalty, equivalent to Unearthly Resistance.
              Description: |
                An intangible, disembodied spirit in the Earth Dimension, solid in other Dimensions. Can drift about in any direction, can pass through solid matter. May be invisible, transparent, translucent, or opaque. Immune to most physical attacks with Intensities less than Unearthly (-9CS).
            Normal Human: |
              The body is completely normal and possesses no detectable abnormalities. Any Powers the hero possesses have left no visible mark on the body.
            Animal:
              Note:
                - Moves 2 areas/turn
                - Attack on Edged attack column.
                - Small felines can't score Kill result on human targets, larger forms can.
                - Aspect can take the form of any small to midsize-to-somewhat-large-ish feline.
              Description: |
                A typical example of Earth's fauna, or alien equivalents.
        Origin of Power:
          Type: Creation
          Description: |
            Born in current form, that of an adult who possesses Power and/or whatever the Body Type is. Inherent to all robots, angels, demons, and deities.
      Weakness:
        Demon:
          Stimulus: Psychological
          Effect: Power Negation
          Duration: Continuous with Contact
          Conditions: Hallowed Ground
          Note:
            - Powers cease functioning within 20 feet of stimulus, -1CS Abilities per 10 turns of exposure, cannot directly use Powers against Stimulus from outside radius.
            - Instantly reverses when moved away from Stimulus.
            - Psychological Weaknesses can be temporarily overcome by an Unearthly Intensity Psyche FEAT. They can be permanently overcome by a Shift-Z Intensity Psyche FEAT.
            - Sites consecrated to the Annunaki (including Ashtaret and Allatou) do not trigger this Weakness.
        Ethereal:
          Stimulus: Psychological
          Effect: Special
          Duration: Continuous with Contact
          Conditions: Hallowed Ground
          Note:
            - Forced change back to Demon Aspect on exposure to stimulus. May not assume Ethereal Aspect again until outside of Stimulus radius.
            - Psychological Weaknesses can be temporarily overcome by an Unearthly Intensity Psyche FEAT. They can be permanently overcome by a Shift-Z Intensity Psyche FEAT.
          Normal Human: &Weakness_Normal_Human
            Stimulus:
              Elemental Allergy: Suffers adverse effects if exposed to dangerous chemical elements.
              Molecular Allergy: Dangerous chemical compounds cause the Effect.
              Energy Allergy: Exposure to dangerous or powerful forms of energy.
            Effect: Fatal
            Duration: Continuous with Contact
            Conditions: Exposure to dangerous energies or toxic substances causes loss of Health and Endurance.  May heal as normal after exposure ceases.
            Note:
              - Inherent to all Normal Human Physical Form Characters.
              - This Weakness simply reflects how dangerous substances and energy like poison, fire, radiation, electricity, etc. affect Normal Humans.
          Animal: *Weakness_Normal_Human
          All Aspects:
            Aspect Shifting:
              Stimulus: Special
              Effect: Special
              Duration: Special
              Conditions: Attempting to change Aspects.
              Note:
                - Assuming Demon or Ethereal Aspect is impossible if Aspect would be subject to Hallowed Ground Weakness.
                - Assuming Normal Human Aspect requires a Yellow result on a Psyche FEAT from Demon Aspect if subject to Hallowed Ground Weakness.
                - Failed FEAT to assume an Aspect requires 1d10 turns until retrying is possible.
