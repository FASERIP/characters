              Tumbling: Enables safe landing from falls; an Agility FEAT allows landing without injury if the fall wouldn't otherwise inflict damage.
            Professional Skills:
              Law: +1CS to all FEAT rolls involving the law, including correct legal procedure.
              Business/Finance: Initial resources are a minimum of Good. +1CS for FEAT rolls dealing with money. A Contact in the Professional category.
              Psychiatry: Expertise in mental processes granting +1CS on FEATs involving mental powers, mental manipulation, and psychological understanding.
            Scientific Skills:
              - Archaeology: Skilled in ancient history and artifacts, providing +1CS on FEATs involving historical records, ancient myths, legends, and paleontology.
              - Computers: A +1CS on matters involving computers, computer-controlled equipment, and artificial intelligences.
            Mystic and Mental Skills:
              Trance: Slows  body functions to such a level that may be assumed to be deceased (Intuition FEAT to determine). Reduces needs for food and water to a minimal level, and may regain Endurance ranks at one rank per day.
              Mesmerism and Hypnosis: A primitive form of Mind Control at Reason Rank level, allowing extraction of information and placement of posthypnotic suggestions.
              Sleight of Hand: Skilled in manual deception, able to discreetly manipulate small objects with +1CS Agility.
              Resist Domination: Resist mental attacks as if the character had a mental power of Psyche +1CS.
              Occult Lore: Knowledgeable about magical items and mystical traditions, gaining +1CS on Reason FEATs involving magical artifacts.
              Mystic Background: Indicates experience or training in magical forces, potentially qualifying for magical powers or spellcasting with Judge approval.
            Other Talents:
              Languages: Naturally adept at languages, initially knowing one extra language and able to learn new languages at half the normal Karma cost.
              Performer: Skilled in performing arts, granting Karma rewards for engaging in performances.
              Trivia:
                History: Specialized knowledge providing +1CS on Reason FEATs related to historical information.
                Religion: Specialized knowledge providing +1CS on Reason FEATs related to religious doctrines and beliefs.
                Art: Specialized knowledge providing +1CS on FEATs involving art and artistic techniques.
            Magic Wielder Talents:
              Bibliophile: Extensive knowledge of magical texts and scrolls, providing +2CS when using or researching these materials.
              Demonologist: Specialized understanding of demons, giving +1CS advantage in research, identification, or interactions involving demons.
              Occultist: Expertise in supernatural and unexplained phenomena, granting +2CS in researching or interacting with occult events.
              Stamina: Ability to sustain long periods without rest or nourishment while engaged in magical study or casting, lasting up to six days.
              Theoginist: Scholar of powerful extradimensional beings and gods, gaining +2CS when researching such entities.
