            Detection:
              Environmental Detection:
                Rank:
                  Demon: *Excellent
                  Animal: *Excellent
                Description: |
                  Automatically aware of environmental conditions and disturbances such as weather, chemicals, movement, and life within the Power's range. Can gain more detailed information with effort.
              Hypersensitive Hearing:
                Rank:
                  Animal: *Remarkable
                Description: |
                  Detect extremely faint sounds and unusual frequencies, identify objects by the sounds they emit. More vulnerable to sonic attacks (which receive a +1CS against him).
              Hypersensitive Olfactory:
                Rank:
                  Animal: *Remarkable
                Description: |
                  Can detect the presence of minute traces of substances and accurately identify them.
              Magic Detection:
                Rank:
                  Demon: *Remarkable
                  Ethereal: *Remarkable
                  Normal Human: *Excellent
                  Animal: *Excellent
                Description: |
                  Identifies the presence and effects of magic, recognizes past magic use, spell types, and magic users with successful feats.
              Tracking Ability:
                Rank:
                  Animal: *Remarkable
                Description: |
                  Detect and follow the tracks, and also environmental and spatial disturbances left by a specific target.
            Energy Control:
              Darkforce Manipulation:
                Rank:
                  Demon: *Remarkable
                  Ethereal: *Remarkable
                Power Stunts:
