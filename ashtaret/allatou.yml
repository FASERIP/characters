                  - Shadowcasting of Power rank Intensity darkness over a maximum of three areas.
                  - Flight at -1CS speed.
                  - Gateway.
                  - Energy Solidification.
                Description: |
                  Controls tangible extradimensional Darkforce energy, creating constructs for physical attacks, darkness areas, flight, gateways, and solidified energy objects.
              Fire Control:
