  Headquarters:
    Note:
      - Cost is a reflection of location as well as size of the structure. The listed prices are for a building in most American cities and their suburban surroundings. If the heroes are apartment hunting in Manhattan or the richer suburbs, the price is +1CS.
      - Room Package Costs are for a fairly nice selection of material. Very high-quality packages (a Library Package stocked with first editions) may be +1CS or +2CS.
    Ashtaret's Domain:
      Type: Special
      Cost: *Beyond
      Size: Deluxe
      Material Strength: *Unearthly
      Room Packages:
        Living Room Package:
          Cost:
            Value: *Remarkable
            Base: *Good
            Note: +2CS to Cost for very high-quality package.
          Note:
            - Represents antechambers and waiting areas outside offices and conference rooms, rather than lounges or living areas; not comfortable or homey.
            - Sofas and chairs are basalt benches and cathedra.
          Description: |
            Cost: Good Occupies one room. Consists of sofa, two easy chairs, two end tables, coffee tables, two lamps (ceiling table or floor).
        Dining Room Package:
          Cost:
            Value: *Amazing
            Base: *Remarkable
            Note: +2CS to Cost for very high-quality package.
          Note:
            - Multiple.
            - Any "silverware" is actually a dark, lightweight, highly durable, unidentifiable metal rather than sterling, and "china" is basalt or obsidian rather than porcelain.
          Description: |
            Cost: Good Occupies one room. Consists of table, four chairs, ceiling lamp. Excellent Cost add large table, bureau and four more chairs. Remarkable Cost add china cabinet, set of good china and sterling tableware.
        Kitchen Package:
          Cost:
            Value: *Remarkable
            Base: *Good
            Note: +2CS to Cost for very high-quality package.
          Note: Stoves, ovens, hearths, hot water, etc. are powered by hellfire or vulcanism. Running water is provided by "natural" springs.
          Description: |
            Cost: Good Occupies one room. Consists of sink, stove (gas or electric), four cabinets, dishware and stainless tableware, counterspace. This version is standard equipment with most residential housing.
        Library Package:
          Cost:
            Value: *Incredible
            Base: *Excellent
            Note: +2CS to Cost for very high-quality package.
          Note: Multiple.
          Description: |
            Cost: Excellent Occupies one room. Consists of two easy chairs, table, desk, straight chair, and up to five bookcases on general subjects (texts readily available, and including encyclopedias, world histories, and atlases). Special or rare volumes, such as the Book of the Vishanti, the Necronomicon, or Amazing Fantasy \#15, would have to be obtained separately.
        Workshop Package:
          Cost:
            Value: *Amazing
            Base: *Remarkable
            Note: +2CS to Cost for very high-quality package.
          Note: A traditional workshop for various wood, metal, stone, and clay trades, without modern technology. Features a forge and anvil.
          Description: |
            Cost: Remarkable Occupies one or more rooms. Basic equipment for metal and woodworking: lathes, drills, saws and fire extinguisher.
        Laboratory Package:
          Cost:
            Value: *Amazing
            Base: *Remarkable
            Note: +2CS to Cost for very high-quality package.
          Note: An expansive, exsquisitely-appointed alchemical laboratory in the classical style, with no modern technology.
          Description: |
            Cost: Remarkable Occupies one or more rooms. Basic lab equipment: scales, sinks, common chemicals, microscope.
        Office Package:
          Cost:
            Value: *Remarkable
            Base: *Good
            Note: +2CS to Cost for very high-quality package.
          Note: Multiple.
          Description: |
            Cost Good Occupies one or more rooms. Includes desk, three chairs, two lamps.
        Pool Package:
          Cost:
            Value: *Unearthly
            Base: *Amazing
            Note: +2CS to Cost for very high-quality package.
          Note:
            - Constructed as thermae-style baths, the pools are supplied by volcanic hot springs, and do Feeble (2) heat damage per turn to anyone in them who lacks sufficient resistance to or protection from fire and heat, Feeble (2) corrosive damage per turn to anyone in them without sufficient resistance to corrosives, and Feeble (2) poison damage per turn to those without protection from toxins.
            - Considered "indoor" for purposes of Cost.
          Description: |
            Cost: Remarkable outdoors, Incredible indoors. Occupies one or more rooms, or outdoor area. Consists of Olympic-size pool, filtered water, small sauna room. At Remarkable Cost adds separate, smaller pool (featuring diving board and chlorine), plus pool cover. At Incredible  Cost includes two Olympic pools, heated water, pool cover. At Amazing Cost, both pools are heated.
        Conference Room Package:
          Cost:
            Value: *Amazing
            Base: *Remarkable
            Note: +2CS to Cost for very high-quality package.
          Note:
            - Multiple.
            - At least one in each format.
          Description: |
            Cost: Remarkable Occupies one room. Contains material for assembling of heroes, or alternately for news conferences and presentations. Contains large table and up to 10 normal chairs, or platform, speaker, and 30 ordinary chairs.
        Security Packages:
          Cost:
            Value: *Monstrous
            Base: *Incredible
            Note: +2CS to Cost for very high-quality package.
          Note:
            - Multiple for ubiquity.
            - Security systems are magical in nature, rather than technological. Comprises wards, scrying sensors, arcane locks, etc.
            - Alarms telepathically alert Ashtaret and Allatou, irrespective of distance or dimension.
            - Ashtaret and Allatou may telepathically activate and deactivate alarms, and lock and unlock locks, irrespective of distance or dimesion.
          Description: |
            Cost: Good — one Security package to a door or window. Occupies no space. Consists of hand-set burglar alarms on windows and doors, coupled with mechanical locks. At Excellent Cost: Automatic burglar alarms with computer-code or card identification system. At Remarkable Cost: Automatic burglar alarms with palm-print scan, can activate defense systems. At Incredible Cost: Full body scan with benign identification program as to hostility. Can activate defense systems.
        Defense Package:
          Cost:
            Value: *Monstrous
            Base: *Incredible
          Note:
            - Multiple for effects.
            - Defensive systems are magical in nature, rather than technological. Beams originate from gems over doorframes or archways, statue mouths and eyes, floating orbs, etc.
            - Defensive Weapons:
              Intensity: *Amazing
              Material Strength: *Amazing
              Range: 20
              Rate: 1
              Note:
                - Emitters may fire one of 3 types of beams per turn, a single target or a Burst.
                - Bursts may affect up to 3 adjacent targets with a single roll.
                - Intensity is the effective Fighting, Agility, or Strength for any attacks or FEATs, as well as Range.
                - Material Strength is the effective Endurance for any FEATs.
                - Stunning requires Enduance FEAT vs Intensity or pass out for 1-10 turns
                - Concussion Beams, Lasers
                - There are enough beam origins to cover any room or area, at least six per (120+ total).
                - For any space, in area or room, there are at least 3 origin able to hit that spot.
              Types:
                Stun Beam: Stunning
                Concussion Beam: Force
                Laser Beam: Energy
                Tentacle:
                  - Stunning
                  - Blunt Attack
                  - Grappling
                  - Grabbing
          Description: |
            Cost: Excellent Will protect one or more areas. Pre-set defenses consisting of entangling tentacles or nets or lasers or stun rifles, or concussive rifles or pit traps, with the maximum of Remarkable Strength or Intensity. Remarkable Cost: Defenses activated by Security package, consists of one type as above of Incredible Strength. Incredible Cost: As above, intensities are of Amazing Strength. Multiple defense mechanisms may protect the same establishment (example, the WCA compound consists of net-filled pits, stun rifles disguised as trees, and a passive alarm system in the Security Package). Specialized defense packages may be designed.
        Porches, storage, bathrooms, and closets:
          Cost: *Unranked
          Note: Running water and other expected amenities are magical or natural, rather than technological. Porches are colonnaded peristyles and loggia around courtyards, as there are no outside entrances.
          Description: |
            These are assumed in the cost of the building, according to its design. These rooms cost nothing, and no package exists other than what the heroes decide to stuff into the closets.
        Trophy Room Package:
          Cost:
            Value: *Amazing
            Base: *Remarkable
            Note: +2CS to Cost for very high-quality package.
          Note: Multiple.
          Description: |
            Excellent. Occupies one room. Contains showcase, lighting, frames to display mementos, and may be used as a reception half or gallery. At Remarkable Cost, contains capability to handle potentially dangerous exhibits at the Incredible level.
        Imprisonment Package:
          Cost:
            Value: *Monstrous
            Base: *Incredible
            Note: +2CS to Cost for very high-quality package.
          Note: Multiple.
          Description: |
            Excellent. Occupies one room. Contains standard restraining devices, including bars of Remarkable material strength. At Remarkable Cost, restraining devices made of Incredible Strength. At Incredible Cost, restraining devices at Amazing Strength and Excellent Strength inhibitor restraints.
      Note:
        - About 20+ areas over about 3+ levels.
        - Descriptions are references from the Ultimate Player's Book chapter on Headquarters, and exemplary, rather than canonical, functionally or qualitatively generally equivalent to the contents of the extraplanar domain by comparison to 1980's Manhattan, rather than literal descriptions.
        - Portal Room to secure Black Mirror instance is a combination of Trophy Room and Imprisonment Package features, designed to keep interlopers somehow emerging from the Black Mirror confined away from access to the rest of her domain.
        - Scrying Room for the Satan-Sphere and Interdimensional Scanner is a combination of Trophy Room and Conference Room features.
        - Throne Room for holding court is a combination of Conference Room and Office Package features. It features an enormous, ornate throne of basalt, obsidian, and iron.
        - Bedrooms, of which there are many, feature subtle implementations of the Imprisonment Package as described. An Amazing Intensity feat is required to notice them when they are inactive. Bedchambers are opulent but austere, matching the rest of the domain.
        - Servants: &Servants
            Note: These are created or summoned by the Servant spell, and are elemental or demonic spirits, or magical automatons, rather than technological robots, but have the same general roles, Abilities, and other features.
            Types:
              - Name: Robot, Standard
                Cost: *Incredible
                Description: |
                  The Standard Robot is only capable of simple tasks and has no special abilities other than to record what transpires before its recorders and perform simple tasks. The H.E.R.B.I.E. series was a modified form of the standard robot. All Standard robot abilities are Typical.
              - Name: Robot, Sentry
                Cost: *Incredible
                Description: |
                  The Sentry Robot has a bit more programming and firepower. It is programmed to identify hostile threats (that is — anything not in its bank) and open fire. Sentry robots come equipped with Good Strength lasers, though some may be additionally armed. All sentry robot abilities are Good.
              - Name: Robot, Talent
                Cost: *Amazing
                Note: Exceptional Attribute and Talents possessed depend on role.
                Description: |
                  The Talent Robot is a robot specifically designed for a certain purpose, and its programming reflects that purpose. The Avengers' fire-fighting robots or the robotic opponent the Black Knight uses are examples of talent robots. Such robots may have one ability at Remarkable level. All others are Excellent.
      Description: |
        A small, obscure, demiplanar pocket with nebulous dimensions and borders that straddles Hell Dimension and the Dimension of Dreams, with a readily accessible border with the Astral Plane, Ashtaret's domain is not strictly a structure or building, though there are areas that appear to be "inside," as well as "outside," and "underground." The substructure of "walls," "ceilings," "floors," and "the ground" are an ultrahard, impenetrable, basalt-like material.  There is "weather" of sorts in the "sky" of the "outdoor" portions, and flying away from the surface eventually leads to the Astral Plane. However, this is ultimately a one-way trip once the flyer has passed fully into the Astral, requiring a different mechanism to return.
        As Ashtaret satisfies her needs with Powers and Spells, the lair has few amenities although everything there is of opulent quality, as it primarily comprises places for Ashtaret to keep her Grimoires and other Mystic Texts, along with any treasures, prisoners, or other possessions, as well as a place for her to sit and hold court. The architecture and design are reminiscent of ancient Mesopotamian aesthetics, and the statuary and friezes and other elements, as well as the lighting and temperature, all respond subtly to her emotional state, changing their countenance or content to reflect her moods. The temperature, atmosphere, and other conditions are survivable, even livable, if not pleasant or comfortable, for humans, animals, and humanlike beings. There is no modern technology present, with amenities such as cooking, hot water, and lighting provided by hellfire and witchlight, running water from "natural" springs, and plumbing, drainage, and waste disposal by the void itself. Though indeed opulent in construction and ornamentation, it is also somewhat spare and spartan, empty and uninhabited save her herself and her Servants, robotic except for Allatou; she finds it stifling and boring to spend too much time there.
