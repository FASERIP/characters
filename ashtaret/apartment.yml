  Headquarters:
    Note:
      - Cost is a reflection of location as well as size of the structure. The listed prices are for a building in most American cities and their suburban surroundings. If the heroes are apartment hunting in Manhattan or the richer suburbs, the price is +1CS.
      - Room Package Costs are for a fairly nice selection of material. Very high-quality packages (a Library Package stocked with first editions) may be +1CS or +2CS.
    Example Manhattan Apartment:
      Type:
        - 1BR Apartment
        - 2BR Apartment
        - 3BR Apartment
      Cost:
        Rent:
          1BR Apartment:
            Value: *Poor
            Base: *Feeble
            Note: +1CS to Cost for Manhattan Location
          2BR Apartment:
            Value: *Typical
            Base: *Poor
            Note: +1CS to Cost for Manhattan Location
          3BR Apartment:
            Value: *Excellent
            Base: *Good
            Note: +1CS to Cost for Manhattan Location
      Size: Small
      Material Strength: *Good
      Room Packages:
        Living Room Package:
          Cost:
            Low: *Good
            Mid: *Excellent
            High: *Remarkable
          Description: |
            Cost: Good Occupies one room. Consists of sofa, two easy chairs, two end tables, coffee tables, two lamps (ceiling table or floor). At Excellent Cost add television, stereo set-up, or piano. At Remarkable Cost add all three.
        Dining Room Package:
          Cost:
            Low: *Good
            Mid: *Excellent
            High: *Remarkable
          Description: |
            Cost: Good Occupies one room. Consists of table, four chairs, ceiling lamp. At Excellent Cost add large table, bureau and four more chairs. At Remarkable Cost add china cabinet, set of good china and sterling tableware.
        Kitchen Package:
          Cost:
            Low: *Good
            Mid: *Excellent
            High: *Remarkable
          Note:
          Fire Extinguisher:
            Price: *Typical
            Note: Included in Kitchen Package with Cost Excellent or better, kept at appropriate Headquarters residences.
            Description: |
              Fire Extinguishers inflict no damage normally, but against fire are of Good Intensity (eliminate fire of Typical Intensity or less in the same area on a green FEAT, of Good Intensity on a yellow, and up to Excellent on a red). Against characters with flaming powers causes a FEAT roll against that Intensity to retain flame.
          Description: |
            Cost: Good Occupies one room. Consists of sink, stove (gas or electric), four cabinets, dishware and stainless tableware, counterspace. This version is standard equipment with most residential housing. At Excellent Cost add refrigerator, dishwasher, or microwave, plus a fire extinguisher. At Remarkable Cost add all three and freezer.
        Storage, bathrooms, and closets:
          Cost: *Unranked
          Description: |
            These are assumed in the cost of the building, according to its design.
        Security Package:
          Cost:
            Low: *Good
            High: *Excellent
          Description: |
            Cost: Excellent One Security package to a door or window. Occupies no space. Consists of hand-set burglar alarms on windows and doors, coupled with mechanical locks.  At Excellent Cost, automatic burglar alarms with computer-code or card identification system.
        Fire Protection Package:
          Cost: *Excellent
          Description: |
            Cost: Excellent Occupies no space. Sprinkler system that may cover up to 10 rooms, provides Good protection from fire.
      Note:
        - Example typical residences for Normal Human Aspect cover identity. Rented furnished. Neighborhood, type, and packages may vary by cover identity.
        - There are probably several cats coming and going as they please.
        - Very high-quality room packages may be +1CS or +2CS to Cost, especially in higher-end residences.
