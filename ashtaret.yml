                  Note: May be summoned by Ashtaret via the Servant Spell.
                  Biography: |
                    The discarded demonic aspect of Ereshkigal, Allatou was absorbed by Ashtaret and focused into a Familiar.  She serves as Ashtaret's majordomo, executor, and consigliere, and her word is Ashtaret's.
                  Personality: |
                    Somewhat paradoxically harsh, stern, and serious on one hand, but flirtatious, flamboyant, and almost comically macabre on the other.   Highly competent. Absolutely devoted and loyal to Ashtaret. Comfortable with modern technology. Generally professional but has outbursts. "Work Hard, Play Hard—Uptight then Let Loose"
                  Description: |
                    A tall, slender woman with a decidedly devilish mien, with dark bronze-olive skin, long, spiraling black curls, and deep amber eyes.  Her typical appearance in human form is much the same, less the devilishness.
