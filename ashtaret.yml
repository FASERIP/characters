    Reference:
      Origin: 
        Physical Form:
          Normal Human:
            Description: &Normal_Human |
              The body is completely normal and possesses no detectable abnormalities. Any Powers the hero possesses have left no visible mark on the body.
              
              - Random ranks are rolled on Column 2 of the Random Ranks Table.
              - Resources are increased +1CS.
          Demon:
            Description: &Demon |
              These are magical beings from other planes of existence. They are both supernatural and corporeal in nature. The main difference between these types is their inherent personality. "Angels" are benevolent; "demons" are malevolent. Other than that, there isn't much difference.

              These beings resemble characters from various mythologies. This affects their Popularity. Angels gain +2CS while demons lose -2CS on their initial Popularity. These beings do not necessarily follow the popular traditional behavior patterns. A heroic demon might be fighting a personal war against other, even more evil beings. A crazed angel might be a villain, seeking to purify the Earth at any cost.

              - Demons roll on Column 5.
              - Demons have no initial Contacts but will soon be sought out by groups who see them as symbols or tools.
              - All Physical Abilities are raised +1CS.
              - Such beings possess a Psychological Weakness that Negates their Power.
              - Demons lose -2CS Popularity.
              - Demons automatically possess Good Fire Generation and Specific Invulnerability to Heat and Fire.
          Deity:
            Description: &Deity |
              This is an "Entity of Great Power" — or rather, was such a being. The deity was an actual god, demigod, or close relative who was actually worshipped at some point in the past. Now his powers have waned because the religion which was devoted to him is no longer practiced. His followers have disappeared into the annals of history. Thor is an example of such a being.

              Now he is a god-on-Earth and locked into a mortal shell. He is still a formidable being, though. Deities have increased ranks in all their primary abilities and cannot really die in the Earth Dimension unless the slayer is another deity. Each deity has a home dimension; on that plane the deity loses his special protection from death.

              Deities are usable as player characters. The Marvel Universe includes Asgardians, Olympians, and deities from a host of other pantheons. Both Thor and Hercules are members of the Avengers. Snowbird, daughter of an Inuit goddess, is a member of Alpha Flight. The thing that permits their playability is their diminished Power. Once Odin formed the Earth from the blood and bones of a slain Ice Giant, but he can't do things like that anymore.

              There are three reasons a deity might be found on Earth. One is that his Powers have diminished to such a point that the Earth Dimension is the only place he can survive. The second is that he has been sent to the Earth Dimension by other, more powerful Deities. Both Thor and Snowbird are in this category. The third reason is that the deity is bored with timeless infinity and is slumming it on Earth as a way of generating excitement. Hercules fits this bill.

              Actually, there is also a fourth reason. The deity might be on Earth seeking Power, whether by regaining worshippers or establishing a portal between Earth and his home dimension. However, for game purposes, this reason is restricted to NPC deities who are acting as villains in your campaign.

              - Deities roll on Column 5.
              - All primary abilities are raised +2CS.
              - Deities automatically possess at least one Travel Power.
              - Deities gain two additional Powers.
              - Deities have increased Popularity (+2CS) with the public but zero Popularity with the hierarchy of the major established Earth religions.
              - Deities eventually attract any remaining living worshippers they still have. All of these people serve as Contacts. A deity PC who abuses his worshippers faces a stiff Karma penalty.
              - Deities are honor-bound not to actively promote a religion based on themselves. Deity PCs who try this lose -1CS from all their Abilities and Powers.
          Animal:
            Description: &Animal |
              This is a catch-all category that includes fish, mammals, birds, reptiles, and the rest of Earth's fauna, in addition to aliens that do not fit into any other category. About the only example of this in the Marvel Universe is Lockheed, the dragon. Your campaign, on the other hand, might be filled with heroic Animals or really peculiar aliens (I'll fudge a little and include Lockjaw, the Inhumans' "dog" as an example of this).

              Animal PCs have three main types of backgrounds. One is that the animal is a mutant. Another is that the animal was altered in ways that gave his intelligence and Power. The last is the animal is a relatively normal member of a race of animals like him (Lockheed, for example). The player can determine this in the Origins of Power section and embellish it to the best of his ability.

              Animals have to have a human Contact. People tend to see the human Contact as the animal's owner or trainer. People refuse initially to believe the animal is intelligent. Animals have very few legal rights, but they also have few responsibilities.

              - Animals roll on column 1.
              - Aliens in this category roll on column 5. Animals gain one less Power.
              - Animals automatically have two Detection Powers at Good rank.
              - Animals risk death or capture from people who are ignorant of the animal's true nature.
              - Resources are zero unless the animal has attached himself to a human. In this case, the Resource rank is assigned to that human.
          Ethereal:
            Description: &Ethereal |
              The hero is an intangible, disembodied spirit. He can be a ghost who once possesses a mortal shell, or belong to a race that always exists in this form. An Ethereal can drift about in any direction he chooses, and can pass through solid matter without any effort. The visibility of an Ethereal varies according to his whim; he can be invisible, transparent, translucent, or opaque.

              If the Ethereal is a ghost, his form resembles an idealized version of his old body. The ghost's appearance is actually based on his self-image and thus reflects the ghost's attitude toward himself. This is why ghosts are usually either very beautiful (or handsome) or quite pathetic.

              Ghosts are immune to most physical attacks with Intensities less than Unearthly. They are vulnerable to Mental and Magical attacks, especially by Powers that affect the spirit. Either Psi or Spirit Vampirism can destroy an Ethereal.

              While Ethereals are intangible on the Earth Dimension, they regain solidity in other Dimensions. In such realms Ethereals are vulnerable to all Powers except those that specifically affect Ethereals and other disembodied beings; these Powers are Spirit Summoning and Storage, Reincarnation, and Exorcism.

              If the Ethereal once had a solid body, he might not necessarily have died to reach his current state. He might have become an Ethereal by being directly transformed from solidity to ethereality. Such transformations can be magical, scientific, Power-based, accidental, or deliberate. The Red Ghost is an example of a Normal Human directly transformed into an Ethereal as a result of a scientific mishap.

              If the Ethereal possesses Alter Ego or Lifeform Creation, he can create a living body for himself. If he possesses Mental Domination, he can possess a human host.

              - Ethereals roll on column 1. (They're about as altered as a human can be).
              - Fighting rank is zero in the Earth Dimension, unless the Ethereal is fighting another Ethereal.
              - Physical attacks have a decreased effect on Ethereals (-9CS).
              - Spirit Vampirism completely destroys Ethereals. Psi-Vampirism destroys the self-image and reduces the Ethereal to a mindless Poltergeist.
              - At least one Contact can be a Spiritual Medium.
          Changeling:
            Description: &Changeling |
              The hero can transform into any of a number of possible Body Types. Each Body Type aspect of the Changeling possesses its regular advantages and disadvantages which apply only when the hero is in that particular form.

              What powers the hero possesses are assigned to any and all of his Aspects. Each Aspect must have one Power which is unique to it, a Power no other Aspect has.

              The hero can transform himself from one Aspect to another in 10 turns. During this time, no Powers can function and all Primary Abilities temporarily drop -2CS.

              Changeling is similar to the Power of Alter Ego. If the player rolls that Power while creating a Changeling character, he can discard it and roll another Power.

              - Changelings roll on column 5, regardless of what the various Aspects would roll on.
              - If while in one Aspect the hero loses all Health points, he can save his life by making a red Psyche FEAT. Success means he lives, but permanently loses the ability to transform into that Aspect.
              - Powers can be assigned to any or all Aspects. Each Aspect must have a unique Power not shared with other Aspects.
        Origin of Power:
          Creation:
            Description: &Creation |
              The hero was born in the form he now has, that of an adult who possesses Power and/or whatever the Body Type is. Most of the Artificial Body Types belong in this class. Examples include the android Human Torch, all robots, angels, demons, and deities.
      Weaknesses:
        Stimuli:
          Psychological Weakness:
            Description: &Psychological_Weakness |
              A specific event, condition, or mental state has an adverse effect on the hero. This Stimulus directly affects the hero's mind; any resulting physical damage is psychosomatic in nature. That is, any physical damage results are due to the hero's instinctive belief in those results.

              Examples include being physically bound, even if the hero could normally snap the binding material; facing a foe covered in a specific color; or feeling extremely confused.

              Psychological Weaknesses can be temporarily overcome by an Unearthly Intensity Psyche FEAT. They can be permanently overcome by a Shift-Z Intensity Psyche FEAT.
          Elemental Allergy:
            Description: &Elemental_Allergy |
              The hero suffers adverse effects if he is exposed to a specific one of the hundred-odd elements. This Allergy only occurs if the element is present in a pure state and in an accumulation of at least one ounce. If the element is combined in a molecular state or is in insufficient quantities, no Effect occurs. The element must be within 20 feet of the hero for it to have any Effect.

              This allergy can be overcome by physically insulating the hero from the element or by increasing the distance between them.
          Molecular Allergy:
            Description: &Molecular_Allergy |
              This is similar to Elemental Allergy. A specific compound causes the Effect. Common examples include water, wood, and Adamantium.
          Energy Allergy:
            Description: &Energy_Allergy |
              The hero suffers when he is exposed to a specific form of energy. This can be any wavelength or Intensity of energy found in the Energy Emission and Energy Control sections of this book. Sunlight is a common example of Energy Allergy, particularly when dealing with supernatural beings.
          Energy Depletion:
            Description: &Energy_Depletion |
              The hero has a finite energy supply that permits him to manifest Power. This energy must be periodically renewed by means of rest, food, Energy Absorption, Energy Vampirism, or simply making contact with a source of that energy. If the hero's energy level drops too low, dire Effects result.
        Effects:
          Power Negation:
            Description: &Power_Negation |
              The hero's Powers cease to function when the hero is within 20 feet of the stimulus. The hero's Primary Abilities are also affected; these drop -1CS per 10 turns until a minimum rank of Typical is reached for all of them. If the. hero is beyond the 20 foot limit but tries to use his Powers to affect the Stimulus, certain uses of Power automatically fail. Any Power that directly acts on a target cannot affect a Stimulus. Only Powers that indirectly affect the Stimulus succeed, such as using brute force to lob missiles at the Stimulus.
          Fatal:
            Description: &Fatal |
              As in the above, the hero gets ill after the initial exposure to the Stimulus. However, the Health loss does not stop at zero. Death will eventually occur if Health and (subsequently) Endurance drop to zero during the Weakness Duration. The hero can be revived if proper medical attention is given, but only after his Health and Endurance have both reached zero.
        Duration:
          Continuous with Contact:
            Description: &Continuous_with_Contact |
              As long as the hero remains within the effective range of the Stimulus, the Effect continues. When the hero is insulated or moved away from the Stimulus, the Effect immediately ceases. Lost Health points are returned at a rate of 2 per turn. If death has occurred, the hero now has the possibility of being revived.
          Permanent:
            Description: &Permanent |
              The Stimulus does its full damage to the hero, even when exposure to the Stimulus has been interrupted. In this case, the Stimulus sets off a bodily self-destruction sequence that must continue to its full extent. In the case of Power Negation, the hero's Powers are permanently lost. Incapacitation results in the hero reaching zero Health points and lapsing into a coma lasting 1 -10 days. After that time, he may regain his Health at the normal rate. Fatal results in the death of the hero as both Health and Endurance drop to zero. The hero can be revived, however, and will eventually recover if revival occurs.
        References:
          Demon: &Weakness_Demon
            Stimulus: *Psychological_Weakness
            Effect: *Power_Negation
            Duration: *Continuous_with_Contact
            Conditions: Hallowed Ground
            Note: Sites consecrated to the Annunaki (including Ashtaret and Allatou) do not trigger this Weakness.
          Ethereal: &Weakness_Ethereal
            Stimulus: Psychological
            Effect: Special
            Duration: *Continuous_with_Contact
            Conditions: Hallowed Ground
            Note: Sites consecrated to the Annunaki (including Ashtaret and Allatou) do not trigger this Weakness.
          Normal Human: &Weakness_Normal_Human
            Stimulus:
              Elemental Allergy: *Elemental_Allergy
              Molecular Allergy: *Molecular_Allergy
              Energy Allergy: *Energy_Allergy
            Effect: *Fatal
            Duration: *Continuous_with_Contact
            Conditions: Exposure to dangerous energies or toxic substances causes loss of Health and Endurance.  May heal as normal after exposure ceases.
            Note: This Weakness simply reflects how dangerous substances and energy like poison, fire, radiation, electricity, etc. affect Normal Humans.
      Abilities:
        Special Abilities:
          Powers:
            Note: Powers with alternate forms are redacted for only those forms included in the character sheets.
            Defensive:
              Body Armor:
                Description: &Body_Armor |
                  The hero possesses artificially-created armor that provides protection and possibly a way of possessing other Powers.
                  Armor comes in many forms exotic plate-mail, nuclear-powered exoskeletons, or mechanically-created force fields. The player should work with the Judge to create proper Armor for his hero. The player can also determine which Powers are possessed by the hero and which are properties of the armor. Powers built into the armor can later be modified and enhanced: think of the changes Tony Stark has made in the Iron Man armor. On the other hand, Powers that are built into the armor may suffer mechanical failure. The Armor's Power rank determines its ability to resist damage.

                  The player also has to determine where he got the Armor in the first place. This is covered in the "Character Creation" section elsewhere in this book. If the hero gained the armor through an accident, he might not be able to repair it.
              Resistance to Emotion Attacks:
                Description: &Resistance_to_Emotion_Attacks |
                  The hero has increased resistance to emotion-related attacks. Such attacks include Emotion Control, Hallucinations, Domination, and attacks aimed at the Intuition. The hero can ignore attacks with Intensities less than the Power rank, and may reduce damage from higher level attacks by the Power rank number.

                  This Power rank must be at least equal to the hero's Intuition +1CS; if a lower rank is initially rolled, the player should raise it to the Intuition rank +1CS.
              Resistance to Energy Attacks:
                Description: &Resistance_to_Energy_Attacks |
                  The hero has an increased resistance to any emitted energy form, whether artificial, natural, or Power-based. Such attacks include Light, Heat, Flame, Plasma, Hard radiation, Electricity, Vibration, Sonics, Cold, and Kinetic Bolts (most of the Energy Emission category).

                  Note that this Power overlaps [D15](#d15). The hero can ignore attacks with Intensities less than his Power rank and may reduce higher level attacks by his Power rank number. When creating the hero, the player can raise his rank +1CS by choosing to specialize in a specific Energy Resistance. For example, the Player's Book contains listings for Resistance to Fire and Heat, Cold, Electricity, and Radiation.
              Resistance to Magic Attacks:
                Description: &Resistance_to_Magic_Attacks |
                  The hero has increased resistance to magic based attacks, whether physical or mental in orientation. Unlike [D11](#d11) and [D14](#d14), this Power rank can be lower than the Psyche rank, making the hero more vulnerable to some types of magic.

                  The hero can ignore any magic whose rank is less than this Power's rank and can reduce higher level attacks by the Power rank number.
              Resistance to Mental Attacks:
                Description: &Resistance_to_Mental_Attacks |
                  The hero has increased resistance to attacks aimed at the mind and neural system. Such attacks include psionics, neural manipulation, and any other attacks aimed at the Psyche. It does not include emotion-based attacks (see [D11](#d11)) or magical attacks (see [D13](#d13)). The Power's rank must be at least one rank higher than the hero's Psyche; if a lower rank is rolled initially, the player should raise it to that rank +1CS.
              Resistance to Physical Attacks:
                Description: &Resistance_to_Physical_Attacks |
                  The hero has increased resistance to any physical attack. This includes brute force, chemical weapons, biochemicals, disease, hostile environments, and temperature extremes. The hero can ignore any physical attacks with Intensities less than. the Power rank, and may reduce damage from higher level attacks by the Power rank number.

                  When creating the hero, the player can raise the Power rank +1CS by choosing to specialize in a specific Physical Resistance. For example, the Player's Book contains listings for Resistances to Fire and Heat, Corrosives, and Disease.
              Resistance to Power Manipulation:
                Description: &Resistance_to_Power_Manipulation |
                  The hero has increased resistance to attacks that directly affect the hero's Powers. Such attacks include Weakness Creation, Power Control, Power Domination, Magic Control, and Magician Domination.

                  The hero can ignore any attack who rank is less than this Power rank. He may reduce the effectiveness of the higher level attacks by the Power rank number.
              Resistance to Vampirism:
                Description: &Resistance_to_Vampirism |
                  The hero has increased resistance to any vampiric-type attacks. Such attacks include forms of Psi-, Bio-, Energy, Magic, and Power Vampirism.

                  The hero can ignore any vampiric attack whose rank is less than this Power's rank. He can reduce the effectiveness of the vampire's attack by deducting his Power rank number from the vampiric attack's Power rank.

                  When creating the hero, the player can choose to raise the rank +2CS by specializing in a particular form of Resistance.
            Detection:
              Environmental Awareness:
                Description: &Environmental_Awareness |
                  Range column B. The hero has increased sensitivity to conditions in, disturbances in, and influences on the environment. The hero automatically maintains full knowledge of current conditions in his surroundings. This awareness extends to such factors as weather, chemicals, movement, and life.

                  The rank determines the range to which the awareness extends: exceeding it requires a FEAT (+1CS, green; +2CS, yellow; +3CS, red). The hero can gain +1CS by linking his Health to the environment. In this symbiosis, harm to the environment is reflected in the hero's physical welfare.
              Extradimensional Detection:
                Description: &Extradimensional_Detection |
                  The hero can sense across the dimensional barrier and see things existing in other dimensions.

                  A list of some of the dimensions in the Marvel Universe is found in Realms of Magic. These include Asgard, the Astral Plane, Avalon, the Dark Dimension, the Demon Dimension, etc. The power rank number equals the number of different dimensions into which the hero can see.
              Hypersensitive Touch:
                Description: &Hypersensitive_Touch |
                  The hero possesses an Enhanced sense of touch that permits him to detect extremely fine surface details and to identify materials by their surface "feel."
              Life Detection:
                Description: &Life_Detection |
                  Range column B. The hero can detect the presence of life and identify the nature of that life. The hero can probe a specific target for more detailed physiological data on a red FEAT.

                  Rank determines the maximum range. A red FEAT allows the hero to locate a specific lifeform in the midst of a number of similar beings.

                  This is one of the Powers that can function as "Mutant Detection."
              Magic Detection:
                Description: &Magic_Detection |
                  The hero can detect and identify magic and its effects. The Power can detect both magic in actual use and in potential. As such, this is another way to detect mutants, although it cannot differentiate them from normal magic-users.

                  The hero can identify the past use of magic (a green FEAT), a yellow FEAT identifies the magic-user, and a red FEAT identifies the actual spell.
              Thermal Vision:
                Description: &Thermal_Vision |
                  The hero can see infrared light and heat images. This allows the hero to see in the dark, perceive temperature differences (especially those left by a living person's contact with an object), and partially see through solids. In the last case, the hero can only see the heat patterns of objects touching the other side of the barrier.

                  With practice, the hero can judge the temperature of a target by its thermal color. The hero has an increased risk of being blinded by strong heat sources, even those that don't affect normal vision (-1CS). Thermal vision may be a consciously-activated mode or the hero's normal means of vision.
              True Sight:
                Description: &True_Sight |
                  The hero can see the correct image of a target, despite any attempts at concealment or disguise. This Power can penetrate any means of hiding something's true nature, whether physical, psionic, illusionary, or power-based.

                  True Sight can penetrate any disguise at or below its rank. A green FEAT is required at +1CS; a yellow FEAT at +2CS; and a red FEAT at +3CS.

                  Range is limited to one area unless the Power is coupled with a Power that extends his vision (Telescopic Vision, for example). The Power may be automatic or deliberate. If automatic, the hero gains +1CS but loses -2CS from his Psyche rank.
              Weakness Detection:
                Description: &Weakness_Detection |
                  The hero can detect flaws and stress points in a target. This doesn't guarantee he can exploit this knowledge, though.

                  The rank determines the types of weaknesses he can detect. Good or below: physical weakness only. Excellent to Amazing: mental and physical weaknesses. Monstrous and above: mental physical, and Power-based weaknesses.
              Hypersensitive Hearing:
                Description: &Hypersensitive_Hearing |
                  The hero can detect extremely faint sounds and unusual frequencies. He can identify objects by the sounds they emit. Because of the sensitivity of the hero's hearing, he is more vulnerable to sonic attacks (which receive a +1CS against him).
              Hypersensitive Olfactory:
                Description: &Hypersensitive_Olfactory |
                  The hero can detect the presence of minute traces of substances and accurately identify them.

                  This Power is continually functioning: the hero has learned to ignore unpleasant smells. If he loses his ability to mask out nasty odors, he'll be so distracted (and possibly sickened) by the intruding odors that he loses -1CS on Reason and Endurance.
              Tracking Ability:
                Description: &Tracking_Ability |
                  The hero can detect and follow the tracks left by a specific target. The hero can detect environmental and spatial disturbances with the result that at high ranks the hero can actually track across deep space.
            Energy Control:
              Darkforce Manipulation:
                Description: &Darkforce_Manipulation |
                  This is a Power that is unique to campaigns using the Marvel Universe. It does not apply to campaigns set in other parts of the Multiverse.

                  The hero can generate and control the extra-dimensional energy-form known as "Darkforce." This resembles a tangible, impenetrable shadow and possesses several unique characteristics that the hero can use to develop Power Stunts:

                  The Darkforce is as yet undefined in the Marvel Universe. For your game's purposes, you might simply treat it as an other-dimensional power source that fills its own entire pocket dimension. That definition will work in or out of the official Marvel Universe.
              Fire Control:
                Description: &Fire_Control |
                  The hero can control existing flames, whether natural or Power-based. He can alter any factor involved in combustion without direct physical contact. The hero can increase or decrease the flame's Intensity up to his Power rank and reduce fire damage by his rank number. This Power includes Power rank Resistance to Fire and Heat. The most important aspect of this Power is enabling the hero to reshape flame into any form he desires. This can be used in a variety of Power stunts, as the hero develops numerous fiery constructs to perform miscellaneous deeds. Such fiery constructs do not act like normal flames. They emit less heat and consume less oxygen. Their fire doesn't spread past the outline of the constructs. In addition, they self-extinguish rapidly upon cessation of this Power. Optional Powers include Fire Generation, Thermal Control, Energy Sheath, and Energy Body.
              Shadowshaping:
                Description: &Shadowshaping |
                  This is not [Darkforce Manipulation](#darkforce_manipulation): that's handled elsewhere. This Power enables the hero to affect normal shadows and, indirectly, light as well. The hero can shift the location and size of normal shadows. He can form them into two-dimensional images that can do Power rank damage to real targets. The hero can also Remote Sense through these shadow-constructs. The hero can increase or decrease the Intensity of any shadow, whether natural or Power-based, by his Power rank number. This overlaps with Light Generation and Shadowcasting but differs in that either effect is possible and only existing shadows or shadow-related Powers are affected.

                  The hero has the ability to see through any shadow as if it were a normally-lit area, provided its Intensity is less than or equal to his Power rank. This does not apply to Darkforce, however.

                  This Power includes Power rank Resistance to shadow-based Powers.

                  This has the Bonus Power of [Shadowcasting](#shadowcasting).

                  Optional Powers include [Light Control](#light_control), [Energy Sheath](#energy_sheath), and [Energy Body](#energy_body). In the last two cases, the hero resembles a living shadow.
            Energy Emission:
              Fire Generation:
                Description: &Fire_Generation |
                  The hero can project fire with Power rank damage and range. These flames have no apparent fuel source and spring from the hero as if he were a living fuel tank. Although the flames' fuel comes out of the proverbial nowhere, free oxygen must be present for the Power to function. If not, the hero can cause a single flame that lasts' only one turn, then fizzles out. At Shift X rank, the hero gains the ability to generate oxygen as well, permitting this Power to function under any conditions. When creating the hero, the player can choose the Powers of Flame Control, Energy Sheath, and Energy Body to fill any slots still open. For example, under the Ultimate system, the Human Torch possesses three powers: Fire Generation, Fire Control, and Energy Sheath.

                  This has to be the most dangerous Power around. Heroes have to watch out for accidental firestorms. They also tend to consume all the oxygen in their location, making everyone pass out. Then there is the question of smoke and gases created by the hero's Flame Power. It makes me wonder what kind of ventilation system the Baxter Building has…

                  Fire Generation is the opposing Power to Cold Emission, Coldshaping, and Powers that use water. This Power gains +1CS when fighting these Powers. It also loses -1CS when being attacked by those Powers
              Kinetic Bolt:
                Description: &Kinetic_Bolt |
                  This is a crude form of M30/Telekinesis. The hero can strike a target with a surge of force at Power rank range and damage. The Kinetic Bolt can be shaped as desired by the hero. It can be a wide cylinder, or an incredibly fine needle. Its effect is the same as if the target had been struck by a solid object of equal material strength. This Power can affect only tangible materials. It includes Resistance to Kinetic Bolts, Kinetic Control, or Telekinesis. Optional Powers are Kinetic Control and Telekinesis, which are also the Nemeses.
              Shadowcasting:
                Description: &Shadowcasting |
                  The hero can emit a field that decreases light and radiation. The obscured energy's Intensity is lowered by the Power's rank taken as Intensity. The energy forms that can be affected by this Power are [Light](#light_emission), [Heat](#heat), [Hard Radiation](#hard_radiation_emission), [Radiowaves](#radiowave_generation), [Energy Doppelgangers](#energy_doppelganger), and [Energy Bodies](#energy_body).

                  The hero possesses the ability to affect only [Light](#light_emission) when his Power is at Good rank. At each rank above Good, he gains the ability to affect another energy form in the following order: EX-[Heat](#heat), RM-[Hard Radiation](#hard_radiation_emission), IN-[Radiowaves](#radiowave_generation), AM-[Energy Doppelgangers](#energy_doppelganger), MN-[Energy Bodies](#energy_body).

                  This Power includes the ability to see clearly through his own natural or Power-created shadows of Intensity less that the hero's Power rank.

                  The Power can disrupt [Darkforce Manipulation](#darkforce_manipulation) on a Typical Intensity FEAT if its rank is higher than that of the Darkforce manipulator, Remarkable Intensity FEAT if they are equal, and Unearthly Intensity FEAT if the Power's rank is lower.

                  Optional Powers include [Shadowshaping](#shadowshaping) and [Darkforce Manipulation](#darkforce_manipulation).

                  The Nemesis is [Light Emission](#light_emission).
            Fighting:
              Natural Weaponry:
                Description: &Natural_Weaponry |
                  The hero's body contains special anatomical features that can function as weapons. These may be of any nature and can be external, internal, or retractable. If these are damaged the hero suffers as if they were normal body parts.

                  When creating the hero, the player decides the nature of the weaponry. The weaponry chosen possesses this Power and rank taken as material strength for purposes of determining potential damage.

                  Each time the player rolls this Power, he can add another weapon to the hero. As stated in the Player's Book, some forms of Natural Weaponry provide Bonus Powers (see "Claws" and "Extra Body Parts"). These are placed in the next available slot in the Power Generation. The player and the Judge need to work together to create a functional hero. A drawback to this Power is that if the hero is somehow deprived of his Natural Weaponry, he suffers a loss to his Fighting Ability equal to his weapon's rank. Example: Due to a mishap with a matter transmitter, Wolverine temporarily loses his claws. He's so shaken that his normal Incredible Fighting Ability drops to Feeble.

                  If the Natural Weaponry is made of materials not normally found in the body, it makes the hero vulnerable to attacks that affect those materials. For instance, Wolvie has a -1CS resistance to Magneto's powers, since they can affect his metal skeleton.
            Illusory:
              Illusion-Casting:
                Description: &Illusion-Casting |
                  The hero can create realistic holographic images that have apparent solidity. These Illusions can be mechanically detected and recorded by such means as photography or television. That separates this Power from the psionic, image-generating Power called Hallucinations, which produces images directly in the target's mind and cannot affect mechanical senses.

                  The Illusion can take any size or appearance the hero desires and is limited only by his imagination. The Illusion can be a realistic simulation, a fanciful creation direct from the hero's mind, or an abstract display of light. The hero is playing with light itself and can create anything that is visible. Since most people depend. on vision to gain information on their surroundings, this Power presents the awesome ability to apparently alter the nature of reality.

                  The hero can cast his Illusions anywhere within his Power rank range, though he must be able to clearly see the area where the Illusion is forming if he wants to make it at all realistic. The normal limit for unaided vision is one area (132 feet). Beyond that range the hero can no longer clearly see his Illusion's surroundings and thus cannot alter the Illusion to reflect things going on around the Illusion.

                  For example, an Illusionary tree cast two areas away might seem to be floating a discreet two inches above the ground.

                  If the hero is unconcerned about maintaining the reality of his Illusions, this limit can be ignored. The hero does not even need to be able to see the Illusion as it forms. Such uncontrolled Illusions appear as transparent, free-floating apparitions. If the Illusion takes the form of a living being, viewers might see it as a ghost or other phantom form. If the hero possesses a means of extending the range of his senses, he can maintain the realism m of his Illusion at up to full range of both this Power and that of whatever means he uses to extend his vision. Ways of increasing the senses' range include mechanical means such as binoculars and remote TV cameras and sense-extending Powers, most notably Telescopic Vision and Clairvoyance.

                  Example: Deetee has an Incredible rank and can Illusion-Cast up to two miles away. She also has a good pair of binoculars that enable her to see up to one mile away. For idle amusement, she likes to go to the top of tall buildings and Cast Illusions at the pedestrians below. She also like to find the monitors for remote surveillance cameras and use them to direct her Illusions into locked rooms.

                  Illusions last as long as the hero concentrates on maintaining their existence. The Judge is free to determine how long the hero can maintain his concentration in a given circumstance. Breaking the hero's concentration abruptly terminates the Illusion, while merely getting distracted causes the Illusion to begin to lose realism (drift, lose detail, become translucent, and so on). The Illusion's effect on a viewer varies. A viewer must make an Intuition FEAT against the Power rank of the Illusion-caster: success means the viewer now recognizes the Illusion's true nature. Players running characters viewing an Illusion are only allowed to make a FEAT if they suspect the Illusion. This can occur if they physically touch the Illusion, if the Illusion is somehow flawed, or if the character is just naturally cynical. ("Congratulations, Les. So far this morning you have attempted to disbelieve the existence of a flying saucer, Galactus, two muggers, and your breakfast."). Since Illusion-Casting includes the Power of Light Control, Illusions can provide a measure of protection against light-based attacks. An Illusory tent would provide protection against both infrared and ultraviolet light, thus keeping the hero cool and safe from sunburn. Treat this Power as +2CS Resistance to Light-based attacks. It does not provide protection against any of the other ways Moms Nature has of affecting us. That Illusory tent would be drafty, cold, and flimsy.

                  Illusion Casting can be combined with other Powers to give 1he Illusion enhanced realism: this can also create Illusions that do real physical damage. If the Illusion-caster has any of the Energy Emission Powers, these can be redirected to apparently originate from the Illusion rather than from the hero.

                  For example, combining this Power with Plasma Generation would simulate the Phoenix-force and fry any electronics in the area.

                  More commonly, the power is used to disguise the true nature of anything the hero or her companions might be doing.

                  Example: Deetee and her buddy Jayboy have to break into a certain building that they know is under surveillance. Deetee doesn't care about subtlety, only About distraction, and casts an Illusion of a Large elephant that comes lumbering around a corner and lies down in front of the door. Inside the elephantine Illusion, Jayboy is free to use his Kinetic Bolt Power to smash open the door. He also uses his K-bolts to simulate the effect the elephant's legs have when they kick against a target.

                  The main drawback to Illusion-Casting is that the hero must keep his Power's true nature a secret from his adversaries. It must be presented as if it were another Power entirely.

                  For example, although she is an Illusion-caster, Deetee often presents herself as a Demon-Summoner.

                  Even if the Power's nature is public knowledge, the Power is still effective. The Powers of Light Emission and Light Control are innate factors of Illusion Casting. As such, the hero has the ability to generate any intensity and frequency of light. He can warp light, alter its frequency, and change its degree of coherency. The hero can do -2CS rank level damage using light-based attacks. As noted earlier, the Power includes -2CS Resistance to Light-based attacks: the hero simply casts an Illusion of something opaque between herself and the offending light. The hero can simulate other visual Powers or Talents with some effectiveness as well: the -2CS limit is used as a guide for determining how well the hero can do these things.

                  Example: Once inside the building, Deetee and Jay-boy discover a guard. Deetee casts an Illusion of Ringmaster and tries to hypnotize the guard. Her Incredible rank is reduced to merely Excellent when she tries simulate Hypnotic Control. Fortunately that is enough: the guard falls under the spurious Ringmaster's control.

                  Powers that are a part of or can be simulated by Illusion-Casting include:

                  - D4/Force Field vs. Energy
                  - D12/Resistance to Energy
                  - DT3/Energy Detection (Light)
                  - EC14/Light Control
                  - EC18/Shadowshaping
                  - EE5/Hard Radiation Emission (UV Light)
                  - EE6/Heat (infrared Light)
                  - EE8/Light Emission
                  - EE12/Shadowcasting
                  - I1/Animate Image
                  - I3/Illusory Invisibility
                  - I4/Illusory Duplication
                  - L9/Hypnotic Control
                  - MCo1/Coloration
                  - M13/Hallucinations
                  - S6/Blending
                  - S12/Energy Sheath (Light)
                  - S20/Self-Vegetation
                  - S21/Shapeshifting

                  A drawback in characters who have this Power is that they tend to become philosophical about the relationship between Reality and Illusion. Companions find themselves drawn into interminable arguments about what is real and what is not. Illusion-Casters may even begin to feel that they themselves are an Illusion being cast by some unknown being.

                  Optional Powers include Energy Solidification, Telescopic Vision, and Clairvoyance.

                  Nemesis Powers include Shadowcasting, Shadowshaping, Sonar, Radar, and closing your eyes.
            Lifeform Control:
              Biophysical Control:
                Description: &Biophysical_Control |
                  The hero has the ability to consciously alter the physiology of a target. This is accomplished by sheer force of will and does not require any physical action on the hero's part, aside from touching the target. The Power can be used at a distance but each 10 feet separating the hero from the target reduces his effective Power by -1CS. The Power is normally concentrated on a single target, but the hero can affect as many targets as he desires. Each additional target also decreases the rank -1CS.

                  For example, trying to affect two targets at a distance of 10 feet drops the hero's rank -4CS (-2CS per target).

                  The result of any form of this Power is permanent. (What's the point of healing somebody if he's just going to drop dead later, right?) The actual ongoing effects continue for as long as the hero continues to use his Power. Once this is done, the target's natural healing abilities and rates revert to normal. There are seven forms of Biophysical Control, each with its own set of effects. The first four forms are benevolent, the last three are maievolent. Heroes who use the malevolent forms against sentient beings risk Karma and Popularity loss. When the hero is created, the player must choose one of these forms. He can select one or let the dice decide for him.

                  - **Healing:** The hero can cure the damage caused by wounds, trauma, toxins', and disease. The hero can increase the target's Health by'an amount equal to the Power rank level. This is the maximum benefit the hero can give per day to one specific person. The color of the required FEAT is determined by the nature and severity of the damage. Green FEATs handle broken bones, non-terminal disease, and simple wounds. Yellow FEATs handle physical trauma, wounds to organs, non-fatal poisoning, and terminal diseases. Red FEATs handle mortal wounds, coronary attacks, strokes, toxic poisoning, and massive physical trauma. The Power seals the body and returns any still-living tissues to health. It cannot replace lost tissue.
                  - **Regeneration:** The hero has the ability to heal (as above) and can recreate large areas of lost tissue, such as severed limbs or destroyed organs. Limbs are regrown by a green FEAT, organs by a yellow FEAT, and brain and neural tissues by a red FEAT.
                  - **Revival:** The hero can actually bring the dead back to life. The Power rank number is the maximum number of days the target can have been deceased and still be revived. The condition of the corpse determines the color of the required FEAT. An intact, unembalmed, undecayed corpse is revived on a green FEAT. A decayed but intact corpse needs a yellow FEAT. A red FEAT is required for partial or embalmed remains.
                    For example, a Good rank can revive a 10-day-old, slightly moldy body if the player rolls a 75 or better.
                    The Power begins by healing and regenerating any damage to the body, especially the cause of death. Once the body is habitable again, the Power automatically summons the deceased spirit back and reconnects it with the body. If the spirit was already reincarnated into another body, the spirit splits into identical halves. One remains with the new body while the other half returns home. If the spirit is trapped, the hero can make an attempt to free him based on the Power rank of whatever is holding the spirit. Until the spirit returns, the body remains in a comatose state.
                  - **Decay:** The hero can accelerate the cellular collapse of body tissue. The Power can cause Power rank damage per turn. The target becomes leprous, dies, and quickly crumbles to dust if the Power is used long enough.
                  - **Disruption:** The Power can upset the Smooth functioning of the physiology. The target suffers Power rank losses to his Health as he suffers anything from minor discomfort (nausea, chills) to fatal trauma (coronary attack).
                  - **Aging:** The Power can accelerate or reverse the aging process. The normal rate is multiplied by the Power rank number. For example, a Good rank can make aging occur at tenfold rate or go in reverse at an equal rate. A green FEAT accelerates aging. A yellow FEAT stops it. A red FEAT reverses it. As the victim's age changes, physiology and mental capacities change as well. While the Power can function as a Fountain of Youth, it can also be used to kill through old age or regression to protoplasm. A target can be protected from unwanted Biophysical Control by such Powers as Force Field Generation and True Invulnerability.

                  Optional Powers include another form of this Power.

                  The Nemesis is either Immortality or Serial Immortality.
              Exorcism:
                Description: &Exorcism |
                  The hero can release a being from any external domination imposed by a third party. Such controls include Possession, Mental Domination, Serial Immortality, and Magic. If there's a control, this Power can break it. This Power rank is compared to that of the Power controlling the subject. A Typical Intensity FEAT can sever a lower ranking control Power. A Remarkable Intensity FEAT severs a controlling Power of equal rank, and an Amazing Intensity FEAT severs one of one or more ranks higher. Upon severing the being's control over the subject, that being is immediately teleported to its home dimension.

                  This Power commonly appears as a spell used by sorcerers and holy men.

                  The hero must be within 10' of the subject in order to perform the Exorcism.

                  The hero can use this Power to resist the initial attempt by another to control him, but if this attempt fails (as per the FEATs listed above), he cannot Exorcise himself later.
              Forced Reincarnation:
                Description: &Forced_Reincarnation |
                  The hero can capture disembodied spirits and merge them into new bodies. The spirits can be the newly-dead, ghosts, or Free Spirits. The bodies can be anything: newborn infants, clones, androids, robots, animals, or plants. Because of the Power's interference, the reincarnated person retains his full memories and Mental Powers. The spirit is permanently bonded to the new body for as long as that body lives, unless the bond is deliberately broken by the spirit (a red Psyche FEAT) or by a hero with Exorcism Power (L5).

                  The hero can indefinitely hold the spirit in stasis (one Typical Intensity FEAT per day should be sufficient) while seeking absuitable body into which he can transplant the soul. If the hero fails a FEAT, he has 10 turns in which to implant the spirit or lose it forever.

                  The hero cannot transplant the spirit into a living, intelligent being-with two notable exceptions. As noted earlier, spirits can be placed within newborn infants. The hero can also accept the spirit into himself; the result is the hero now has a complete second person living in his head. The player now has to redo his character sheet to reflect the secondary set of characteristics for Reason, Intuition, and Psyche.

                  When a character is reincarnated into a body, he retains his abilities of Reason, Intuition, and Psyche, and any Mental Talents and Powers. Physical abilities, secondary characteristics, Physical Powers and Talents, and Contacts are all lost. Contacts can be quickly regained by convincing the Contacts of who he really is (a Remarkable Intensity FEAT).

                  Karma awards should depend on how well the hero has handled the spiritual transplant. Just dumping the spirit into the first available body can actually cost Karma, while going to extraordinary lengths to find the perfect situation entitles the hero to a hefty bonus.
              Hypnotic Control:
                Description: &Hypnotic_Control |
                  This is a Talent in the Advanced Set. The hero can dominate a target's behavior and actions by implanting commands, not by direct psionic control. The Hypnotic command may pertain to current conditions or lie dormant until triggered by future conditions (post-hypnotic suggestion). Hypnotic controls come in two forms:

                  Normal hypnosis cannot make a person perform any action that goes against his sense of ethics. However, the Power of Hypnotic Control can override the target's innate sense of morality by means of a red FEAT. Less conflicting commands involve only a green FEAT. Hypnotic Control can be established by any one of a number of means. These include specific gestures, words, songs, or devices. When creating the hero, the Player determines which method the hero uses.

                  The Intensity and duration of a Hypnotic Control are determined by the Power rank. In the case of post-hypnotic Suggestions, duration does not include the time prior to activation of the suggestion, but only the time the suggestion is actually in force.
              Mind Control:
                Description: &Mind_Control |
                  The hero has the ability to directly control a target's mind through psionic Powers. The hero completely overrides the will and perhaps even the conscious mind of the target. There are four forms of Mind Control:

                  - **Possession:** the target mind loses both control and consciousness.

                  The Power rank determines the Intensity of the hero's control, the range at which he can establish and maintain that control, and the duration of the control.
              Sleep-Induced:
                Description: &Sleep-Induced |
                  This is a nice, simple, straight-forward Power that is hardly ever used in any comic because it's not terribly dramatic. Nor is it exactly cricket. The hero has the ability to put any target into a deep sleep, from which he cannot awake while the Power is in effect. During this induced sleep, the target is completely helpless (see what I mean about not being cricket?). On the other hand, when you're facing 325 battle-crazed Skrulls, this Power can be really handy.

                  The Power rank determines the range and duration of the Power. Relevant distances are shown on column A of the Range Table. It affects everyone within range. Sleep persists for 1-10 hours after the Power's duration. During that time, the victim can be awakened by anyone, but he'll wake up naturally in any case.
              Summoning:
                Description: &Summoning |
                  The hero can summon and control extra-dimensional, corporeal beings. Such beings are commonly called "demons" but may be of any nature or disposition.

                  The Power enables the hero to summon any known extra-dimensional being, Provided his Power rank is higher than the being's Psyche rank, on a green FEAT. Equal ranks require a yellow FEAT. Trust me, you don't want to summon beings more powerful than you (they might answer), but if you do it anyway, you need a red FEAT. The summoned being is instantly teleported from its home dimension to a spot chosen by the hero. Once summoned, the being must perform a single task ordered by the hero. being must immediately set about fulfilling the order. If successful, he can immediately depart for his home dimension.

                  Players should refer to MHAC9, Realms of Magic, by Kim Eastland for a detailed list of beings this Power can summon. Normally, heroes will only summon magical creatures like demons and elementals. If a hero feels particularly confident, though, he might be able to call magical characters like Clea and D'Spayre. Heroes can never summon entities, although one might pretend to answer a summoning on a lark.

                  This Power summons one being at a time. Each additional being decreases the Power's rank by -1CS.

                  Remember that most magical beings are intelligent and that many are hostile to humans. The being a hero summons today might hold a grudge against him for eons to come.
            Matter Control:
              Molding:
                Description: &Molding |
                  The hero can shape any solid material into any desired shape. The shaped material retains its original chemical nature. If the target is living, its internal anatomy is rearranged in such a way that permits life to continue without loss of Health. The new shape can be of any complexity; even intricate machines can be created if the proper materials are available. The newly-Molded target can be Animated, even if the original material or the current shape is normally incapable of movement. This movement is accomplished by the simple act of continually re-Molding the target (think of it in terms of stop-motion animation).

                  Molded targets retain their basic Material Strength. New shapes may alter the load-bearing capacity of the material. For example, a arch can bear greater weight than a plane and a honeycomb is about the strongest shape there is. Using the Power destructively is easy; using it constructively is harder and requires the player to have some knowledge of basic Engineering.

                  The maximum range at which the hero can Mold a target is determined by the Power rank. Appropriate distances are. shown on Column A of the Range Table. The amount of material the hero can Mold is a mass weighing 100 pounds times the Power rank number. When creating the hero, the player has the option of raising either range or amount affected by lowering the other factor an equal amount. For example, a Remarkable rank can Mold 3,000 pounds of material at a range of 8 areas. Either factor can be altered by as much as 5CS and produce results as varied as Feeble range (contact)/Shift X effect (15,000 lb.) to Shift X range (80 areas)/Feeble effect (200 lb.). The player has the further option of raising the Power rank +1CS by specializing in Molding a particular type of matter, such as wood, metal, stone, and so on. This option is not available if the hero also possesses any of the Elemental or Molecular Conversion or Creation Powers.

                  The complexity of the intended design determines what Reason FEAT is needed. Simple, single-component designs require a green Reason FEAT. Complex or multiple-component designs require a yellow FEAT. Extremely complex designs (anything from a clock on up) requires a red FEAT and probably a set of blueprints. Exactly duplicating an existing object also requires a red Reason FEAT. The Power can function for as long as the hero can concentrate. Any failed rolls while attempting a FEAT mean that while the Power has begun to Mold the target, there is a problem because "something doesn't look quite right."

                  Molding automatically affects any stationary, non-living, unprotected material. Moving targets require the hero to make an Agility FEAT to hit. Living targets are allowed to Resist this Power in the same way they would try to Resist any Energy Attack. As mentioned earlier, living targets can be affected but not directly slain by this Power. A target can be protected from being Molded by the use of such Powers as Force Field vs. Energy, Resistance to Energy, True Invulnerability, certain Magics and Power Controls, temporary Conversion to a liquid or gaseous state, or an equal or higher rank of Molding. The simultaneous use of a protective Molding Power to counteract an offensive one by continually re-Molding the target into its original shape would look positively psychedelic as the target of both Molders continually rippled and wavered.

                  The Power can be used quite profitably to outfit either heroes or villains with all the arcane and exotic equipment they need. After all, Quinjets, body armor, and nuclear pogo-sticks aren't exactly off-the-shelf purchases. Clever use of this Power could raise the hero's Resource level anywhere from +1CS to +4CS; the Judge and player will have to work this out for themselves. ("Okay Jeff, in yesterday's game you remodeled the HQ of Dr. Octopus. Today you try to collect what he owes you.")

                  Optional Powers include Elemental and Molecular Conversion, Collection, and Crystallization.

                  Nemeses include Force Field and Molding.
            Matter Conversion:
              Molecular Conversion:
                Description: &Molecular_Conversion |
                  The hero can transform any material into a desired compound. This Power is an enhanced version of Elemental Conversion. Whereas that Power could only create a single specified element, this Power can create a number of elements simultaneously and arrange them in a desired molecular configuration. The matter to be converted can be composed of any element, compound, or combination thereof. The elements that result can be any of the hundred-odd natural, artificial, and mythical elements. The compounds they form can likewise be real or mythical. An example of a fictional compound is the alloy Adamantium, a steel alloy that only exists in the Marvel Universe. Mythical compounds or compounds that incorporate a mythical element (like Vibranium) require a red FEAT to create. Note: it has never been established whether Vibranium is an element or a compound; while I choose to refer to Vibranium as an element, Judges are free to decide for themselves whether it is an element or a compound in their campaign. Most other compounds require either a green or yellow FEAT to create. The more complex a compound's formula is, the harder it is to create. As a rule of thumb, a compound whose molecules incorporate from two to twenty atoms can be created by a green FEAT. A compound with molecules of from twenty-one to one hundred atoms, or alloys of various compounds, requires a yellow FEAT; examples include hydrocarbons. More complex molecules or alloys require a red FEAT; examples include polymers, proteins, and other compounds essential to life. Obviously, playing this Power requires knowledge of basic chemistry. At the least the player must have a crib sheet filled with various useful compounds and their formulas.

                  The hero can after a finite amount of matter each turn. The mass limit is the number of pounds equal to the Power rank number. The amount of matter converted weighs the same either before or after Conversion. The heavier the resulting compound, the smaller its volume. Conversely, the lighter the compound, the more volume it has. This simple fact can be exploited as a variety of Power Stunts. For example, a fist-sized rock can be transformed into a roomful of the mixture of gases we humans consume as air.

                  The maximum range at which the Power can affect a target is determined by the Power rank; distances are shown on column A of the Range Table. At the time the hero is created, the player has the option of increasing either the Power's range or amount affected by decreasing the remaining factor an equal amount. For example, an Amazing rank can Convert 50 pounds at a range of 20 areas. Either factor can be modified by up to 7CS. This can produce such extreme combinations as Feeble range (Contact only) and CL3000 effect (3000 pounds per turn) or CL3000 range (10,000 miles) and Feeble effect (two pounds).

                  The player also has the option of increasing the Power +1CS by making its effect temporary. Normally, Conversions are permanent or at least remain until a reverse Conversion occurs. If the player chooses the temporary option, the Conversion only lasts a maximum number of turns equal to the hero's Reason rank number. While permanent Conversions may be fatal to living targets (it depends on what was Converted and what the result was), the temporary form has the side-effect of placing the target area into a form of Suspended Animation until the Conversion wears off. Of course, the Conversion can have severe, even fatal, effects on the rest of the living target if the entire body is not Converted.

                  The target must be in line of sight of the hero for the Conversion to occur. The Power can function even if a normal, transparent barrier such as glass separates the hero and the target.

                  The minimum amount of material that can be affected by the Power is limited only by the hero's eyesight. In practical terms, the smallest size a Normal Human can see is 1/128th of an inch. Below that requires the use of something to enhance the hero's vision.

                  Stationary, non-living, unprotected targets are automatically affected by this Power. Moving targets require an Agility FEAT in order for the hero to hit the target. Living targets are allowed to resist Molecular Conversion just as they would any Energy Attack. Targets can be protected from being effected by this Power through the use of other Powers including Force Field vs. Energy, Resistance to Energy, True Invulnerability, various Magics, and various Power Controls. Such Powers will completely protect against a lesser or equal rank Molecular Conversion and offer partial protection against higher ranks. The Judge is free to decide the results of partial protection.

                  Optional Powers include Matter Animation and Molding.

                  Nemeses include Force Field vs. Energy, Resistance to Energy, and True Invulnerability.
            Matter Creation:
              Artifact Creation:
                Description: &Artifact_Creation |
                  The hero can create a desired object from virtually nothing. The artifact can be of any substance, and is limited to being composed of a single piece. Although the Power can create facsimiles of more complex construction, close examination reveals that all the smaller pieces are fused together. However, the hero can create complex items by forming them one piece at a time.

                  The hero can create in one turn a number of ounces equal to his Power rank number. The durability of the artifact is determined at the time of creation. A green FEAT gives the artifact a lifespan of the number of turns equal to the hero's Reason rank number times 100. A yellow FEAT raises it to 10,000 times the Reason rank number. A red FEAT makes the artifact permanent.

                  Each ounce of created matter temporarily costs the hero one Health point. The hero can regain all his lost Health points after 24 hours. Thus, the hero can only create a number of ounces in a single day equal to his Health point total. The hero must have detailed knowledge of the design of whatever he wants to create. He can only store a finite number of designs in his mind at any one time. The limit for this Power is equal to his Reason rank number. The player must keep a record of which items the hero knows how to create. The list can be changed at any time. A green Reason FEAT gains the hero a new design. If no memory slots are available, the new design replaces an old one. ("That's okay; how many more Dr. Doom masks was I going to need, anyway?")

                  Editor's Note: Matter Creation Powers that create specific items (as opposed to raw matter) bring with them a specified number of memory slots, usually equal to the hero's Reason rank number. If a hero should have two of these specific Matter Creation Powers, he would then have twice the number of memory slots (equal to his Reason rank number times two once for each Power).

                  Normally the Power is used to create facsimiles of objects that already exist. These can be directly studied by the hero as he memorizes their designs. This takes at least ten minutes before attempting the FEAT. Failure requires another ten minutes of study, and another attempt. As you can guess, their hero might never be able to master certain designs.

                  The hero can also create new designs based solely on his own imagination. Since this requires really intense concentration, a red Reason FEAT is needed to store this design.

                  The artifact has the same properties as a normally manufactured item of its type. In the case of altered or imaginary designs, the player and the Judge should agree on reasonable statistics for the item in question.

                  The hero can materialize the artifact at any site within one area. The artifact is initially stationary; you can't launch an artifact as you can a missile or a spray. The hero can take advantage of gravity, though, by materializing the artifact uphill or over a target.

                  Now that you've read all the rules so far, I'll give you the one exception to the weight limit. When creating the character, the player can choose to specialize in creating a single copy of one specific item, like a suit of armor or a costume. In this case, the weight limit is raised from one ounce per Health point to one pound per Health point. Red FEATs are treated as yellow FEATs.

                  This Power includes versions of Elemental and Molecular Creation. Each element and compound takes up a memory slot, just like the daggers and shields that are already cluttering the hero's mind. Such raw matter can be formed in any shape, though. This permits the hero to change the composition of any of his already-memorized designs. For example, if he already has memorized a knife design and the nature of silver, he can make either a steel knife (like the one he memorized) or one made of silver. The hero can create facsimiles of living matter, but such facsimiles are not themselves capable of living. He can make a dead chicken, but not a live one; however, the one he makes will taste just as good. Being able to create corpse versions of yourself could be extremely handy, especially for villains out to confound the law.

                  Optional Powers include a form of Matter Animation that is limited to matter created by the hero, and Hyper-Intelligence.

                  The Nemesis Powers are Disintegration and Mental Domination, especially induced Amnesia.
              Molecular Creation:
                Description: &Molecular_Creation |
                  This is a more powerful form of Elemental Creation. The hero can form several elements simultaneously and form them into any desired compound. The hero can form this on any target within one area. He can create in one turn a number of ounces equal to his Power rank number. For example, at Poor rank he could form only four ounces in one turn. The durability of the newly created compound is determined by a FEAT at the time of creation. A green FEAT gives the material a span of a number of turns equal to 100 times the hero's Reason rank number. A yellow FEAT raises the multiplier to 10,000, and on a red FEAT the material is permanent.

                  Each ounce the hero creates temporarily costs him one point of Health. The hero can regain Health points lost in this way after a 24-hour period including eight hours of sleep. Thus, the hero can create only a number of ounces per day equal to his total Health points.

                  Example: Synthos is visiting a primitive culture and decides to give them a gift of useful bronze. His Power is Excellent (20) and his Reason is Typical (6), but his Health is only 50. On his first try, he makes only a green FEAT. That batch of 20 ounces disintegrates in 600 turns (1 hour). He tries again, making a yellow FEAT this time. That's not much better; the batch of 20 ounces disintegrates in four days. His honor on the line, Synthos tries again. He succeeds with a red FEAT. However, his depleted Health only permitted him to create 10 ounces of bronze. Synthos is unaware of this, having passed out from the strain.

                  The hero can use this Power as an attack by trying to form the new material on a chosen target. Such targets can try to dodge. If they succeed, the material forms in their previous position. The hero must be in line of sight of the target. He cannot form material within a target's interior or through any barrier between himself and the target. Synthos, for example, could not form plastic explosive within a Sentinel, unless someone left an inspection hatch open where Synthos could see it.

                  In order to fully play this Power, the player needs to know some basic chemistry, especially the physical properties of various compounds. The hero can develop Power stunts such as:

                  This Power includes the ability to form single elements as in Elemental Creation. This is an innate (not a Bonus) Power. Optional Powers include Matter Animation in any single form and Mechanical Animation. The Nemesis Powers are Disintegration and Matter Animation (all forms, simultaneously).
            Mental Enhancement:
              Cosmic Awareness:
                Description: &Cosmic_Awareness |
                  The hero is in tune with the entire scope of reality. He possesses a detached, omniscient viewpoint that allows him to explore the entire existence of a chosen subject. Unfortunately, this causes such a massive overload of superfluous information that the hero is hard pressed to sort it all out. The FEAT represents the hero's ability to recover a specific bit of information from all the effluvia. The more exact the required detail, the higher the difficulty. Discovering basic facts or locating any one on the Earth requires a green FEAT. Complex information or finding anyone within a star system requires a yellow FEAT. Secrets, weaknesses, arcane knowledge, and anything else the Judge wants to make difficult to find out requires a red FEAT.

                  The Power can be used to automatically track any Class 1000 or higher Power within ten miles of the hero's position. In combat the Power raises the hero's own attacks +1CS by detecting the weak points in the opponent.

                  The major drawback to this Power is that can lead to insanity, especially catatonic withdrawal, as the hero's Psyche is continually inundated by a flood of information. The Judge can determine the chance of temporary insanity by secretly making a Reason FEAT for the hero: a green, yellow, or red FEAT means the hero has retained all his marbles for another day. The Judge should make this check any time the hero uses the Power more than five times a day or a number equal to 10% of the Power rank number, whichever is higher. Because of this, caution is urged in the use of this Power. If the Power is somehow negated, the hero may also go into a state of shock or severe depression. Any mental problems the hero suffers can be cured by normal psychotherapy.

                  The Optional Power is [Hyper-Intelligence](#hyper-intelligence).

                  The Nemesis is [Emotion Control](#emotion_control).
              Dreamtravel:
                Description: &Dreamtravel |
                  The hero can actually enter into the short-lived pocket dimensions created by a person's dreams and nightmares. These dreamworlds are outside the boundaries of normal reality and exist solely as a reflection of the dreamer's imagination.

                  The Dreamtraveler must be within ten feet of the dreamer in order for the Power to function at full rank. The Power rank decreases -1CS for each additional 10 feet that separates the two.

                  The Dreamtraveler has no direct control over the conditions within the dreamworld. He can interact with things within that world by performing "physical" actions much as he would in the real world. Fighting, Agility, Strength, and Endurance are all represented by this Power's rank. If the hero has other Powers, these exist in equivalent forms that possess this Power's rank instead of their own. The Dreamtraveler can suffer real damage as a result of events that affect him within the dreamworld. He might even die. The equivalent of the damage appears in the hero's real body.

                  Normally the hero's real body retains its solidity during Dreamtravel. The player can raise the rank +1CS by making the hero's body dematerialize whenever the Power is used. In this case, if the hero is slain or trapped within the dreamworld, the body might never reappear.

                  Each dreamworld is unique to the specific dreamer and retains no existence except during the act of dreaming. Dreamworlds are not the same as the Dream Dimension, although it is possible they exist within the greater Dream Dimension. It is possible that dreamworlds touch each other and may even overlap in the case of telepathic dreamers. If so, it is possible that the Dreamtraveler can enter one dreamworld and exit one of someone else's.

                  The Optional Power is a form of Telepathy limited to dreamers.
              Empathy:
                Description: &Empathy |
                  The hero can detect the surface emotions of others. The hero can detect the target's emotional state and further refine that knowledge to discover the target's physical state, surroundings, and location, insofar as these have an influence on the emotions. He can transmit his own emotional state but he cannot impose this on others (that requires Emotion Control).

                  Empathy is extremely useful when the hero has to deal with non-sentient beings or large numbers of people. It can read the target's mood and support already existing emotions. The range can vary within a single Power rank. The distances shown on column B of the Range Table refer to a single target. Each additional target reduces the range -1CS. Range never falls below Feeble, even if the hero is trying to read the emotions of a crowd. The Power functions for as long as the hero concentrates on using it. The hero can send 'Empathic, messages by means of a Power FEAT. The message is in the form of a burst of emotion accompanied by a subtle identification of the Empath. A green FEAT transmits to a known person and location. A yellow FEAT transmits to a known person in an unknown location. A red FEAT is the Psionic equivalent of a general announcement. ("Did you feel that? Felt like somebody was really scared… Wait a minute. That was Sender. He needs us!")

                  Optional Powers include Clairvoyance and Emotion Control.

                  The Nemeses are Mental Invisibility and either Force Field or Resistance to Psionics.
              Iron Will:
                Description: &Iron_Will |
                  The hero has complete conscious control over his mind and body. By using his Iron Will, the hero can temporarily halt the damage done by mental or physical attacks: he can even postpone his own death.

                  Iron Will can be used in place of any lower-ranked Ability to determine Resistance to an attack. Any time the hero suffers damage from an attack, the Power can temporarily absorb it before it can affect any of the hero's Ability ranks. The maximum amount of damage Iron Will can absorb at one time is equal to its rank number. Absorbed damage does not affect the hero at that time. Damage exceeding that amount affects the hero in its normal manner. The hero can maintain his Iron Will indefinitely but will eventually have to relax his self-control in order to heal and renew his Power. Letting down his control causes him to immediately suffer a loss of Health points equal to one half the amount of damage Iron Will had absorbed. Regardless of the original nature of the attack, it is always translated into lost Health points: this reflects the strain the Power places on the body. Once the translation occurs and the Iron Will has been purged of its burden, it is able to absorb new damage. The cycle of absorption/purging/ absorption can continue until the hero's Health drops to zero or below. Note: The Power. can still absorb damage, even if the conversion of that damage into Health points will result in the immediate death of the hero. In such a case, the hero had best make sure he is already in an excellent Trauma Center when he relaxes his Power.

                  Example: Sunstone is battling the Marauders and not doing too well. He possesses Incredible Iron Will and has 100 Health points. Harpoon hits him with a Slayspear: this does 40 points of damage. Iron Will absorbs it all but immediately reconverts it to a loss of 20 Health points. Sabertooth slashes and gnaws Sunstone for 60 points. Iron Will only absorbs the first 40, then immediately converts it. Health now stands at 40 points. Malice attempts to Possess Sunstone: Iron Will fends off the mental attack but at a cost of another 38 points. Sunstone decides discretion is better than valor and flees. Scalphunter fires at the retreating figure and inflicts thirty more points of damage. Sunstone heads for the best-equipped hospital in the area. He manages to maintain his self-control until he is actually in the operating room, then he passes out as wounds suddenly appear across his body.
              Linguistics:
                Description: &Linguistics |
                  This is a specialized form of Hyper-intelligence. The hero has the ability to rapidly learn any language if sufficient material is available for him to work with. Once the language is mastered, the hero is fluent in that language, provided he is physically capable of communicating in it.

                  The number of languages a hero is currently fluent in is limited to the Power rank number. For example, Doug Ramsey's Incredible rank enables him to retain fluency in up to forty languages at a time. When a hero exceeds that limit, he begins to forget a previously mastered language. This will usually be some obscure tongue the hero has had little use for, like Basic Otter or Mephitish.

                  The speed with which a hero can learn a new language is determined by its strangeness and what source materials are available. Current human languages require a Poor FEAT. Archaic human languages are a Good FEAT. Alien but Humanoid languages are Remarkable FEAT. Animal languages are an Incredible FEAT (note: not all animals have an actual language). Alien, nonhumanoid languages are an Amazing FEAT. The color of the FEAT is determined by the source of the language. A green FEAT is needed if the hero has access to actual instructional materials or a cooperative native speaker of that language who also speaks a language the hero knows. A yellow FEAT is needed if the hero has a native speaker who cannot speak any tongue the hero knows or if the hero only has non-instructional samples of that language. A red FEAT is needed if the hero has only fragments of the new language. For example, learning Shi'ar from watching a broadcast of a speech by Majestrix Lilandra is a yellow Remarkable Intensity FEAT. Learning spoken Primate by actually using sign language to talk with a chimpanzee requires a green incredible intensity FEAT.

                  The hero can try a FEAT roll every hour. Failure means he simply has not yet gotten the hang of the new language. The only real drawback to the Power is that the hero may accidentally forget his native language, especially if he rarely uses it. Still, he can always re-learn it. There is a danger that an adversary might warp the hero's Linguistic Power and actually negate his language comprehension: in such a case, the hero becomes dyslexic and unable to understand simple English.

                  A curious side-effect of the Power is that it provides Power rank Resistance to Hypnotic Voice and other sonic-based forms of Hypnotic or Mind Control. The hero's mind shifts into its translation mode: it studies the medium through which the hypnosis is communicated rather than the actual message. ("Lorelei, did you ever realize that your sleep command is a high C-sharp while your paralysis command is a high C-flat?")

                  The Optional Power is Hyper-Intelligence.

                  The Nemesis is Mind Drain.
              Mental Probe:
                Description: &Mental_Probe |
                  The hero can telepathically probe a living mind or a psionic phenomenon to gain a detailed analysis of the target. Living minds can be searched for specific images and thoughts, although the hero must have a basic idea beforehand of what she is looking for. The target mind is allowed to make a Psyche FEAT to resist a Mental Probe. This is automatic, even if the target mind is initially unaware if the attempted probe. If resistance is successful, the probe is rejected with a headache-like backlash that prevents the hero from trying to probe that target again for 24 hours. A side-effect of the Power is that the target's Psyche may temporarily drop -1CS for 24 hours as a result of fending off the probe. This potential loss is determined by a second Psyche FEAT made after the initial resistance. A successful probe reveals only information known by the target.

                  Mental Probes can be used to analyze independently existing psychic phenomena. Such things include poltergeists, psionic emissions that were so strong they permeated an area and now continually echo, and psionic Powers intercepted by the hero. The hero can examine any unknown psionic phenomena in stages. The first FEAT reveals basic information, such as the nature of the psionics in use. Further FEATs reveal increasingly detailed information.

                  Mental Probes have a range determined by the Power rank. Maximum ranges are shown on column A of the Range Table. The player has the option, when creating the hero, of raising the Power rank +1CS by decreasing the range to contact-only.

                  Optional Powers include Telepathy and Sensory Link. The Nemesis is Mental Invisibility.
              Serial Immortality:
                Description: &Serial_Immortality |
                  A character with this Power can suffer damage, get sick, age, and even die. None of it is permanent to the character, though. When the hero's body dies from any cause, the unique nature of his lifeforce enables it to transfer to a new body. He can also transfer some but not all of his Powers to the new body. The hero loses all Karma with the death of the old body. There are five forms of Serial Immortality, each with a different means of rebirth and Power transferral. The player must choose one of these methods, either selecting for himself or letting the die decide.

                  - **Spontaneous Creation:** This is the most sociably acceptable form of Serial Immortality. The hero creates existing matter and energy into the flesh of a new body. The newly-created body is identical to the previous one and possesses all Powers except externally derived ones. Any Power that is in the hero's self-image can transfer. The time needed to create a new body is the number of days equal to 100 minus the Power rank number..

                  It is incredibly difficult to finally defeat an adversary with any form of Serial Immortality. The best the foe can normally hope for is to defeat the current body and then prepare for the next incarnation. It is possible to stop the infinite progression from body to body by preventing the hero from leaving his current body (suspended animation will do) or entering a new one (stranding the hero in intergalactic space is a good tactic). The lifeforce can be directly fought or even killed within the Limbo dimension.

                  Sometimes a character with this Power can be forced out of his current body without that body getting killed in the process. The Judge is free to decide what conditions apply in his campaign; suggested moans revolve around coercion or such Powers as Magic, Power Controls, Force Field vs. Hostiles, Summoning, and Exorcism. Such Powers must exceed the hero's Power rank by 2CS in order to forcibly evict the lifeforce from the body. If successful, the lifeforce is driven into Limbo or a new body in a more peaceful location. As for the now vacated body, the results vary with the form and variety of Serial Immortality:

                  - **Creation:** The body reverts to its original materials.

                  The Nemesis is Exorcism.
              Telekinesis:
                Description: &Telekinesis |
                  The hero can handle material objects without having to make direct or indirect physical contact (pushing or blowing, for example). The hero can perform any action that could be accomplished using normal Strength. The Power rank serves as an equivalent for the Strength rank. Most Telekinetics ("TKs") visualize their Power in terms of an amorphous arm extending from the body. This leads to a curious psychological handicap in that most TKs cannot lift their own bodies. Only rare examples like Marvel Girl have overcome this bit of irrationality.

                  The range is determined by the Power rank. Column A on the Range Table shows the ranges for a single act of TK activity. Each additional simultaneous action reduces the range -1CS. Multiple activities share the common pool of TK strength. The more actions that are attempted, the weaker each telekinetic arm becomes. If the hero attempts to perform a greater number of simultaneous complex activities than the Judge thinks plausible, the Judge may require an Agility FEAT.

                  If the hero also possesses Remote Sensing, she can develop a sense of touch through her TK grasp. This permits the hero to handle materials that are not within her sight. Clairvoyance can be incorporated into TK to permit visual guidance.

                  Optional Powers include Matter Animation, Molding, Clairvoyance, Remote Sensing/Touch, Levitation, and True Flight.

                  Nemesis is either Force Field vs. Psionics or Gravity Manipulation.
              Telelocation:
                Description: &Telelocation |
                  The hero can Psionically locate a chosen target. This differs from normal Tracking in that no physical or sensory contact, however tenuous, is required. Consequently, the Power is not hampered by the concealment, erasure, or absence of the target's "scent." Telelocation can operate over immense distances. The only factors that can hinder the Power are those that diminish any Psionic activity.

                  The range, determined by the Power rank, is shown on Column D of the Range Table. This represents a sphere centered on the hero: the quarry must be within it. The hero must have a stimulus to channel her Power toward a specific quarry. The nature of the stimulus determines the Power FEAT. A green FEAT requires contact with a part or possession of the quarry. A yellow FEAT requires the hero to have previous contact with the quarry.

                  A red FEAT is required if the hero only has second-hand information about the quarry (and it had better be good).

                  Optional Powers include Clairvoyance (limited to already located quarries) and Extradimensional Detection (which automatically combines with this Power to extend its range into other dimensions).

                  The Nemesis is Mental Invisibility.
              Telepathy:
                Description: &Telepathy |
                  The hero can communicate on a direct mind-to-mind basis. This is automatic with willing minds or Psyches with ranks lower than the Power rank. Equal Psyche ranks require a yellow FEAT. Minds with mental Powers or some form of Psionic defense require a red FEAT. Uncooperative beings with Psyches exceeding the Power rank are impossible FEATs.

                  Range is determined by Power rank. Column D of the Range Table shows the limits. At Class 1000 the Power can breach dimensional barriers: this can also be accomplished if the hero combines Telepathy with Extradimensional Detection.

                  In the main Marvel Universe, Magneto created a special magnetic flux in the Earth's magnetic field. His purpose was to hinder Professor X's efforts to locate him. The result is that terrestrial Telepathy is decreased -3CS in range with a minimum of contact-only. Actual Telepathic strength is unaffected by Magneto's interference. If the hero is beyond Earth's altered magnetic field, in the past, or in other dimensions, then the limit disappears and the Telepathy can assume its true range.

                  When the hero is created, the player can raise the Power rank +1CS by choosing a limitation. Examples include either receiving or transmitting only (not both), communicating in only words or visual images (not both), or being limited to contacting only other telepaths and other Psionic types.

                  Optional Powers include Empathy, Hallucinations, Mental Invisibility, Mental Probe, Mind Blast, Mind Drain, Sensory Link, and Psionic Detection.

                  The Nemesis is Resistance to Psionics.
              Total Memory:
                Description: &Total_Memory |
                  The hero has the ability to remember anything that he has ever experienced. This could be a book he's read, the faces of everyone he saw on Tuesday, what birth was like, and so on. The accuracy of his recall is his Power rank number treated as a percentage. Feeble is 2%, Excellent is 20%, and so on to automatic accuracy at Unearthly rank or above.

                  The color FEAT reflects the nature of the memory being sought. Green FEATs involve personal memories. Yellow FEATs involve learning experiences. Red FEATs involve unconsciously gained information, such as the faces of everyone the hero saw on Tuesday.

                  The Power is the perfect complement for Hyper-Intelligence by providing a built-in library. It can be used to simulate that Power, Hyper-Invention, or Weapons Tinkering, provided the hero once read texts that explained how to do things that come naturally to those with the other Powers. ("Well, I read Reed Richard's notes on constructing dimensional gateways, so if I just follow his plans we should be in the Negative Zone by next Monday night.")

                  When playing a character with Total Memory, assume he is a voracious consumer of all media. It is to his advantage, after all. Such characters are also fond of quoting obscure texts or unconsciously reciting encyclopedia entries. The Power doesn't really alter either Intuition or Reason, thus these can be used as a guide for what the hero has probably read in the past. When the hero claims to have read a special text, the player is required to make a Reason FEAT to prove he has read something along the desired liner.

                  Flashback is a real danger. If the hero was ever a victim of a mental attack, there is a chance the memory will accidentally resurface at a later time and the effect returns anew. Such flashbacks occur when the hero is somehow reminded of the original incident. The hero must make a green Psyche FEAT to avoid reliving the full effects of that other Power.

                  Example: Phtomemry was under Ringmaster's Hypnotic Control for two days back in 1978. Today he saw a news report on Ringmaster's parole hearing. Suddenly the compulsion to rob jewelry stores returned.

                  Optional Powers include Hyper-Invention, Hyper-intelligence, and Weapons Tinkering.

                  The Nemesis is Mind Drain.
            Physical Enhancement:
              Body Resistance:
                Description: &Body_Resistance |
                  This is the form Body Armor most heroes want. The hero's body is composed of apparently normal flesh. However, the tissue of capable of withstanding major damage without showing any effects. The resistance covers physical and energy attacks only.

                  The Intensity rank number of the attack is reduced by this Power's rank number. The remaining Intensity is the actual damage the hero suffers.

                  While the hero's skin shows the effects of the tremendous abuse it suffers, at least it heals quickly. The Power enables the epidermis to heal at a tenfold rate.

                  An Optional Power is [Regeneration](#regeneration).
              Hypnotic Voice:
                Description: &Hypnotic_Voice |
                  The hero possesses a voice whose intrinsic qualities permit a hypnotic domination of the target's conscious and subconscious thoughts. The bulk of the hero's commands are sub-verbal in nature (it's not what she says, but how she says it).

                  The hero can effect anyone within the sound of her voice. The optimum effect occurs within twenty feet of her location.

                  The Power decreases -1CS for each additional twenty feet. Everyone within range must make an Intuition FEAT in order to resist falling under the effect of this Power. Failure means complete submission to the singer's command. Victims of the Power can make a new attempt to resist every ten turns. The Power can be used for as long as the hero concentrates on it. If a victim gets beyond the sound of the Hypnotic Voice, he can attempt to resist every five turns.

                  The Power comes in two varieties, automatic and deliberate. The automatic form is a permanent modification to the hero's voice. Every time she speaks, the Power can function. The deliberate form requires the hero to consciously alter his voice to manifest his Power. The player must choose which form the hero has. The automatic form costs a decrease of -2CS to the Power rank.

                  The Power's range can be extended by mechanical means like telephones and radio. Remote control has a decreased effectiveness of -2CS. Reproduction of the Hypnotic Voice is not quite as dangerous: the overall rank is decreased -4CS.

                  The Power cannot control someone who cannot hear it. Deaf persons or those with altered senses are immune. Soundproofing, loud noises, and simply getting out of range are effective tactics against the Power. The Power has -1CS effect on non-humans. (When creating the hero, the player can raise the Power rank +1CS by limiting its effect to members of the opposite sex. For example, Lorelei can only affect men.)
              Pheromones:
                Description: &Pheromones |
                  This is an aerosol version of Hypnotic Control. The hero's body can create and emit chemicals capable of altering a target's behavior. These chemicals vaporize instantly on contact with air and are received by the target's nose. The complexity of the commands can vary with the rank of the Power. The hero can readily affect anyone within twenty feet of him. The Power rank decreases -1CS with each additional twenty feet.

                  The Power cannot affect those unable to smell it. This includes would-be targets who are upwind, behind a force-field, have their own air supply, don't breathe, or breathe but have no sense of smell. The last example includes a hero with the power of Lung Adaptability.

                  When the hero is created, the player must decide whether the Power functions automatically or deliberately. The automatic form lowers the Power rank -2CS.
              Self-Revival:
                Description: &Self-Revival |
                  The hero's Power is so strong that it can repair fatal damage and actually return the hero to life. The power functions despite the absence of life in the body. It repairs the major damage and replaces lost tissues at the same rate as Regeneration above. When the body is returned to minimum life sustaining condition, the hero comes back to life. This occurs despite any intervening time in which the hero was dead: from the hero's point of view, no time has passed.

                  If the hero was dismembered, the Revival Power is concentrated on the largest remaining segment. The rest of the body decays normally. In rare cases, all body parts regrow. Depending on the size of the segment, each attains only partial redevelopment of growth, intelligence, and power. Even rarer are the cases where all the newly regrown bodies attain full development. Rarest of all is the case where all the new bodies share a single mind. The Judge can decide if he wants to allow such rare cases to intrude on his tidy campaign. This power contains aspects of Free Spirit and Matter Creation.

                  The color FEAT reflects the amount of the body available for the Power to work with. A green FEAT means all the body is present aside from spilled blood. A yellow FEAT means all vital organs are present, although some of the less vital parts may still be missing. A red FEAT is required if at most one quarter of the original body is available. If less is available, Revival cannot occur.
              Self-Sustenance:
                Description: &Self-Sustenance |
                  The hero can survive indefinitely without consuming air, water, or food. Bodily wastes are internally recycled back into useable materials.

                  Normally the hero would not need to replenish himself when his power reached its limit. He merely resumes normal consumption habits (breathe normally, eat a light snack, etc.). This is the permanent form of the power. The temporary form requires the hero to consume mass quantities at the expiration of the Power. ("That's the fifteenth steak you've eaten, Fred. How long did you say it's been since you ate last?") The required intake is one-quarter what the hero would normally have consumed during the time he was abstaining. The hero can raise his Power rank +1CS by opting for the temporary form.
              Stealth:
                Description: &Stealth |
                  The hero can move in ways that cannot be detected, whether while moving or if subjected to later tracking. When the hero uses Stealth, his rank is subtracted from the efforts of those detecting him.

                  Example: Shadowfox has Excellent Stealth. He cannot be detected by Typical means (that is less than Shift-0). Unfortunately, it's Wolverine who's tracking him with Monstrous ability. Shadowfox's Stealth lowers Wolverine's chance of finding him to merely Good.
              True Invulnerability:
                Description: &True_Invulnerability |
                  This is a combination of Resistances and Body Armor. The hero is immune to any physi cal harm, up to his rank's limit. The immunity includes the following resistances: fire, heat, cold, electricity, radiation, corrosives, disease, poison, brute force, sonics, and kinetic bolts. The rank of the Invulnerability reduces the rank of the attack form.

                  Example: A Mandroid's Excellent laser would do only Feeble damage against Good Invulnerability, and none at all against Remarkable Invulnerability.

                  The hero with this Power is still vulnerable to magical and mental attacks. If the hero should lose his True Invulnerability, his Fighting rank drops to Typical (he's not used to avoiding blows).

                  The hero's appearance is not affected by this power; he appears to be a normal member of his race.
              Vocal Control:
                Description: &Vocal_Control |
                  This might be considered a Talent rather than a Power, but here goes anyway.

                  The hero has total control over his own voice and can use it to duplicate any desired voice of sound. The accuracy of the simulated sound is 100% within the Power's limit (determined by rank) on a green FEAT. Exceeding the limit requires a higher FEAT. The hero can imitate Sonic Powers that will have most of the effectiveness of the original. The rank for such mimicked Powers is -1CS of the original's rank.
            Power Control:
              Energy Source:
                Description: &Energy_Source |
                  The hero draws his Powers from a special source that provides him with all the energy he can handle. As long as the hero can maintain his link with this source, he can continue to use his Powers. The nature of the source and its link varies with each hero. If the source is small enough, the hero may be required to carry it with him. If not, perhaps the hero needs to periodically return to the source or forge an ethereal Power cord that links him to his Source despite any intervening distance. The Judge and player need to work together to produce a playable source and link.

                  If the link is severed or the source destroyed, the Mage is left with a finite supply of energy left. The amount of raw Power left is the number of points equal to his Psyche rank. Each time he uses Power, he decreases the reservoir by that Power's rank number. Obviously, it is within the hero's best interests to renew his link or rebuild his source in as little time as possible.

                  As you are beginning to suspect, this isn't really a Power and is more of a restraint. You're right. If you roll this Power, go ahead and roll an additional Power.
              Focus:
                Description: &Focus |
                  The hero can channel all his raw energy into a single burst of a chosen Ability or Power. All his Power and Ability rank numbers are totaled together. This rank number replaces the rank number for a chosen Power. Upon the completion of releasing the Power, all the hero's Abilities and Powers temporarily drop to Feeble. This Power's rank number is the total amount of lost points the hero can regain each turn. Points are divided evenly between all the depleted Abilities and Powers. (Okay, this isn't really a Power either. Roll again for an additional Power.)
            Self Alteration:
              Imitation-Face Changer:
                Description: &Imitation-Face_Changer |
                  The hero can change his superficial appearance but cannot alter his basic form or dimensions. The hero has conscious control over the movement and placement of muscles, cartilage, and minor bones (nose, fingers, cheeks) and can alter the color and appearance of his skin and hair.

                  The hero can use this Power to assume any human appearance, provided the desired shape roughly matches his own. Examples: A child could imitate other children, midgets, and dwarves. A thin man could not imitate Sydney Greenstreet.
              Imitation-Human Changeling:
                Description: &Imitation-Human_Changeling |
                  The hero can change his superficial appearance but cannot alter his basic form or dimensions. The hero has conscious control over the movement and placement of muscles, cartilage, and minor bones (nose, fingers, cheeks) and can alter the color and appearance of his skin and hair.

                  The hero can use this Power to assume any human appearance, provided the desired shape roughly matches his own. Examples: A child could imitate other children, midgets, and dwarves. A thin man could not imitate Sydney Greenstreet.
              Invisibility:
                Description: &Invisibility |
                  With this Power a hero can render himself undetectable by normal, consciously willed sight. There are four very different means of accomplishing this effect. Each form has unique characteristics regarding such factors as the area made invisible, protection against light-based attacks, mechanical detection, and detection by other means.

                  The duration of any form of Invisibility is a function of the Power rank. This Power can be reduced in effectiveness or even terminated by certain acts, performed either by the hero or someone under the Power's effect. Simple physical contact can alert others to the hero's presence (Physics, Hallucinatory, Holographic). Physical attacks by the hero terminate the Invisibility (Telepathic) or reduce its protection by -1CS for each attack the hero makes (all other forms). A Invisible hero may find himself surrounded by a coating material (rain, dust, and paint for example). This only effects the Physics-based Invisibility. At Feeble, Poor, and Typical ranks the hero is visible for the duration of the coating. At Good or higher ranks, such coatings remain visible for the number of turns equal to eight minus the number of Power rank levels. (Example: Invisible Woman is struck by a balloon filled with paint. Her Power is Excellent and renders the paint invisible in three turns.)

                  There is a base 2% chance that the Invisibility is permanent (4% if the hero is alien). Such a state can only be negated by nullifying the Power itself, permanently. Previously controllable Invisibility can be made permanent through brain damage or Powers that affect the hero's control.
            Travel:
              Dimension Travel:
                Description: &Dimension_Travel |
                  The hero can travel into a number of other Dimensions. Transit to a random dimension normally occurs automatically but the Power is weakened by adrenaline. If the hero is in any kind of precarious situation, he must make a Power rank FEAT. He must also make a FEAT if he is trying to appear in a specific dimension or alternate timeline. Specific locations in the other dimension require a red FEAT. The return trip is easier. Returning to a random location on the homeworld is automatic. Returning to a familiar spot on the homeworld is a yellow FEAT.

                  The hero initially has two dimensions he can travel to, his home and one other realm. Additional dimensions can be reached by developing the trips as Power stunts or by dropping the affinity that permits effortless travel to either of the two original dimensions. ("What do you mean, you don't remember how to get back to Earth?")
              Gateway:
                Description: &Gateway |
                  The hero can travel to any point in space, time, or other dimensions by traveling along bridges she creates herself. She can travel along a bridge from her current location to a location in space (a green FEAT), time (a yellow FEAT), and other dimensions (a red FEAT). The destination of each Gateway is a fixed point in space but the departure end always moves with the hero.

                  A bridge to another location in space is created by a FEAT. A green FEAT creates a spatial bridge. The maximum distance the target can be from the hero at the time the bridge is created is shown on column E of the Range Table. A Gateway through time is created by a yellow FEAT. The maximum distance into the past or future the Power can initially reach is the number of centuries equal to the Power rank number. Gateways into other dimensions or alternate timelines require a red FEAT. The transdimensional bridges are initially limited to reaching only one dimension. Additional dimensions require development as Power Stunts. Once created, the bridge functions no matter how far the hero is in space, time, or the Multiverse.

                  The hero has a finite number of locations she can bridge to. Once the hero has established the bridge, she always returns to it when creating that type of Gateway. The maximum number of dif ferent Gateways the hero can create is equal to the Power rank number. Shortly after gaining this Power, the hero should create at least half of her possible Gateways. More can be added at any time. If the hero exceeds her limit, a previously established bridge is replaced by the hero is trying to add.

                  Example: Gatekeeper has Good rank. She can establish up to ten bridges. She establishes Gateways to her home, her team's headquarters at the Avengers Minnesota mansion, her ex-boyfriend's timesharing condo in Jamaica, the bottom of the Atlantic, geosynchronous orbit 22,400 miles above Minnesota, the crater of an active volcano in Iceland, the prisoner processing area of Ryker's Island Federal Prison, Tahiti in the year 1287, the surface of Lake Michigan (twenty miles east of Milwaukee), and Death Valley. The need arises for a bridge to an alternate Earth. Gatekeeper concentrates on establishing the link: making the red FEAT takes her most of the day. Later she realizes that she can't hop over to Jamaica any more. Oh well, she'd hadn't been there with Wilford since he'd gotten married.

                  Gateways automatically transport willing passengers. The Power can be used to catch and transport unwilling passengers (like foes or rampaging water buffaloes) by means of an Agility FEAT. The would-be transportee is allowed to resist in any way he can.

                  Gateways deal with size and not mass. The hero can transport a black hole as long as it's small enough. The maximum size of a Gateway is the number of square feet equal to the Power rank number. For example, a Feeble rank creates a two square foot Gateway that most people could just barely squeeze through. The Gateway forms within ten feet of the hero. It can maintain its existence for as long as the hero concentrates on it or until he passes through it.
              Teleport Others:
                Description: &Teleport_Others |
                  The hero can make any target except his own body vanish and instantly reappear at a distant site. The target does not physically cross the intervening distance and is unaffected by most physical barriers. Column E of the Range Table shows the maximum distance the hero can Teleport a passenger.

                  Teleportation always occurs if the passenger is immobile or touching the hero. The passenger must make an yellow Endurance FEAT to see how he fared. Failure means disorientation for 1-10 turns.

                  If the passenger is uncooperative or in motion, the hero must make an Agility FEAT to catch him. In addition, each 10 feet of distance separating the hero and passenger increases the Power rank -1CS.

                  The Power can teleport a mass equal to the hero's Strength limit. This may be a single object or any number, so long as the weight limit isn't exceeded. If the hero is trying to exceed his limit, he only Teleports part of the mass. Living targets are transported intact: if a being weighs too much it simply won't Teleport. Only the amount of non-living material that within the limit is Teleported: the rest is left behind.

                  Example: The Teleportation beam aboard the spaceship Jenni Lea has Excellent rank and can handle up to 800 pounds of material. A emergency required the evacuation of five people (average weight 200 lbs.) and their equipment. The Teleportation beam sorted out its load before taking effect. Only four of the crewmen were teleported in the first turn. The fifth crewman, the equipment, and the clothes the other four had previously been wearing arrived on the next go-round.

                  The hero can consciously try to Teleport sections of a target: the effect is as if the hero had used an extremely fine scalpel. Such Teleportational dissection requires a Power FEAT whose intensity is equal to the material strength of a nonliving target or the actual Strength of a living target. Heroes with Medical Talents can develop this type of exotic surgery as a Power Stunt.

                  Certain conditions can prevent the passage of a Teleportation beam. Neutronium and black holes are impassable. Barriers that incorporate such Powers as Force Field vs. either Energy or Magic, Power Negation, or True Invulnerability are impenetrable if their Intensity ranks are greater than this Power's rank.

                  The act of Teleportation takes three turns. The first turn the hero affects the target. The second turn the actual transportation occurs. The third turn the target rematerializes. Only on the fourth turn can the hero seek another target.

                  Optional Powers include Teleport Self and Clairvoyance.
              Teleport Self:
                Description: &Teleport_Self |
                  The hero can vanish at one location and instantly reappear at a distant site. He does not physically. cross the intervening distance and is not affected by most physical barriers. Column E of the Range Table shows the maximum distance a hero can Teleport. Teleportation always occurs, but the hero must make a Power FEAT to see how well he makes the trip. Failure means he arrives disoriented and cannot take any actions the following turn.

                  The hero can carry along anything he is touching (except the ground on which he stands), up to his Strength's weight limit. Passengers must make a green Endurance FEAT or be disoriented for 1-10 turns.

                  As the hero rematerializes, gases and liquids move aside before he solidifies. Normal safeguards prevent the hero from consciously Teleporting into a solid mass. If the hero accidentally teleports into a solid, he must make an Endurance FEAT. Success means the hero instinctively jumped to another location and promptly fainted for 1-10 turns. Failure means the hero takes damage equal to twice the solid's Material Strength or actual Strength, if the blockage was a living being. In the latter case, that being takes equal damage.

                  Certain conditions can prevent the hero from Teleporting. If the hero doesn't know where he is, psychological blockage may prevent him from consciously Teleporting. Extremely dense materials like Neutronium or black holes are impassable. Barriers that incorporate such Powers as Power Negation, Force Field vs. either Energy or Magic, or True Invulnerability are also impassable at higher rank.

                  The Optional Powers are Teleport Others and Clairvoyance.
              True Flight:
                Description: &True_Flight |
                  The hero can fly through air and space without an apparent means of propulsion. This is the most desired Power in the history of the world. The Power rank determines the maximum speed the hero can attain in a specific condition. There are three mediums in which a hero can fly. The slowest form of Flight occurs when the hero torpedoes through the water at the Water Movement rate. Faster speed occurs when the hero flies through the air at the Air Movement rate. The fastest flight occurs when the hero is free of any hindering atmospheric friction: this is the Space Movement rate. Acceleration occurs at a rate of +1CS per turn. Deceleration occurs at -2CS per turn.

                  The hero's maneuverability is determined by his Agility. The hero may be able to surpass light speed but if he has Feeble Agility he is going to need a wide turning radius.

                  True Flight includes as a side effect Power rank resistance to atmospheric friction and lungs adapted to breathe high velocity wind. It does not include the ability to breathe water or survive the rigors of outer space.

                  When creating the hero, the player can define the Power in any way that is consistent with the character or his equipment.

                  Optional Powers include Body Resistance, Armor Skin, Self-Sustenance, and Telekinesis.

                  The Nemesis is Gravity Manipulation.
            Special:
              Eldritch Bolts:
                Description: &Eldritch_Bolts |
                  Eldritch Bolt is a bolt of magical power, and includes all manner of spells such as Doctor Strange's Bolt of Bedevilment. The range is as determined in the spell range table, and damage is equal to the Power rank, with the following difference:: the bolt may reduce Health or Karma values (in the latter case, the target's effectively out of luck). If the bolt attacks Health, treat it as a Force attack.
              Eldritch Shield:
                Description: &Eldritch_Shield |
                  The Eldritch Shield is a shield of mystical energy that provides the caster with mystical Body Armor equal to the caster's rank number. This is also proof against magical attacks or those attacks which arise from magic.

                  If an attacker directs his attacks against the shield Itself, treat the attack as an attempt to break the material, with the attacker's bolt supplying the strength and the defender's shield the object that may be broken. The mage whose shield is broken that round takes no damage, but has no shield until he raises it the next round. An Eldritch Shield will protect its caster from all forms of magic of up to the Psyche of the caster.
              Immortality:
                Description: &Immortality |
                  The character with this Power does not age or die in a normal fashion. Now, before you all run out and grab this Power for your young hero, note the fine print. The hero can still suffer loss of Endurance ranks as the result of wounds, poisons, and damages, but if the results call for perishing. then the character is left at Shift 0 Endurance but does not die. The character cannot move or act until Endurance reaches Feeble, however. so throwing an Immortal character into an active volcano will keep him out of the way for a while. (He cannot heal while taking damage.)

                  If Endurance reaches Shift 0, or the character otherwise dies, the immortal character loses all Karma, including that set aside for advancement. The character may be out of luck, but at least he has his Health. If an immortal character is part of a Karma pool, then an amount of Karma is subtracted as if the character had left the group. This is done each time the immortal character becomes "dead."
                  This Power does not have a Power rank. It counts as two Powers for any hero who takes it, unless the character is alien in origin, in which case the cost is normal (this reflects that a large number of extradimensional aliens are effectively immortal).
                  An immortal character's body will slowly regenerate lost parts and heal. so that short of atomizing the remains and spreading that collection of atoms through a large portion of space, the immortal character will return at some point in the future.
                  Immortality is applicable to the Earth Dimension only (including all planets of this dimension). An immortal character in another dimension—such as Asgard or Olympus, but excluding variant or divergent earths-does not age, but may be killed normally while in that dimension.
          Talents:
            Weapon Skills:
              Sharp Weapons:
                Description: &Sharp_Weapons |
                  Characters with this Talent gain a +1CS to hit when attacking with a weapon that resolves attacks on the Edged Attack column of the Battle Effects Table. This includes swords, daggers (unless thrown), and spears, but excludes claws and other natural extensions that inflict this type of damage.
              Weapons Master:
                Description: &Weapons_Master |
                  The character with this Talent gains a +1CS to hit with any weapon that requires a Fighting FEAT to hit.
              Weapons Specialist:
                Description: &Weapons_Specialist |
                  The character with this Talent gains a +2CS with a single weapon of choice. This may be any type of weapon, missile, or melee. The character who is a weapon specialist will also increase his initiative when using this weapon by 1.
            Fighting Skills:
              Acrobatics:
                Description: &Acrobatics |
                  The hero with this Talent is very limber and as such gains advantages when under attack. The hero has a +1CS when dodging, evading, and escaping.
              Tumbling:
                Description: &Tumbling |
                  The hero with this Talent knows how to fall and land without undue injury. Individuals with this Talent may make an Agility FEAT to land feet-first after any fall that does not inflict damage.
            Professional Skills:
              Law:
                Description: &Law |
                  The character with this Talent has an extensive background in law (the assumption being US Law, but this may vary according to the Judge's campaign). The hero may be a lawyer or capable of applying to pass the bar (Reason FEAT of Good Intensity). A character with Law as a Talent gains a +1CS to all FEAT rolls involving the law, including correct legal procedure. A character without Law gains no benefit to Reason FEATs, and in addition, will have to make Reason FEATs more often than a character with Law Talent.
              Military:
                Description: &Military |
                  The hero has had some dealings with one of the armed services. In military matters, the hero gets a +1CS to all FEAT rolls, and in addition may take a member of the armed services as a Contact.
              Business/Finance:
                Description: &Business-Finance |
                  The hero is familiar with the world of business, corporate finance, and how money works. Initial resources are a minimum of Good, and the hero gains a +1CS for FEAT rolls dealing with money. The hero gains a Contact in the Professional category.
              Engineering:
                Description: &Engineering |
                  Engineering includes all the varied types of that profession dedicated to the design of functional items- civil, chemical, mechanical, etc. A character with Engineering Talent gains a +1CS to all FEATs involving building things, including the Resource FEAT to determine if an object can be built.
              Criminology:
                Description: &Criminology |
                  The hero with this Talent has an understanding of the criminal mind and behavior, either from studies or first-hand observation. The character with this Talent gains a +1CS on all Reason and Intuition FEATs involving criminal practices ("If I were a crook, where would I hide?"). The hero also gains a Contact in either the police or crime areas.
              Psychiatry:
                Description: &Psychiatry |
                  The hero with this Talent has a background in studies of the mind and as such gains a +1CS on all FEATs involving the mind. This is a popular Talent with those heroes and villains with Mental Powers, and the character with these Talents gains a +1CS on FEATs involving Mental Control, Domination, Hypnosis, Emotion Control, and Mental Probe Powers.
              Detective/Espionage:
                Description: &Detective-Espionage |
                  The hero with this Talent has been trained to notice small clues in solving crimes. The character with this Talent gains a +1CS to discover clues to a crime, and in addition gains a Contact in either crime, law enforcement, law, or espionage.
            Scientific Skills:
              Chemistry:
                Description: &Chemistry |
                  A +1CS on matters of chemistry, including developing new formulas, finding cures for inorganic poisons, and identifying chemicals by smell, touch, or taste.
              Biology:
                Description: &Biology |
                  A +1CS on matters of biology, including animal and plant identification, finding cures for organic poisons, and researching diseases and their cures.
              Geology:
                Description: &Geology |
                  A +1CS on matters involving the Earth, including volcanic activity, the geology of the surrounding land, types of rocks and their powers, and mineral identification.
              Archaeology:
                Description: &Archaeology |
                  A +1CS on matters involving the past, including paleontology, historical records, and ancient myths and legends.
              Computers:
                Description:
            Mystic and Mental Skills:
              Trance:
                Description: &Trance |
                  The character may place himself into a trance. While in a trance, the character slows his body functions to such a level that he may be assumed to be deceased (Intuition FEAT for the character checking). A character in a trance reduces needs for food and water to a minimal level, and may regain Endurance ranks at one rank per day.
              Mesmerism and Hypnosis:
                Description: &Mesmerism_and_Hypnosis |
                  This Talent is a primitive form of Mind Control at the Power rank number equal to the Reason of the character with this Talent. Information can be gained as per a Mental Probe, and posthypnotic suggestions may be implanted within the victim's mind. Any attempt to force an individual to do something that he would not normally do, or divulge information that he would not normally reveal, will cause the hypnotism to break. A hypnotic command fades in 1-10 hours after it is given.
              Sleight of Hand:
                Description: &Sleight_of_Hand |
                  This is a Talent developed by stage magicians which causes items to appear and disappear by a combination of misdirection and swift, fluid gestures. The character with this Talent may palm small items, making them appear or disappear with Agility +1CS ability.
              Resist Domination:
                Description: &Resist_Domination |
                  This is a Psi-Screen that may be developed by individuals without that Power. This permits the character to resist mental attacks as if the character had a mental power of Psyche +1CS. The Talent is passive in nature and does not grant any other particular benefit. A character with Mental Probe may be able to discern where the character gained this Talent, but nothing else.
              Occult Lore:
                Description: &Occult_Lore |
                  The character with this Talent has a knowledge of magical societies, antiquities, runes, and a general understanding of forgotten lore. The character gains a +1CS to Reason FEATs involving items of a magical nature.
              Mystic Background:
                Description: &Mystic_Background |
                  the Marvel Universe, all humankind has the potential for developing magical Powers. This "Talent" shows that the character has some background with magical forces. Heroes may have derived their powers from these forces if they choose this Talent. A character with this Talent may have Magical Powers, with the approval of the Judge. If the Judge allows magical player characters, then any of the initial Powers created may be spells, and should be noted as deriving from Personal, Universal, or Dimensional energies.
            Other Talents:
              Artist:
                Description: &Artist |
                  The character with an artist background creates works of art, either for himself or for sale to others. This includes painting, sculpting, and writing. A single work takes 1-10 weeks, and upon completion grants the artist Karma points equal to 10 times the number of weeks. The character must allocate some time daily at his work.
              Languages:
                Description: &Languages |
                  The character with this Talent has a natural understanding of languages. The character gains 1 additional language at start, and may add other languages at half the cost of a Talent (500 points regardless of who teaches it). Characters without the Languages Talent must gain this Talent first to learn other languages. The gaining of additional languages assumes someone is available to teach these languages. A Player character with this Talent does not have to assign a language at start, but may fill one in later as need be.
              Repair/Tinkering:
                Description:
                  The character with this Talent gains a +1CS to any Reason FEATs involving the repair and modification of existing items, but not the building of new items. This +1CS may be added to any other bonuses gained from other Talents, so that an Engineer with Tinkering Talent would gain a +2CS on repair.
              Performer:
                Description: &Performer |
                  The character is someone who acts, sings, dances, mimes, or otherwise uses his Talents to entertain (this is related to the Artist, the key difference being that the Artist may leave the scene of creation; the Performer is identified with that creation directly). A Performer receives 10 karma points for a week's worth of performance, whether in a play, doing a nightclub routine, or working for a movie.
              Trivia:
                Description: &Trivia |
                  This is a general category that covers any one subject desired by the character. On that subject, the character gains +1CS to all Reason FEATs. (Say, the character is into collecting Spores and Fungus. A Trivia Talent would be: Trivia/Spores and Fungus). Trivia categories should be specific (old movies, military history, sports, rock music, comic books) as opposed to general (all knowledge) or covered by other Talents.
              Leadership:
                Description: &Leadership |
                  The hero with this Talent has the brains and understanding of a cohesive group, such that he is a benefit to the team. Any Karma Pool to which the character belongs receives a 50-point bonus, provided the character with this Talent is recognized as the "team leader." A Karma Pool may only have one recognized leader, though more than one character with Leadership may belong to one group. When the "Leader" of a group leaves, the 50 points are deducted from the Karma Pool, but the leader does not receive them for personal use (the bonus points only exist as a part of the pool).
            Magic Wielder Talents:
              Bibliophile:
                Description: &Bibliophile |
                  The character has an extensive knowledge of magical books, scrolls, or other primarily informational items, and the lore concerning them. He has a +2 CS when using or researching these.
              Chronicler of Magic:
                Description: &Chronicler_of_Magic |
                  The character studies magical societies and their activities. He has a +2 CS for researching and/or knowing who the adepts and masters are, what their relationship is with each other and with any beings that they entreat, and for any specific facts about most magical cults.
              Demonologist:
                Description: &Demonologist |
                  The character has studied accounts of demons in the Marvel Universe and he knows how dangerous and hostile they are. The character receives a + 1 CS in any situation involving demons, including research, communication, identification, and combat.
              Occultist:
                Description: &Occultist |
                  The character has made extensive studies into the area of occult happenings, including unexplained events and mysteries of the world, hauntings, and other manifestations of the spirit world. He has a +2 CS when researching or dealing with occult events.
              Runesmith:
                Description: &Runesmith |
                  The character is a transcriber and translator of runes, especially ancient, magical runes. (A rune is a letter in an ancient alphabet. Most ancient magical items have runes on them to warn potential users of the possible harm that the item can cause. These runes can be any one of a vast array of almost-forgotten codes.) The character has a +2 CS whenever studying, deciphering, or inscribing runes.
              Scholar of Antiquities:
                Description: &Scholar_of_Antiquities |
                  The character has an extensive knowledge of antiques, especially ancient magical artifacts and lore concerning them (but not including books, scrolls, or other artifacts that are primarily informational). He has a +2 CS when dealing with them or researching them.
              Stamina:
                Description: &Stamina |
                  The character has trained himself to go many days without eating or sleeping in the pursuit of his magical studies. If researching anything magical or just using a spell (no physical combat or extensive movement allowed), the character can go without food or sleep for up to 6 days.
              Theoginist:
                Description: &Theoginist |
                  The character is a scholar on the origins of the powerful extra-dimensional beings and gods of the Marvel Universe (this category includes all of the major entities listed in the Miscellany of Mysticism and those beings that provide dimensional energy when called upon, such as Dormammu). The character has a +2 CS when researching information on this subject.
              Zoologist of Magic:
                Description: &Zoologist_of_Magic |
                  The character studies magical creatures and has collected books on the subject. This talent includes not only mythological or fantastic beasts of Earth’s legends but also the creatures of other dimensions in the Marvel Universe. He has a +1CS when attempting to identify magical creatures and their powers. (Please see the Magical Creature section in Book 3 for many known magical creatures.
          Equipment:
            Shooting Weapons:
              Laser Pistol: &Laser
                Price: *Remarkable
                Range: 10
                Damage: 10
                Type: Energy
                Rate: 1
                Shots: 10
                Material Strength: *Poor
                Notes:
                  - One-handed
                  - Power pack
                  - Illegal
                Description: |
                  The Laser Pistol, Concussion Pistol, and Plasma Beam Handgun are weapons used by high-tech spies and subversive organizations, including S.H.I.E.L.D. and A.I.M. Their possession is illegal by unauthorized persons (Other Crime). All three types operate from power packs.
            Melee and Thrown Weapons:
              Knife: &Knife
                Price: *Feeble
                Damage: 10
                Type: 
                  - Edged Attack
                  - Edged Throwing
                Material Strength: *Excellent
                Description: |
                  A Knife is defined as any blade weapon with a blade up to 12 inches. It may be thrown as a thrown object.
              Sword: &Sword
                Price: *Poor
                Damage: 10
                Type: Edged Attack
                Material Strength: *Excellent
                Description: |
                  Swords are considered one-handed blade weapons with blades over 12 inches long. They are not normally thrown.
              Spear: &Spear
                Price: *Feeble
                Damage: 10
                Type:
                  - Edged Attack
                  - Edged Throwing
                Material Strength: *Good
                Description: |
                  A Spear is considered as any thrusting blade with a handle over one foot long. It is normally thrown or wielded with two hands.
              Whip, Leather: &Leather_Whip
                Price: *Poor
                Damage: 0
                Type:
                  - Grappling
                  - Grabbing
                Material Strength: *Typical
                Description: |
                  Whips can make Grappling or Grabbing attacks from a distance, as if the whip had a Strength equal to its material strength. Example: a villain using a leather whip tries to entangle a charging hero. The villain rolls a Grappling attack on the Typical column. The result would then be a Miss, Partial hold, or Full hold.
            Salaries Sundries and Other Equipment:
              Fire Extinguisher: &Fire_Extinguisher
                Price: *Typical
                Notes: Excellent Intensity
                Description: |
                  Fire Extinguishers inflict no damage normally, but against fire are of Good Intensity (eliminate fire of Typical Intensity or less in the same area on a green FEAT, of Good Intensity on a yellow, and up to Excellent on a red). Against characters with flaming powers causes a FEAT roll against that Intensity to retain flame.
              Robot, Standard: &Standard_Robot
                Cost: *Incredible
                Description: |
                  The Standard Robot is only capable of simple tasks and has no special abilities other than to record what transpires before its recorders and perform simple tasks. The H.E.R.B.I.E. series was a modified form of the standard robot. All Standard robot abilities are Typical.
              Robot, Sentry: &Sentry_Robot
                Cost: *Incredible
                Description: |
                  The Sentry Robot has a bit more programming and firepower. It is programmed to identify hostile threats (that is — anything not in its bank) and open fire. Sentry robots come equipped with Good Strength lasers, though some may be additionally armed. All sentry robot abilities are Good.
              Robot, Talent: &Talent_Robot
                Cost: *Amazing
                Description: |
                  The Talent Robot is a robot specifically designed for a certain purpose, and its programming reflects that purpose. The Avengers' fire-fighting robots or the robotic opponent the Black Knight uses are examples of talent robots. Such robots may have one ability at Remarkable level. All others are Excellent.
              Mystic Texts: &Mystic_Texts
                Price: *Incredible
                Description: |
                  Mystic Texts is a blanket term for those less-powerful magical books that mages acquire to aid them in their work.
            Magical Items:
              Black Mirror:
                Description: &Black_Mirror |
                  This full length ebony oval of glass is surrounded by an ornate frame. While it has been called a mirror, it does not reflect. Instead, it is a legendary gateway to countless dimensions, to an infinite number of alternate Earths. A specific incantation is needed for each dimension. After speaking the incantation, the character speaking can simply pass through the mirror into the desired world. The mirror also exists on each dimension it opens into, so passage back and forth is easy, but only for those who know the right incantation.
              Familiar:
                Description: &Familiar |
                  Familiar indicates a being that is very powerful magically and actively assists the hero. Two powers should be rolled randomly or selected by the Judge from the personal and universal energy lists for this familiar. In addition, the familiar is intelligent (Reason and Psyche at least Typical) and can communicate with its owner (the kind of communication is left to the Judge’s discretion). The form of the familiar can either be that of a normal animal (usually a cat) or an unusual type, such as a small dragon or other mythical creature. The familiar’s form is at the player’s discretion.
              Grimoire:
                Description: &Grimoire |
                  The book in which a mage records spells or incantations. Some spells, like many Entreaty spells, cannot be memorized, only read aloud from a text. A character can only have two grimoires at any one time, the primary and a back-up copy. Creating takes 10+1d10 full days of work
              Ruby of Domination: &Ruby_of_Domination
                  Description: |
                    This large red, floating ruby (3 feet in diameter) was once used by Xandu in an attempt to make Earth's population mind-slaves. When Doctor Strange shattered it, little rubies were left on Earth from its shards. A character attempting the powers of Emotion Control, Mental Control, Mesmerism, or Mesmermechanism has a +1CS for success when focusing the power through one of these smaller Rubies of Domination.
              Serum of the Seraphim:
                Description: &Serum_of_the_Seraphim |
                  This is the most powerful medicine known to the occult and can cure anything but death once it occurs. The serum is so potent that only a few ounces are needed, it is usually kept in tiny ornate containers holding just a few ounces.
                  Any character drinking this serum is instantly returned to his full Health points and has all of his wounds healed. Any magical fungus, physical curses (like blindness), or diseases are held in check, then slowly cured over a few days time.
              Silver:
                Description: &Silver |
                  In game terms, all silver weapons cause double their normal damage to those characters and creatures classified as demons. If a silver weapon strikes a character who is possessed by a demon, only the demon will suffer damage, not the host body, Damage is caused not by the edge or type of weapon as much as simply touching silver to these creatures.
            Headquarters:
              Note:
                 - Size is a general statement.
                  - Small quarters are suitable for 1 or 2 heroes with a small amount of equipment, and has 2, maybe 3 areas or rooms.
                  - Mid-sized housing is suitable for 2 or 3 heroes, any support crowd (offices would fit into this area), and runs no more than 5 areas or rooms.
                  - Large is suitable for a number of heroes and equipment, and has 10 or more areas spread over 2 floors.
                  - Deluxe is the largest size, and is for heroes with several vehicle types, trophy rooms, and living quarters. It has 20 + areas spread through 3 or more floors.

                    Spider-Man's lodgings are an example of Small dwelling. The Heroes for Hire offices were Mid-sized, the Angel's place used by the Defenders in Colorado Large, and the Avengers' mansion, Baxter Building, and Doctor Strange's sanctum sanctorum are Deluxe. (The last measures interior size, not exterior.)
                  - Cost is a reflection of location as well as sire of the structure. The listed prices are for a building in most American cities and their suburban surroundings. If the heroes are apartment hunting in Manhattan or the richer suburbs, the price is +1CS. If the heroes settle down in a relatively secluded spot, like Colorado, Tamarind Island, or Lake Geneva, the price is -1CS. Cost is presented in 2 values. The first is the cost if the character is renting, payable by the month. The second is if the character is buying or building (in the case of apartments, this is dealing in condos).
                  - Costs are for a fairly nice selection of material. The heroes may acquire something less expensive and/or reliable (in the case of a living room, the furniture doesn't match— in the case of a second-hand danger room, it goes berserk more often than usual), at -1CS of price. Very high-quality packages (a Library Package stocked with first editions) may be +1CS or +2CS. Equipment may also be picked up by pieces, and for certain types of equipment, this is the only way of acquiring it.
                  - Rented, furnished places often have their own packages installed. This is included in the rent, though the hero is responsible for their replacement in case of damage or theft. ("Let me get this straight, Mr. Grimm. You threw a what through the where to hit who?")
              Room Packages:
                Living Room Package:
                  Description: &Living_Room_Package |
                    *Cost: Good* - Occupies one room. Consists of sofa, two easy chairs, two end tables, coffee tables, two lamps (ceiling table or floor). At *Excellent Cost* add television, stereo set-up, or piano. At *Remarkable Cost* add all three.
                Dining Room Package:
                  Description: &Dining_Room_Package |
                    *Cost: Good* - Occupies one room. Consists of table, four chairs, ceiling lamp. *Excellent Cost* add large table, bureau and four more chairs. *Remarkable Cost* add china cabinet, set of good china and sterling tableware.
                Kitchen Package:
                  Description: &Kitchen_Package |
                    *Cost: Good* - Occupies one room. Consists of sink, stove (gas or electric), four cabinets, dishware and stainless tableware, counterspace. This version is standard equipment with most residential housing. At *Excellent Cost* add refrigerator, dishwasher, or microwave, plus a fire extinguisher. At *Remarkable Cost* add all three and freezer.
                Library Package:
                  Description: &Library_Package |
                    *Cost: Excellent* - Occupies one room. Consists of two easy chairs, table, desk, straight chair, and up to five bookcases on general subjects (texts readily available, and including encyclopedias, world histories, and atlases). At *Remarkable Cost* adds globe, microfiche or microfilm reader, computer terminal (only useful if building has computer room or is linked up to computer). Special or rare volumes, such as the Book of the Vishanti, the Necronomicon, or Amazing Fantasy \#15, would have to be obtained separately.
                Workshop Package:
                  Description: &Workshop_Package |
                    *Cost: Remarkable* - Occupies one or more rooms. Basic equipment for metal and woodworking: lathes, drills, saws and fire extinguisher. At *Incredible Cost* includes laser-guided instruments. At *Amazing Cost* includes all of the above and automatic processing materials (an automatic factory, in effect, for simple goods).
                Laboratory Package:
                  Description: &Laboratory_Package |
                    *Cost: Remarkable* - Occupies one or more rooms. Basic lab equipment: scales, sinks, common chemicals, microscope. At *Incredible Cost* include computer capable of analysis with incredible ability, or clean room (prevent germs from escaping lab). At *Amazing Cost* include both, plus poison analysis and serum dispenser (Excellent effects against known poisons only). Certain pieces, such as electron micro-probes and stellar mass detectors, may be purchased separately (in general, such items are Incredible Rank purchases).
                Office Package:
                  Description: &Office_Package |
                    *Cost: Good* - Occupies one or more rooms. Includes desk, three chairs, two lamps. At *Excellent Cost* doubles the material, adds file cabinet, typewriter. At *Remarkable Cost*, add computer terminal, double previous material, add hanging plants, decorative art.
                Pool Package:
                  Description: &Pool_Package |
                    *Cost: Remarkable outdoors, Incredible indoors* - Occupies one or more rooms, or outdoor area. Consists of Olympic-size pool, filtered water, small sauna room. At *Remarkable Cost* adds separate, smaller pool (featuring diving board and chlorine), plus pool cover. At *Incredible Cost* includes two Olympic pools, heated water, pool cover. At Amazing Cost, both pools are heated.
                Conference Room Package:
                  Description: &Conference_Room_Package |
                    *Cost: Remarkable* - Occupies one room. Contains material for assembling of heroes, or alternately for news conferences and presentations. Contains large table and up to 10 normal chairs, or platform, speaker, and 30 ordinary chairs. Wood paneling available at *Incredible Cost*.
                Security Packages:
                  Description: &Security_Packages |
                    *Cost: Good* — one Security package to a door or window. Occupies no space. Consists of hand-set burglar alarms on windows and doors, coupled with mechanical locks. At *Excellent Cost:* Automatic burglar alarms with computer-code or card identification system. At *Remarkable Cost:* Automatic burglar alarms with palm-print scan, can activate defense systems. At *Incredible Cost:* Full body scan with benign identification program as to hostility. Can activate defense systems.
                Defense Package:
                  Description: &Defense_Package |
                    *Cost: Excellent* - Will protect one or more areas. Pre-set defenses consisting of entangling tentacles or nets or lasers or stun rifles, or concussive rifles or pit traps, with the maximum of Remarkable Strength or Intensity. *Remarkable Cost:* Defenses activated by Security package, consists of one type as above of Incredible Strength. *Incredible Cost:* As above, intensities are of Amazing Strength. Multiple defense mechanisms may protect the same establishment (example, the WCA compound consists of net-filled pits, stun rifles disguised as trees, and a passive alarm system in the Security Package). Specialized defense packages may be designed.
                Porches, storage, bathrooms, and closets:
                  Description: &PSBC |
                    These are assumed in the cost of the building, according to its design. These rooms cost nothing, and no package exists other than what the heroes decide to stuff into the closets.
                Trophy Room Package:
                  Description: &Trophy_Room_Package |
                    *Cost: Excellent* - Occupies one room. Contains showcase, lighting, frames to display mementos, and may be used as a reception half or gallery. At *Remarkable Cost*, contains capability to handle potentially dangerous exhibits at the Incredible level.
                Imprisonment Package:
                  Description: &Imprisonment_Package |
                    *Cost: Excellent* - Occupies one room. Contains standard restraining devices, including bars of Remarkable material strength. At *Remarkable Cost*, restraining devices made of Incredible Strength. At *Incredible Cost*, restraining devices at Amazing Strength and Excellent Strength inhibitor restraints.
                Fire Protection Packages:
                  Description: &Fire_Protection_Packages |
                    Cost: Excellent Occupies no space. Sprinkler system that may cover up to 10 rooms, provides Good protection from fire. Remarkable Cost: Foam-projectors that provide Excellent protection from fire, covers up to 10 rooms. Fire Protection Packages automatically activate on heat or smoke and must be modified to avoid extinguishing flaming heroes.
          Magic:
            Spells:
              Personal Energies:
                Admittance:
                  Description: &Admittance |
                    The caster can direct enchanted energy at any locked door or container and it will easily open for him, no matter how many locks it has or how big or intricate they are, if his spell rank FEAT roll is successful.
                Apparition:
                  Description: &Apparition |
                    The caster can mystically make his body non-corporeal and become an apparition. (This should not be confused with Astral Projection, as that power takes the caster to another dimension and he is invisible to most characters in this dimension.) Once the spell is cast, the caster need not concentrate upon his state to remain an apparition. As an apparition, the caster can still move, speak, cast spells, and perform most other normal actions. His movement rate is the same as if he were corporeal, but he can walk on air, sink through floors, climb up elevations as if he were climbing stairs, etc.
                    
                    When a caster becomes an apparition his body loses its density, allowing him to pass through solid object and letting solid objects pass through him. The caster can be seen, but is obviously not completely solid. This power grants the caster body armor equal to the spell rank against any physical, energy, or mental attacks. If the apparition/caster physically attacks another character, that character must also be treated as though he has body armor equal to this spell rank. Magical, mental, or energy attacks against the target are treated as normal.
                    
                    To pass through a solid object, or have a solid object pass through him, the object’s material rank must be equal to or less than the spell rank. In addition, the caster can lower the density of an object he touches by making a spell rank FEAT roll and, if succeeding, keeping it in his possession.
                    
                    Judge’s Note:If the player wishes to make a concentrated effort at creating a character who appears like a ghost, striking fear and terror into criminal hearts, then the Judge should keep this effect in mind when the caster walks through a wall, drops through a ceiling, etc. and faces anyone. A character encountering this apparition, especially for the first time, must make a Psyche FEAT roll (see Magic Effects Table) or react as described in the Fear power. There is a price the caster has to pay for this extra “power”, however. This frightening effect on people only works if the caster is not famous, thus cutting off his Popularity and some sources of Karma gain. He must remain relatively reclusive and unknown so the criminal element does not recognize him.
                Astral Projection:
                  Description: &Astral_Projection |
                    The caster can separate his astral self-the sheath of his life essence-from his physical self and travel through space unbound by physical laws while retaining human consciousness. The astral form (also sometimes called the ethereal form or the ectoplasmic form) is invisible, intangible, and incapable of being harmed except by the most powerful magic or by opponents who are themselves in astral form. If the caster wishes to project his astral self while under duress, during a combat or while he is being mentally attacked, he must make his spell rank FEAT roll.
                    
                    The duration of effect determines how long the caster can remain in this form without physical deterioration occurring to his physical form. If the astral form does not return to its physical body before the duration of effect has elapsed, the caster’s body dies; and the astral form can only enter it as it would any other corpse or dummy, creating a blind, zombie-like creature. If the caster’s body is destroyed while the astral form is projecting, the caster is stranded in his astral form.
                    
                    If a character is stranded in his astral form due to the death of his physical body, the astral form itself will dissolve after an amount of time equal to the normal spell duration associated with the character’s Psyche rank. (For example, the astral form of a character with Incredible Psyche would endure for one day; the astral form of someone with an Unearthly Psyche would last indefinitely.)
                    
                    The caster can transport other willing subjects to the astral plane along with himself. When attempting to do so, he must make a Psyche FEAT roll: a white or green result means that the caster traveled and the other(s) did not, a yellow or red result means that the multiple astral travel worked perfectly. Astral projection cannot affect someone against his will.
                    
                    Characters who are in their astral forms can see and communicate with each other, if both parties desire. If one or both parties do not desire to be seen, they may have to hide behind solid items, just as if they were in their physical form. If the astral character who is seeking has a lower power rank than the astral character who is attempting to avoid being seen, he must make a Psyche FEAT roll, even if that character is in plain, astral view. If seen, they can have magical combat in that form.
                    
                    Magical items, though left behind on the physical plane, also have a counterpart that can be taken into the astral plane. It acts in the same manner as its physical counterpart, but its powers are lessened by one rank on the astral plane. Any magic item that the character possesses on the physical plane can be controlled by the owner’s astral self. (For example, Doctor Strange has escaped innumerable traps by controlling his Cloak of Levitation and the Eye of Agamotto within his amulet, while he was in his astral form.).
                    
                    Time alteration spells cast from the astral plane work within the physical plane, but do not affect the astral plane.
                Empathy:
                  Description: &Empathy |
                    The caster can magically sense another character or group’s strong emotions (not thoughts). This spell not only allows the character to gain a general impression of the mood and intentions of individuals or groups, it also allows him to broadcast his emotions to an individual or group. Broadcasting emotional attitudes like friendship, love, caution, helpfulness, and so forth can sometimes prove invaluable in clearing up a misunderstanding. The character cannot broadcast these emotions unless he truly feels them. These feelings should help dictate his actions. Only one attempt at it can be made per encounter. By using this spell, especially on animals, the caster can sense whether the target is deathly afraid, slightly afraid, in love, full of hate, etc. and the object of their hate, love, fear, and so on.
                Enchanted Eye:
                  Description: &Enchanted_Eye |
                    The caster creates an enchanted eye when he wishes. The caster can automatically summon the enchanted eye for one round only. A successful spell rank FEAT roll brings the eye forth for the full duration of the spell. It can only see as far as sight normally would, but can penetrate darkness (real or magical), show the caster mystical existences (such as astral projections, invisible magical objects, mystical shields, and so on), and see through illusions. The caster is mentally linked with the eye and sees everything it sees.
                    
                    The enchanted eye is a separate magical creation capable of flight. Its movement rate is the same as that of the caster. The maximum distance it can be be separate from the caster is based on the spell rank (for example, 12 areas for Amazing rank.) The eye can be attacked physically or magically; the eye has Health points equal to the caster’s Psyche and any FEAT roll the eye is required to make use the caster’s appropriate ability rank. The caster is not affected by any damage suffered by the enchanted eye.
                Flaw:
                  Description: &Flaw |
                    The caster weaves a mystical tendril around an object and sees the stress points, fracture planes, or weaknesses inherent in the item. The object must be natural, not magical. If this spell is used successfully, the caster can use a magical energy attack (bolt, blast, etc.), and shatter the object if he gets a Bull’s-Eye result using a Targeting attack (see the Magic Effects Table), even if the object’s material rank is up to three ranks higher than the spell rank. Note; This spell cannot be used to shatter Class 1000 materials unless the caster’s spell rank is also Class 1000.)
                Flight:
                  Description: &Flight |
                    With this spell, the caster can magically fly. The spell rank and Psyche of the caster determines how fast he can fly. Consult theMagical Flight Speed     Table, below to determine the movement rate. The normal rate is the speed the character usually flies. If he wishes to achieve top rate flight he must make a Psyche FEAT roll every 5 rounds. A failed roll simply drops the caster’s speed back to normal.
                    
                    The caster must make a successful spell rank FEAT roll to perform intricate flight maneuvers, fight while aloft, or perform other magic while aloft. The form of flight that the individual player character has (wings that magically appear, magic control of wind, or simply mystical flight) is up to the player.
                Foretelling:
                  Description: &Foretelling |
                    The caster can mystically predict the actions of anyone he has studied (defined as observed for at least 10 rounds). This foretelling is short-term only. If he makes a successful spell rank FEAT roll the caster does not have to decide what to do in that round until after the opponent(s) have declared their actions, no matter who has the initiative.
                Gramarye:
                  Description: &Gramarye |
                    The caster has the ability to magically learn information from an item, The caster must make a successful spell rank FEAT roll to learn anything from the item (if the item is of an unfamiliar alien design, the Judge can apply a -1CS to the spell rank).
                    
                    The first information that can be gleaned by a successful spell rank FEAT roll is what the item’s purpose is and how to use it. If the caster has no talent in an area that the item might be used for, then he only has a rank of Typical when using it.
                    
                    Once an artifact’s purpose is identified another spell rank FEAT roll is allowed. If successful, it allows the caster to “read” the psychic impressions left on it by the last person who used it. Information that can be gained includes what the user looked like, what he thought of while using it, what he was doing for the last few hours before the item was lost, stolen, or otherwise left his possession, etc. The longer the item has been untouched, the dimmer the impression.
                    
                    This spell is increased or diminished if the item is magical. If the magic is of the same school as the caster, he receives a +2CS. If the magic is not of the same school as the caster, he receives a -1CS. If the magic is of a school hostile to the caster, he suffers an additional -1CS.
                Healing:
                  Description: &Healing |
                    This spell gives the caster such complete control over his bodily functions that he can heal himself by use of personal or dimensional energy. Use the spell rank number instead of his Endurance rank number to determine the maximum amount of damage healed. The caster can only perform this once per day, in addition to his normal healing rate.
                Healing-Others:
                  Description: &Healing-Others |
                    The caster can magically heal other characters by using universal or dimensional energy. The caster must touch the character for two consecutive rounds after casting the spell. A successful spell rank FEAT roll is required. The, maximum amount of damage that can be healed per person is the spell rank number. Any individual character can only be healed once per day by a specific caster. The number of different characters the caster can heal per day is equal to the spell rank number divided by 10 (round fractions up). If the player so desires, this spell could be used to heal a creature instead of a character.

                    The healing is complete, including the mending of broken bones and torn cartilage. The spell is also effective against disease.
                Image Projection:
                  Description: &Image_Projection |
                    The caster can direct his magical energy to form an identical image of himself. For every round he makes a successful spell rank FEAT roll, the image will perform as he desires, thoroughly convincing most characters that the image is the caster. This belief is somewhat like the Illusion spell and should be treated as an illusion for the purposes of combat or touching the image.
                    
                    The caster can either use this spell while he is visible to create a “double” and confuse his opponents, or he can hide or turn invisible (if he has that spell) and have the image replace him.
                    
                    The creation of more than one image is possible, but it requires a successful Psyche FEAT roll by the caster for every image made and each image requires a successful spell rank FEAT roll by the caster for each round he is commanding them. The maximum number of images a caster can create during the use of this spell is the spell rank divided by 10 (round fractions up).
                Invisibility:
                  Description: &Invisibility |
                    This spell makes the caster invisible to others. Any item on the caster’s person and anyone holding hands with him (and willing to be affected) also becomes invisible as long as they remain in contact with him. This spell cannot turn an unwilling creature invisible.
                    
                    Being invisible causes no special problems for the caster, but anyone else affected who is not used to being invisible will have a real problem moving about (movement halved), performing the simplest of actions (-2CS), and fighting in any fashion (-3CS for any combat). It requires at least 10 rounds of being invisible before becoming used to it.
                    
                    Note: an invisible person can be located by persons with superhuman hearing or sense of smell, or by detection powers and devices that do not depend on sight.
                Learning:
                  Description: &Learning |
                    This spell is used to give the caster an advantage in combat. It enables him to quickly learn from his mistakes. After this spell is cast the caster must fight his opponent for three consecutive rounds (normal combat, magical combat, astral combat, etc.). When the three rounds have passed the caster suddenly has insight into his opponent’s methods of combat and receives a +1CS when fighting that opponent during this encounter only. The duration and area of effect listed on the Magical Limits Table do not apply for this spell.
                    
                    If combat is interrupted but later resumed and the Judge is not sure whether to consider it one continual encounter or two separate encounters, the spell still applies if the caster makes a successful spell rank FEAT roll.
                Levitation:
                  Description: &Levitation |
                    This spell enables the caster to mystically rise into the air. A successful spell rank FEAT roll is required. No further FEAT rolls are needed unless the caster descends to the ground, and then want to levitate again during the duration of the spell. The maximum altitude a levitating character can reach is 1 area at Good rank, with an additional 2 areas for every spell rank above Good (thus, a caster with a Remarkable Levitation spell can reach an altitude of 5 areas). The movement speed (rising or descending) per round is 1 area for a character with Good Psyche with an additional area for each Psyche rank above Good. The character cannot use this spell to lift any weight greater than his normal clothing and equipment. This spell affects the caster only.
                    
                    The character can perform other actions while airborne, including combat, but is limited to one spell per round regardless of the type of energy (personal, universal, or dimensional). If knocked unconscious while levitated, a character will immediately fall to the ground.
                    
                    This spell should not be mistaken for the ability to fly (see the Flight spell). Levitation only allows vertical movement. Sideways movement is only achievable by the levitating character pulling himself along an object. A levitating character cannot create forward momentum to affect the direction of his ascent. It is always straight up. While wind has no affect on a floating caster’s ascent direction, it can slow him down if the Judge feels it is strong enough.
                Luck:
                  Description: &Luck |
                    The caster can disrupt probability fields so that very unlikely events can occur, somewhat like creating his own luck. For example, he could cause a table to collapse or a machine to tip over. He can not cause something to happen if that event is impossible; tables can not be created from nothing, and machines just can’t cease to exist. When the caster uses his spell, the player describes exactly what effect is wanted, and the Judge decides whether or not that effect is within the spell’s power and assigns an appropriate FEAT color. To use the spell the caster must make a successful spell rank FEAT roll. If the caster is trying to alter probabilities around magic materials or energies, such as magical artifacts or temples, apply a -2CS to the spell rank when making the FEAT roll.
                Manipulation:
                  Description: &Manipulation |
                    This spell creates invisible magic tendrils that can manipulate materials. “Soft” materials, like organic tissue and fabric are easily manipulated while “hard” inorganic materials require a successful spell rank FEAT roll. No material can be manipulated if its Material Strength rank is greater than the spell rank. The caster can easily manipulate the hair or clothing of another character, causing them to constrict or bind the target (Strength for grappling would equal the spell rank). If the caster is attempting to affect organic tissues or muscles in another creature, the caster must make a successful Psyche FEAT roll. If successful, the victim must make an Endurance FEAT roll or suffer damage equal to this spell rank. The spell can only be used on one target at a time.
                Mental Barrier:
                  Description: &Mental_Barrier |
                    This spell creates a magical invisible headgear which does not hinder the caster’s normal senses. It allows the caster to know when someone is trying to intrude on his thoughts, magically attack his mind through mesmerism, illusion, etc. It does not indicate who is doing the attacking or intruding, nor does it reveal what spell is being used.
                    
                    In the round following the one in which the hostile spell is detected, the caster can, secure the barrier, preventing illusions, telepathy, empathy, etc., from affecting the caster. It also protects him from magical attacks on the mind (Emotion Control, Confusion, Fear, Mental Control, etc.) by giving him a +3CS for any Psyche FEAT roll to resist the attack. While the barrier is up the caster can perform no spells that require/a great deal of concentration.
                    
                    Treat the spell rank as body armor for the sake of defense against attempted mental penetration by non-magical powers.
                    
                    The Judge should make sure this spell is not abused. A character who constantly has the barrier up will become easily exhausted and can even suffer Psyche loss due to the mind damaging effects of trying to always be mentally protected. The maximum safe duration rank is Excellent.
                Servant:
                  Description: &Servant |
                    The caster can summon forth his own, personal servant to do his bidding. This servant will require quite a bit of Judge’s discretion as to its nature, abilities, spell, etc.
                    
                    The servant’s abilities are generated as for any other character. The Judge then gives it two spells, and gives it an origin appropriate to the character it serves. Various types of magical servants exist, including jinn, demons, familiars, ghosts, and the like. The servant is obedient, helpful, and useful. The caster can automatically talk to or otherwise communicate with the servant.
                    
                    This spell cannot use human beings as servants.
                Sensing-Danger:
                  Description: &Sensing-Danger |
                    The caster can scan the area of spell using mystic waves that will warn him of danger. If this spell rank is higher than the caster’s Intuition rank, use this spell rank when the caster makes Intuition FEAT rolls. If the spell rank is lower than the caster’s Intuition, increase his Intuition by one level when making Intuition FEAT checks.
                Sensing-Evil:
                  Description: &Sensing-Evil |
                    The caster can mystically sense the presence of great evil in his area of spell. This includes the presence of evil creatures (demons, evil magic wielders, super villains bent on destruction, etc.), artifacts of evil design or exceptionally evil deeds. This spell is automatic (FEAT rolls are not needed). As the caster gets closer to the source of the evil emanations, his sensing gets stronger. Thus, he can usually root out the evil if he goes looking for it.

                    If the spell duration is permanent, the spell functions constantly, even when the caster is asleep.
                Sensing-Fields:
                  Description: &Sensing-Fields |
                    The caster can magically detect the presence of force fields, magical or otherwise in the area of effect. The caster must make a successful yellow FEAT to detect fields smaller than man-sized at ranges greater than five areas. At ranges of a mile or more, the caster must make a successful red FEAT to detect fields smaller than building-sized.

                    Unlike some of the other sensing spells, this spell does not require a great deal of concentration.
                Sensing-Identity:
                  Description: &Sensing-Identity |
                    The caster can mystically scan the mind of anybody he can see within his area of spell and determine that person’s true identity. If the target is another magic wielder or a character with mental powers of any kind, he is allowed a Psyche FEAT roll to resist the probe. If the resistance FEAT roll is successful, he is unaffected.
                Sensing-Mystical Detection:
                  Description: &Sensing-Mystical_Detection |
                    The caster is sensitive to the use of magic. He can detect magic use and its specific source within the area of effect. Among the specific things he can detect are: magicians casting spells, magical items that are being used or that have a protective spell cast on them, magical portals, and magical creatures.

                    Unlike some sensing spells, this spell does not require a great deal of concentration.
                Shield-Great:
                  Description: &Shield-Great |
                    This shield protects an area. Unlike the other shields, the great shield is immobile and the caster assigns it to a fixed position when he casts it. The size of the great shield can be anywhere from the size of an individual shield up to a plane that is 1 area wide and 3 stories tall. It can be located anywhere within the area of effect, but the caster must see the location to place it. The great shield has an armor rank equal to the spell rank +2CS. It is usually transparent, but strange runes can be seen scrawled around the edge. If it is struck by an attack with a higher power rank it is shattered and disappears, though no damage penetrates it to harm the caster during that round.
                    
                    A caster can have only one great shield in effect at any time.
                Shield-Individual:
                  Description: &Shield-Individual |
                    The caster create a sorcerous shield to protect himself. The shield has an armor rank equal to the spell rank. This shield is usually invisible to all but magic wielders and can be projected out away from the caster’s outstretched hand a few feet. The caster moves the shield to block attacks. If the caster is attacked from a number of sources at once the shield will only protect him from one attack. If the caster is surprised, or if the attacking character succeeds in targeting a magical beam or bolt as a bull’s-eye, it means the caster could not move his shield fast enough to deflect the attack. If the shield is hit by an attack with a higher spell rank it shatters, though no damage penetrates it to harm the caster during that round.
                    
                    The caster can also use this spell to encircle himself with four weaker shields (armor rank equalling the spell rank -1CS).
                    
                    If any of the shields are broken, the remainder are unaffected. The caster cannot leave the circle of shields until they dissipate or are destroyed.
                Tongues:
                  Description: &Tongues |
                    The caster mystically alters his senses so he can read, write, speak, and hear unknown language spoken or written in his presence. The area of effect has no significance with this spell. If the language is native to his world, no FEAT roll is needed. If the language is an alien one, he must make a successful spell rank FEAT roll to be able to comprehend it.
                Trance:
                  Description: &Trance |
                    The caster has two options with this spell, he can mystically slow down or speed up his metabolism.
                    
                    The slowed metabolism reduces the potency of any poison in his body (-3CS). The character can almost hibernate, thus lasting longer on fewer supplies in harsh climates, The character can feign death and has a chance to fool even the best doctors into believing he has died; feigning death requires a successful spell rank FEAT roll. While the caster’s body metabolism is slowed down, healing is also slower (one-half his Endurance rank number per day).
                    
                    The accelerated metabolism speeds up medicinal drugs injected into the caster’s system, thus doubling the effects of healing. He can feign a fever, heart attack, and other maladies.
                    
                    Once the character has started his mystical trance he cannot move or do any action except concentrate. He can come out of the trance whenever he desires, but it takes 2 rounds for his body to return to full consciousness.
              Universal Energies:
                Charm:
                  Description: &Charm |
                    The caster creates a pleasant aura about himself, charming opponents in the area of effect. Every opponent in the area is allowed a Psyche FEAT roll (see Magic Effects Table). If the target is affected, he will quickly change his mind about attacking the caster because “there is just something about him he likes”; if the Psyche FEAT result is “No Effect”, the target is not even aware that the caster tried to charm him. A charmed target will not attack the caster, but will attack another opponent, if one is available. The caster cannot give orders of any kind to a charmed character; the spell is not a form of mental control.
                    
                    A charmed target is allowed to make a Psyche FEAT roll each round to attempt to break the charm. Each charmed opponent must break the charm on his own; he cannot be persuaded that he is charmed by friends, although a counterspell cast by a friend might break the charm. Unless the charm is broken, it will remain in effect for the duration of the spell, even if the caster leaves. A charmed character will not remember that he has been charmed once the spell expires.
                    
                    If the caster attacks an opponent charmed by his spell, the spell is automatically broken, and the target retains full memories of being charmed and remembers who is responsible.
                Confusion:
                  Description: &Confusion |
                    The effects of this spell are unpredictable, but can be devastating. When it is cast, all targets within the area of effect receive a Psyche FEAT roll to avoid the effect. If a target fails the roll, he is affected by the confusion. The Judge rolls a die for each affected target and checksConfusion Results, to see how each is affected. The duration is 1-10 rounds, rather than the normal duration associated with the spell rank.
                Conjure:
                  Description: &Conjure |
                    This spell is used to teleport an item, plant, creature or character from its current location to the caster’s location. This spell can even restore a broken or decayed item to its original form while in the act of teleporting.
                    
                    If conjuring a trivial item, plant, or harmless animal, the caster need make no FEAT roll, it simply appears.
                    
                    If conjuring a complex or dangerous item, plant, or dangerous creature, or attempting to conjure a broken or decayed item, the caster must make a successful spell rank FEAT roll before it appears.
                    
                    If conjuring forth a willing character (teammate, friend, etc.) the caster must make both a successful spell rank FEAT roll and a successful Psyche FEAT roll before the character appears.
                    
                    If conjuring forth an unwilling character, the caster must make a successful spell rank FEAT roll. The subject is allowed a Psyche FEAT roll to resist being brought forth; if the resistance FEAT is successful, the conjuration fails.
                    
                    The conjuration of the body of a dead character is far beyond the abilities of any caster who does not have an Unearthly spell rank in this spell. The conjure spell only summons or recreates the physical body; however, if the dead character’s astral form survives (see the Astral Projection spell), it can reanimate the body, restoring it to true life.
                Curse:
                  Description: &Curse |
                    With this spell, the caster can weave an enchanted curse around an opponent. If the spell rank FEAT roll is successful, the curse will remain with the opponent for the duration of effect. The duration of this spell is unusual; a curse cannot exceed Amazing duration (one month), even if the caster’s spell rank exceeds Amazing.
                    
                    When a curse is attempted, the target can avoid it by making a successful Psyche FEAT roll. If the curse takes effect, the victim can make one Psyche FEAT roll per day to attempt to break it; a successful FEAT roll means the curse is broken. The target will not know who attacked him, regardless of whether or not the curse is successfully cast.
                    
                    A curse negatively modifies all of the opponent’s actions and spells by a 1 Column Shift (plus or minus, as long as it works against the opponent). No more than one curse can normally be placed on a character. The exception is the use of the Link spell, whereby up to two curses can be placed on one opponent, but they cannot, totally, exceed the effect of a -2 Column Shift modifier lasting one month.
                    
                    The Judge can decide to allow curses that have different effects instead of column shifts, such as: temporary aging; warts and boils; etc., but no curse can cause the death of a character.
                Fear:
                  Description: &Fear |
                    This spell affects all targets in the area of effect. The spell releases an unreasoning fear from the target’s mind. All targets are allowed a Psyche FEAT roll to resist the effect (see the Magic Effects Table). If the target misses the roll, the frightened character wants nothing more than to run away and hide (all his actions while afraid are at -2CS). The victim will try to avoid, or if necessary attack, anyone attempting to stop or restrain him. The character can only perform actions (including spellcasting) that will help him to escape. The victim always flees away from the attacker, even if he cannot see the caster. After the first three rounds of being afraid, and every other round after that, if need be, the frightened character is allowed a Psyche FEAT roll to regain his composure. Once made, it will still take him a full round to get complete control of himself.
                    
                    Though the caster must maintain a high degree of concentration on this spell to keep the target afraid (no attacks or other spellcasting allowed), he does not know when the character breaks the spell. Only when the target attacks the caster or otherwise acts contrary to a state of fear does the caster realize he no longer influences the target.
                Forgetfulness:
                  Description: &Forgetfulness |
                    The caster can magically effect other characters’ minds and cause them to forget events. This is usually used by heroic magic wielders to protect innocent bystanders from the awesome psychic shock caused by some of the sights to be seen during magical combat, etc. It is also used by most magic wielding characters to protect their secret identities. Evil magicians may also use this spell to cover up their trail or their crimes. The duration of the spell is permanent (unless another sorcerer uses a Revival spell of at least equal spell rank to break the spell of Forgetfulness). The number of people that can be ensorcelled by the spell depends on the spell rank: Good = 1 person; Excellent = up to 5 people; Remarkable = everyone in I area; Incredible = everyone in a square mile; Amazing = everyone in 100 square miles; Monstrous = everyone on the planet; Unearthly everyone in one dimension; Class 1000 everyone in all dimensions.
                    
                    Any character with a Psyche equal to or greater than the caster’s may make a Psyche FEAT roll to reduce the effects of the spell. Magic wielding characters have a +2CS for this FEAT roll. A green result means that vague recollections of the event sometimes surface in the character’s memory. A yellow result means that the character knows most of the highlights of the event, but cannot remember who cast the spell of forgetfulness. A red result means that the character can remember everything.
                Glamor:
                  Description: &Glamor |
                    The caster can conjure up flashing lights and swirling colors, which distract and confuse opponents. The caster can cause them to appear anywhere within sight in the area of effect. Any characters in that area must make a Psyche FEAT roll; if the FEAT is successful, the target is unaffected. If the roll fails, the target suffers an unfavorable 1 CS on all his actions (plus or minus 1 CS depending on whatever is unfavorable to the target).
                    
                    If the caster desires, he can try and target the glamor on a specific character; this requires a successful targeting Agility bull’s-eye FEAT roll. If successful, the target suffers an unfavorable 2 CS, but the spell effects that target only
                    
                    Once established the glamor cannot be moved out of the area or exact location it was cast upon. Glamor has no effect on the caster.
                Healing-Others:
                Illusion:
                  Description: &Illusion |
                    This spell creates an illusion in the mind of creatures within the area of effect. The player whose character is using this spell must describe it to the Judge. The illusion looks, sounds, and smells the way it would if it were real, but cannot cause damage. Since the illusion exists only in the mind of the targets, no one outside the area of effect can see it. All characters in the area of effect see the same illusion. The caster must concentrate on the illusion for the entire duration of its existence to be believable.
                    
                    Each character seeing the illusion may make a Psyche FEAT roll to disbelieve it at the beginning of the illusion and every other round after that. If the FEAT roll is successful, the illusion fades from his mind. Other characters with illusion creating powers, whether magical, mutant, or whatever, receive a +2 Column Shift to their attempts to disbelieve. An unaffected character cannot persuade an affected character of the illusion’s true nature.
                    
                    Characters who are affected will act as they normally would if the illusion were real. If characters attack an illusion, attacks will not affect it (although the caster could make it seem otherwise); the Judge will have to keep track of the attacks because of the possibility of injury to bystanders or property. Items passing through an illusion may look like they are absorbed by it, like he side-stepped it, or whatever else the caster desires.
                    
                    If the illusion is of something silly, confusing, or extremely contradictory, then the Judge should secretly roll an Intuition check for those affected to disbelieve it.
                Mesmerism:
                  Description: &Mesmerism |
                    This is a basic magical form of hypnotism that permits the caster to communicate with and command specific creatures of less than human intelligence. To communicate with a creature requires a successful Psyche FEAT roll. Commanding a creature is possible only if the caster’s spell rank is greater than the creature’s Endurance rank, and also requires a successful spell rank FEAT roll.
                    
                    The target must be able to see the caster to be affected by this spell. If the caster is affected by an attack in the round he casts this spell, the mesmerism is automatically broken.
                    
                    When this spell is obtained, the caster will be able to mesmerize only one specific type of animal: mammals, birds, reptiles, amphibians, fish, insects, etc. As he becomes experienced he can learn how to mesmerize other types (Judge’s discretion).
                Paralyze:
                  Description: &Paralyze |
                    This spell creates a magical tendril that attacks the target’s mind, making him unable to move. If the caster’s spell rank FEAT roll is unsuccessful, the target will not even suspect he has been attacked. It the caster’s spell rank FEAT roll is successful, the target is allowed a Psyche FEAT roll to resist. If the target’s resistance roll is successful, he is unaffected but knows that he has been attacked. If the target’s resistance roll is unsuccessful, he becomes completely paralyzed for a number of rounds equal to the roll of one die, plus 2 additional rounds. A paralyzed character cannot move or speak, but he can see, hear, smell, and use mental spells (it he has any). Only a creature with a brain (including cyborgs) can be paralyzed. Medical treatment cannot cure magical paralysis.
                Revival:
                  Description: &Revival |
                    The spell counters the effects of other spells that preventing a character from acting or thinking with complete control. Spells that can be countered by a Revival spell include Mesmerism, Emotion Control, Confusion, Fear, Illusion, Charm, Mental Control, Paralyze, Forgetfulness, and the like.
                    
                    If the spell rank of the Revival spell is stronger than the spell rank of the controlling spell, then the controlling spell is automatically broken. If the spell ranks are equal, a successful spell rank FEAT roll is needed to break the spell. If the holding spell is a higher spell rank than the Revival spell, then the caster must make a successful spell rank FEAT roll to break the spell subtracting as many ranks from his spell’s normal spell rank as the holding spell exceeds it.
                    
                    A Revival spell can only be used against a specific spell enthralling a specific character once a day.
                Shield-Aura:
                  Description: &Shield-Aura |
                    The caster surrounds himself or another character with a shining aura that acts as body armor against all forms of attack. It does not hinder the caster in any way. An aura shield has an armor rank equal to the spell rank -1CS. If it is hit by an attack with a higher power rank it is shattered and disappears, though no damage reaches the caster during that round. Only one aura shield can surround a character at any given time.
                Teleportation:
                  Description: &Teleportation |
                    The caster can channel his Universal or Dimensional energy into a special type of movement that allows him to travel instantaneously from one spot to another without physically crossing any of the space between. The caster can teleport as far as his area of effect allows. If the caster is familiar with the location he is teleporting to, or is able to see it, then he need make no FEAT roll. If he is attempting to teleport into an unknown location he must make a spell rank FEAT roll. A failed roll means he could not complete the movement and was “bumped” back to his original point of departure.
                    
                    If a caster tries teleporting into a solid object (because he is unaware of its presence) he must make an Endurance FEAT roll; if this roll fails, he materializes outside the object but suffers damage equal to the material rank of the object. The character is automatically slammed (1 area) and may be stunned (make a FEAT roll for exact result).
                    
                    The visual effects that accompany teleporting (vapors rising, flash of light, slow fade out, etc.) are up to the player.
                Trap:
                  Description: &Trap |
                    The caster uses this spell it he expects to be mentally attacked (magical or otherwise). Once set, the trap will last for 5 rounds (ignore the normal duration of spell) or until the character is successfully struck by a magical mental attack or other form of mental probe. When this happens, the caster must make a spell rank FEAT roll. If he succeeds, the caster’s stored magical Universal or Dimensional energy lashes out, causing damage to the attacker’s mind that is equal to the trap’s spell rank. If he fails, the attack against the caster will be successful, but apply a -2CS to the spell rank of the hostile spell.
                Vapors-Obscurity:
                  Description: &Vapors-Obscurity |
                    The caster can conjure forth magical vapors, which pour out from around his feet, hands, or just suddenly begin to swirl in the air (caster’s discretion). The vapors resemble dense smoke of a color specified by the caster. They fill the area he is occupying in one round. The caster can continue to fill areas at a rate of one per round until some or all of his area of effect is full. These vapors prevent anyone from seeing the caster, and even radar, sonar, and infrared devices cannot penetrate them. The caster, on the other hand, can see through the vapors perfectly.
                    
                    The effect that the vapors have on combat is to provide the caster with a +1CS when striking an opponent who is in the vapors and to penalize the opponent with a -2CS Shift for striking at the caster, while the opponent is in the vapors.
                Vapors-Sleep:
                  Description: &Vapors-Sleep |
                    The caster can conjure forth magical vapors, which pour out from around his feet, hands, or just suddenly begin to swirl in the air (caster’s discretion). These vapors resemble soft, billowy, white clouds and will only cover the caster’s immediate area (if the spell rank is Good or less) or the caster’s area and one adjacent area of his choice (if the spell rank is Excellent of better). The vapors are not of sufficient density to affect anyone’s vision.
                    
                    Everyone but the caster who is in the vaporous area(s) must make an Endurance FEAT roll or fall asleep for 1-10 rounds plus an additional 2 rounds. Loud noises, being nudged, and other “awakening” conditions will arouse the characters affected. These vapors only last for one round, then dissipate.
              Dimensional Energies:
                Environmental Independence:
                  Description: &Environmental_Independence |
                    The caster can surround himself with an aura of magic that maintains a livable environment for him. He does not need to sleep, eat, drink, or breathe, but can if he wants to. He feels no non-magical cold or heat and can survive in outer space, under water, within the earth, in hostile atmospheres, etc. This spell does not provide protection from or immunity to attack, but it does allow the caster to survive in conditions where survival would normally be impossible. The area of spell is usually just around the caster himself, though the aura can contain an additional character for every rank of the caster’s Psyche above Remarkable.
                    
                    This is a particularly long-lived spell, often used by magic wielders stranded in hostile circumstances or alien dimensions. The duration of this spell is left to the Judge, as different conditions and circumstances (time passage in other dimensions for example) can affect the duration. It is suggested that the caster receive a +3CS on the duration of the spell. (For example, the spell would have a Unearthly duration for a caster with an Incredible spell rank.) An Unearthly duration means that the spell lasts indefinitely, usually until the caster escapes from the hostile conditions that caused him to cast the spell.
                Dimensional Aperture:
                  Description: &Dimensional_Aperture |
                    This spell causes a temporary opening in the dimension’s fabric, allowing the caster to cross from one dimension to another. Look for the section on Dimensions in the Miscellany of Mysticism for more detail. The caster can automatically open a portal to a dimension with which he is familiar, but opening a portal to an unfamiliar dimension requires a successful spell rank FEAT roll. If a FEAT roll is required, failure indicates that the caster cannot enter the desired dimension that day A beginning caster who does not really know one dimension from another can stumble into any one of them at random.
                    
                    A spellcaster who is in a familiar foreign dimension can automatically return to his home dimension. However, if the caster is in an unfamiliar dimension or if his mind has been affected by traveling in a sanity-bending or sanity-threatening dimension, the caster must make a successful spell rank FEAT roll to locate the dimensional position of his home dimension. This roll to return is only allowed once per week. However, the caster can enter another random dimension and try to go home from there.
                    
                    If the caster tries to take anyone else with him into a dimension, whether they are willing or unwilling, then a Psyche FEAT roll is required of each character passing through into the dimension, every time they enter a new dimension. Anyone who fails the FEAT roll cannot pass through that particular dimensional aperture at this time. Characters who are left behind can try again a day later, if the aperture is still in effect.
                    
                    This spell also grants the caster knowledge of a tiny “personal dimension” where he can go with perfect accuracy and safety. This pocket dimension is only accessible from the caster’s home dimension and contains no dangerous creatures. There the caster can go for peace, solitude, and can even make it a home away from home. The caster can enter or leave his own little dimension once per day.
                Link:
                  Description: &Link |
                    The caster can link his mind with other, willing magic wielders, thus giving him additional power. Up to four magic wielders can be linked in this manner. For every magic wielder linked to his mind, the caster gains a +1CS to the spell rank of any spell he casts, up to a maximum of Shift X rank. (Exception: this spell cannot increase the rank or effects of Link spells.) If the spell involves a range factor, the range is increased to that of the shifted spell rank. If the spell inflicts damage, the area of effect and the spell rank is shifted, for purposes of FEAT rolls, but damage is increased by 10 points (not 1 rank) for each additional mind linked. (For example, if three magic wielders are linked to a caster with an Incredible rank in Eldritch Crystals, he would receive a +3CS for the area of effect and chance of a successful spell rank FEAT roll, but any damage caused would be 70 points, not 100.
                    
                    Only the caster who initiates the Link spell can perform any actions. All other magic wielders who are linked must remain in place and concentrate. If the caster they are linked to sustains damage, they absorb one-tenth of that damage too, rounded down. The link also increases the caster’s Psyche for resistance to mental attack. For every additional mind linked, apply a +1CS to the caster’s Psyche when defending against mental attack.
                    
                    The link is automatically broken if the caster is rendered unconscious or if he loses control of his own mind (due to Confusion spells, Fear spells, Mental Control spells, etc.)
                Shield-Multiple:
                  Description: &Shield-Multiple |
                    This spell uses extradimensional energies to create a Multiple Shield. It is identical to an Individual Shield, except that there are actually multiple shields behind the one that appears. For every spell rank above Good, the caster has another Shield that immediately appears when the previous shield has been shattered. For example, a caster with a Remarkable spell rank has three Individual Shields, one right behind the other to protect him.
                    
                    If the outermost shield is struck by an attack that is at least two ranks higher than the shield rank, one or more inner shields are also broken; if the attack is 2 ranks higher, a second shield is broken, at 3 ranks higher, a third shield, and so on. No damage will reach the caster in the round the last shield is broken.
                Teleportation:
                  Description: &Teleportation |
                    The caster can channel his Universal or Dimensional energy into a special type of movement that allows him to travel instantaneously from one spot to another without physically crossing any of the space between. The caster can teleport as far as his area of effect allows. If the caster is familiar with the location he is teleporting to, or is able to see it, then he need make no FEAT roll. If he is attempting to teleport into an unknown location he must make a spell rank FEAT roll. A failed roll means he could not complete the movement and was “bumped” back to his original point of departure.
                    
                    If a caster tries teleporting into a solid object (because he is unaware of its presence) he must make an Endurance FEAT roll; if this roll fails, he materializes outside the object but suffers damage equal to the material rank of the object. The character is automatically slammed (1 area) and may be stunned (make a FEAT roll for exact result).
                    
                    The visual effects that accompany teleporting (vapors rising, flash of light, slow fade out, etc.) are up to the player.
