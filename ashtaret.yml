Hero:
  Game System: TSR Marvel Super Heroes RPG Advanced
  Name: Ashtaret
  Identity: Ashtaret
  Secret:
    Demon: false
    Deity: false
    Normal Human: true
    Note: Normal Human Aspects may have appropriate cover identities.
  Base of Operations:
    - Hell Dimension
    - Dimension of Dreams
    - Manhattan
  Group Affiliation: None
  Era: Bronze-Iron Transition (Mid 1980's-Early 1990's)
  Continuity: Earth-1986
  Age: Timeless
  Origin:
    Physical Form:
      Type: Changeling
      Description: Able to transform between multiple distinct Body Types, each with unique advantages, disadvantages, and at least one exclusive power. Transformation temporarily disables all powers and reduces abilities.
      Note: Takes 10 turns to change Aspect. No Powers can function and all Abilities -2CS during change. No Powers available to Normal Human Aspect unless specifically noted under that Power.
      Aspects:
        - Demon: Supernatural, corporeal being from another dimension, inherently malevolent by nature. Demons possess increased physical abilities, fire generation, invulnerability to heat and fire, and reduced popularity.
        - Deity: A former powerful entity worshiped as a god, now diminished and bound to a mortal form on Earth. Deities have significantly enhanced abilities, additional powers, automatic access to at least one travel power, and increased popularity with the general public, though limited influence among modern religious groups. Eventually attract any remaining living worshippers they still have as Contacts.
        - Normal Human: The body is completely normal and possesses no detectable abnormalities. Any Powers the hero possesses have left no visible mark on the body.
    Origin of Power: Natal
  Weakness:
    Demon:
      Stimulus: Psychological
      Effect: Power Negation
      Duration: Continuous with Contact
      Conditions: Hallowed Ground
      Note: Powers cease functioning withing 20 feet of stimulus, -1CS Abilities per 10 turns of exposure, cannot directly use Powers against Stimulus from outside radius. Instantly reverses when moved away from Stimulus. Sites consecrated to her do not trigger this Weakness.
    Deity:
      Stimulus: Energy Depletion
      Effect: Special
      Duration: Special
      Conditions: Forced change back to Demon Aspect after 1d100 turns in Deity Aspect, unless in continuous contact with Energy Source while in that Aspect, until 1d100 turns exposure to Energy Source to recharge.
    Normal Human:
      Stimulus:
        - Elemental Allergy
        - Molecular Allergy
        - Energy Allergy
      Effect: Fatal
      Duration: Continuous with Contact
      Conditions: Exposure to energies or toxic substances causes loss of Health and Endurance.  May heal as normal after exposure ceases.
      Note: Inherent to all Normal Human Physical Form Characters.
    Special:
      Stimulus: Special
      Effect: Loss of -1CS to all Powers and abilities
      Duration: Continuous with Contact
      Conditions: Engaging personally in actively promoting a religion based on herself (may still passively attract folowers).
      Note: Inherent to all Deity Physical Form characters. This condition and effect applies in any Aspect.
  Abilities:
    Primary Abilities:
      Fighting:
        Demon:
          Rank: Excellent
          Number: 20
          Rank Description: Regular, formal training
        Deity:
          Rank: Remarkable
          Number: 30
          Rank Description: Superior talent
        Normal Human:
          Rank: Excellent
          Number: 20
          Rank Description: Regular, formal training
      Agility:
        Demon:
          Rank: Amazing
          Number: 50
          Rank Description: Super-human accuracy
        Deity:
          Rank: Monstrous
          Number: 75
          Rank Description: Super-human accuracy and sense of dexterity
        Normal Human:
          Rank: Excellent
          Number: 20
          Rank Description: Intensive training in dexterity and/or accuracy
      Strength:
        Demon:
          Rank: Excellent
          Number: 20
          Rank Description: Able to press up to 800 lbs. (Maximum human ability)
        Deity:
          Rank: Remarkable
          Number: 30
          Rank Description: Able to press up to 2000 lbs (1 ton)
        Normal Human:
          Rank: Excellent
          Number: 20
          Rank Description: Able to press up to 800 lbs. (Maximum human ability)
      Endurance:
        Demon:
          Rank: Monstrous
          Number: 75
          Rank Description: Rarely tires, great fortitude
        Deity:
          Rank: Unearthly
          Number: 100
          Rank Description: Never tires
        Normal Human:
          Rank: Excellent
          Number: 20
          Rank Description: Regular exercise
      Reason:
        Demon:
          Rank: Incredible
          Number: 40
          Rank Description: Understand non-terran technologies
        Deity:
          Rank: Monstrous
          Number: 75
          Rank Description: Improve and modify advanced alien technologies
        Normal Human:
          Rank: Excellent
          Number: 20
          Rank Description: Modify existing 1980's technology
      Intuition:
        Demon:
          Rank: Shift-X
          Number: 150
          Base:
            Rank: Monstrous
            Number: 75
            Rank Description: Senses beyond all normal limitations
        Deity:
          Rank: Shift-Y
          Number: 225
          Base:
            Rank: Shift-X
            Number: 150
        Normal Human:
          Rank: Unearthly
          Number: 95
          Rank Description: In touch with universe, cannot be blindsided
          Base:
            Rank: Excellent
            Number: 20
            Rank Description: Detective skills or background
        Note: Monstrous (75) Additive Hyper-Intelligence added to base Intuition of Demon and Deity Aspects.
      Psyche:
        Demon:
          Rank: Monstrous
          Number: 75
          Rank Description: Intense training in mental powers, experience in wielding those powers
        Deity:
          Rank: Unearthly
          Number: 100
          Rank Description: A closed mind, practically uncontrollable by outside means
        Normal Human:
          Rank: Excellent
          Number: 20
          Rank Description: Some experience with mental control and/or mystic forces
    Secondary Abilities:
      Health:
        Demon: 165
        Deity: 235
        Normal Human: 80
      Karma:
        Demon: 190
        Deity: 475
        Normal Human: 135
      Resources:
        Demon:
          Rank: Poor
          Number: 4
        Deity:
          Rank: Poor
          Number: 4
        Normal Human:
          Rank: Typical
          Number: 6
      Popularity:
        Demon:
          Rank: 0
          Number: 0
        Deity:
          Public:
            Rank: Good
            Number: 10
          Established Religions:
            Rank: 0
            Number: 0
        Normal Human:
          Rank: Typical
          Number: 5
    Special Abilities:
    Powers:
      Note: No Powers available to Normal Human Aspect unless specifically noted.
      Defensive:
        Resistance to Emotion Attacks:
          Demon:
            Rank: Unearthly
            Number: 100
          Normal Human:
            Rank: Remarkable
            Number: 30
          Note: Minimum Psyche +1CS. Normal Human Aspects Resistance comes from the Resist Domination Talent.
          Description: Grants resistance to attacks targeting emotions or Intuition, reducing damage from attacks like Emotion Control and Hallucinations by Power rank number. Attacks below rank are ignored.
        Immunity to Emotion Attacks:
          Rank: Class 1000
          Number: 1000
          Note: Deity Aspect only.
          Description: Completely negates damage from emotion-based attacks, including Emotion Control, Hallucinations, and Domination.
        Resistance to Energy Attacks:
          Cold:
            Demon:
              Rank: Excellent
              Number: 20
            Deity:
              Rank: Monstrous
              Number: 75
          Electricity:
            Demon:
              Rank: Good
              Number: 10
            Deity:
              Rank: Monstrous
              Number: 75
          Description: Provides resistance against energy forms such as Light, Heat, Flame, Plasma, Radiation, Electricity, Vibration, Sonics, Cold, and Kinetic Bolts, reducing damage by Power rank number.
        Immunity to Energy Attacks:
          Heat and Flame:
            Rank: Class 1000
            Number: 1000
            Note: Both Demon and Deity Aspects. Inherent to all Demon Physical Form characters. Retained in Deity Aspect.
          Description: Grants full immunity against specific energy types like Heat and Flame.
        Resistance to Magic Attacks:
          Demon:
            Rank: Incredible
            Number: 40
          Deity:
            Rank: Monstrous
            Number: 75
          Description: Protects against magical attacks of both physical and mental nature, reducing their effectiveness by Power rank number.
        Resistance to Mental Attacks:
          Demon:
            Rank: Unearthly
            Number: 100
          Normal Human:
            Rank: Remarkable
            Number: 30
          Note: Minimum Psyche +1CS. Normal Human Aspects Resistance comes from the Resist Domination Talent.
          Description: Enhances resistance against Psionics and Neural Manipulation, ignoring attacks below rank and reducing others by Power rank number.
        Immunity to Mental Attacks:
          Rank: Class 1000
          Number: 1000
          Note: Deity Aspect only.
          Description: Completely immune to mental and psychic-based attacks including Psionics and Neural Manipulation.
        Resistance to Physical Attacks:
          Toxins:
            Rank: Monstrous
            Number: 75
            Note: Demon Aspect only.
          Disease:
            Rank: Monstrous
            Number: 75
            Note: Demon Aspect only.
          Corrosives:
            Demon:
              Rank: Remarkable
              Number: 30
            Deity:
              Rank: Monstrous
              Number: 75
          Description: Reduces damage from brute force, chemical weapons, diseases, corrosives, extreme temperatures, and hostile environments by Power rank number.
        Immunity to Physical Attacks:
          Fire and Heat:
            Rank: Class 1000
            Number: 1000
            Note: Both Demon and Deity Aspects. Inherent to all Demon Physical Form characters. Retained in Deity Aspect.
          Toxins:
            Rank: Class 1000
            Number: 1000
            Note: Deity Aspect only.
          Disease:
            Rank: Class 1000
            Number: 1000
            Note: Deity Aspect only.
          Description: Fully immune to specified physical threats such as Fire, Heat, Toxins, and Disease.
        Resistance to Power Manipulation:
          Rank: Monstrous
          Number: 75
          Note: Demon and Normal Human Aspects only.
          Description: Grants resistance against direct attacks affecting the character’s powers, reducing their effectiveness by Power rank number.
        Immunity to Power Manipulation:
          Rank: Class 1000
          Number: 1000
          Note: Deity Aspect only.
          Description: Completely immune to attacks that alter or negate the character's powers, such as Power Control and Weakness Creation.
        Resistance to Vampirism:
          Rank: Monstrous
          Number: 75
          Note: Demon Aspect and Normal Human Aspects only.
          Description: Provides resistance against vampiric attacks (Psi, Bio, Energy, Magic, and Power Vampirism), reducing effectiveness by Power rank number.
        Immunity to Vampirism:
          Rank: Class 1000
          Number: 1000
          Note: Deity Aspect only.
          Description: Fully immune to all forms of vampiric attacks.
      Detection:
        Environmental Awareness:
          Rank: Monstrous
          Number: 75
          Description: Automatically aware of environmental conditions and disturbances such as weather, chemicals, movement, and life within the Power's range. Can gain more detailed information with effort.
        Hypersensitive Touch:
          Rank: Monstrous
          Number: 75
          Description: Enhanced sense of touch allows detailed identification of materials and fine surface details.
        Life Detection:
          Rank: Monstrous
          Number: 75
          Description: Detects and identifies life forms, can pinpoint specific beings amidst similar ones with effort.
        Magic Detection:
          Rank: Monstrous
          Number: 75
          Description: Identifies the presence and effects of magic, recognizes past magic use, spell types, and magic users with successful feats.
        Thermal Vision:
          Rank: Monstrous
          Number: 75
          Description: Sees heat and infrared emissions, able to perceive temperature variations and partially see through solid objects by heat patterns.
        Weakness Detection:
          Rank: Monstrous
          Number: 75
          Description: Detects vulnerabilities in targets, including physical, mental, and power-based weaknesses depending on rank.
      Energy Control:
        Darkforce Manipulation:
          Demon:
            Rank: Incredible
            Number: 40
          Deity:
            Rank: Monstrous
            Number: 75
          Power Stunts:
            - Blunt attack damage at Power rank.
            - Shadowcasting of Power rank Intensity darkness over a maximum of three areas.
            - Flight at -1CS speed.
            - Gateway.
            - Energy Solidification.
          Note: Power Stunts available in both Aspects.
          Description: Controls tangible extradimensional Darkforce energy, creating constructs for physical attacks, darkness areas, flight, gateways, and solidified energy objects.
        Fire Control:
          Rank: Good
          Number: 10
          Note: Demon Aspect only.
          Description: Manipulates existing flames, intensifying, diminishing, or reshaping them at will.
        Shadowshaping:
          Rank: Amazing
          Number: 50
          Description: Shapes existing shadows into tangible forms, constructs, or barriers, manipulating their size, shape, and solidity.
      Energy Emission:
        Fire Generation:
          Rank: Good
          Number: 10
          Note: Inherent to all Demon Physical Form Characters. Demon Aspect only.
          Description: Generates and projects fire directly from the character’s body as offensive energy.
        Shadowcasting:
          Rank: Remarkable
          Number: 30
          Description: Projects shadows of specified intensity over an area, creating darkness fields to obscure vision.
      Fighting:
        Natural Weaponry:
          Rank: Good
          Number: 10
          Type: Claws (Edged Attack)
          Note: Demon Aspect only.
          Description: Employs natural body features, like claws, as weapons capable of edged attacks.
      Illusory:
        Illusion Casting:
          Rank: Incredible
          Number: 40
          Description: Creates visual, auditory, or tactile illusions, deceiving targets through realistic sensory deception.
      Lifeform Control:
        Biophysical Control:
          Rank: Monstrous
          Number: 75
          Note: Deity Aspect only.
          Forms:
            - Healing: Restores a target’s Health by up to your Power rank per day, sealing wounds and curing disease without regrowing lost tissue.
            - Regeneration: Heals damage and reconstructs lost tissue—limbs with green FEATs, organs with yellow, and neural tissue with red.
            - Revival: Reanimates a corpse up to Power‑rank days old by healing damage, repairing cause of death, and reuniting the spirit.
            - Damage Transferral: Heals a target by shifting their damage into your body, which you then self‑heal at your Power rank.
            - Decay: Rapidly accelerates cellular collapse, inflicting Power‑rank damage each turn until the victim crumbles to dust.
            - Disruption: Disrupts normal physiology, causing up to Power‑rank Health losses from nausea and chills to fatal trauma.
            - Aging: Alters a target’s age at your Power‑rank rate—green FEATs speed it up, yellow stop it, red reverse it.
          Description: By touch (or at –1CS per 10 ft and per extra target), permanently alter a target’s physiology in one of seven forms, so long as the Power is maintained.
        Exorcism:
          Rank: Monstrous
          Number: 75
          Note: Deity Aspect only.
          Description: Within 10 feet, sever any external magical, mental, or immortal‐type domination over a subject by matching FEAT intensity against the controlling Power’s rank, and instantly teleport the controller back to its home dimension.
        Hypnotic Control:
          Rank: Amazing
          Number: 50
          Description: Exerts mental control over targets through hypnotic suggestions, compelling actions or behaviors.
        Neural Manipulation:
          Demon:
            Rank: Good
            Number: 10
          Deity:
            Rank: Monstrous
            Number: 75
          Forms:
            - Disruption: Block all sensory and motor signals, causing the target to collapse limp and unresponsive.
            - Paralysis: Freeze the target’s voluntary muscles in total rigidity, impervious to any chemical countermeasures.
            - Seizure: Trigger uncontrollable, painful muscle spasms for the Power’s duration.
            - Exaggeration: Amplify nerve impulses so every attempt at movement becomes wildly overdone and erratic.
          Description: Within a rank‑determined range, alter a target’s voluntary muscle nerve signals to produce one of effects while leaving senses and autonomic functions intact and reducing duration by –1CS per extra target.
        Plant Control:
          Rank: Monstrous
          Number: 75
          Note: Deity Aspect only.
          Description: Animate and command multiple plants within your rank-based limit—granting them basic awareness, senses, and movement for a duration that decreases if you exceed your plant quota.
        Plant Growth:
          Rank: Monstrous
          Number: 75
          Note: Deity Aspect only.
          Description: Instantly supercharge the growth and size of existing or carried plants up to your Power rank—even in poor conditions—with FEATs determining success and yielding naturally limited lifespans.
        Sleep-Induced:
          Demon:
            Rank: Excellent
            Number: 20
          Deity:
            Rank: Monstrous
            Number: 75
          Description: Within a Power‑rank–determined range, put all targets into an irresistible, deep sleep for a rank‑based duration, with unconsciousness persisting 1–10 hours after the effect ends.
        Summoning:
          Rank: Amazing
          Number: 50
          Description: Summons creatures or entities from other locations or dimensions, compelling their obedience and aid.
      Matter Control:
        Crystallization:
          Demon:
            Rank: Excellent
            Number: 20
          Deity:
            Rank: Amazing
            Number: 50
          Description: Transforms matter into crystalline form, altering its structural integrity and shape.
        Geoforce:
          Rank: Incredible
          Number: 40
          Note: Deity Aspect only.
          Description: Manipulates geological materials and phenomena, such as rock formations, seismic activity, and earth movements.
        Molding:
          Demon:
            Rank: Excellent
            Number: 20
          Deity:
            Rank: Incredible
            Number: 40
          Description: Alters the shape, density, and form of solid matter, reshaping it according to will.
        Weather Control:
          Rank: Incredible
          Number: 40
          Note: Deity Aspect only.
          Description: Manipulates weather patterns and conditions, such as storms, temperature shifts, wind, and precipitation.
      Matter Conversion:
        Molecular Conversion:
          Demon:
            Rank: Remarkable
            Number: 30
          Deity:
            Rank: Amazing
            Number: 50
          Description: Transforms matter at a molecular level, changing substances from one molecular composition to another.
      Matter Creation:
        Artifact Creation:
          Demon:
            Rank: Incredible
            Number: 40
          Deity:
            Rank: Monstrous
            Number: 75
          Normal Human:
            Rank: Excellent
            Number: 20
          Description: Creates a single-piece object from nothing, detailed replicas require memorized designs. Temporarily drains Health per ounce created. Lifespan depends on FEAT success, from temporary to permanent.
        Lifeform Creation:
          Rank: Amazing
          Number: 50
          Note: Deity Aspect only.
          Description: Forms living organisms from imagination or memory, costing Health points per ounce. Lifespan and complexity depend on FEAT success, can create permanent living beings.
        Missile Creation:
          Demon:
            Rank: Excellent
            Number: 20
          Deity:
            Rank: Amazing
            Number: 50
          Note: Missiles do Stunning damage on impact unless combined with another power to cause that effect instead of or in addition to it. May be combined with any externally-interacting Power. Limited to Power Rank Number missiles per hour.
          Description: Instantly creates and launches projectiles that inflict Stunning attacks or combine with other Powers for special effects. Limited by hourly missile creation rate.
        Molecular Creation:
          Demon:
            Rank: Remarkable
            Number: 30
          Deity:
            Rank: Amazing
            Number: 50
          Description: Synthesizes compounds and complex materials from nothing, temporarily sacrificing Health points per ounce. Durability based on FEAT, from temporary to permanent.
      Mental Enhancement:
        Cosmic Awareness:
          Rank: Monstrous
          Number: 75
          Note: Deity Aspect only.
          Description: Provides extraordinary perception and understanding of cosmic-scale events and universal truths.
        Dreamtravel:
          Rank: Monstrous
          Number: 75
          Description: Enables entering and navigating through dreams or dream-like dimensions.
        Empathy:
          Rank: Monstrous
          Number: 75
          Description: Senses and influences emotions of others, understanding their feelings and potentially altering them.
        Free Spirit:
          Rank: Monstrous
          Number: 75
          Description: Allows the character's consciousness to leave their body and travel independently, unaffected by physical constraints.
        Hyper Intelligence:
          Rank: Monstrous
          Number: 75
          Type: Additive
          Abilities:
            - Intuition
          Note: Adds Power Rank to base Ability Rank. Available to Normal Human Aspect.
          Description: Significantly boosts intellectual capabilities and intuition, enhancing mental acuity and problem-solving.
        Iron Will:
          Rank: Monstrous
          Number: 75
          Description: Strengthens mental fortitude, resisting psychological manipulation and enhancing determination.
          Note: Available to Normal Human Aspect.
        Linguistics:
          Rank: Monstrous
          Number: 75
          Description: Instantly understands and communicates in any language encountered, spoken or written.
          Note: Available to Normal Human Aspect.
        Mental Probe:
          Demon:
            Rank: Excellent
            Number: 20
          Deity:
            Rank: Incredible
            Number: 40
          Description: Accesses thoughts and memories of others through telepathic intrusion.
        Serial Immortality:
          Demon:
            Rank: Monstrous
            Number: 75
          Deity:
            Rank: Monstrous
            Number: 75
          Normal Human:
            Rank: Incredible
            Number: 40
          Form:
            Type: Spontaneous Creation
            Description: Psionically fabricate a full-grown duplicate of your previous body from raw matter and energy, with a build time of (100 – Power rank) days. The body reverts to its original materials.
          Note: Default for Normal Human Aspect.  New body will match Aspect at Death, except Deity will be Demon, and requires 1d100 Turns of exposure to Energy Source to regain ability to assume Deity Aspect.  Death in any Aspect automatically triggers Free Spirit Power.
          Description: Upon Death, lifeforce rebounds into a new host while you forfeit all Karma.
        Telekinesis:
          Demon:
            Rank: Good
            Number: 10
          Deity:
            Rank: Incredible
            Number: 40
          Description: Moves and manipulates objects with mental energy, exerting force remotely without physical contact.
        Telelocation:
          Rank: Monstrous
          Number: 75
          Note: Deity Aspect only.
          Description: Within a spherical range set by your Power rank, psionically sense and pinpoint a target without any physical or sensory contact—using green FEATs for direct possession of a part, yellow for past contact, or red for reliable second‑hand information.
        Telepathy:
          Demon:
            Rank: Remarkable
            Number: 30
          Deity:
            Rank: Amazing
            Number: 50
          Description: Mentally communicates with others, sending and receiving thoughts, and establishing mental links.
        Total Memory:
          Rank: Monstrous
          Number: 75
          Note: Available to Normal Human Aspect.
          Description: Perfectly recalls any previously experienced event or information without degradation.
      Physical Enhancement:
        Body Resistance:
          Rank: Remarkable
          Number: 30
          Description: Enhances natural resistance against physical damage, absorbing and reducing incoming harm.
        Hypnotic Voice:
          Rank: Incredible
          Number: 40
          Description: Influences or controls others through voice, compelling obedience or specific actions.
        Pheromones:
          Rank: Amazing
          Number: 50
          Description: Emits biochemical substances that subtly influence behavior or emotional responses of others nearby.
        Self-Revival:
          Rank: Monstrous
          Number: 75
          Note: Not available to Normal Human Aspect, which uses Serial Immortality instead, as does a destroyed body in other Aspects (less than one quarter of body remaining). Death in any Aspect automatically triggers Free Spirit power.
          Description: Functions identically to Regeneration, healing at Power Rank multiple rate (lost limbs and organs requiring a Red FEAT), except also automatically revives after death, restoring life functions after fatal harm.  Color of FEAT required depends on condition of body (Green for intact, Yellow for vitals intact, Red for at least one-quarter body remaining).
        Self-Sustenance:
          Rank: Monstrous
          Number: 75
          Type: Permanent
          Description: Operates indefinitely without typical biological needs like air, food, water, or sleep.
        Stealth:
          Rank: Remarkable
          Number: 30
          Description: Moves silently and unnoticed, significantly reducing chances of detection.
        True Invulnerability:
          Rank: Monstrous
          Number: 75
          Note: Deity Aspect only.
          Description: Provides absolute protection against damage from physical and energy attacks.
        Vocal Control:
          Rank: Monstrous
          Number: 75
          Description: Manipulates sound and voice to imitate others, alter tone, or create sonic effects.
      Power Control:
        Energy Source:
          Rank: null
          Number: .nan
          Type:
            - Hell Dimension
            - Dimension of Dreams
            - Site of active worship: Cannot benefit from actively self-promoted worship.
          Note: Recharges Deity Aspect.
          Description: Supplies energy to sustain other Powers or devices continuously without external input.
        Focus:
          Demon:
            Rank: Monstrous
            Number: 75
            Total:
              Rank: Class 3000
              Number: 4820
              Spread: 63
              Turns Until Full Recovery: 65
          Deity:
            Rank: Unearthly
            Number: 100
            Total:
              Rank: Class 5000
              Number: 11925
              Spread: 83
              Turns Until Full Recovery: 120
          Note: Rankless abilities not included.
          Description: Channels all Abilities and Powers into a single burst, replacing the target Power’s rank with the sum of all other ranks. After use, all Abilities and Powers drop to Feeble. The Focus rank determines how many points can be recovered each turn, divided evenly across all affected traits.
      Self Alteration:
        Imitation-Human Changeling:
          Rank: Monstrous
          Number: 75
          Description: Physically alters appearance to mimic other humans perfectly, copying their physical traits and features.
          Note: Appearance of Normal Human Aspect is last form taken by Demon or Deity Aspects.
        Invisibility:
          Rank: Remarkable
          Number: 30
          Type: Physics
          Description: Becomes unseen to normal sight, avoiding visual detection entirely.
      Travel:
        Astral Body:
          Rank: Monstrous
          Number: 75
          Description: Projects an intangible form for exploration of physical and astral planes without physical constraints.
        Dimension Travel:
          Rank: Monstrous
          Number: 75
          Description: Opens portals to other dimensions, enabling transit between alternate realities and planes.
        Gateway:
          Rank: Monstrous
          Number: 75
          Note: Deity Aspect only.
          Description: Creates stable passageways linking distant locations instantly.
        Teleport Others:
          Rank: Monstrous
          Number: 75
          Note: Deity Aspect only.
          Description: Instantaneously moves others to desired locations without physical travel.
        Teleport Self:
          Rank: Monstrous
          Number: 75
          Note: Deity Aspect only.
          Description: Instantaneously moves self from one location to another without physically traversing the space in between.
        True Flight:
          Rank: Unearthly
          Number: 100
          Note: Deity Aspect only.
          Description: Grants the natural ability to fly freely, allowing complete aerial maneuverability and sustained flight without external assistance.
      Body Alterations-Defensive:
        Immortality:
          Rank: null
          Number: .nan
          Note: From Advanced Player's Book, not Ultimate Powers Book. Available to Normal Human Aspect.
          Description: Character does not age or die normally. Still vulnerable to damage that reduces Endurance; if Endurance reaches Shift 0, character is incapacitated but not killed. Cannot move or act until healed above Shift 0, and cannot heal while continually sustaining damage.
    Talents:
      Fighting Skills:
        - Acrobatics: Grants a +1CS bonus when dodging, evading, or escaping attacks due to enhanced agility.
        - Tumbling: Enables safe landing from falls; an Agility FEAT allows landing without injury if the fall wouldn't otherwise inflict damage.
      Professional Skills:
        - Criminology: Provides insights into criminal behavior, granting +1CS on Reason and Intuition FEATs related to crime‑solving and criminal tactics; includes a Contact in police or criminal circles.
        - Psychiatry: Expertise in mental processes granting +1CS on FEATs involving mental powers, mental manipulation, and psychological understanding.
        - Detective/Espionage: Trained in clue detection and espionage methods, giving +1CS to uncover clues; includes a Contact in crime, law enforcement, or espionage.
      Scientific Skills:
        - Geology: Specialized knowledge of Earth’s materials and geological processes, providing a +1CS on related Reason FEATs.
        - Archaeology: Skilled in ancient history and artifacts, providing +1CS on FEATs involving historical records, ancient myths, legends, and paleontology.
      Mystic and Mental Skills:
        - Mesmerism and Hypnosis: A primitive form of Mind Control at Reason rank level, allowing extraction of information and placement of posthypnotic suggestions.
        - Sleight of Hand: Skilled in manual deception, able to discreetly manipulate small objects with +1CS Agility.
        - Resist Domination: Resist mental attacks as if the character had a mental power of Psyche +1CS.
        - Occult Lore: Knowledgeable about magical items and mystical traditions, gaining +1CS on Reason FEATs involving magical artifacts.
        - Mystic Background: Indicates experience or training in magical forces, potentially qualifying for magical powers or spellcasting with Judge approval.
      Other Talents:
        - Languages: Naturally adept at languages, initially knowing one extra language and able to learn new languages at half the normal Karma cost.
        - Performer: Skilled in performing arts, granting Karma rewards for engaging in performances.
        - Trivia:
            History: Specialized knowledge providing +1CS on Reason FEATs related to historical information.
