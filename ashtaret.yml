            - Set
            - Gaea
          - Khonshu: In particular among Heliopolis pantheon because of Marc Spector.
          - Three Asgardian Co-Conspirators and Rivals:
            - Loki Laufeyson
            - Amora
            - Lorelei
          - Remaining living worshippers: Eventually passively attracts followers, but is forbidden from actively promoting a religion based on herself, including active recruitment.
