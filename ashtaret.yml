            - Ereshkigal: Possible sister and thus ultimate rival if so.  Has, or had, a discarded demonic aspect, Allatou, that Ashtaret possibly merged with or absorbed.
            - Inanna: Other universes' versions of Inanna.
          - Nightmare: Relationship, both conflict and cooperation, revolves around their mutual inhabitation of the Dimension of Dreams.
          - Co-Inhabitants of Hell Dimension:
            - Mephisto
            - Satannish
            - Marduk Kurios
          - The Elder Gods of Earth in Particular:
            - Chthon
