  Biography: |
    Maria Teresa "Nonna Maria" Athanasiou (née Aiello) is Stella Blake's  (alter ego of the cosmic hero Evenstar) maternal grandmother. She immigrated to New York City from Calabria, Italy as a child. Maria worked odd jobs to make ends meet, and went to a vocational training program for secretarial work after high school. When World War II broke out, Maria worked at the Brooklyn Naval Yards as a "Rosie," and scrimped and saved every dime she could. After the war she married Konstantinos Theódoros Athanasiou, and worked as a secretary until they'd saved enough money to open the restaurant and grocery in 1947.

    A petite but spry and fiery woman with curly black hair shot with grey, dark olive skin, and hazel eyes, Nonna Maria is the family matriarch and its de-facto head. She is gregarious, warm, and nurturing, but can be somewhat stern. The kitchen genius behind the restaurant, Nonna Maria also keeps the books, which is likely the reason Stella's mother, Sophia, became an accountant. Nonna is a practicing Stregha, telling fortunes in a room in the back of the restaurant. The Aiellos distant Jewish roots, having been forcibly converted from Judaism in the 1490s, due to the Alhambra Decree, have her Stregheria tinged with Kabbalistic practices as well.
